<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speed Math Leaderboard</title>
<meta name="description" content="Public Speed Math scores from kunga.me, verified by certificate.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12213B;--sky-deep:#0d1a30;--sky-mid:#1b2e52;--snow:#F5F8FC;--snow-dim:#b9c4d8;
  --gold:#E8A33D;--gold-dim:#B87F2A;--good:#3FAE72;--bad:#E1584B;
  --radius:18px;--shadow:0 10px 30px rgba(0,0,0,.4);
  --font-display:'Space Grotesk',sans-serif;--font-body:'Inter',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-body);background:linear-gradient(180deg,var(--sky-deep),var(--sky-mid) 60%,var(--sky-deep));color:var(--snow);min-height:100vh;padding:0 0 60px}
a{color:inherit;text-decoration:none}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 20px}
.brand{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--snow-dim)}
.wrap{max-width:640px;margin:0 auto;padding:0 18px}
.hero{text-align:center;margin:10px 0 24px}
.hero h1{font-family:var(--font-display);font-weight:800;font-size:clamp(26px,6vw,36px);margin:0 0 6px}
.hero p{color:var(--snow-dim);font-size:14.5px;margin:0}
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:20px}
.tabs button{all:unset;cursor:pointer;font-family:var(--font-display);font-weight:600;font-size:13.5px;padding:9px 18px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--snow-dim)}
.tabs button.on{background:var(--gold);color:var(--ink)}
.row{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:13px 16px;margin-bottom:9px}
.rank{font-family:var(--font-display);font-weight:800;font-size:17px;color:var(--gold);width:28px;text-align:center;flex-shrink:0}
.row:nth-child(1) .rank{color:#ffd700}
.row:nth-child(2) .rank{color:#d9d9e3}
.row:nth-child(3) .rank{color:#cd7f32}
.who{flex:1;min-width:0}
.name{font-weight:600;font-size:15px}
.sub{font-size:12px;color:var(--snow-dim);margin-top:1px}
.score{font-family:var(--font-display);font-weight:800;font-size:19px;color:var(--snow);flex-shrink:0}
.state{text-align:center;color:var(--snow-dim);margin-top:40px}
</style>
</head>
<body>

<div class="top">
  <a class="brand" href="/">← kunga.me</a>
</div>

<div class="wrap">
  <div class="hero">
    <h1>🏆 Speed Math Leaderboard</h1>
    <p>Every score here is backed by a public certificate — tap a row to verify it.</p>
  </div>
  <div class="tabs" id="tabs">
    <button data-d="60">60 seconds</button>
    <button data-d="120">120 seconds</button>
  </div>
  <div id="list"></div>
</div>

<script>
function fmtDate(iso){
  try{ return new Date(iso).toLocaleDateString(undefined,{month:'short',day:'numeric'}); }catch(e){ return ''; }
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
const params = new URLSearchParams(location.search);
let duration = [60,120].includes(Number(params.get('duration'))) ? Number(params.get('duration')) : 120;

function renderTabs(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on', Number(b.dataset.d)===duration));
}
async function load(){
  renderTabs();
  const list = document.getElementById('list');
  list.innerHTML = '<div class="state">Loading…</div>';
  try{
    const res = await fetch('/api/speedmath/leaderboard?duration='+duration);
    const data = await res.json();
    const certs = data.certificates || [];
    if(!certs.length){ list.innerHTML = '<div class="state">No certified scores yet for this duration. Be the first!</div>'; return; }
    list.innerHTML = certs.map((c,i)=>{
      const total = c.correct + c.wrong;
      const accuracy = total>0 ? Math.round((c.correct/total)*100) : 100;
      return `<a class="row" href="/certificate/${c.id}">
        <div class="rank">${i+1}</div>
        <div class="who"><div class="name">${esc(c.username)}</div><div class="sub">${accuracy}% accuracy · ${fmtDate(c.createdAt)} · #${String(c.id).padStart(6,'0')}</div></div>
        <div class="score">${c.correct}</div>
      </a>`;
    }).join('');
  }catch(e){
    list.innerHTML = '<div class="state">Couldn\'t load the leaderboard right now.</div>';
  }
}
document.getElementById('tabs').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  duration = Number(b.dataset.d);
  history.replaceState(null,'','?duration='+duration);
  load();
});
load();
</script>

</body>
</html>
