<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yeshe Store</title>
<meta name="description" content="Courses and YESHE clothing, in one cart.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12213B;--sky-deep:#0d1a30;--sky-mid:#1b2e52;--snow:#F5F8FC;--snow-dim:#b9c4d8;
  --gold:#E8A33D;--gold-dim:#B87F2A;--good:#3FAE72;--bad:#E1584B;
  --radius:16px;--shadow:0 10px 30px rgba(0,0,0,.4);
  --font-display:'Space Grotesk',sans-serif;--font-body:'Inter',sans-serif;--font-mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-body);background:linear-gradient(180deg,var(--sky-deep),var(--sky-mid) 60%,var(--sky-deep));color:var(--snow);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 16px 60px}
a{color:var(--gold)}
.top{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:720px;margin-bottom:22px;gap:10px}
.brand{font-family:var(--font-display);font-weight:700;font-size:15px;text-decoration:none;color:var(--snow-dim)}
.cartBtn{all:unset;cursor:pointer;display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--snow)}
.cartBtn .count{background:var(--gold);color:var(--ink);font-family:var(--font-mono);font-weight:700;font-size:11px;padding:1px 7px;border-radius:999px}

.wrap{width:100%;max-width:720px}
.hero{text-align:center;margin-bottom:20px}
h1{font-family:var(--font-display);font-size:26px;font-weight:800;margin:0 0 6px}
.sub{color:var(--snow-dim);font-size:14px;margin:0}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;justify-content:center}
.tab{all:unset;cursor:pointer;font-size:13px;font-weight:600;padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--snow-dim)}
.tab.sel{background:var(--gold);color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.pCard{background:radial-gradient(ellipse at top,rgba(232,163,61,.06),transparent 60%),var(--sky-mid);border:1px solid rgba(255,255,255,.1);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.pImg{width:100%;aspect-ratio:1;object-fit:cover;background:rgba(255,255,255,.04)}
.pImgPlaceholder{width:100%;aspect-ratio:1;display:grid;place-items:center;font-size:36px;background:rgba(255,255,255,.04)}
.pBody{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.pBadge{align-self:flex-start;font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--gold);background:rgba(232,163,61,.12);padding:3px 8px;border-radius:999px}
.pName{font-family:var(--font-display);font-weight:700;font-size:15px;line-height:1.3}
.pDesc{font-size:12.5px;color:var(--snow-dim);line-height:1.5;flex:1}
.pPrice{font-family:var(--font-mono);font-weight:700;font-size:16px;color:var(--snow)}
.pVariant{font-size:12px;padding:8px 10px;border-radius:8px;border:1.5px solid rgba(255,255,255,.12);background:rgba(0,0,0,.2);color:var(--snow)}
.pAddBtn{all:unset;cursor:pointer;text-align:center;font-family:var(--font-display);font-weight:700;font-size:13px;padding:10px;border-radius:10px;background:var(--gold);color:var(--ink)}
.pAddBtn.added{background:var(--good);color:var(--ink)}

.emptyState{text-align:center;color:var(--snow-dim);padding:50px 10px}

/* cart overlay */
.cartOverlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}
.cartOverlay.open{display:flex}
.cartPanel{width:100%;max-width:520px;max-height:85vh;background:var(--sky-mid);border-radius:20px 20px 0 0;padding:22px 20px 28px;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.cartHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.cartHead h2{font-family:var(--font-display);font-size:18px;margin:0}
.closeBtn{all:unset;cursor:pointer;font-size:20px;color:var(--snow-dim);padding:4px}
.cartItems{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.cartRow{display:flex;gap:12px;align-items:center}
.cartRowInfo{flex:1;min-width:0}
.cartRowName{font-size:13.5px;font-weight:600}
.cartRowVariant{font-size:11.5px;color:var(--snow-dim)}
.cartRowPrice{font-family:var(--font-mono);font-size:12.5px;color:var(--snow-dim);margin-top:2px}
.qtyCtrl{display:flex;align-items:center;gap:8px}
.qtyBtn{all:unset;cursor:pointer;width:26px;height:26px;display:grid;place-items:center;border-radius:8px;background:rgba(255,255,255,.08);font-weight:700}
.qtyNum{font-family:var(--font-mono);font-weight:700;min-width:16px;text-align:center}
.removeBtn{all:unset;cursor:pointer;color:var(--bad);font-size:12px;margin-left:8px}

.cartTotalRow{display:flex;justify-content:space-between;font-family:var(--font-display);font-weight:700;font-size:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,.1);margin-bottom:14px}
label.fieldLabel{display:block;font-size:12px;color:var(--snow-dim);margin:0 0 6px;font-weight:600}
input[type=text],input[type=email]{width:100%;font-family:var(--font-body);font-size:14px;padding:11px 13px;border-radius:10px;border:1.5px solid rgba(255,255,255,.1);background:rgba(0,0,0,.22);color:var(--snow);outline:none;margin-bottom:12px}
input:focus{border-color:var(--gold)}
button.sendBtn{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;text-align:center;font-family:var(--font-display);font-weight:700;font-size:15px;padding:14px;border-radius:12px;background:var(--gold);color:var(--ink)}
button.sendBtn:disabled{opacity:.5;cursor:default}
.errorBox{background:rgba(225,88,75,.14);border:1px solid rgba(225,88,75,.4);color:#ffb3ab;padding:10px 14px;border-radius:10px;font-size:13px;margin-top:10px;text-align:center}

.state{text-align:center;margin-top:60px}
.state .glyph{font-size:46px}
.state .big{font-family:var(--font-display);font-size:22px;font-weight:800;margin:14px 0 8px}
.state p{color:var(--snow-dim);font-size:14px;line-height:1.6}
.btnlink{all:unset;cursor:pointer;display:inline-block;margin-top:18px;font-family:var(--font-display);font-weight:700;font-size:13.5px;padding:10px 18px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--snow)}
.note{text-align:center;color:var(--snow-dim);font-size:11.5px;margin-top:20px;line-height:1.6}
</style>
</head>
<body>

<div class="top">
  <a class="brand" href="/">← kunga.me</a>
  <button class="cartBtn" id="cartBtn">🛒 Cart <span class="count" id="cartCount">0</span></button>
</div>

<div class="wrap">
  <div id="view"></div>
</div>

<div class="cartOverlay" id="cartOverlay">
  <div class="cartPanel">
    <div class="cartHead"><h2>Your cart</h2><button class="closeBtn" id="closeCart">×</button></div>
    <div class="cartItems" id="cartItems"></div>
    <div class="cartTotalRow"><span>Total</span><span id="cartTotal">$0</span></div>
    <div id="checkoutForm"></div>
  </div>
</div>

<script>
const LS_CART_KEY = 'yesheStoreCartV1';
let products = [];
let activeCategory = 'All';
let cart = [];

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtPrice(cents){ return '$' + (cents/100).toFixed(cents % 100 === 0 ? 0 : 2); }

function loadCart(){
  try{ const raw = localStorage.getItem(LS_CART_KEY); const parsed = raw ? JSON.parse(raw) : []; return Array.isArray(parsed) ? parsed : []; }
  catch(e){ return []; }
}
function saveCart(){ try{ localStorage.setItem(LS_CART_KEY, JSON.stringify(cart)); }catch(e){} }
cart = loadCart();

function cartKey(productId, variant){ return productId + '::' + (variant || ''); }
function cartCount(){ return cart.reduce((n,i) => n+i.qty, 0); }
function cartTotalCents(){ return cart.reduce((n,i) => n+i.priceCents*i.qty, 0); }

function addToCart(product, variant){
  const key = cartKey(product.id, variant);
  const existing = cart.find(i => cartKey(i.productId, i.variant) === key);
  if(existing) existing.qty += 1;
  else cart.push({ productId: product.id, name: product.name, priceCents: product.priceCents, variant: variant || null, qty: 1 });
  saveCart();
  updateCartCount();
}
function updateCartCount(){ document.getElementById('cartCount').textContent = cartCount(); }

async function renderShop(bannerHtml){
  const view = document.getElementById('view');
  view.innerHTML = `
    <div class="hero">
      <h1>🛍️ Yeshe Store</h1>
      <p class="sub">Courses and YESHE clothing.</p>
    </div>
    ${bannerHtml || ''}
    <div class="tabs" id="tabs"></div>
    <div id="grid"><div class="emptyState">Loading…</div></div>
  `;
  try{
    const resp = await fetch('/api/store/products');
    const data = await resp.json();
    products = data.products || [];
  }catch(e){
    document.getElementById('grid').innerHTML = `<div class="emptyState">Couldn't load the store. Try again shortly.</div>`;
    return;
  }
  renderTabs();
  renderGrid();
}

function renderTabs(){
  const categories = ['All', ...new Set(products.map(p => p.category).filter(Boolean))];
  document.getElementById('tabs').innerHTML = categories.map(c =>
    `<button class="tab ${c===activeCategory?'sel':''}" data-cat="${esc(c)}">${esc(c)}</button>`
  ).join('');
  document.querySelectorAll('.tab').forEach(btn => {
    btn.onclick = () => { activeCategory = btn.dataset.cat; renderTabs(); renderGrid(); };
  });
}

function renderGrid(){
  const grid = document.getElementById('grid');
  const filtered = activeCategory === 'All' ? products : products.filter(p => p.category === activeCategory);
  if(!filtered.length){
    grid.innerHTML = `<div class="emptyState">Nothing here yet.</div>`;
    return;
  }
  grid.innerHTML = `<div class="grid">${filtered.map(p => {
    const img = p.imagePath
      ? `<img class="pImg" src="/store-photo/${p.id}" loading="lazy">`
      : `<div class="pImgPlaceholder">${p.type==='digital'?'📘':'👕'}</div>`;
    const variantSelect = p.variants && p.variants.length
      ? `<select class="pVariant" id="variant-${p.id}">${p.variants.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}</select>`
      : '';
    return `
      <div class="pCard">
        ${img}
        <div class="pBody">
          <div class="pBadge">${p.type === 'digital' ? 'Course' : 'Clothing'}</div>
          <div class="pName">${esc(p.name)}</div>
          <div class="pDesc">${esc(p.description || '')}</div>
          ${variantSelect}
          <div class="pPrice">${fmtPrice(p.priceCents)}</div>
          <button class="pAddBtn" data-add="${p.id}">Add to cart</button>
        </div>
      </div>`;
  }).join('')}</div>`;
  grid.querySelectorAll('[data-add]').forEach(btn => {
    btn.onclick = () => {
      const product = products.find(p => p.id === Number(btn.dataset.add));
      const variantSelect = document.getElementById('variant-' + product.id);
      const variant = variantSelect ? variantSelect.value : null;
      addToCart(product, variant);
      btn.textContent = 'Added ✓';
      btn.classList.add('added');
      setTimeout(() => { btn.textContent = 'Add to cart'; btn.classList.remove('added'); }, 1000);
    };
  });
}

function renderCart(){
  const itemsEl = document.getElementById('cartItems');
  if(!cart.length){
    itemsEl.innerHTML = `<div class="emptyState">Your cart is empty.</div>`;
  } else {
    itemsEl.innerHTML = cart.map((item, idx) => `
      <div class="cartRow" data-idx="${idx}">
        <div class="cartRowInfo">
          <div class="cartRowName">${esc(item.name)}</div>
          ${item.variant ? `<div class="cartRowVariant">${esc(item.variant)}</div>` : ''}
          <div class="cartRowPrice">${fmtPrice(item.priceCents)} each</div>
        </div>
        <div class="qtyCtrl">
          <button class="qtyBtn" data-dec="${idx}">−</button>
          <span class="qtyNum">${item.qty}</span>
          <button class="qtyBtn" data-inc="${idx}">+</button>
        </div>
        <button class="removeBtn" data-remove="${idx}">Remove</button>
      </div>`).join('');
    itemsEl.querySelectorAll('[data-inc]').forEach(b => b.onclick = () => { cart[Number(b.dataset.inc)].qty++; saveCart(); renderCart(); });
    itemsEl.querySelectorAll('[data-dec]').forEach(b => b.onclick = () => {
      const i = Number(b.dataset.dec);
      cart[i].qty--;
      if(cart[i].qty <= 0) cart.splice(i,1);
      saveCart(); renderCart();
    });
    itemsEl.querySelectorAll('[data-remove]').forEach(b => b.onclick = () => { cart.splice(Number(b.dataset.remove),1); saveCart(); renderCart(); });
  }
  document.getElementById('cartTotal').textContent = fmtPrice(cartTotalCents());
  updateCartCount();

  const formEl = document.getElementById('checkoutForm');
  if(!cart.length){ formEl.innerHTML = ''; return; }
  formEl.innerHTML = `
    <label class="fieldLabel" for="nameInput">Your name</label>
    <input type="text" id="nameInput" placeholder="Full name" maxlength="80">
    <label class="fieldLabel" for="emailInput">Your email</label>
    <input type="email" id="emailInput" placeholder="you@example.com" maxlength="200">
    <button class="sendBtn" id="checkoutBtn">Checkout — ${fmtPrice(cartTotalCents())}</button>
    <div id="errorBox"></div>
  `;
  document.getElementById('checkoutBtn').onclick = submitCheckout;
}

async function submitCheckout(){
  const errorBox = document.getElementById('errorBox');
  errorBox.innerHTML = '';
  const name = document.getElementById('nameInput').value.trim();
  const email = document.getElementById('emailInput').value.trim();
  if(!name){ errorBox.innerHTML = `<div class="errorBox">Please enter your name.</div>`; return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ errorBox.innerHTML = `<div class="errorBox">Please enter a valid email.</div>`; return; }

  const btn = document.getElementById('checkoutBtn');
  btn.disabled = true;
  btn.textContent = 'Starting checkout…';
  try{
    const resp = await fetch('/api/store/checkout', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        items: cart.map(i => ({ productId: i.productId, qty: i.qty, variant: i.variant })),
        name, email,
      }),
    });
    const data = await resp.json();
    if(!resp.ok || !data.url){
      errorBox.innerHTML = `<div class="errorBox">${esc(data.error || 'Something went wrong.')}</div>`;
      btn.disabled = false;
      btn.textContent = `Checkout — ${fmtPrice(cartTotalCents())}`;
      return;
    }
    location.href = data.url;
  }catch(e){
    errorBox.innerHTML = `<div class="errorBox">Network error — try again.</div>`;
    btn.disabled = false;
    btn.textContent = `Checkout — ${fmtPrice(cartTotalCents())}`;
  }
}

document.getElementById('cartBtn').onclick = () => { renderCart(); document.getElementById('cartOverlay').classList.add('open'); };
document.getElementById('closeCart').onclick = () => document.getElementById('cartOverlay').classList.remove('open');
document.getElementById('cartOverlay').onclick = (e) => { if(e.target.id === 'cartOverlay') e.currentTarget.classList.remove('open'); };

function renderDone(){
  cart = [];
  saveCart();
  document.getElementById('view').innerHTML = `
    <div class="state">
      <div class="glyph">✅</div>
      <div class="big">Order placed.</div>
      <p>Thanks for the order — you'll hear from Kunga by email to confirm delivery.</p>
      <a class="btnlink" href="/">Back to kunga.me</a>
    </div>`;
}
function renderCancelled(){
  renderShop(`<p style="text-align:center;color:var(--snow-dim);font-size:13px;margin-bottom:14px;">Checkout was cancelled — no charge was made. Your cart is still saved.</p>`);
}

const orderParam = new URLSearchParams(location.search).get('order');
updateCartCount();
if(orderParam === 'success') renderDone();
else if(orderParam === 'cancel') renderCancelled();
else renderShop();
</script>
</body>
</html>
