<script>
const TOPICS = [
{ id:"fermi", name:"Fermi Estimation", blurb:"Guess big numbers fast and land within the right order of magnitude.",
  lesson:`
<h2>The idea</h2>
<p>A Fermi question asks for a number nobody knows exactly, like how many piano tuners work in Brisbane. They're not checking if you're right. They want to see you break it into pieces you can guess, keep the maths clean, and say your assumptions out loud.</p>
<h3>The method</h3>
<ol>
<li><b>Define it.</b> Pin down what's being counted and over what time period.</li>
<li><b>Break it down.</b> Write it as a product of things you can guess: people × fraction who do X × how often × how much.</li>
<li><b>Round to powers of 10.</b> 2.6 million people → 3×10⁶. Multiply the leading digits, add the exponents.</li>
<li><b>Sanity check.</b> Does the answer feel insane? Check against something you know.</li>
</ol>
<h3>Bounding trick</h3>
<p>If you've got no idea, pick a number you're sure is too low and one that's too high, then take the geometric mean.</p>
<div class="formula">estimate ≈ √(low × high)
e.g. low 100, high 10,000 → √(10⁶) = 1,000</div>
<h3>Handy anchors</h3>
<div class="tablewrap"><table>
<tr><th>Thing</th><th>Rough value</th></tr>
<tr><td>World population</td><td class="mono">8 × 10⁹</td></tr>
<tr><td>Australia</td><td class="mono">2.7 × 10⁷</td></tr>
<tr><td>Brisbane</td><td class="mono">2.6 × 10⁶</td></tr>
<tr><td>Seconds in a year</td><td class="mono">≈ π × 10⁷</td></tr>
<tr><td>Minutes in a day</td><td class="mono">1,440</td></tr>
<tr><td>Working days a year</td><td class="mono">≈ 250</td></tr>
<tr><td>People per household</td><td class="mono">≈ 2.5</td></tr>
</table></div>
<div class="tip"><b>On the night:</b> talk through your chain. A clean breakdown that's off by 3× beats a lucky guess with no reasoning.</div>
<div class="widget" id="fermiCalc">
<h3 style="margin-top:0">Bounds calculator</h3>
<div class="row"><input type="text" id="fLow" value="100" aria-label="Low bound"> <input type="text" id="fHigh" value="10000" aria-label="High bound"></div>
<p class="mono" id="fOut" style="margin:10px 0 0"></p>
</div>`,
  qs:[
  {d:"warm-up",t:"How many heartbeats does a person have in a lifetime?",a:2.9e9,fermi:true,s:"~70 bpm × 60 × 24 × 365 × 80 years ≈ 70 × 5×10⁵ × 80 ≈ 2.9 × 10⁹."},
  {d:"classic",t:"How many piano tuners work in Brisbane?",a:50,fermi:true,s:"2.6M people / 2.5 per house ≈ 1M households. Maybe 1 in 20 has a piano → 50,000 pianos, tuned about once a year. A tuner does ~4 a day × 250 days = 1,000 a year. 50,000 / 1,000 ≈ 50."},
  {d:"classic",t:"How many golf balls fit in a school bus?",a:5e5,fermi:true,s:"Bus inside ≈ 10m × 2.5m × 2m = 50 m³. A golf ball is ~4cm wide, so it takes up about (4cm)³ = 64 cm³ of space if you count gaps. 50 m³ = 5×10⁷ cm³. 5×10⁷ / 64 ≈ 8×10⁵, knock some off for seats → ~5×10⁵."},
  {d:"medium",t:"How many people are in the air on planes worldwide right now?",a:1e6,fermi:true,s:"~100,000 flights a day, average ~2.5 hours → at any moment about 100,000 × 2.5/24 ≈ 10,000 planes up. ~120 passengers each → ~1.2 × 10⁶."},
  {d:"medium",t:"How many litres of coffee do Australians drink in a day?",a:5e6,fermi:true,s:"27M people, about half drink coffee, ~1.5 cups each, ~250 mL per cup. 1.35×10⁷ × 1.5 × 0.25 ≈ 5 × 10⁶ litres."},
  {d:"spicy",t:"How many words does the average person speak in their lifetime?",a:5e8,fermi:true,s:"~15,000 words a day (studies land around there) × 365 × 80 ≈ 4.4 × 10⁸. Call it 5 × 10⁸."}
  ]},
{ id:"cond", name:"Conditional Probability", blurb:"Updating odds once you learn something. Bayes lives here.",
  lesson:`
<h2>The core formula</h2>
<p>Conditional probability is just "zoom in on the world where B happened, and ask how much of it is A".</p>
<div class="formula">P(A | B) = P(A and B) / P(B)</div>
<h3>Bayes' rule</h3>
<p>Flip it around when you know P(B | A) but want P(A | B):</p>
<div class="formula">P(A | B) = P(B | A) · P(A) / P(B)
P(B)     = P(B | A)·P(A) + P(B | not A)·P(not A)</div>
<h3>Natural frequencies (the easy way)</h3>
<p>Imagine 1,000 people. 1% have a disease → 10 sick. A test catches 90% → 9 true positives. It wrongly flags 9% of the 990 healthy → ~89 false positives. So if you test positive, your chance of being sick is 9 / (9 + 89) ≈ 9%. Way lower than people expect.</p>
<div class="widget" id="bayes">
<h3 style="margin-top:0">Play with it</h3>
<div class="sliders">
<div><label for="bPrev">Base rate <span id="bPrevV"></span></label><input type="range" id="bPrev" min="1" max="50" value="5"></div>
<div><label for="bSens">Catches true cases <span id="bSensV"></span></label><input type="range" id="bSens" min="50" max="100" value="90"></div>
<div><label for="bFp">False alarm rate <span id="bFpV"></span></label><input type="range" id="bFp" min="0" max="40" value="10"></div>
</div>
<div class="grid" id="bGrid" aria-hidden="true"></div>
<div class="legend"><span style="--c:var(--bad)">true positive</span><span style="--c:var(--chip)">false positive</span><span style="--c:var(--muted)">missed case</span></div>
<p style="margin:12px 0 0">P(actually positive | test says positive) = <span class="big" id="bOut"></span></p>
</div>
<h3>Traps they love</h3>
<ul>
<li><b>Two-child problem.</b> "At least one is a boy" and "the older one is a boy" give different answers (1/3 vs 1/2). Read the wording super carefully.</li>
<li><b>Monty Hall.</b> The host knows where the car is and always opens a goat door. That info is why switching wins 2/3 of the time.</li>
<li><b>Restricting the sample space.</b> List every outcome that matches the condition, then count.</li>
</ul>`,
  qs:[
  {d:"warm-up",t:"Roll two dice. Given the sum is 8, what's the probability one of the dice shows a 3?",a:0.4,s:"Sum 8: (2,6),(3,5),(4,4),(5,3),(6,2) → 5 outcomes. Two include a 3. Answer 2/5."},
  {d:"classic",t:"A family has two kids. At least one is a boy. What's the probability both are boys?",a:1/3,s:"Options: BB, BG, GB, GG. Remove GG. Of the 3 left, only BB works → 1/3."},
  {d:"classic",t:"Monty Hall: you pick a door, the host (who knows) opens a goat door. What's your chance of winning if you switch?",a:2/3,s:"You were wrong at first with probability 2/3. When you were wrong, switching always wins. So 2/3."},
  {d:"medium",t:"A disease affects 1% of people. The test catches 99% of cases but also flags 5% of healthy people. You test positive. Probability you have it?",a:1/6,s:"Out of 10,000: 100 sick → 99 positive. 9,900 healthy → 495 positive. 99/(99+495) = 99/594 = 1/6 ≈ 0.167."},
  {d:"medium",t:"A bag has one fair coin and one double-headed coin. You grab one and flip it twice: heads both times. Probability it's the double-headed coin?",a:0.8,s:"P(HH | double) = 1, P(HH | fair) = 1/4. Equal priors → 1 / (1 + 1/4) = 4/5."},
  {d:"spicy",t:"Draw 2 cards from a standard deck. Given at least one is an ace, what's the probability both are aces?",a:1/33,s:"P(both aces) = C(4,2)/C(52,2) = 6/1326. P(at least one) = 1 − C(48,2)/C(52,2) = 1 − 1128/1326 = 198/1326. Ratio 6/198 = 1/33."}
  ]},
{ id:"comb", name:"Combinatorics", blurb:"Counting stuff without listing it all out.",
  lesson:`
<h2>The four tools</h2>
<div class="tablewrap"><table>
<tr><th></th><th>Order matters</th><th>Order doesn't</th></tr>
<tr><th>No repeats</th><td class="mono">nPk = n!/(n−k)!</td><td class="mono">nCk = n!/(k!(n−k)!)</td></tr>
<tr><th>Repeats ok</th><td class="mono">nᵏ</td><td class="mono">C(n+k−1, k)</td></tr>
</table></div>
<p>The bottom-right one is <b>stars and bars</b>: the number of ways to split k identical things into n bins.</p>
<h3>Repeated letters</h3>
<div class="formula">arrangements of BANANA = 6! / (3! · 2! · 1!) = 60</div>
<p>Divide by the factorial of each repeated group because swapping identical letters doesn't make a new word.</p>
<h3>Complement counting</h3>
<p>"At least one" problems are almost always easier as <code>total − none</code>.</p>
<h3>Inclusion–exclusion</h3>
<div class="formula">|A ∪ B| = |A| + |B| − |A ∩ B|</div>
<h3>Numbers worth memorising</h3>
<div class="tablewrap"><table>
<tr><td>C(52,5)</td><td class="mono">2,598,960</td></tr>
<tr><td>C(52,2)</td><td class="mono">1,326</td></tr>
<tr><td>5! · 6! · 7!</td><td class="mono">120 · 720 · 5,040</td></tr>
<tr><td>C(10,5)</td><td class="mono">252</td></tr>
</table></div>
<div class="tip"><b>Quick check:</b> before computing, ask yourself "does swapping two things give a different result?" If no, you want combinations.</div>`,
  qs:[
  {d:"warm-up",t:"10 people each shake hands with everyone else once. How many handshakes?",a:45,s:"C(10,2) = 45."},
  {d:"warm-up",t:"How many different 5-card poker hands are there?",a:2598960,s:"C(52,5) = 2,598,960."},
  {d:"classic",t:"How many ways can you arrange the letters of MISSISSIPPI?",a:34650,s:"11 letters: M×1, I×4, S×4, P×2. 11!/(4!·4!·2!) = 34,650."},
  {d:"medium",t:"How many non-negative integer solutions does x + y + z = 10 have?",a:66,s:"Stars and bars: C(10+2, 2) = C(12,2) = 66."},
  {d:"medium",t:"Pick a 3-person committee from 5 men and 4 women. How many committees have at least one woman?",a:74,s:"Total C(9,3) = 84. All-men C(5,3) = 10. 84 − 10 = 74."},
  {d:"medium",t:"4 letters go into 4 addressed envelopes at random. How many ways can every letter end up in the wrong envelope?",a:9,s:"Derangements: D(4) = 4!(1 − 1 + 1/2 − 1/6 + 1/24) = 9."},
  {d:"spicy",t:"What's the probability a 5-card hand is a flush (all one suit, straight flushes included)?",a:0.0019808,s:"4 · C(13,5) / C(52,5) = 4 · 1287 / 2,598,960 ≈ 0.00198."}
  ]},
{ id:"ev", name:"Expected Value", blurb:"The average outcome. Linearity makes hard ones easy.",
  lesson:`
<h2>What it is</h2>
<div class="formula">E[X] = Σ x · P(X = x)</div>
<p>One fair die: (1+2+3+4+5+6)/6 = 3.5.</p>
<h3>Linearity is your best friend</h3>
<div class="formula">E[X + Y] = E[X] + E[Y]     (always, even if X and Y are dependent)</div>
<p>Two dice summed: 3.5 + 3.5 = 7. No need to list 36 outcomes.</p>
<h3>Indicator trick</h3>
<p>To count "how many things happen", give each thing an indicator that's 1 if it happens and 0 if not. The expected count is just the sum of the probabilities.</p>
<p>Example: shuffle a deck. Expected number of cards in their original spot? Each card has a 1/52 chance, there are 52 cards → 52 × 1/52 = 1.</p>
<h3>Geometric waiting</h3>
<div class="formula">Trial with success chance p → expected tries until first success = 1/p</div>
<h3>Optimal stopping</h3>
<p>If you can reroll, keep a result only when it beats the expected value of rerolling. Work backwards from the last roll.</p>
<div class="tip"><b>On the night:</b> if they offer you a game, the fair price is the EV. Anything less than that is a good deal for you.</div>`,
  qs:[
  {d:"warm-up",t:"Expected number of rolls of a fair die until you get a 6?",a:6,s:"Geometric with p = 1/6 → 1/p = 6."},
  {d:"warm-up",t:"Flip a coin until it lands tails. You get $1 per head before that. Fair price to play?",a:1,s:"Number of heads before first tail has mean p/(1−p) = 0.5/0.5 = 1."},
  {d:"classic",t:"Roll a die. You can reroll once and must keep the second roll. With the best strategy, what's your expected payout (in dots)?",a:4.25,s:"Reroll EV is 3.5, so keep 4, 5, 6. EV = (4+5+6)/6 + (3/6)(3.5) = 2.5 + 1.75 = 4.25."},
  {d:"medium",t:"Roll two dice. What's the expected value of the larger one?",a:161/36,s:"P(max = k) = (2k−1)/36. Σ k(2k−1)/36 = (1+6+15+28+45+66)/36 = 161/36 ≈ 4.47."},
  {d:"medium",t:"Shuffle 52 cards. Expected number of cards that land in their original position?",a:1,s:"Indicator trick: 52 × (1/52) = 1."},
  {d:"spicy",t:"Expected rolls of a die until you've seen every face at least once?",a:14.7,s:"Coupon collector: 6 × (1 + 1/2 + 1/3 + 1/4 + 1/5 + 1/6) = 6 × 2.45 = 14.7."}
  ]},
{ id:"markov", name:"Recursion & Markov", blurb:"Set up states, write equations, solve. Coin-flip patterns live here.",
  lesson:`
<h2>The approach</h2>
<p>When a process "resets" or depends only on where you are right now, name each situation as a state and write one equation per state.</p>
<h3>Worked example: expected flips to get HH</h3>
<p>Let E₀ = expected flips from scratch, E₁ = expected flips when the last flip was H.</p>
<div class="formula">E₀ = 1 + ½·E₁ + ½·E₀
E₁ = 1 + ½·0  + ½·E₀
→ E₁ = 1 + E₀/2,  E₀ = 2 + E₁  → E₀ = 6</div>
<p>But HT only takes 4. Why? After an H, a failed attempt at HH sends you back to the start, while for HT you just stay on H until a T shows up.</p>
<h3>Gambler's ruin</h3>
<div class="formula">fair coin, start at i, stop at 0 or N → P(reach N) = i / N</div>
<h3>Alternating turns</h3>
<p>If player A goes first and each turn has success chance p:</p>
<div class="formula">P(A wins) = p / (1 − (1−p)²)  = 1/(2−p)</div>
<div class="tip"><b>Shortcut:</b> expected time to see k sixes in a row is 6 + 6² + … + 6ᵏ. Same idea for any pattern with no self-overlap.</div>`,
  qs:[
  {d:"warm-up",t:"Expected number of coin flips until you get HT?",a:4,s:"Wait for H (2 flips on average), then wait for T (2 more). Total 4."},
  {d:"classic",t:"Expected number of coin flips until you get two heads in a row (HH)?",a:6,s:"Set up E₀ = 1 + ½E₁ + ½E₀ and E₁ = 1 + ½E₀ → E₀ = 6."},
  {d:"classic",t:"A and B take turns flipping a fair coin, A first. First to get heads wins. P(A wins)?",a:2/3,s:"P = ½ + ¼·P → P = 2/3. Or 1/(2 − ½) = 2/3."},
  {d:"medium",t:"You have $3 and bet $1 on fair coin flips. You stop at $0 or $10. Probability you hit $10?",a:0.3,s:"Fair gambler's ruin: i/N = 3/10."},
  {d:"spicy",t:"Expected rolls of a die until you get two 6s in a row?",a:42,s:"6 + 6² = 42."}
  ]},
{ id:"dist", name:"Distributions & Geometry", blurb:"Binomial, uniform, birthday problem, and the classic continuous puzzles.",
  lesson:`
<h2>Discrete must-knows</h2>
<div class="tablewrap"><table>
<tr><th>Name</th><th>When</th><th>Mean</th><th>Variance</th></tr>
<tr><td>Binomial(n,p)</td><td>count successes in n tries</td><td class="mono">np</td><td class="mono">np(1−p)</td></tr>
<tr><td>Geometric(p)</td><td>tries until first success</td><td class="mono">1/p</td><td class="mono">(1−p)/p²</td></tr>
<tr><td>Poisson(λ)</td><td>rare events per interval</td><td class="mono">λ</td><td class="mono">λ</td></tr>
<tr><td>Fair die</td><td>one roll</td><td class="mono">3.5</td><td class="mono">35/12</td></tr>
</table></div>
<h3>"At least one"</h3>
<div class="formula">P(at least one) = 1 − P(none) = 1 − (1−p)ⁿ</div>
<h3>Uniform order statistics</h3>
<p>Drop n points uniformly on [0,1]. They split it into n+1 pieces that are the same size on average, so the k-th smallest has mean k/(n+1). Min of two uniforms → 1/3, max → 2/3.</p>
<h3>Geometric probability</h3>
<p>For two uniform variables, draw the unit square. The probability is just the area of the region that works.</p>
<p>Example: two friends arrive at random within an hour and each waits 15 minutes. They meet if |x − y| ≤ ¼. Region that fails is two triangles with total area (¾)² → P(meet) = 1 − 9/16 = 7/16.</p>
<h3>Birthday problem</h3>
<p>With 23 people, the chance two share a birthday passes 50%. The trick is counting pairs: 23 people make 253 pairs.</p>`,
  qs:[
  {d:"warm-up",t:"Roll a die 4 times. Probability of at least one 6?",a:671/1296,s:"1 − (5/6)⁴ = 1 − 625/1296 = 671/1296 ≈ 0.518."},
  {d:"warm-up",t:"What's the variance of one fair die roll?",a:35/12,s:"E[X²] = 91/6, E[X]² = 12.25. 91/6 − 49/4 = 35/12 ≈ 2.92."},
  {d:"classic",t:"Pick two numbers uniformly from [0,1]. Expected value of the smaller one?",a:1/3,s:"Two points split [0,1] into 3 parts with equal mean length → min = 1/3."},
  {d:"classic",t:"Smallest number of people where the chance two share a birthday is over 50%?",a:23,s:"1 − (365·364·…·343)/365²³ ≈ 0.507 at n = 23."},
  {d:"medium",t:"Two people arrive at random times in the same hour and each waits 15 minutes. Probability they meet?",a:7/16,s:"Unit square, success when |x−y| ≤ 1/4. 1 − (3/4)² = 7/16 = 0.4375."},
  {d:"spicy",t:"Break a stick at two uniformly random points. Probability the three pieces form a triangle?",a:0.25,s:"Need every piece < 1/2. That region is 1/4 of the square → 1/4."}
  ]},
{ id:"bet", name:"Betting & Market Making", blurb:"Fair prices, odds, edge, and how much to bet.",
  lesson:`
<h2>Fair value</h2>
<p>A bet's fair value is its expected payout. Making a market means quoting a bid below fair and an ask above it.</p>
<div class="formula">fair value = Σ payout × probability</div>
<h3>Odds ↔ probability</h3>
<div class="formula">odds of a:b against → implied P = b / (a + b)
3:1 against → P = 1/4</div>
<h3>Edge</h3>
<p>Your edge is your expected profit per $1 bet. Positive edge means you should play (at the right size).</p>
<h3>Kelly criterion</h3>
<p>How much of your bankroll to bet so it grows fastest over time:</p>
<div class="formula">f* = p − q / b
p = win prob, q = 1 − p, b = net odds (win $b per $1)
even money (b = 1) → f* = 2p − 1</div>
<div class="tip"><b>Trading games:</b> if someone keeps buying your ask, they might know something. Update your fair value and widen your spread when you're unsure.</div>
<h3>Making a market, example</h3>
<p>"Make me a market on the sum of two dice." Fair is 7. You might quote 6.5 – 7.5. If they ask you for a market on the product, fair is 3.5 × 3.5 = 12.25 because the dice are independent.</p>`,
  qs:[
  {d:"warm-up",t:"A bet pays $10 if two dice sum to 7. What's its fair value in dollars?",a:10/6,s:"P(sum 7) = 6/36 = 1/6 → 10/6 ≈ $1.67."},
  {d:"warm-up",t:"Fair value of the product of two dice?",a:12.25,s:"Independent, so E[XY] = E[X]E[Y] = 3.5² = 12.25."},
  {d:"classic",t:"You're offered 3:1 on drawing a heart from a full deck ($3 win per $1 bet). What's your expected profit per $1?",a:0,s:"(1/4)(3) − (3/4)(1) = 0. Totally fair bet."},
  {d:"medium",t:"You win an even-money bet 60% of the time. What fraction of your bankroll does Kelly say to bet?",a:0.2,s:"Even money: 2p − 1 = 0.2."},
  {d:"medium",t:"Bet pays 2:1 (win $2 per $1) and you win 40% of the time. Kelly fraction?",a:0.1,s:"f = p − q/b = 0.4 − 0.6/2 = 0.1."},
  {d:"spicy",t:"Fair value of a game: roll a die, you're paid the square of the roll in dollars.",a:91/6,s:"(1+4+9+16+25+36)/6 = 91/6 ≈ $15.17."}
  ]}
];

// ---------- state ----------
let solved = {};
try { solved = JSON.parse(localStorage.getItem("pn-solved")||"{}") || {}; } catch(e){ solved = {}; }
function save(){ try{ localStorage.setItem("pn-solved", JSON.stringify(solved)); }catch(e){} }
let current = "fermi", tab = "learn";
try { const h = location.hash.slice(1); if (h && (TOPICS.some(t=>t.id===h) || h==="sprint")) current = h; } catch(e){}

// ---------- parsing ----------
function parseNum(raw){
  if(!raw) return NaN;
  let s = String(raw).trim().toLowerCase().replace(/,/g,"").replace(/\$/g,"").replace(/\s+/g," ");
  let mult = 1;
  const words = {thousand:1e3,k:1e3,million:1e6,mil:1e6,m:1e6,billion:1e9,bn:1e9,b:1e9,trillion:1e12};
  const wm = s.match(/^(.*?)\s*(thousand|million|mil|billion|trillion|bn|k|m|b)$/);
  if (wm){ s = wm[1]; mult = words[wm[2]]; }
  s = s.replace(/×\s*10\^?/g,"e").replace(/x\s*10\^/g,"e").replace(/\*\s*10\^/g,"e");
  let pct = false;
  if (s.endsWith("%")){ pct = true; s = s.slice(0,-1); }
  let v;
  const frac = s.match(/^(-?[\d.e+-]+)\s*\/\s*([\d.e+-]+)$/);
  if (frac) v = parseFloat(frac[1]) / parseFloat(frac[2]);
  else if (/^-?[\d.]+(e[+-]?\d+)?$/.test(s)) v = parseFloat(s);
  else v = NaN;
  if (pct) v /= 100;
  return v * mult;
}
function fmt(x){
  if (Math.abs(x) >= 1e5) { const e = Math.floor(Math.log10(Math.abs(x))); const m = x/10**e; return (Math.round(m*10)/10)+" × 10^"+e; }
  if (Number.isInteger(x)) return x.toLocaleString();
  return (+x.toPrecision(4)).toString();
}
function nice(q){
  const fr = {[1/3]:"1/3",[2/3]:"2/3",[1/6]:"1/6",[1/33]:"1/33",[161/36]:"161/36",[671/1296]:"671/1296",[35/12]:"35/12",[7/16]:"7/16",[10/6]:"10/6",[91/6]:"91/6"};
  return (fr[q.a] ? fr[q.a]+" ≈ " : "") + fmt(q.a);
}

// ---------- render ----------
const nav = document.getElementById("nav"), view = document.getElementById("view");
function allQs(){ return TOPICS.flatMap(t=>t.qs.map((q,i)=>({...q,key:t.id+"-"+i,topic:t}))); }
function renderNav(){
  nav.innerHTML = "";
  TOPICS.forEach(t=>{
    const b = document.createElement("button");
    const done = t.qs.filter((q,i)=>solved[t.id+"-"+i]).length;
    b.innerHTML = `<span>${t.name}</span><span class="count">${done}/${t.qs.length}</span>`;
    b.setAttribute("aria-current", current===t.id);
    b.onclick = ()=>{ current=t.id; tab="learn"; render(); window.scrollTo(0,0); };
    nav.appendChild(b);
  });
  const sep = document.createElement("div"); sep.className="navsep"; nav.appendChild(sep);
  const s = document.createElement("button");
  s.innerHTML = `<span>Mixed Sprint</span><span class="count">10 Qs</span>`;
  s.setAttribute("aria-current", current==="sprint");
  s.onclick = ()=>{ current="sprint"; startSprint(); render(); window.scrollTo(0,0); };
  nav.appendChild(s);
  const all = allQs(), n = all.filter(q=>solved[q.key]).length;
  document.getElementById("totalTxt").textContent = `${n} of ${all.length} solved`;
  document.getElementById("totalBar").style.width = (100*n/all.length)+"%";
}

function qCard(q, idx, onDone){
  const el = document.createElement("div");
  el.className = "q" + (solved[q.key] ? " solved":"");
  const id = "in-"+q.key;
  el.innerHTML = `
    <div class="qhead"><span class="qnum">${idx}${q.topic && current==="sprint" ? " · "+q.topic.name.toUpperCase() : ""}</span><span class="diff">${q.d}</span></div>
    <p class="qtext">${q.t}</p>
    <div class="row">
      <input type="text" id="${id}" placeholder="${q.fermi ? "e.g. 5e6 or 5 million" : "e.g. 1/3, 0.25, 45"}" aria-label="Your answer" autocomplete="off">
      <button class="btn primary">Check</button>
      <button class="btn ghost">Show solution</button>
    </div>
    <div class="fb" hidden></div>
    <div class="reveal" hidden><span class="ans">Answer: ${q.fermi ? "~"+fmt(q.a) : nice(q)}</span><br>${q.s}</div>`;
  const inp = el.querySelector("input"), fb = el.querySelector(".fb"), rv = el.querySelector(".reveal");
  const [check, show] = el.querySelectorAll(".btn");
  function grade(){
    const v = parseNum(inp.value);
    fb.hidden = false;
    if (isNaN(v)){ fb.className="fb bad"; fb.textContent="Couldn't read that. Try a number, a fraction like 2/3, or 5e6."; return; }
    let ok=false, msg;
    if (q.fermi){
      const r = Math.max(v/q.a, q.a/v);
      if (r <= 3){ ok=true; fb.className="fb good"; msg=`Nice, within 3× of ~${fmt(q.a)}. That's a great Fermi answer.`; }
      else if (r <= 10){ ok=true; fb.className="fb mid"; msg=`Right order of magnitude (within 10× of ~${fmt(q.a)}). Check the solution to tighten it up.`; }
      else { fb.className="fb bad"; msg=`Off by about ${Math.round(r)}×. Have another go or peek at the breakdown.`; }
    } else {
      ok = Math.abs(v-q.a) <= Math.max(0.005, Math.abs(q.a)*0.01);
      fb.className = "fb " + (ok?"good":"bad");
      msg = ok ? "Correct." : "Not quite. Give it another shot.";
    }
    fb.textContent = msg;
    if (ok){ solved[q.key]=true; save(); el.classList.add("solved"); renderNav(); rv.hidden=false; }
    onDone && onDone(ok);
  }
  check.onclick = grade;
  inp.addEventListener("keydown", e=>{ if(e.key==="Enter") grade(); });
  show.onclick = ()=>{ rv.hidden = !rv.hidden; show.textContent = rv.hidden ? "Show solution" : "Hide solution"; onDone && onDone(false, true); };
  return el;
}

function renderTopic(t){
  const done = t.qs.filter((q,i)=>solved[t.id+"-"+i]).length;
  view.innerHTML = `
    <div class="eyebrow">Topic ${TOPICS.indexOf(t)+1} of ${TOPICS.length} · ${done}/${t.qs.length} solved</div>
    <h1>${t.name}</h1>
    <p class="lede">${t.blurb}</p>
    <div class="tabs" role="tablist">
      <button role="tab" id="tLearn" aria-selected="${tab==="learn"}">Learn</button>
      <button role="tab" id="tPrac" aria-selected="${tab==="practice"}">Practice (${t.qs.length})</button>
    </div>
    <div id="body"></div>`;
  view.querySelector("#tLearn").onclick = ()=>{ tab="learn"; render(); };
  view.querySelector("#tPrac").onclick = ()=>{ tab="practice"; render(); };
  const body = view.querySelector("#body");
  if (tab==="learn"){
    body.innerHTML = t.lesson + `<p style="margin-top:28px"><button class="btn primary" id="goPrac">Try the practice questions →</button></p>`;
    body.querySelector("#goPrac").onclick = ()=>{ tab="practice"; render(); window.scrollTo(0,0); };
    if (t.id==="cond") initBayes();
    if (t.id==="fermi") initFermi();
  } else {
    t.qs.forEach((q,i)=> body.appendChild(qCard({...q,key:t.id+"-"+i}, "Q"+(i+1))));
    const i = TOPICS.indexOf(t);
    if (i < TOPICS.length-1){
      const p = document.createElement("p"); p.style.marginTop="24px";
      p.innerHTML = `<button class="btn">Next topic: ${TOPICS[i+1].name} →</button>`;
      p.querySelector("button").onclick = ()=>{ current=TOPICS[i+1].id; tab="learn"; render(); window.scrollTo(0,0); };
      body.appendChild(p);
    }
  }
}

// ---------- sprint ----------
let sprint = null, timer = null;
function startSprint(){
  const pool = allQs().filter(q=>!q.fermi);
  for (let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  sprint = {qs:pool.slice(0,10), score:0, answered:new Set(), start:Date.now()};
  clearInterval(timer);
  timer = setInterval(()=>{ const el=document.getElementById("clock"); if(el && sprint && sprint.answered.size<10){ el.textContent = clock(Date.now()-sprint.start); } }, 1000);
}
function clock(ms){ const s=Math.floor(ms/1000); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function renderSprint(){
  if (!sprint) startSprint();
  view.innerHTML = `
    <div class="eyebrow">Mixed sprint · 10 random questions</div>
    <h1>Beat the clock</h1>
    <p class="lede">Questions from every topic, shuffled. Your first check on each one counts toward the score, and showing the solution counts as a miss. Mental maths only if you want the real night feel.</p>
    <div class="sprintbar"><span>Time <b id="clock">0:00</b></span><span>Score <b id="score">0</b>/10</span><span>Done <b id="done">0</b>/10</span><button class="btn" id="reshuffle">New set</button></div>
    <div id="body"></div>`;
  view.querySelector("#reshuffle").onclick = ()=>{ startSprint(); render(); };
  const body = view.querySelector("#body");
  sprint.qs.forEach((q,i)=>{
    body.appendChild(qCard(q, "Q"+(i+1), (ok, peeked)=>{
      if (sprint.answered.has(q.key)) return;
      sprint.answered.add(q.key);
      if (ok && !peeked) sprint.score++;
      document.getElementById("score").textContent = sprint.score;
      document.getElementById("done").textContent = sprint.answered.size;
      if (sprint.answered.size===10){
        const t = clock(Date.now()-sprint.start);
        const end = document.createElement("div"); end.className="widget";
        end.innerHTML = `<div class="eyebrow">Finished in ${t}</div><p class="big" style="margin:6px 0">${sprint.score}/10</p><p style="margin:0">${sprint.score>=8?"Ready for the night. Go again to keep it sharp.":sprint.score>=5?"Solid. Revise the topics you missed, then try a new set.":"Go back through the Learn tabs for the ones that tripped you up, then hit New set."}</p>`;
        body.appendChild(end);
      }
    }));
  });
}

// ---------- widgets ----------
function initBayes(){
  const P=document.getElementById("bPrev"), S=document.getElementById("bSens"), F=document.getElementById("bFp"), G=document.getElementById("bGrid");
  const N = window.innerWidth<=820 ? 500 : 1000;
  G.innerHTML = "<i></i>".repeat(N);
  const cells = G.children;
  function upd(){
    const prev=P.value/100, sens=S.value/100, fp=F.value/100;
    document.getElementById("bPrevV").textContent=P.value+"%";
    document.getElementById("bSensV").textContent=S.value+"%";
    document.getElementById("bFpV").textContent=F.value+"%";
    const sick=Math.round(N*prev), tp=Math.round(sick*sens), fps=Math.round((N-sick)*fp);
    for(let i=0;i<N;i++){ cells[i].className = i<tp ? "tp" : i<sick ? "fn" : i<sick+fps ? "fp" : ""; }
    const pp = prev*sens/(prev*sens+(1-prev)*fp);
    document.getElementById("bOut").textContent = isFinite(pp) ? (pp*100).toFixed(1)+"%" : "—";
  }
  [P,S,F].forEach(x=>x.oninput=upd); upd();
}
function initFermi(){
  const L=document.getElementById("fLow"), H=document.getElementById("fHigh"), O=document.getElementById("fOut");
  function upd(){ const l=parseNum(L.value), h=parseNum(H.value); O.textContent = (l>0&&h>0) ? "Geometric mean ≈ "+fmt(Math.sqrt(l*h)) : "Enter two positive numbers (5e6 and 2 million both work)."; }
  L.oninput=H.oninput=upd; upd();
}

function render(){
  renderNav();
  try { history.replaceState(null,"","#"+current); } catch(e){}
  if (current==="sprint") renderSprint(); else renderTopic(TOPICS.find(t=>t.id===current));
}
if (current==="sprint") startSprint();
render();
</script>

</body></html>
