<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Write — Kunga's Diary</title>
<style>
:root{
  --bg:#0a0f1d;--panel:#121b2f;--panel-2:#1a2540;--text:#eef3ff;--muted:#9bb0d3;
  --gold:#f4c95d;--accent:#7cc7ff;--danger:#ff7a7a;--good:#6fd79a;--border:rgba(255,255,255,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#0a0f1d 0%,#0f172a 100%);color:var(--text);min-height:100vh}
.shell{max-width:720px;margin:0 auto;padding:28px 18px 80px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.brand{font-size:1.25rem;font-weight:700}
.brand span{color:var(--gold)}
a{color:var(--accent);text-decoration:none;font-size:13px}
.panel{background:rgba(18,27,47,.9);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
label{display:block;font-size:12.5px;color:var(--muted);margin:14px 0 6px;font-weight:600}
label:first-of-type{margin-top:0}
input[type=password],input[type=date],input[type=text]{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--border);background:rgba(10,15,29,.8);color:var(--text);font-size:14px;outline:none}
input:focus{border-color:var(--gold)}
button{border:0;border-radius:10px;background:linear-gradient(135deg,var(--gold),#e9b440);color:#111827;font-weight:700;padding:11px 16px;cursor:pointer;font-size:13.5px}
button.secondary{background:rgba(255,255,255,.08);color:var(--text)}
button.danger{background:rgba(255,122,122,.15);color:var(--danger)}
button:disabled{opacity:.5;cursor:default}
.toolbar{display:flex;gap:6px;margin-top:4px}
.toolbar button{padding:6px 11px;font-size:13px}
#editor{min-height:140px;border:1px solid var(--border);border-radius:10px;background:rgba(10,15,29,.8);padding:12px 14px;font-size:15px;line-height:1.6;outline:none;margin-top:6px}
#editor:focus{border-color:var(--gold)}
.moodRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.moodBtn{font-size:20px;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.06);border:1.5px solid transparent;cursor:pointer}
.moodBtn.sel{border-color:var(--gold);background:rgba(244,201,93,.15)}
.actions{display:flex;gap:10px;margin-top:18px}
.msg{font-size:13px;margin-top:10px;min-height:16px}
.msg.good{color:var(--good)}
.msg.bad{color:var(--danger)}
.entryRow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.entryRow:last-child{border-bottom:none}
.entryDate{font-weight:700;font-size:13.5px}
.entrySnippet{font-size:12.5px;color:var(--muted);margin-top:3px;max-width:48ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entryBtns{display:flex;gap:6px;flex-shrink:0}
.entryBtns button{padding:6px 10px;font-size:12px}
.hidden{display:none}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:14px 0}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="brand">Write — <span>Kunga's Diary</span></div>
    <a href="/diary">View public page →</a>
  </div>

  <div class="panel" id="lockPanel">
    <label>Admin key</label>
    <input type="password" id="adminKeyInput" placeholder="Admin key">
    <div class="actions"><button id="unlockBtn">Unlock</button></div>
    <div class="msg" id="lockMsg"></div>
  </div>

  <div id="writerArea" class="hidden">
    <div class="panel">
      <label id="formHeading">New entry</label>
      <label>Date</label>
      <input type="date" id="dateInput">
      <label>Mood (optional)</label>
      <div class="moodRow" id="moodRow"></div>
      <label>Entry</label>
      <div class="toolbar">
        <button type="button" class="secondary" data-cmd="bold"><b>B</b></button>
        <button type="button" class="secondary" data-cmd="italic"><i>I</i></button>
        <button type="button" class="secondary" data-cmd="insertUnorderedList">• List</button>
      </div>
      <div id="editor" contenteditable="true" data-placeholder="Write today's entry…"></div>
      <div class="actions">
        <button id="saveBtn">Save entry</button>
        <button class="secondary hidden" id="cancelEditBtn">Cancel edit</button>
      </div>
      <div class="msg" id="saveMsg"></div>
    </div>

    <div class="panel">
      <label>Past entries</label>
      <div id="entryList"><div class="empty">Loading…</div></div>
    </div>
  </div>
</div>

<script>
let adminKey = '';
let editingId = null;
let selectedMood = '';
const MOODS = ['😊','😐','😢','😤','🎉','💭','🥱','❤️'];

const lockPanel = document.getElementById('lockPanel');
const writerArea = document.getElementById('writerArea');
const lockMsg = document.getElementById('lockMsg');
const saveMsg = document.getElementById('saveMsg');
const editor = document.getElementById('editor');
const dateInput = document.getElementById('dateInput');
const moodRow = document.getElementById('moodRow');
const entryList = document.getElementById('entryList');
const formHeading = document.getElementById('formHeading');
const cancelEditBtn = document.getElementById('cancelEditBtn');

moodRow.innerHTML = MOODS.map(m => `<button type="button" class="moodBtn" data-mood="${m}">${m}</button>`).join('');
moodRow.querySelectorAll('.moodBtn').forEach(btn => {
  btn.onclick = () => {
    const m = btn.dataset.mood;
    selectedMood = (selectedMood === m) ? '' : m;
    moodRow.querySelectorAll('.moodBtn').forEach(b => b.classList.toggle('sel', b.dataset.mood === selectedMood));
  };
});

document.querySelectorAll('.toolbar [data-cmd]').forEach(btn => {
  btn.onclick = () => { document.execCommand(btn.dataset.cmd, false, null); editor.focus(); };
});

function todayStr(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
dateInput.value = todayStr();

document.getElementById('unlockBtn').onclick = async () => {
  adminKey = document.getElementById('adminKeyInput').value.trim();
  if(!adminKey){ lockMsg.textContent = 'Enter the admin key.'; lockMsg.className = 'msg bad'; return; }
  const ok = await loadEntries();
  if(ok){
    lockPanel.classList.add('hidden');
    writerArea.classList.remove('hidden');
  }
};

async function loadEntries(){
  try{
    const resp = await fetch('/api/kungas-diary/entries', { headers: { 'x-admin-key': adminKey } });
    if(resp.status === 401){ lockMsg.textContent = 'Incorrect admin key.'; lockMsg.className = 'msg bad'; adminKey = ''; return false; }
    const data = await resp.json();
    renderEntries(data.entries || []);
    return true;
  }catch(e){
    lockMsg.textContent = 'Network error.'; lockMsg.className = 'msg bad';
    return false;
  }
}

function renderEntries(entries){
  entries = entries.slice().sort((a,b) => (b.date||'').localeCompare(a.date||'') || (b.t||0)-(a.t||0));
  if(!entries.length){ entryList.innerHTML = '<div class="empty">No entries yet.</div>'; return; }
  entryList.innerHTML = entries.map(e => `
    <div class="entryRow">
      <div>
        <div class="entryDate">${e.mood ? e.mood + ' ' : ''}${e.date}</div>
        <div class="entrySnippet">${(e.html || '').replace(/<[^>]+>/g,' ').trim().slice(0,70)}</div>
      </div>
      <div class="entryBtns">
        <button class="secondary" data-edit="${e.id}">Edit</button>
        <button class="danger" data-del="${e.id}">Delete</button>
      </div>
    </div>`).join('');
  entryList.querySelectorAll('[data-edit]').forEach(btn => {
    btn.onclick = () => startEdit(entries.find(e => e.id === btn.dataset.edit));
  });
  entryList.querySelectorAll('[data-del]').forEach(btn => {
    btn.onclick = () => deleteEntry(btn.dataset.del);
  });
}

function startEdit(entry){
  if(!entry) return;
  editingId = entry.id;
  dateInput.value = entry.date;
  selectedMood = entry.mood || '';
  moodRow.querySelectorAll('.moodBtn').forEach(b => b.classList.toggle('sel', b.dataset.mood === selectedMood));
  editor.innerHTML = entry.html || '';
  formHeading.textContent = 'Editing ' + entry.date;
  cancelEditBtn.classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

cancelEditBtn.onclick = () => { resetForm(); saveMsg.textContent = ''; };

function resetForm(){
  editingId = null;
  dateInput.value = todayStr();
  selectedMood = '';
  moodRow.querySelectorAll('.moodBtn').forEach(b => b.classList.remove('sel'));
  editor.innerHTML = '';
  formHeading.textContent = 'New entry';
  cancelEditBtn.classList.add('hidden');
}

document.getElementById('saveBtn').onclick = async () => {
  const date = dateInput.value;
  const html = editor.innerHTML.trim();
  if(!date){ saveMsg.textContent = 'Pick a date.'; saveMsg.className = 'msg bad'; return; }
  if(!html || html === '<br>'){ saveMsg.textContent = "Today's entry can't be empty."; saveMsg.className = 'msg bad'; return; }

  try{
    const resp = await fetch('/api/kungas-diary/entry', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-key': adminKey },
      body: JSON.stringify({ id: editingId, date, html, mood: selectedMood }),
    });
    const data = await resp.json();
    if(!resp.ok){ saveMsg.textContent = data.error || 'Could not save.'; saveMsg.className = 'msg bad'; return; }
    saveMsg.textContent = 'Saved.'; saveMsg.className = 'msg good';
    resetForm();
    loadEntries();
  }catch(e){
    saveMsg.textContent = 'Network error.'; saveMsg.className = 'msg bad';
  }
};

async function deleteEntry(id){
  if(!confirm('Delete this entry? This cannot be undone.')) return;
  await fetch('/api/kungas-diary/delete', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-admin-key': adminKey },
    body: JSON.stringify({ id }),
  });
  loadEntries();
}
</script>
</body>
</html>
