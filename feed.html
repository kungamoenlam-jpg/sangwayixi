<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kunga's Feed</title>
<meta name="description" content="Post a photo of yourself and like other people's posts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1a0f17;--ink:#fdf0f6;--muted:#c79bb3;--accent:#ff4d8d;--accent2:#c2287f;
  --good:#3FAE72;--bad:#ff8a8a;--font-display:'Space Grotesk',sans-serif;--font-body:'Inter',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 0%,#3a1a2c,#1a0f17 60%);color:var(--ink);font-family:var(--font-body);min-height:100vh}
.topBar{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px;background:rgba(26,15,23,.88);backdrop-filter:blur(8px)}
.brand{font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--ink);text-decoration:none}
.loginNudge{text-align:center;color:var(--muted);font-size:13.5px;padding:14px 10px;line-height:1.7}
.loginNudge a{color:var(--accent);font-weight:600}

.wrap{max-width:480px;margin:0 auto;padding:4px 18px 60px}
.hero{padding:16px 0 10px}
.hero h1{font-family:var(--font-display);font-weight:800;font-size:26px;margin:0 0 6px}
.hero p{color:var(--muted);font-size:13.5px;margin:0;line-height:1.6}

.composer{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:16px;margin-bottom:20px}
.composer textarea{width:100%;font-size:14px;padding:12px 14px;border-radius:12px;border:1.5px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:var(--ink);outline:none;resize:vertical;min-height:60px;font-family:inherit;margin-bottom:10px}
.composer textarea:focus{border-color:var(--accent)}
.composerRow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.fileBtn{all:unset;cursor:pointer;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.postBtn{all:unset;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#2a0a17;font-weight:700;padding:9px 18px;border-radius:999px;font-size:13.5px}
.postBtn:disabled{opacity:.4;cursor:default}
.previewThumb{width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-bottom:10px;display:none}
.previewThumb.show{display:block}
.composerMsg{font-size:12px;color:var(--bad);margin-top:8px;min-height:14px}

.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:16px;overflow:hidden;margin-bottom:18px}
.cardHead{display:flex;align-items:center;gap:10px;padding:12px 14px}
.avatarDot{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--accent),var(--accent2));color:#2a0a17;font-weight:700;font-size:14px;text-transform:uppercase}
.cardUser{font-weight:700;font-size:14px}
.cardTime{font-size:11.5px;color:var(--muted)}
.cardPhoto{width:100%;max-height:480px;object-fit:cover;display:block;background:rgba(255,255,255,.03)}
.cardFoot{padding:10px 14px 14px}
.cardCaption{font-size:14px;line-height:1.55;margin-bottom:10px;white-space:pre-wrap;word-break:break-word}
.cardActions{display:flex;align-items:center;gap:14px}
.likeBtn{all:unset;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.likeBtn .heart{font-size:18px;transition:transform .15s}
.likeBtn.liked{color:var(--accent)}
.likeBtn.liked .heart{transform:scale(1.1)}
.likeBtn:active .heart{transform:scale(.85)}
.deleteBtn{all:unset;cursor:pointer;font-size:12px;color:var(--muted);margin-left:auto}
.deleteBtn:hover{color:var(--bad)}

.emptyState{text-align:center;color:var(--muted);font-size:13.5px;padding:60px 20px;line-height:1.7}
.emptyState .glyph{font-size:34px;display:block;margin-bottom:10px}
</style>
</head>
<body>

<div class="topBar">
  <a class="brand" href="/">← kunga.me</a>
  <span class="brand" style="color:var(--muted);font-weight:600">FEED</span>
</div>

<div class="wrap">
  <div class="hero">
    <h1>📸 Kunga's Feed</h1>
    <p>Post a photo of yourself. Like what you see.</p>
  </div>
  <div id="composerWrap"></div>
  <div id="feed"><div class="emptyState">Loading…</div></div>
</div>

<script>
const SESSION_KEY = 'sangwa_session_v1';
function currentUser(){
  try{
    const s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    return (s && s.currentUser) ? String(s.currentUser) : null;
  }catch(e){ return null; }
}
function esc(s){ return String(s === undefined || s === null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function timeAgo(iso){
  if(!iso) return '';
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diffMs / 60000);
  if(mins < 1) return 'now';
  if(mins < 60) return mins + 'm';
  const hrs = Math.floor(mins / 60);
  if(hrs < 24) return hrs + 'h';
  return Math.floor(hrs / 24) + 'd';
}

let selectedFile = null;
let posting = false;

function renderComposer(){
  const wrap = document.getElementById('composerWrap');
  const user = currentUser();
  if(!user){
    wrap.innerHTML = `<div class="composer"><div class="loginNudge">Log in on <a href="/">kunga.me</a> to post.</div></div>`;
    return;
  }
  wrap.innerHTML = `
    <div class="composer">
      <img class="previewThumb" id="previewThumb">
      <textarea id="captionInput" maxlength="280" placeholder="Say something about this photo…"></textarea>
      <div class="composerRow">
        <button class="fileBtn" id="fileBtn">📷 <span id="fileLabel">Choose a photo</span></button>
        <input type="file" id="photoInput" accept="image/jpeg,image/png,image/webp" style="display:none">
        <button class="postBtn" id="postBtn" disabled>Post</button>
      </div>
      <div class="composerMsg" id="composerMsg"></div>
    </div>
  `;
  document.getElementById('fileBtn').onclick = () => document.getElementById('photoInput').click();
  document.getElementById('photoInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    selectedFile = file;
    document.getElementById('fileLabel').textContent = file.name;
    const preview = document.getElementById('previewThumb');
    preview.src = URL.createObjectURL(file);
    preview.classList.add('show');
    document.getElementById('postBtn').disabled = false;
  });
  document.getElementById('postBtn').onclick = submitPost;
}

async function submitPost(){
  if(posting || !selectedFile) return;
  posting = true;
  const msgEl = document.getElementById('composerMsg');
  msgEl.textContent = '';
  document.getElementById('postBtn').disabled = true;
  const caption = document.getElementById('captionInput').value.trim();

  try{
    const resp = await fetch('/api/feed', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: currentUser(), caption }),
    });
    const data = await resp.json();
    if(!resp.ok){ msgEl.textContent = data.error || 'Could not post.'; posting = false; document.getElementById('postBtn').disabled = false; return; }

    const buf = await selectedFile.arrayBuffer();
    const photoResp = await fetch('/api/feed/' + data.post.id + '/photo', {
      method: 'POST', headers: { 'Content-Type': selectedFile.type },
      body: buf,
    });
    if(!photoResp.ok){
      const photoData = await photoResp.json().catch(() => ({}));
      msgEl.textContent = photoData.error || 'Photo upload failed.';
      posting = false;
      document.getElementById('postBtn').disabled = false;
      return;
    }

    selectedFile = null;
    renderComposer();
    posting = false;
    loadFeed();
  }catch(e){
    msgEl.textContent = 'Network error — try again.';
    posting = false;
    document.getElementById('postBtn').disabled = false;
  }
}

async function loadFeed(){
  const feed = document.getElementById('feed');
  const user = currentUser();
  try{
    const resp = await fetch('/api/feed' + (user ? '?username=' + encodeURIComponent(user) : ''));
    const data = await resp.json();
    const posts = data.posts || [];
    if(!posts.length){
      feed.innerHTML = `<div class="emptyState"><span class="glyph">📸</span>No posts yet — be the first to share a photo.</div>`;
      return;
    }
    feed.innerHTML = posts.map((p) => `
      <div class="card" data-post="${p.id}">
        <div class="cardHead">
          <div class="avatarDot">${esc(p.username.charAt(0))}</div>
          <div>
            <div class="cardUser">${esc(p.username)}</div>
            <div class="cardTime">${esc(timeAgo(p.createdAt))}</div>
          </div>
        </div>
        <img class="cardPhoto" src="/feed-photo/${p.id}" loading="lazy">
        <div class="cardFoot">
          ${p.caption ? `<div class="cardCaption">${esc(p.caption)}</div>` : ''}
          <div class="cardActions">
            <button class="likeBtn ${p.likedByMe ? 'liked' : ''}" data-like="${p.id}">
              <span class="heart">${p.likedByMe ? '❤️' : '🤍'}</span>
              <span class="likeCount">${p.likeCount}</span>
            </button>
            ${(user && user.toLowerCase() === p.username.toLowerCase()) ? `<button class="deleteBtn" data-delete="${p.id}">Delete</button>` : ''}
          </div>
        </div>
      </div>
    `).join('');
    feed.querySelectorAll('[data-like]').forEach((btn) => {
      btn.onclick = () => toggleLike(btn.dataset.like);
    });
    feed.querySelectorAll('[data-delete]').forEach((btn) => {
      btn.onclick = () => deletePost(btn.dataset.delete);
    });
  }catch(e){
    feed.innerHTML = `<div class="emptyState">Network error — try again.</div>`;
  }
}

async function toggleLike(postId){
  const user = currentUser();
  if(!user){ alert('Log in to like posts.'); return; }
  const btn = document.querySelector('[data-like="' + postId + '"]');
  if(!btn) return;
  btn.disabled = true;
  try{
    const resp = await fetch('/api/feed/' + postId + '/like', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: user }),
    });
    const data = await resp.json();
    if(resp.ok){
      btn.classList.toggle('liked', data.liked);
      btn.querySelector('.heart').textContent = data.liked ? '❤️' : '🤍';
      btn.querySelector('.likeCount').textContent = data.likeCount;
    }
  }catch(e){ /* ignore, UI stays as-is */ }
  btn.disabled = false;
}

async function deletePost(postId){
  if(!confirm("Delete this post? This can't be undone.")) return;
  await fetch('/api/feed/' + postId + '/delete', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: currentUser() }),
  });
  loadFeed();
}

renderComposer();
loadFeed();
</script>
</body>
</html>
