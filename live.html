<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kunga's Live</title>
<meta name="description" content="Go live, or watch someone else's stream and send gifts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#fff;--muted:#b4b6c6;--accent:#ff2d75;--accent2:#7c3aed;--live-red:#ff3b30;
  --good:#3FAE72;--bad:#ff5c5c;--font-display:'Space Grotesk',sans-serif;--font-body:'Inter',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0b0b12;color:var(--ink);font-family:var(--font-body);overflow:hidden}
.view{display:none;height:100%}
.view.active{display:block}

/* ---- Lobby ---- */
#lobbyView{overflow-y:auto}
.topBar{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px;background:rgba(11,11,18,.85);backdrop-filter:blur(8px)}
.brand{font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--ink);text-decoration:none}
.wrap{max-width:560px;margin:0 auto;padding:10px 18px calc(40px + env(safe-area-inset-bottom,0px))}
h1{font-family:var(--font-display);font-weight:800;font-size:26px;margin:14px 0 4px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:14px;margin:0 0 18px}
.goLiveBtn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;font-family:var(--font-display);font-weight:700;font-size:16px;padding:16px;border-radius:14px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;margin-bottom:26px}
.sectionLabel{font-family:var(--font-display);font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px}
.streamGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.streamCard{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
.streamThumb{aspect-ratio:3/4;background:linear-gradient(145deg,#2a1f45,#160f28);display:flex;align-items:center;justify-content:center;position:relative}
.liveBadge{position:absolute;top:8px;left:8px;background:var(--live-red);font-family:var(--font-display);font-weight:700;font-size:10px;letter-spacing:.04em;padding:3px 7px;border-radius:5px;display:flex;align-items:center;gap:4px}
.liveDot{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.viewerBadge{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.55);font-size:11px;padding:3px 7px;border-radius:999px;display:flex;align-items:center;gap:4px}
.streamMeta{padding:10px}
.streamTitle{font-size:13px;font-weight:600;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.streamUser{font-size:11.5px;color:var(--muted)}
.emptyLobby{grid-column:1/-1;text-align:center;color:var(--muted);font-size:13.5px;padding:40px 10px}
.emptyLobby .glyph{font-size:36px;display:block;margin-bottom:8px}

/* ---- Host setup modal ---- */
.modalOverlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modalOverlay.open{display:flex}
.modalCard{width:100%;max-width:480px;background:#15151f;border-radius:20px 20px 0 0;padding:22px 20px calc(26px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow-y:auto}
.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modalHead h2{font-family:var(--font-display);font-size:17px;margin:0}
.closeBtn{all:unset;cursor:pointer;font-size:20px;color:var(--muted);padding:4px}
label.fieldLabel{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 8px}
input#titleInput{width:100%;font-family:var(--font-body);font-size:15px;padding:12px 14px;border-radius:12px;border:1.5px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:var(--ink);outline:none;margin-bottom:16px}
.previewBox{position:relative;width:100%;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:#000;margin-bottom:16px}
.previewBox video{width:100%;height:100%;object-fit:cover}
.loginNudge{text-align:center;color:var(--muted);font-size:13.5px;padding:30px 10px;line-height:1.7}
.loginNudge a{color:var(--accent);font-weight:600}
.primaryBtn{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;text-align:center;font-family:var(--font-display);font-weight:700;font-size:15px;padding:14px;border-radius:14px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff}
.primaryBtn:disabled{opacity:.5;cursor:default}
.errorBox{background:rgba(255,92,92,.14);border:1px solid rgba(255,92,92,.35);color:#ffb0b0;padding:10px 14px;border-radius:10px;font-size:13px;margin-top:12px;text-align:center}

/* ---- Host / Watch full-screen stage ---- */
.stage{position:relative;height:100%;width:100%;background:#000}
.stageVideo{width:100%;height:100%;object-fit:cover;background:#000}
.stageTop{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;background:linear-gradient(180deg,rgba(0,0,0,.6),transparent)}
.stageUserRow{display:flex;align-items:center;gap:8px}
.stageTitle{font-size:13px;font-weight:600;max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exitBtn{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:rgba(0,0,0,.4);font-size:16px}
.viewerCountPill{background:rgba(0,0,0,.45);font-size:11.5px;padding:5px 10px;border-radius:999px;display:flex;align-items:center;gap:5px}
.stageBottom{position:absolute;left:0;right:0;bottom:0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(0deg,rgba(0,0,0,.65),transparent)}
.endBtn{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;text-align:center;font-family:var(--font-display);font-weight:700;font-size:15px;padding:14px;border-radius:14px;background:rgba(255,59,48,.85);color:#fff}
.muteToggle{all:unset;cursor:pointer;position:absolute;right:16px;bottom:100px;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center;font-size:18px}
.endedCard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px;color:var(--muted)}
.endedCard .glyph{font-size:40px}
.backToLobbyBtn{all:unset;cursor:pointer;font-family:var(--font-display);font-weight:700;font-size:14px;padding:12px 22px;border-radius:12px;background:rgba(255,255,255,.1);color:#fff}

.giftRow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.giftBtn{all:unset;box-sizing:border-box;cursor:pointer;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:8px 12px;min-width:58px}
.giftBtn .emoji{font-size:20px}
.giftBtn .price{font-size:10px;color:var(--muted)}
.giftBtn:active{background:rgba(255,45,117,.3)}

.toastStack{position:absolute;left:16px;bottom:170px;display:flex;flex-direction:column-reverse;gap:6px;pointer-events:none;max-width:70%}
.giftToast{background:rgba(0,0,0,.55);border-radius:999px;padding:7px 14px;font-size:13px;display:flex;align-items:center;gap:6px;animation:toastIn .25s ease-out, toastOut .4s ease-in 2.6s forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{to{opacity:0}}
.flashMsg{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);padding:8px 16px;border-radius:999px;font-size:13px;z-index:5}
</style>
</head>
<body>

<div class="view active" id="lobbyView">
  <div class="topBar">
    <a class="brand" href="/">← kunga.me</a>
    <span class="brand" style="color:var(--muted);font-weight:600">LIVE</span>
  </div>
  <div class="wrap">
    <h1>Kunga's Live</h1>
    <p class="sub">Go live, or watch someone else's stream and send them a gift.</p>
    <button class="goLiveBtn" id="goLiveBtn">🔴 Go Live</button>
    <div class="sectionLabel">Live now</div>
    <div class="streamGrid" id="streamGrid"></div>
  </div>
</div>

<div class="view" id="hostView">
  <div class="stage">
    <video class="stageVideo" id="hostVideo" autoplay playsinline muted></video>
    <div class="stageTop">
      <div class="stageUserRow">
        <button class="exitBtn" id="hostExitBtn">←</button>
        <span class="stageTitle" id="hostTitleLabel"></span>
      </div>
      <span class="viewerCountPill">👁 <span id="hostViewerCount">0</span></span>
    </div>
    <div class="toastStack" id="hostToastStack"></div>
    <div class="stageBottom">
      <button class="endBtn" id="endStreamBtn">End stream</button>
    </div>
  </div>
</div>

<div class="view" id="watchView">
  <div class="stage">
    <video class="stageVideo" id="watchVideo" autoplay playsinline muted></video>
    <div class="stageTop">
      <div class="stageUserRow">
        <button class="exitBtn" id="watchExitBtn">←</button>
        <span class="stageTitle" id="watchTitleLabel"></span>
      </div>
      <span class="viewerCountPill">👁 <span id="watchViewerCount">0</span></span>
    </div>
    <button class="muteToggle" id="muteToggleBtn">🔇</button>
    <div class="toastStack" id="watchToastStack"></div>
    <div class="flashMsg" id="watchFlashMsg" style="display:none"></div>
    <div class="stageBottom">
      <div class="giftRow" id="giftRow"></div>
    </div>
    <div class="endedCard" id="endedCard" style="display:none">
      <div class="glyph">📡</div>
      <p>This stream has ended.</p>
      <button class="backToLobbyBtn" id="backToLobbyBtn">Back to Live</button>
    </div>
  </div>
</div>

<div class="modalOverlay" id="hostSetupOverlay">
  <div class="modalCard">
    <div class="modalHead"><h2>Go live</h2><button class="closeBtn" id="closeHostSetup">×</button></div>
    <div id="hostSetupBody"></div>
  </div>
</div>

<script>
const SESSION_KEY = 'sangwa_session_v1';
function currentUser(){
  try{
    const s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    return (s && s.currentUser) ? String(s.currentUser) : null;
  }catch(e){ return null; }
}
function esc(s){ return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function wsUrl(){
  return (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/live';
}
const ICE_SERVERS = [{ urls: 'stun:stun.l.google.com:19302' }];
let GIFTS = {};

function showView(name){
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(name + 'View').classList.add('active');
}

// ================= Lobby =================
const streamGrid = document.getElementById('streamGrid');
let lobbyPollTimer = null;

async function loadLobby(){
  try{
    const resp = await fetch('/api/live');
    const data = await resp.json();
    GIFTS = data.gifts || {};
    renderLobby(data.sessions || []);
  }catch(e){ /* a silent miss just means the grid holds its last state until the next poll */ }
}
function renderLobby(sessions){
  if(!sessions.length){
    streamGrid.innerHTML = '<div class="emptyLobby"><span class="glyph">📡</span>No one is live right now — be the first!</div>';
    return;
  }
  streamGrid.innerHTML = sessions.map(s => `
    <button class="streamCard" data-watch="${s.id}">
      <div class="streamThumb">
        <div class="liveBadge"><span class="liveDot"></span>LIVE</div>
        <div class="viewerBadge">👁 ${s.viewerCount}</div>
        <span style="font-size:34px">🎥</span>
      </div>
      <div class="streamMeta">
        <div class="streamTitle">${esc(s.title)}</div>
        <div class="streamUser">@${esc(s.username)}</div>
      </div>
    </button>
  `).join('');
  streamGrid.querySelectorAll('[data-watch]').forEach((btn, i) => {
    btn.onclick = () => startWatching(sessions[i].id, sessions[i].title, sessions[i].username);
  });
}
function startLobbyPolling(){
  loadLobby();
  clearInterval(lobbyPollTimer);
  lobbyPollTimer = setInterval(loadLobby, 4000);
}
function stopLobbyPolling(){ clearInterval(lobbyPollTimer); }

// ================= Go-live setup =================
const hostSetupOverlay = document.getElementById('hostSetupOverlay');
const hostSetupBody = document.getElementById('hostSetupBody');
let setupStream = null;

document.getElementById('goLiveBtn').onclick = openHostSetup;
document.getElementById('closeHostSetup').onclick = closeHostSetup;
hostSetupOverlay.onclick = (e) => { if(e.target === hostSetupOverlay) closeHostSetup(); };

function closeHostSetup(){
  hostSetupOverlay.classList.remove('open');
  if(setupStream){ setupStream.getTracks().forEach(t => t.stop()); setupStream = null; }
}

async function openHostSetup(){
  const user = currentUser();
  hostSetupOverlay.classList.add('open');
  if(!user){
    hostSetupBody.innerHTML = `<div class="loginNudge">Log in on <a href="/">kunga.me</a> first, then come back to go live.</div>`;
    return;
  }
  hostSetupBody.innerHTML = `
    <label class="fieldLabel" for="titleInput">Stream title</label>
    <input type="text" id="titleInput" maxlength="80" placeholder="What are you up to?">
    <div class="previewBox"><video id="setupPreview" autoplay playsinline muted></video></div>
    <button class="primaryBtn" id="startLiveBtn">Start streaming</button>
    <div id="setupErrorBox"></div>
  `;
  const preview = document.getElementById('setupPreview');
  try{
    setupStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    preview.srcObject = setupStream;
  }catch(e){
    document.getElementById('setupErrorBox').innerHTML = `<div class="errorBox">Couldn't access your camera/microphone. Check your browser permissions and try again.</div>`;
    document.getElementById('startLiveBtn').disabled = true;
  }
  document.getElementById('startLiveBtn').onclick = startBroadcast;
}

// ================= Host (broadcaster) =================
let hostState = null; // { liveId, ws, stream, peers: Map(viewerId -> RTCPeerConnection) }

async function startBroadcast(){
  const user = currentUser();
  const title = document.getElementById('titleInput').value.trim();
  const btn = document.getElementById('startLiveBtn');
  const errorBox = document.getElementById('setupErrorBox');
  errorBox.innerHTML = '';
  btn.disabled = true;
  btn.textContent = 'Starting…';

  try{
    const resp = await fetch('/api/live/start', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: user, title }),
    });
    const data = await resp.json();
    if(!resp.ok){
      errorBox.innerHTML = `<div class="errorBox">${esc(data.error || 'Could not go live.')}</div>`;
      btn.disabled = false; btn.textContent = 'Start streaming';
      return;
    }

    hostState = { liveId: data.id, ws: null, stream: setupStream, peers: new Map() };
    setupStream = null; // ownership moves to hostState so closeHostSetup() won't stop it

    document.getElementById('hostVideo').srcObject = hostState.stream;
    document.getElementById('hostTitleLabel').textContent = title || `${user}'s stream`;
    hostSetupOverlay.classList.remove('open');
    stopLobbyPolling();
    showView('host');

    const ws = new WebSocket(wsUrl());
    hostState.ws = ws;
    ws.addEventListener('open', () => ws.send(JSON.stringify({ type: 'host-join', liveId: hostState.liveId })));
    ws.addEventListener('message', onHostMessage);
    ws.addEventListener('close', () => { if(hostState) showHostEnded(); });
  }catch(e){
    errorBox.innerHTML = `<div class="errorBox">Network error — try again.</div>`;
    btn.disabled = false; btn.textContent = 'Start streaming';
  }
}

async function onHostMessage(event){
  if(!hostState) return;
  const msg = JSON.parse(event.data);
  if(msg.type === 'viewer-joined'){
    const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    hostState.peers.set(msg.viewerId, pc);
    hostState.stream.getTracks().forEach(t => pc.addTrack(t, hostState.stream));
    pc.onicecandidate = (e) => {
      if(e.candidate) hostState.ws.send(JSON.stringify({ type: 'ice-candidate', liveId: hostState.liveId, viewerId: msg.viewerId, candidate: e.candidate }));
    };
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    hostState.ws.send(JSON.stringify({ type: 'offer', liveId: hostState.liveId, viewerId: msg.viewerId, sdp: offer }));
  } else if(msg.type === 'answer'){
    const pc = hostState.peers.get(msg.viewerId);
    if(pc) await pc.setRemoteDescription(msg.sdp);
  } else if(msg.type === 'ice-candidate' && msg.from === 'viewer'){
    const pc = hostState.peers.get(msg.viewerId);
    if(pc && msg.candidate) await pc.addIceCandidate(msg.candidate).catch(() => {});
  } else if(msg.type === 'viewer-left'){
    const pc = hostState.peers.get(msg.viewerId);
    if(pc) pc.close();
    hostState.peers.delete(msg.viewerId);
  } else if(msg.type === 'viewer-count'){
    document.getElementById('hostViewerCount').textContent = msg.count;
  } else if(msg.type === 'gift'){
    showGiftToast('hostToastStack', msg);
  }
}

document.getElementById('endStreamBtn').onclick = () => {
  if(!confirm('End your stream?')) return;
  endBroadcast();
};
document.getElementById('hostExitBtn').onclick = () => {
  if(!confirm('End your stream?')) return;
  endBroadcast();
};

function endBroadcast(){
  if(!hostState) return;
  const { liveId, ws, stream, peers } = hostState;
  if(ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'end-stream', liveId }));
  fetch(`/api/live/${liveId}/end`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: currentUser() }),
  }).catch(() => {});
  peers.forEach(pc => pc.close());
  stream.getTracks().forEach(t => t.stop());
  if(ws) ws.close();
  hostState = null;
  backToLobby();
}
function showHostEnded(){
  if(!hostState) return;
  hostState.peers.forEach(pc => pc.close());
  hostState.stream.getTracks().forEach(t => t.stop());
  hostState = null;
  backToLobby();
}

// ================= Watch (viewer) =================
let watchState = null; // { liveId, viewerId, ws, pc }

async function startWatching(liveId, title, username){
  stopLobbyPolling();
  // A direct ?watch= deep link skips the lobby fetch that normally supplies
  // the gift catalog and this stream's title/username -- make sure both are
  // loaded regardless of how the viewer got here.
  if(!Object.keys(GIFTS).length || !title){
    try{
      const data = await (await fetch('/api/live')).json();
      GIFTS = data.gifts || {};
      const match = (data.sessions || []).find((s) => s.id === liveId);
      if(match){ title = title || match.title; username = username || match.username; }
    }catch(e){}
  }
  watchState = { liveId, viewerId: crypto.randomUUID(), ws: null, pc: null };
  document.getElementById('endedCard').style.display = 'none';
  document.getElementById('watchVideo').srcObject = null;
  document.getElementById('watchViewerCount').textContent = '0';
  document.getElementById('watchToastStack').innerHTML = '';
  document.getElementById('watchTitleLabel').textContent = username ? `@${username}${title ? ' · ' + title : ''}` : (title || '');
  renderGiftRow();
  showView('watch');

  const ws = new WebSocket(wsUrl());
  watchState.ws = ws;
  ws.addEventListener('open', () => ws.send(JSON.stringify({ type: 'viewer-join', liveId, viewerId: watchState.viewerId })));
  ws.addEventListener('message', onWatchMessage);
  ws.addEventListener('close', () => { if(watchState) showWatchEnded(); });
}

async function onWatchMessage(event){
  if(!watchState) return;
  const msg = JSON.parse(event.data);
  if(msg.type === 'offer'){
    const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    watchState.pc = pc;
    pc.ontrack = (e) => { document.getElementById('watchVideo').srcObject = e.streams[0]; };
    pc.onicecandidate = (e) => {
      if(e.candidate) watchState.ws.send(JSON.stringify({ type: 'ice-candidate', liveId: watchState.liveId, viewerId: watchState.viewerId, candidate: e.candidate }));
    };
    await pc.setRemoteDescription(msg.sdp);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    watchState.ws.send(JSON.stringify({ type: 'answer', liveId: watchState.liveId, viewerId: watchState.viewerId, sdp: answer }));
  } else if(msg.type === 'ice-candidate' && msg.from === 'host'){
    if(watchState.pc && msg.candidate) await watchState.pc.addIceCandidate(msg.candidate).catch(() => {});
  } else if(msg.type === 'viewer-count'){
    document.getElementById('watchViewerCount').textContent = msg.count;
  } else if(msg.type === 'gift'){
    showGiftToast('watchToastStack', msg);
  } else if(msg.type === 'stream-ended'){
    showWatchEnded();
  }
}

function showWatchEnded(){
  if(watchState && watchState.pc) watchState.pc.close();
  if(watchState && watchState.ws) watchState.ws.close();
  watchState = null;
  document.getElementById('endedCard').style.display = 'flex';
}
document.getElementById('backToLobbyBtn').onclick = backToLobby;
document.getElementById('watchExitBtn').onclick = () => {
  if(watchState){ if(watchState.pc) watchState.pc.close(); if(watchState.ws) watchState.ws.close(); watchState = null; }
  backToLobby();
};
document.getElementById('muteToggleBtn').onclick = (e) => {
  const video = document.getElementById('watchVideo');
  video.muted = !video.muted;
  e.target.textContent = video.muted ? '🔇' : '🔊';
};

function backToLobby(){
  showView('lobby');
  startLobbyPolling();
}

// ---- Gifts ----
function renderGiftRow(){
  const row = document.getElementById('giftRow');
  row.innerHTML = Object.entries(GIFTS).map(([key, g]) => `
    <button class="giftBtn" data-gift="${key}">
      <span class="emoji">${g.emoji}</span>
      <span class="price">$${(g.amountCents/100).toFixed(2)}</span>
    </button>
  `).join('');
  row.querySelectorAll('[data-gift]').forEach(btn => {
    btn.onclick = () => sendGift(btn.dataset.gift);
  });
}
async function sendGift(giftKey){
  if(!watchState) return;
  const user = currentUser();
  let senderName = user;
  if(!senderName){
    senderName = prompt('Your name (shown with the gift):', '') || 'Someone';
  }
  try{
    const resp = await fetch(`/api/live/${watchState.liveId}/gift/checkout`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ giftKey, senderName }),
    });
    const data = await resp.json();
    if(!resp.ok){ alert(data.error || 'Could not start checkout.'); return; }
    window.location.href = data.url;
  }catch(e){
    alert('Network error — try again.');
  }
}
function showGiftToast(stackId, gift){
  const stack = document.getElementById(stackId);
  const toast = document.createElement('div');
  toast.className = 'giftToast';
  toast.innerHTML = `<span>${gift.emoji}</span><span>${esc(gift.senderName)} sent a ${esc(gift.label)}!</span>`;
  stack.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

// ---- Entry point: deep-link into watching a stream, or show the lobby ----
(function init(){
  const params = new URLSearchParams(location.search);
  const watchId = params.get('watch');
  const giftStatus = params.get('gift');
  if(watchId){
    startWatching(watchId);
    if(giftStatus === 'success'){
      setTimeout(() => {
        const flash = document.getElementById('watchFlashMsg');
        flash.textContent = 'Gift sent! 🎉';
        flash.style.display = 'block';
        setTimeout(() => { flash.style.display = 'none'; }, 3000);
      }, 600);
    }
  } else {
    startLobbyPolling();
  }
})();
</script>
