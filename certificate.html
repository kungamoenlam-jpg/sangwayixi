<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speed Math Certificate</title>
<meta name="description" content="A verified Speed Math score from kunga.me.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12213B;--sky-deep:#0d1a30;--sky-mid:#1b2e52;--snow:#F5F8FC;--snow-dim:#b9c4d8;
  --gold:#E8A33D;--gold-dim:#B87F2A;--good:#3FAE72;--bad:#E1584B;
  --radius:18px;--shadow:0 10px 30px rgba(0,0,0,.4);
  --font-display:'Space Grotesk',sans-serif;--font-body:'Inter',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-body);background:linear-gradient(180deg,var(--sky-deep),var(--sky-mid) 60%,var(--sky-deep));color:var(--snow);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 16px 60px}
a{color:var(--gold)}
.top{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:560px;margin-bottom:22px}
.brand{font-family:var(--font-display);font-weight:700;font-size:15px;text-decoration:none;color:var(--snow-dim)}
.lbLink{font-size:13px;color:var(--gold);text-decoration:none;padding:6px 12px;border-radius:999px;background:rgba(232,163,61,.12)}

.cert{width:100%;max-width:560px;background:radial-gradient(ellipse at top,rgba(232,163,61,.08),transparent 60%),var(--sky-mid);border:2px solid var(--gold);border-radius:20px;padding:40px 32px;box-shadow:var(--shadow);position:relative;text-align:center}
.cert::before{content:'';position:absolute;inset:8px;border:1px solid rgba(232,163,61,.35);border-radius:14px;pointer-events:none}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700}
.title{font-family:var(--font-display);font-size:26px;font-weight:800;margin:8px 0 2px}
.certNo{font-family:var(--font-display);font-size:13px;color:var(--snow-dim);margin-bottom:26px}
.seal{font-size:40px;margin:6px 0 18px}
.statLine{font-size:17px;line-height:1.7;margin:4px 0}
.statLine b{color:var(--gold);font-family:var(--font-display)}
.meta{margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,255,255,.12);font-size:12.5px;color:var(--snow-dim);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.actions{display:flex;gap:10px;margin-top:24px;justify-content:center;flex-wrap:wrap}
button,.btnlink{all:unset;cursor:pointer;font-family:var(--font-display);font-weight:600;font-size:13.5px;padding:10px 18px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--snow)}
button.primary{background:var(--gold);color:var(--ink)}
.state{text-align:center;color:var(--snow-dim);margin-top:40px}
@media (max-width:480px){.cert{padding:28px 18px}.title{font-size:21px}.statLine{font-size:15px}}
</style>
</head>
<body>

<div class="top">
  <a class="brand" href="/">← kunga.me</a>
  <a class="lbLink" href="/leaderboard">🏆 Leaderboard</a>
</div>

<div id="view"></div>

<script>
function fmtDate(iso){
  try{ return new Date(iso).toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'}); }catch(e){ return iso; }
}
function pad(n){ return String(n).padStart(6,'0'); }
const id = location.pathname.match(/\/certificate\/(\d+)/);

async function load(){
  const view = document.getElementById('view');
  if(!id){
    view.innerHTML = `<div class="state">No certificate number given.<br><a href="/leaderboard">See the leaderboard →</a></div>`;
    return;
  }
  view.innerHTML = `<div class="state">Loading…</div>`;
  try{
    const res = await fetch('/api/speedmath/certificate/'+id[1]);
    if(!res.ok){
      view.innerHTML = `<div class="state">Certificate #${id[1]} wasn't found. It may not exist, or the number was mistyped.<br><a href="/leaderboard">See the leaderboard →</a></div>`;
      return;
    }
    const { certificate: c } = await res.json();
    const total = c.correct + c.wrong;
    const accuracy = total>0 ? Math.round((c.correct/total)*100) : 100;
    const url = location.origin + '/certificate/' + c.id;
    view.innerHTML = `
      <div class="cert">
        <div class="eyebrow">Kunga's Speed Math</div>
        <div class="title">Certificate of Achievement</div>
        <div class="certNo">No. ${pad(c.id)}</div>
        <div class="seal">🏅</div>
        <div class="statLine">This certifies that <b>${esc(c.username)}</b></div>
        <div class="statLine">solved <b>${c.correct}</b> problem${c.correct===1?'':'s'} correctly</div>
        <div class="statLine">in <b>${c.durationSec}</b> seconds</div>
        <div class="meta">
          <span>Accuracy: ${accuracy}%${c.wrong?` (${c.wrong} missed)`:''}</span>
          <span>${fmtDate(c.createdAt)}</span>
        </div>
      </div>
      <div class="actions">
        <button class="primary" id="copyBtn">Copy link</button>
        <a class="btnlink" href="/leaderboard?duration=${c.durationSec}">View leaderboard</a>
        <a class="btnlink" href="/">Try it yourself</a>
      </div>`;
    document.getElementById('copyBtn').onclick = async ()=>{
      try{ await navigator.clipboard.writeText(url); const b=document.getElementById('copyBtn'); b.textContent='Copied!'; setTimeout(()=>b.textContent='Copy link',1500); }catch(e){}
    };
  }catch(e){
    view.innerHTML = `<div class="state">Couldn't load that certificate right now. Try again shortly.</div>`;
  }
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
load();
</script>

</body>
</html>
