<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yeshe Voice Recorder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tibetan:wght@400;600;700&family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0f1d;
      --panel: #121b2f;
      --panel-2: #1a2540;
      --text: #eef3ff;
      --muted: #9bb0d3;
      --gold: #f4c95d;
      --accent: #7cc7ff;
      --danger: #ff7a7a;
      --good: #6ee7a8;
      --border: rgba(255,255,255,0.08);
      --font-bo: 'Noto Sans Tibetan', sans-serif;
      --font-zh: 'Noto Sans SC', sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #0a0f1d 0%, #0f172a 100%);
      color: var(--text);
    }
    .shell { max-width: 900px; margin: 0 auto; padding: 32px 20px 80px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
    .brand { font-size: 1.4rem; font-weight: 700; letter-spacing: 0.04em; }
    .brand span { color: var(--gold); }
    .panel { background: rgba(18, 27, 47, 0.9); border: 1px solid var(--border); border-radius: 18px; box-shadow: 0 8px 30px rgba(0,0,0,0.25); overflow: hidden; margin-bottom: 20px; }
    .controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; padding: 16px 20px; background: rgba(26, 37, 64, 0.75); border-bottom: 1px solid var(--border); }
    .controls input, .controls select { padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: rgba(10, 15, 29, 0.8); color: var(--text); font-size: 0.95rem; }
    .controls input#adminKeyInput { flex: 1; min-width: 200px; }
    .controls input#searchInput { flex: 1; min-width: 160px; }
    button { border: 0; border-radius: 12px; background: linear-gradient(135deg, var(--gold), #e9b440); color: #111827; font-weight: 700; padding: 10px 14px; cursor: pointer; font-size: 0.9rem; }
    button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
    button.danger { background: var(--danger); color: #2a0a0a; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .lang-tabs { display: flex; gap: 8px; padding: 16px 20px 0; }
    .lang-tab { background: transparent; border: 1px solid var(--border); color: var(--muted); }
    .lang-tab.active { background: linear-gradient(135deg, var(--gold), #e9b440); color: #111827; border-color: transparent; }
    .stats { display: flex; gap: 16px; padding: 16px 20px; flex-wrap: wrap; }
    .stat { background: rgba(18, 27, 47, 0.8); border: 1px solid var(--border); border-radius: 14px; padding: 12px 18px; }
    .stat .label { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; }
    .stat .value { margin-top: 4px; font-size: 1.4rem; font-weight: 700; color: var(--gold); }
    .error { color: var(--danger); font-weight: 600; padding: 0 20px 16px; }
    .row { display: flex; align-items: center; gap: 14px; padding: 14px 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .row:last-child { border-bottom: none; }
    .row-text { flex: 1; min-width: 180px; }
    .row-bo { font-family: var(--font-bo); font-size: 22px; }
    .row-zh { font-family: var(--font-zh); font-size: 20px; }
    .row-sub { color: var(--muted); font-size: 0.82rem; margin-top: 2px; }
    .row-actions { display: flex; align-items: center; gap: 8px; }
    .badge { display: inline-flex; align-items: center; padding: 5px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; white-space: nowrap; }
    .badge.done { background: rgba(110, 231, 168, 0.15); color: var(--good); }
    .badge.pending { background: rgba(255,255,255,0.08); color: var(--muted); }
    audio { height: 32px; max-width: 160px; }
    .empty { padding: 28px 20px; color: var(--muted); text-align: center; }
    .note { color: var(--muted); font-size: 0.85rem; padding: 0 20px 16px; line-height: 1.5; }
    @media (max-width: 640px) {
      .row { flex-direction: column; align-items: flex-start; }
      .row-actions { width: 100%; justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="brand">Yeshe <span>Voice Recorder</span></div>
      <button class="secondary" id="refreshBtn" type="button">Refresh status</button>
    </div>

    <div class="panel">
      <div class="controls">
        <input id="adminKeyInput" type="password" placeholder="Admin key" />
        <button id="loadBtn" type="button">Load words</button>
      </div>
      <div class="lang-tabs">
        <button type="button" class="lang-tab active" data-lang="bo">🏔️ Tibetan</button>
        <button type="button" class="lang-tab" data-lang="en">🇬🇧 English</button>
        <button type="button" class="lang-tab" data-lang="zh">🇨🇳 Mandarin</button>
      </div>
      <div class="stats">
        <div class="stat"><div class="label">Recorded</div><div class="value" id="recordedCount">0 / 0</div></div>
      </div>
      <div class="controls">
        <input id="searchInput" type="text" placeholder="Search English, Tibetan or Mandarin..." />
        <select id="categoryFilter"><option value="">All categories</option></select>
        <select id="statusFilter">
          <option value="">All</option>
          <option value="pending">Not yet recorded</option>
          <option value="done">Already recorded</option>
        </select>
      </div>
      <div id="errorBox" class="error" hidden></div>
      <div class="note" id="noteText"></div>
      <div id="wordList"></div>
      <div id="emptyState" class="empty" hidden>No words match your filter.</div>
    </div>
  </div>

  <script src="wordbank_data.js"></script>
  <script>

    const adminKeyInput = document.getElementById('adminKeyInput');
    const errorBox = document.getElementById('errorBox');
    const wordList = document.getElementById('wordList');
    const emptyState = document.getElementById('emptyState');
    const recordedCount = document.getElementById('recordedCount');
    const searchInput = document.getElementById('searchInput');
    const categoryFilter = document.getElementById('categoryFilter');
    const statusFilter = document.getElementById('statusFilter');
    const noteText = document.getElementById('noteText');
    const langTabs = Array.from(document.querySelectorAll('.lang-tab'));

    const LANG_NOTES = {
      bo: 'Record each Tibetan word/sentence once in your own voice. Tibetan has no usable text-to-speech voice on any provider, so every learner hears exactly what you record here — there is no fallback. Recordings upload straight to Supabase Storage and are permanent immediately — no need to run this locally or commit anything to git. Safe to use directly on kunga.me/record.',
      en: 'Record each English word/sentence once in your own voice. Any item you record here is used instead of the Azure voice for it — items you haven’t recorded still fall back to the Female/Male Azure voice picked in Profile > Voice settings. Uploads go straight to Supabase Storage and are permanent immediately.',
      zh: 'Record each Mandarin word/sentence once in your own voice. Any item you record here is used instead of the Azure voice for it — items you haven’t recorded still fall back to the Female/Male Azure voice picked in Profile > Voice settings. Uploads go straight to Supabase Storage and are permanent immediately.',
    };

    let currentLang = 'bo';
    let recordedSet = new Set();
    let mediaStream = null;
    let activeRecorder = null;
    let activeWordId = null;

    function showError(msg){ errorBox.hidden = false; errorBox.textContent = msg; }
    function hideError(){ errorBox.hidden = true; errorBox.textContent = ''; }
    function adminKey(){ return adminKeyInput.value.trim(); }
    function escapeHtml(v){ return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function populateCategories(){
      const cats = Array.from(new Set(WORDBANK.map(w=>w.cat))).sort();
      categoryFilter.innerHTML = '<option value="">All categories</option>' +
        cats.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
    }

    function setLang(lang){
      currentLang = lang;
      langTabs.forEach(btn => btn.classList.toggle('active', btn.dataset.lang === lang));
      noteText.innerHTML = LANG_NOTES[lang];
      recordedSet = new Set();
      renderList();
      if(adminKey()) loadStatus();
    }

    async function loadStatus(){
      const key = adminKey();
      if(!key){ showError('Please enter the admin key.'); return; }
      try {
        const res = await fetch('/api/admin/audio-status/' + currentLang, { headers: { 'X-Admin-Key': key } });
        const data = await res.json().catch(()=>({}));
        if(!res.ok) throw new Error(data.error || 'Unable to load status.');
        recordedSet = new Set(data.recorded || []);
        hideError();
        renderList();
      } catch(e){
        showError(e.message || 'Something went wrong.');
      }
    }

    function matchesFilters(w){
      const q = searchInput.value.trim().toLowerCase();
      if(q && !(
        w.en.toLowerCase().includes(q) ||
        w.bo.includes(q) ||
        (w.bo_tr||'').toLowerCase().includes(q) ||
        (w.zh||'').includes(q) ||
        (w.zh_py||'').toLowerCase().includes(q)
      )) return false;
      if(categoryFilter.value && w.cat !== categoryFilter.value) return false;
      const done = recordedSet.has(w.id);
      if(statusFilter.value === 'pending' && done) return false;
      if(statusFilter.value === 'done' && !done) return false;
      return true;
    }

    function renderList(){
      recordedCount.textContent = recordedSet.size + ' / ' + WORDBANK.length;
      const filtered = WORDBANK.filter(matchesFilters);
      wordList.innerHTML = '';
      emptyState.hidden = filtered.length > 0;
      filtered.forEach(w => wordList.appendChild(renderRow(w)));
    }

    function renderRow(w){
      const done = recordedSet.has(w.id);
      const row = document.createElement('div');
      row.className = 'row';
      row.dataset.id = w.id;
      let mainText;
      if(currentLang === 'bo'){
        mainText = `<div class="row-bo">${escapeHtml(w.bo)}</div><div class="row-sub">${escapeHtml(w.bo_tr || '')} &middot; ${escapeHtml(w.en)}</div>`;
      } else if(currentLang === 'zh'){
        mainText = `<div class="row-zh">${escapeHtml(w.zh)}</div><div class="row-sub">${escapeHtml(w.zh_py || '')} &middot; ${escapeHtml(w.en)}</div>`;
      } else {
        mainText = `<div class="row-bo" style="font-family:inherit;">${escapeHtml(w.en)}</div><div class="row-sub">${escapeHtml(w.bo)}</div>`;
      }
      row.innerHTML = `
        <div class="row-text">${mainText}</div>
        <span class="badge ${done ? 'done' : 'pending'}">${done ? '✅ Recorded' : '⬜ Not yet'}</span>
        <div class="row-actions">
          <audio controls preload="none" src="${done ? '/audio/' + currentLang + '/' + encodeURIComponent(w.id) + '.webm?t=' + Date.now() : ''}" ${done ? '' : 'style="display:none"'}></audio>
          <button type="button" class="record-btn secondary">\u{1F3A4} Record</button>
        </div>
      `;
      row.querySelector('.record-btn').addEventListener('click', () => toggleRecord(w.id, row));
      return row;
    }

    async function toggleRecord(wordId, row){
      const key = adminKey();
      if(!key){ showError('Please enter the admin key.'); return; }
      hideError();

      if(activeRecorder && activeWordId === wordId){
        activeRecorder.stop();
        return;
      }
      if(activeRecorder){
        showError('Finish the recording in progress first.');
        return;
      }

      try {
        mediaStream = mediaStream || await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch(e){
        showError('Could not access the microphone: ' + e.message);
        return;
      }

      const lang = currentLang;
      const btn = row.querySelector('.record-btn');
      const chunks = [];
      const recorder = new MediaRecorder(mediaStream);
      activeRecorder = recorder;
      activeWordId = wordId;
      btn.textContent = '⏹ Stop';

      recorder.ondataavailable = (e) => { if(e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = async () => {
        activeRecorder = null;
        activeWordId = null;
        btn.textContent = 'Uploading...';
        btn.disabled = true;
        const blob = new Blob(chunks, { type: 'audio/webm' });
        try {
          const res = await fetch('/api/admin/audio/' + lang + '/' + encodeURIComponent(wordId), {
            method: 'POST',
            headers: { 'X-Admin-Key': key, 'Content-Type': 'audio/webm' },
            body: blob,
          });
          const data = await res.json().catch(()=>({}));
          if(!res.ok) throw new Error(data.error || 'Upload failed.');
          recordedSet.add(wordId);
          const audioEl = row.querySelector('audio');
          audioEl.src = '/audio/' + lang + '/' + encodeURIComponent(wordId) + '.webm?t=' + Date.now();
          audioEl.style.display = '';
          row.querySelector('.badge').className = 'badge done';
          row.querySelector('.badge').textContent = '✅ Recorded';
          recordedCount.textContent = recordedSet.size + ' / ' + WORDBANK.length;
        } catch(e){
          showError('Upload failed for "' + wordId + '": ' + e.message);
        } finally {
          btn.disabled = false;
          btn.textContent = '\u{1F3A4} Record';
        }
      };

      recorder.start();
    }

    langTabs.forEach(btn => btn.addEventListener('click', () => setLang(btn.dataset.lang)));

    document.getElementById('loadBtn').addEventListener('click', loadStatus);
    document.getElementById('refreshBtn').addEventListener('click', loadStatus);
    searchInput.addEventListener('input', renderList);
    categoryFilter.addEventListener('change', renderList);
    statusFilter.addEventListener('change', renderList);

    populateCategories();
    noteText.innerHTML = LANG_NOTES[currentLang];
    renderList();
  </script>
</body>
</html>
