// ---- algebra learning: Month 1 of a longer planned progression (algebra ->
// calculus -> linear algebra -> discrete math -> probability). Unlike mental
// math, each topic teaches the concept first (renderAlgebraLearn) before
// practice, and a wrong answer shows the actual worked solution to THIS
// problem, not just the bare correct number — teaching the concept in the
// moment it's needed, not just grading. Answer-checking is deliberately
// scoped to forms a plain string/number comparison can validate exactly
// (integers, reduced fractions, a fixed set of exact trig values) rather
// than attempting general symbolic/expression parsing. ----------------------
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ const r=a%b; a=b; b=r; } return a||1; }
function nonZeroRandInt(min,max){ let v; do{ v=randInt(min,max); }while(v===0); return v; }
function parseFraction(str){
  if(!str) return null;
  const s = str.trim();
  const frac = s.match(/^(-?\d+)\s*\/\s*(-?\d+)$/);
  if(frac){
    const n=parseInt(frac[1],10), d=parseInt(frac[2],10);
    if(d===0) return null;
    const sign = (n<0)!==(d<0) ? -1 : 1;
    const g = gcd(n,d);
    return {p: sign*Math.abs(n)/g, q: Math.abs(d)/g};
  }
  const whole = s.match(/^(-?\d+)$/);
  if(whole) return {p:parseInt(whole[1],10), q:1};
  return null;
}
// "+3x" / "-x" / "" (omitted when coef===0) — for terms after the first.
function signedCoeffTerm(coef, varPart){
  if(coef===0) return '';
  const sign = coef>0 ? ' + ' : ' - ';
  const mag = Math.abs(coef);
  const magStr = (varPart && mag===1) ? '' : String(mag);
  return sign+magStr+varPart;
}
// "3x" / "-x" / "x" — for a leading term with no preceding sign.
function leadTerm(coef, varPart){
  if(coef===1) return varPart || '1';
  if(coef===-1) return '-'+(varPart||'1');
  return coef+(varPart||'');
}
function factorTerm(root){ return root>=0 ? `(x - ${root})` : `(x + ${-root})`; }

function algProblemFractions(){
  const q = randInt(2,9);
  let p; do{ p = randInt(1, q*2); }while(gcd(p,q)!==1);
  const k = randInt(2,6);
  const num = p*k, den = q*k;
  return {
    promptText: t('algFractionsPrompt', {expr:`${num}/${den}`}),
    inputs: [{key:'ans', placeholder:t('algFractionAnswerPlaceholder'), fracInput:true}],
    check(vals){ const f = parseFraction(vals.ans); return !!f && f.p===p && f.q===q; },
    explain: t('algFractionsExplain', {num, den, k, p, q}),
  };
}
function algProblemExponents(){
  const a = randInt(2,6), b = randInt(2,4);
  const answer = Math.pow(a,b);
  return {
    promptText: t('algExponentsPrompt', {expr:`${a}^${b}`}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('algExponentsExplain', {a, b, answer}),
  };
}
function algProblemLogarithms(){
  const bases=[2,3,5,10];
  const b = bases[randInt(0,bases.length-1)];
  const e = randInt(1,4);
  const x = Math.pow(b,e);
  return {
    promptText: t('algLogPrompt', {b, x}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===e; },
    explain: t('algLogExplain', {b, x, e}),
  };
}
function algProblemEquations(){
  const a = randInt(2,9);
  const x0 = nonZeroRandInt(-10,10);
  const b = randInt(-20,20);
  const c = a*x0+b;
  return {
    promptText: t('algEquationsPrompt', {expr:`${a}x${signedCoeffTerm(b,'')} = ${c}`}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===x0; },
    explain: t('algEquationsExplain', {a, rhs:c-b, x0}),
  };
}
function algProblemInequalities(){
  const a = randInt(2,9);
  const x0 = nonZeroRandInt(-10,10);
  const b = randInt(-20,20);
  const c = a*x0+b;
  const symbol = ['<','>','≤','≥'][randInt(0,3)];
  return {
    promptText: t('algInequalitiesPrompt', {expr:`${a}x${signedCoeffTerm(b,'')} ${symbol} ${c}`}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===x0; },
    explain: t('algInequalitiesExplain', {a, rhs:c-b, x0}),
  };
}
function algProblemSimultaneous(){
  let a1,b1,a2,b2;
  do{
    a1=nonZeroRandInt(-6,6); b1=nonZeroRandInt(-6,6);
    a2=nonZeroRandInt(-6,6); b2=nonZeroRandInt(-6,6);
  } while(a1*b2-a2*b1===0);
  const x0 = randInt(-8,8), y0 = randInt(-8,8);
  const c1 = a1*x0+b1*y0, c2 = a2*x0+b2*y0;
  return {
    promptText: t('algSimultaneousPrompt', {
      eq1:`${leadTerm(a1,'x')}${signedCoeffTerm(b1,'y')} = ${c1}`,
      eq2:`${leadTerm(a2,'x')}${signedCoeffTerm(b2,'y')} = ${c2}`,
    }),
    inputs: [{key:'x', label:'x ='}, {key:'y', label:'y ='}],
    check(vals){ return Number(vals.x)===x0 && Number(vals.y)===y0; },
    explain: t('algSimultaneousExplain', {x0, y0}),
  };
}
function algProblemPolynomials(){
  const A = nonZeroRandInt(1,5), B = randInt(-8,8), C = randInt(-8,8);
  const k = randInt(-5,5);
  const term1 = A*k*k, term2 = B*k;
  const answer = term1 + term2 + C;
  const expr = `${leadTerm(A,'x²')}${signedCoeffTerm(B,'x')}${signedCoeffTerm(C,'')}`;
  const sumExpr = `${term1}${signedCoeffTerm(term2,'')}${signedCoeffTerm(C,'')}`;
  return {
    promptText: t('algPolynomialsPrompt', {expr, k}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('algPolynomialsExplain', {k, sumExpr, answer}),
  };
}
function algProblemFactorisation(){
  let r1 = randInt(-8,8), r2;
  do{ r2 = randInt(-8,8); }while(r2===r1);
  const rmin = Math.min(r1,r2), rmax = Math.max(r1,r2);
  const b = -(r1+r2), c = r1*r2;
  const expr = `x²${signedCoeffTerm(b,'x')}${signedCoeffTerm(c,'')} = 0`;
  return {
    promptText: t('algFactorisationPrompt', {expr}),
    inputs: [{key:'small', label:t('algSmallerRootLabel')}, {key:'large', label:t('algLargerRootLabel')}],
    check(vals){ return Number(vals.small)===rmin && Number(vals.large)===rmax; },
    explain: t('algFactorisationExplain', {factors:`${factorTerm(rmin)}${factorTerm(rmax)}`, rmin, rmax}),
  };
}
function algProblemSequences(){
  if(Math.random()<0.3){
    const a1 = randInt(1,5), r = [2,3][randInt(0,1)], n = randInt(2,6);
    const answer = a1*Math.pow(r,n-1);
    return {
      promptText: t('algSeqGeoPrompt', {a1, r, n}),
      inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
      check(vals){ return Number(vals.ans)===answer; },
      explain: t('algSeqGeoExplain', {a1, r, n, answer}),
    };
  }
  const a1 = randInt(-10,10), d = nonZeroRandInt(-6,6), n = randInt(5,15);
  const answer = a1+(n-1)*d;
  return {
    promptText: t('algSeqArithPrompt', {a1, d, n}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('algSeqArithExplain', {a1, d, n, answer}),
  };
}
function algProblemFunctions(){
  const A = nonZeroRandInt(-5,5), B = randInt(-8,8);
  const C = nonZeroRandInt(-5,5), D = randInt(-8,8);
  const k = randInt(-5,5);
  const inner = C*k+D;
  const answer = A*inner+B;
  const fExpr = `${leadTerm(A,'x')}${signedCoeffTerm(B,'')}`;
  const gExpr = `${leadTerm(C,'x')}${signedCoeffTerm(D,'')}`;
  return {
    promptText: t('algFunctionsPrompt', {fExpr, gExpr, k}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('algFunctionsExplain', {k, inner, answer}),
  };
}
function algProblemGraphs(){
  const m = nonZeroRandInt(-6,6), b = randInt(-10,10);
  const xTermSign = m>=0 ? '-' : '+';
  const magStr = Math.abs(m)===1 ? '' : String(Math.abs(m));
  const expr = `y ${xTermSign} ${magStr}x = ${b}`;
  return {
    promptText: t('algGraphsPrompt', {expr}),
    inputs: [{key:'slope', label:t('algSlopeLabel')}, {key:'intercept', label:t('algInterceptLabel')}],
    check(vals){ return Number(vals.slope)===m && Number(vals.intercept)===b; },
    explain: t('algGraphsExplain', {m, b}),
  };
}
const ALG_TRIG_TABLE = {
  sin: {0:['0'], 30:['1/2'], 45:['√2/2','sqrt(2)/2'], 60:['√3/2','sqrt(3)/2'], 90:['1']},
  cos: {0:['1'], 30:['√3/2','sqrt(3)/2'], 45:['√2/2','sqrt(2)/2'], 60:['1/2'], 90:['0']},
  tan: {0:['0'], 30:['√3/3','sqrt(3)/3'], 45:['1'], 60:['√3','sqrt(3)']},
};
function algProblemTrig(){
  const fns = Object.keys(ALG_TRIG_TABLE);
  const fn = fns[randInt(0,fns.length-1)];
  const angles = Object.keys(ALG_TRIG_TABLE[fn]).map(Number);
  const angle = angles[randInt(0,angles.length-1)];
  const accepted = ALG_TRIG_TABLE[fn][angle].map(s=>s.toLowerCase().replace(/\s+/g,''));
  return {
    promptText: t('algTrigPrompt', {expr:`${fn}(${angle}°)`}),
    inputs: [{key:'ans', placeholder:t('algTrigAnswerPlaceholder')}],
    check(vals){ const norm=(vals.ans||'').toLowerCase().replace(/\s+/g,''); return accepted.includes(norm); },
    explain: t('algTrigExplain', {expr:`${fn}(${angle}°)`, answer:ALG_TRIG_TABLE[fn][angle][0]}),
  };
}

  {key:'polynomials', build:algProblemPolynomials},
  {key:'factorisation', build:algProblemFactorisation},
  {key:'sequences', build:algProblemSequences},
  {key:'functions', build:algProblemFunctions},

function submitAlgebraStep(){
  const s = state.algebraSession;
  if(!s || s.answered) return;
  const steps = s.steps;
  const step = steps[s.stepIndex];
  for(const inp of step.inputs){ if(!s.stepInputs[inp.key]) return; }
  const correct = step.check(s.stepInputs);
  if(!correct) s.anyWrong = true;
  const valuesText = step.inputs.map(inp=>s.stepInputs[inp.key]).join(', ');
  const result = {prompt: step.prompt, valuesText, explain: step.explain, correct};
  const isLastStep = s.stepIndex === steps.length-1;
  if(isLastStep){
    s.stepResults.push(result);
    const problemCorrect = !s.anyWrong;
    s.answered = true; s.lastCorrect = problemCorrect;
    if(problemCorrect) registerCorrectAnswer(s, state.game);
    else registerWrongAnswer(s);
  } else {
    s.pendingResult = result;
    s.answered = true; s.lastCorrect = correct;
  }
  render();
}

function nextAlgebraStep(){
  const s = state.algebraSession;
  s.stepResults.push(s.pendingResult);
  s.pendingResult = null;
  s.stepIndex += 1;
  s.answered = false; s.lastCorrect = null; s.stepInputs = {};
  render();
  focusAlgebraInput();
}

function nextAlgebraQuestion(){
  const s = state.algebraSession;
  if(s.mistakes>=MATH_MAX_MISTAKES){ finishAlgebraPractice(); return; }
  const topic = algTopicByKey(s.topicKey);
  const problem = topic.build();
  s.problem = problem; s.steps = normalizeSteps(problem);
  s.stepIndex=0; s.stepInputs={}; s.stepResults=[]; s.anyWrong=false; s.pendingResult=null;
  s.answered=false; s.lastCorrect=null;
  render();
  focusAlgebraInput();
}

function finishAlgebraPractice(){
  const s = state.algebraSession;

// ---- calculus learning: Month 2 of the planned progression (algebra ->
// calculus -> linear algebra -> discrete math -> probability). Same
// architecture as algebra (learn screen -> unlimited practice -> worked
// explanation on a wrong answer -> best-score tracking), reusing the shared
// combo/achievement/level system. Scoped to single-variable calculus's
// core computational skills (limits, the derivative rules, optimisation,
// antiderivatives, definite integrals) — implicit differentiation and
// related rates are left out of this first pass since they don't reduce to
// a single cleanly-typed-and-graded value the way these do.
function calcProblemLimits(){
  if(Math.random()<0.4){
    const r = randInt(-8,8);
    let s; do{ s = randInt(-8,8); }while(s===r);
    const num = `${factorTerm(r)}${factorTerm(s)}`;
    const den = factorTerm(r);
    const answer = r - s;
    const remExpr = `x${signedCoeffTerm(-s,'')}`;
    return {
      promptText: t('calcLimitFactorPrompt', {num, den, r}),
      inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
      check(vals){ return Number(vals.ans)===answer; },
      explain: t('calcLimitFactorExplain', {den, remExpr, r, answer}),
    };
  }
  const A = nonZeroRandInt(1,5), B = randInt(-8,8), C = randInt(-8,8);
  const c = randInt(-5,5);
  const answer = A*c*c + B*c + C;
  const expr = `${leadTerm(A,'x²')}${signedCoeffTerm(B,'x')}${signedCoeffTerm(C,'')}`;
  return {
    promptText: t('calcLimitDirectPrompt', {expr, c}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('calcLimitDirectExplain', {c, answer}),
  };
}
function calcProblemPowerRule(){
  const A = nonZeroRandInt(1,4), B = randInt(-6,6), C = randInt(-6,6), D = randInt(-6,6);
  const k = randInt(-4,4);
  const expr = `${leadTerm(A,'x³')}${signedCoeffTerm(B,'x²')}${signedCoeffTerm(C,'x')}${signedCoeffTerm(D,'')}`;
  const derivExpr = `${leadTerm(3*A,'x²')}${signedCoeffTerm(2*B,'x')}${signedCoeffTerm(C,'')}`;
  const answer = 3*A*k*k + 2*B*k + C;
  return {
    promptText: t('calcPowerRulePrompt', {expr, k}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('calcPowerRuleExplain', {derivExpr, k, answer}),
  };
}
function calcProblemProductRule(){
  const A = nonZeroRandInt(-6,6), B = randInt(-8,8), C = nonZeroRandInt(-6,6), D = randInt(-8,8);
  const k = randInt(-5,5);
  const uk = A*k+B, vk = C*k+D;
  const term1 = A*vk, term2 = C*uk;
  const answer = term1 + term2;
  // Display strings built by hand (not naive "{a} + {b}" template interpolation)
  // so a negative second term reads as "- 60", never the confusing "+ -60".
  const stepExpr = `${A}×(${vk})${C>=0?` + ${C}`:` - ${-C}`}×(${uk})`;
  const sumExpr = `${term1}${signedCoeffTerm(term2,'')}`;
  const uExpr = `${leadTerm(A,'x')}${signedCoeffTerm(B,'')}`;
  const vExpr = `${leadTerm(C,'x')}${signedCoeffTerm(D,'')}`;
  return {
    promptText: t('calcProductRulePrompt', {uExpr, vExpr, k}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('calcProductRuleExplain', {k, uk, vk, A, C, stepExpr, sumExpr, answer}),
  };
}
function calcProblemQuotientRule(){
  const A = nonZeroRandInt(-6,6), B = randInt(-8,8), C = nonZeroRandInt(-5,5);
  const k = randInt(-5,5);
  const vSign = randInt(0,1)===0 ? 1 : -1;
  const D = vSign - C*k; // guarantees v(k) = C*k+D = vSign (±1), so v² = 1
  const uk = A*k+B, vk = vSign, vk2 = vk*vk;
  const term1 = A*vk, term2 = C*uk;
  const numerator = term1 - term2;
  const answer = numerator / vk2;
  // Display string built by hand, same reasoning as the product rule above —
  // avoids "5×(1) - -4×(9)"-style double signs from naive interpolation.
  const stepExpr = `${A}×(${vk})${C>=0?` - ${C}`:` + ${-C}`}×(${uk})`;
  const uExpr = `${leadTerm(A,'x')}${signedCoeffTerm(B,'')}`;
  const vExpr = `${leadTerm(C,'x')}${signedCoeffTerm(D,'')}`;
  return {
    promptText: t('calcQuotientRulePrompt', {uExpr, vExpr, k}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('calcQuotientRuleExplain', {k, uk, vk, A, C, stepExpr, numerator, vk2, answer}),
  };
}
function calcProblemChainRule(){
  const A = nonZeroRandInt(1,5), B = randInt(-6,6);
  const C = nonZeroRandInt(-5,5), D = randInt(-6,6);
  const k = randInt(-5,5);
  const gk = C*k+D;
  const twoA = 2*A;
  const fprime = twoA*gk;
  const answer = fprime*C;
  const fExpr = `${leadTerm(A,'u²')}${signedCoeffTerm(B,'')}`;
  const gExpr = `${leadTerm(C,'x')}${signedCoeffTerm(D,'')}`;
  const fPrimeExpr = `${leadTerm(twoA,'u')}`;
  return {
    promptText: t('calcChainRulePrompt', {fExpr, gExpr, k}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('calcChainRuleExplain', {fPrimeExpr, C, k, gk, twoA, fprime, answer}),
  };
}
function calcProblemOptimisation(){
  const A = nonZeroRandInt(1,6);
  const x0 = nonZeroRandInt(-8,8);
  const B = -2*A*x0;
  const C = randInt(-8,8);
  const expr = `${leadTerm(A,'x²')}${signedCoeffTerm(B,'x')}${signedCoeffTerm(C,'')}`;
  const twoA = 2*A;
  const derivExpr = `${leadTerm(twoA,'x')}${signedCoeffTerm(B,'')}`;
  return {
    promptText: t('calcOptimPrompt', {expr}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===x0; },
    explain: t('calcOptimExplain', {derivExpr, twoA, negB:-B, x0}),
  };
}
function calcProblemAntiderivatives(){
  const A = nonZeroRandInt(-4,4)*2; // even, so A/2 is a clean integer
  const B = randInt(-8,8);
  const k = randInt(-6,6);
  const halfA = A/2;
  const expr = `${leadTerm(A,'x')}${signedCoeffTerm(B,'')}`;
  const FExpr = `${leadTerm(halfA,'x²')}${signedCoeffTerm(B,'x')}`;
  const term1 = halfA*k*k, term2 = B*k;
  const answer = term1 + term2;
  const sumExpr = `${term1}${signedCoeffTerm(term2,'')}`;
  return {
    promptText: t('calcAntiderivPrompt', {expr, k}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('calcAntiderivExplain', {FExpr, k, sumExpr, answer}),
  };
}
function calcProblemDefiniteIntegral(){
  const A = nonZeroRandInt(-4,4)*2; // even, so A/2 is a clean integer
  const B = randInt(-8,8);
  const a = randInt(-5,4);
  let b; do{ b = randInt(-5,5); }while(b<=a);
  const halfA = A/2;
  const expr = `${leadTerm(A,'x')}${signedCoeffTerm(B,'')}`;
  const FExpr = `${leadTerm(halfA,'x²')}${signedCoeffTerm(B,'x')}`;
  const Fa = halfA*a*a + B*a, Fb = halfA*b*b + B*b;
  const answer = Fb - Fa;
  return {
    promptText: t('calcDefIntegralPrompt', {expr, a, b}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('calcDefIntegralExplain', {FExpr, a, b, Fa, Fb, answer}),
  };
}

      <div style="flex:1; max-width:110px;">
        ${inp.label ? `<div style="font-size:12px; color:var(--snow-dim); margin-bottom:4px; text-align:center;">${inp.label}</div>` : ''}
        <div class="frac-input">
          <input class="calc-input algebra-input" type="text" inputmode="numeric" autocomplete="off"
            style="font-size:20px; font-family:var(--font-display); font-weight:700; text-align:center;"
            ${s.answered?'disabled':''} value="${numVal}"
            oninput="setFracInputPart(state.calcSession,'${inp.key}','num',this.value)">
          <div class="frac-input-bar"></div>
          <input class="algebra-input" type="text" inputmode="numeric" autocomplete="off"
            style="font-size:20px; font-family:var(--font-display); font-weight:700; text-align:center;"
            ${s.answered?'disabled':''} value="${denVal}"
            oninput="setFracInputPart(state.calcSession,'${inp.key}','den',this.value)">
        </div>
      </div>`;
    }
    return `
    <div style="flex:1;">
      ${inp.label ? `<div style="font-size:12px; color:var(--snow-dim); margin-bottom:4px;">${inp.label}</div>` : ''}
      <input class="calc-input algebra-input" data-key="${inp.key}" type="text" autocomplete="off"
        placeholder="${inp.placeholder||''}"
        style="text-align:center; font-size:20px; font-family:var(--font-display); font-weight:700; width:100%;"
        ${s.answered?'disabled':''} value="${(s.stepInputs[inp.key]||'')}"
        oninput="state.calcSession.stepInputs['${inp.key}']=this.value">
    </div>`;
  };

  const inputsHtml = curStep.matrixShape
    ? `<div style="display:grid; grid-template-columns:repeat(${curStep.matrixShape[1]}, 1fr); gap:10px; max-width:240px; margin:0 auto;">${curStep.inputs.map(inputBox).join('')}</div>`
    : `<div style="display:flex; gap:12px; align-items:flex-end; justify-content:center;">${curStep.inputs.map(inputBox).join('')}</div>`;

  const stepRowHtml = (r) => `
    <div class="step-row done ${r.correct?'correct':'wrong'}">
      <div class="step-label"><span class="step-icon">${r.correct?'✅':'❌'}</span>${r.prompt?enhanceMath(r.prompt):''}</div>
      <div class="step-values">${enhanceMath(r.valuesText)}</div>
      <div class="step-explain">${enhanceMath(r.explain)}</div>
    </div>`;
  const doneRowsHtml = multiStep ? s.stepResults.map(stepRowHtml).join('') : '';

  let activeStepHtml = '';
  if(!(s.answered && isLastStep)){
    if(!s.answered){
      activeStepHtml = multiStep ? `
        <div class="step-row active">
          <div class="step-label">${t('stepLabel',{n:stepIndex+1, total:steps.length})}</div>
          ${curStep.prompt ? `<div class="step-prompt">${enhanceMath(curStep.prompt)}</div>` : ''}
          ${inputsHtml}
          <button class="btn btn-primary btn-block" style="margin-top:12px;" onclick="submitCalcStep()">${t('checkBtn')}</button>
        </div>` : `
        ${inputsHtml}
        <button class="btn btn-primary btn-block" onclick="submitCalcStep()">${t('checkBtn')}</button>`;
    } else {
      const r = s.pendingResult;
      activeStepHtml = `
        <div class="step-row done ${r.correct?'correct':'wrong'}">
          <div class="step-label"><span class="step-icon">${r.correct?'✅':'❌'}</span>${r.prompt?enhanceMath(r.prompt):''}</div>
          <div class="step-values">${enhanceMath(r.valuesText)}</div>
          <div class="step-explain">${enhanceMath(r.explain)}</div>
          <button class="btn btn-light btn-block" style="margin-top:10px;" onclick="nextCalcStep()">${t('nextStepBtn')}</button>
        </div>`;
    }
  }

  const feedback = (s.answered && isLastStep) ? `
    <div class="feedback-bar ${s.lastCorrect?'good':'bad'}">
      <div class="fb-text">
        <div class="fb-title">${s.lastCorrect? t('correctFeedback',{n:s.lastXpGain}) : t('notQuiteFeedback')}</div>
        ${!multiStep ? `<div class="fb-sub">${enhanceMath(curStep.explain)}</div>` : ''}
      </div>
      <button class="btn btn-light" onclick="nextCalcQuestion()">${willFinish ? t('finishBtn'):t('continueBtn')}</button>
    </div>` : '';

  return `
  ${topbar({back:'exitCalcPractice()'})}
  <div class="lesson">
    <div style="display:flex; justify-content:space-between; align-items:center; margin:6px 0 10px;">
      <div class="hearts-row">${Array.from({length:MATH_MAX_MISTAKES}).map((_,i)=>`<span>${i<(MATH_MAX_MISTAKES-s.mistakes)?'❤️':'🩶'}</span>`).join('')}</div>
      <div style="font-size:12px; color:var(--snow-dim); text-align:right;">${t('correctAnswersLabel')}: ${s.correct}${s.combo>=3?`<br><span style="color:var(--gold);">${comboBadge(s.combo)} ${t('comboLabel',{n:s.combo})}</span>`:''}</div>
    </div>
    <div class="q-wrap">
      <div class="q-card">
        <div class="q-eyebrow">${t('calcTopicTitle_'+s.topicKey)}</div>
        <div class="q-prompt" style="font-size:22px;">${enhanceMath(s.problem.promptText)}</div>
      </div>
      ${multiStep ? `<div class="step-list">${doneRowsHtml}${activeStepHtml}</div>` : activeStepHtml}
    </div>
  </div>
  ${feedback}
  `;
}

function submitCalcStep(){
  const s = state.calcSession;
  if(!s || s.answered) return;
  const steps = s.steps;
  const step = steps[s.stepIndex];
  for(const inp of step.inputs){ if(!s.stepInputs[inp.key]) return; }
  const correct = step.check(s.stepInputs);
  if(!correct) s.anyWrong = true;
  const valuesText = step.inputs.map(inp=>s.stepInputs[inp.key]).join(', ');
  const result = {prompt: step.prompt, valuesText, explain: step.explain, correct};
  const isLastStep = s.stepIndex === steps.length-1;
  if(isLastStep){
    s.stepResults.push(result);
    const problemCorrect = !s.anyWrong;
    s.answered = true; s.lastCorrect = problemCorrect;
    if(problemCorrect) registerCorrectAnswer(s, state.game);
    else registerWrongAnswer(s);
  } else {
    s.pendingResult = result;
    s.answered = true; s.lastCorrect = correct;
  }
  render();
}

function nextCalcStep(){
  const s = state.calcSession;
  s.stepResults.push(s.pendingResult);
  s.pendingResult = null;
  s.stepIndex += 1;
  s.answered = false; s.lastCorrect = null; s.stepInputs = {};
  render();
  focusCalcInput();
}

function nextCalcQuestion(){
  const s = state.calcSession;
  if(s.mistakes>=MATH_MAX_MISTAKES){ finishCalcPractice(); return; }
  const topic = calcTopicByKey(s.topicKey);
  const problem = topic.build();
  s.problem = problem; s.steps = normalizeSteps(problem);
  s.stepIndex=0; s.stepInputs={}; s.stepResults=[]; s.anyWrong=false; s.pendingResult=null;
  s.answered=false; s.lastCorrect=null;
  render();
  focusCalcInput();
}

function finishCalcPractice(){
  const s = state.calcSession;
  if(!state.game.calculus) state.game.calculus = {};
  const rec = state.game.calculus[s.topicKey] || (state.game.calculus[s.topicKey] = {best:0});
  s.isNewBest = s.correct > rec.best;
  if(s.isNewBest) rec.best = s.correct;
  touchStreak();
  s.newAchievements = checkAchievements(state.game);
  state.screen='calc_complete';
  render();
}

function renderCalcComplete(){
  const s = state.calcSession;
  const best = state.game.calculus[s.topicKey].best;
  const lvl = xpLevel(state.game.xp);
  return `
  ${topbar()}
  <div class="complete ${appLangClass()}">
    <div class="medal">${s.isNewBest ? '🏆' : '🎯'}</div>
    <h2>${s.isNewBest ? t('newBestReached') : t('checkpointReached')}</h2>
    <div class="stat-row">
      <div class="stat-box"><div class="val">${s.correct}</div><div class="lab">${t('correctAnswersLabel')}</div></div>
      <div class="stat-box"><div class="val">+${s.xpEarned}</div><div class="lab">${t('xpEarnedLabel')}</div></div>
      <div class="stat-box"><div class="val">🔥 ${state.game.streak}</div><div class="lab">${t('dayStreak')}</div></div>
    </div>
    <div style="color:var(--snow-dim); font-size:13px;">${t('mathBestLabel',{n:best})} · ${t('levelLabel',{n:lvl.level})}</div>
    ${achievementBannerHtml(s.newAchievements)}

// ---- linear algebra learning: Month 3 of the planned progression (algebra ->
// calculus -> linear algebra -> discrete math -> probability). Same
// architecture as algebra/calculus, but several problems need more than the
// usual 1-2 typed inputs (a 2x2 matrix result, a 3D cross product) — those
// carry an optional `matrixShape:[rows,cols]` on the problem so the practice
// screen can lay the inputs out in a grid that matches the matrix shape
// instead of a single row. Scoped to vector/matrix arithmetic that reduces to
// exact integers: vector ops, matrix ops, determinants, transpose, and a 2x2
// inverse (engineered to determinant ±1 so the inverse entries stay integers,
// since fraction-typing wasn't part of this pass).
function vectorText(comps){ return `(${comps.join(', ')})`; }
// Renders an actual bracket-style matrix (rows of cells between two tall
// brackets) instead of "[[1,2],[3,4]]" plain text — used everywhere a
// matrix is shown in a prompt or explanation, across linear algebra and
// matrices & linear systems. Non-numeric cells (e.g. the literal 'x' in a
// solve-for-x problem) pass through unchanged.
function matrixHTML(rows){
  const cols = rows[0].length;
  const cells = rows.flat().map(v=>`<span class="mm-cell">${v}</span>`).join('');
  return `<span class="math-matrix"><span class="mm-bracket left"></span><span class="mm-grid" style="grid-template-columns:repeat(${cols}, auto);">${cells}</span><span class="mm-bracket right"></span></span>`;
}
// Renders a numeric fraction as a stacked numerator/denominator with a bar,
// instead of "p/q" plain text.
function fracHTML(p, q){
  const neg = (p<0) !== (q<0);
  const ap = Math.abs(p), aq = Math.abs(q);
  return `<span class="math-frac">${neg?'<span class="mf-sign">−</span>':''}<span class="mf-stack"><span class="mf-num">${ap}</span><span class="mf-bar"></span><span class="mf-den">${aq}</span></span></span>`;
}
// Post-processes an already-i18n-interpolated prompt/explain string, turning
// any plain numeric "p/q" substring (an answer or an intermediate result,
// e.g. "reduced to 3/4" or "x = -6/-3 = 2") into a stacked visual fraction.
// Deliberately only matches digit/digit patterns — a symbolic formula like
// "n(n+1)/2" or "Dx/D" is left as plain text, since there's no single clean
// numeric fraction to render until the variables are substituted with
// numbers. Never applied to input placeholders (those stay plain text hints
// inside the input box, not HTML).
function enhanceMath(str){
  if(str==null) return str;
  return str.replace(/(-?\d+)\/(-?\d+)(?!\d)/g, (m,p,q)=>fracHTML(Number(p), Number(q)));
}
// Normalizes a problem into its list of answer steps. Most problems are a
// single step (the legacy {inputs, check, explain} shape, auto-wrapped here
// with no separate step prompt so they render exactly as a one-shot
// question, unchanged from before this feature existed); problems that
// naturally break into a sequence (Cramer's rule: D, then Dx, Dy, then x, y)
// return {steps:[...]} directly and get the guided, one-step-at-a-time UI.
function normalizeSteps(problem){
  if(problem.steps) return problem.steps;
  return [{prompt:null, inputs:problem.inputs, check:problem.check, explain:problem.explain, matrixShape:problem.matrixShape}];
}
// Backs a two-box numerator/denominator input (used wherever an input is
// marked fracInput:true) — keeps the two typed halves for redisplay, and
// recomputes a single "num/den" string under the input's own key so the
// existing check() functions (which already expect that format, via
// parseFraction) don't need to know the answer came from two boxes instead
// of one. Shared by every math mode's practice screen.
function setFracInputPart(session, key, part, val){
  session.stepInputs[key+'_'+part] = val;
  session.stepInputs[key] = (session.stepInputs[key+'_num']||'') + '/' + (session.stepInputs[key+'_den']||'');
}

function linalgProblemVectorAddition(){
  const a1=randInt(-9,9), b1=randInt(-9,9), a2=randInt(-9,9), b2=randInt(-9,9);
  const x=a1+a2, y=b1+b2;
  return {
    promptText: t('linalgVectorAddPrompt', {u:vectorText([a1,b1]), v:vectorText([a2,b2])}),
    inputs: [{key:'x', label:'x'}, {key:'y', label:'y'}],
    check(vals){ return Number(vals.x)===x && Number(vals.y)===y; },
    explain: t('linalgVectorAddExplain', {a1, a2, b1, b2, x, y}),
  };
}
function linalgProblemVectorScalar(){
  const a=randInt(-9,9), b=randInt(-9,9), k=nonZeroRandInt(-6,6);
  const x=k*a, y=k*b;
  return {
    promptText: t('linalgVectorScalarPrompt', {k, v:vectorText([a,b])}),
    inputs: [{key:'x', label:'x'}, {key:'y', label:'y'}],
    check(vals){ return Number(vals.x)===x && Number(vals.y)===y; },
    explain: t('linalgVectorScalarExplain', {k, a, b, x, y}),
  };
}
const LINALG_TRIPLES = [[3,4,5],[6,8,10],[5,12,13],[9,12,15],[8,15,17],[7,24,25],[20,21,29],[12,16,20]];
function linalgProblemMagnitude(){
  const [a0,b0,c] = LINALG_TRIPLES[randInt(0,LINALG_TRIPLES.length-1)];
  const swap = Math.random()<0.5;
  const a = (swap ? b0 : a0) * (Math.random()<0.5?-1:1);
  const b = (swap ? a0 : b0) * (Math.random()<0.5?-1:1);
  return {
    promptText: t('linalgMagnitudePrompt', {v:vectorText([a,b])}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===c; },
    explain: t('linalgMagnitudeExplain', {aSq:a*a, bSq:b*b, sum:a*a+b*b, c}),
  };
}
function linalgProblemDotProduct(){
  const a1=randInt(-6,6), b1=randInt(-6,6), c1=randInt(-6,6);
  const a2=randInt(-6,6), b2=randInt(-6,6), c2=randInt(-6,6);
  const t1=a1*a2, t2=b1*b2, t3=c1*c2;
  const answer = t1+t2+t3;
  return {
    promptText: t('linalgDotProductPrompt', {u:vectorText([a1,b1,c1]), v:vectorText([a2,b2,c2])}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('linalgDotProductExplain', {t1, t2, t3, answer}),
  };
}
function linalgProblemCrossProduct(){
  const a1=randInt(-5,5), b1=randInt(-5,5), c1=randInt(-5,5);
  const a2=randInt(-5,5), b2=randInt(-5,5), c2=randInt(-5,5);
  const x=b1*c2-c1*b2, y=c1*a2-a1*c2, z=a1*b2-b1*a2;
  const xExpr = `(${b1})(${c2}) − (${c1})(${b2}) = ${x}`;
  const yExpr = `(${c1})(${a2}) − (${a1})(${c2}) = ${y}`;
  const zExpr = `(${a1})(${b2}) − (${b1})(${a2}) = ${z}`;
  return {
    promptText: t('linalgCrossProductPrompt', {u:vectorText([a1,b1,c1]), v:vectorText([a2,b2,c2])}),
    inputs: [{key:'x', label:'x'}, {key:'y', label:'y'}, {key:'z', label:'z'}],
    check(vals){ return Number(vals.x)===x && Number(vals.y)===y && Number(vals.z)===z; },
    explain: t('linalgCrossProductExplain', {xExpr, yExpr, zExpr}),
  };
}

function linalgProblemDet2(){
  const a=randInt(-9,9), b=randInt(-9,9), c=randInt(-9,9), d=randInt(-9,9);
  const answer=a*d-b*c;
  return {
    promptText: t('linalgDet2Prompt', {A:matrixHTML([[a,b],[c,d]])}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('linalgDet2Explain', {ad:a*d, bc:b*c, answer}),
  };
}
function linalgProblemDet3(){
  const m = Array.from({length:3},()=>Array.from({length:3},()=>randInt(-4,4)));
  const [[a,b,c],[d,e,f],[g,h,i]] = m;
  const t1=a*(e*i-f*h), t2=b*(d*i-f*g), t3=c*(d*h-e*g);
  const answer = t1 - t2 + t3;
  return {
    promptText: t('linalgDet3Prompt', {A:matrixHTML(m)}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('linalgDet3Explain', {
      sumExpr: `${a}(${e*i-f*h}) − ${b}(${d*i-f*g}) + ${c}(${d*h-e*g})`,
      answer,
    }),
  };
}
function linalgProblemTranspose(){
  const m = Array.from({length:2},()=>Array.from({length:3},()=>randInt(-9,9)));
  const row = randInt(0,2), col = randInt(0,1);
  const answer = m[col][row];
  return {
    promptText: t('linalgTransposePrompt', {A:matrixHTML(m), i:row+1, j:col+1}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('linalgTransposeExplain', {i:row+1, j:col+1, origI:col+1, origJ:row+1, answer}),
  };
}
function linalgProblemInverse(){
  let a,b,c,d,det;
  do{
    a=randInt(-4,4); d=randInt(-4,4); b=randInt(-4,4); c=randInt(-4,4);
    det = a*d-b*c;
  } while(Math.abs(det)!==1);
  const i11=d/det, i12=-b/det, i21=-c/det, i22=a/det;
  return {
    promptText: t('linalgInversePrompt', {A:matrixHTML([[a,b],[c,d]])}),
    inputs: [{key:'c11'},{key:'c12'},{key:'c21'},{key:'c22'}],
    matrixShape: [2,2],
    check(vals){ return Number(vals.c11)===i11 && Number(vals.c12)===i12 && Number(vals.c21)===i21 && Number(vals.c22)===i22; },
    explain: t('linalgInverseExplain', {det, C:matrixHTML([[i11,i12],[i21,i22]])}),
  };
}

function submitLinAlgStep(){
  const s = state.linalgSession;
  if(!s || s.answered) return;
  const steps = s.steps;
  const step = steps[s.stepIndex];
  for(const inp of step.inputs){ if(!s.stepInputs[inp.key]) return; }
  const correct = step.check(s.stepInputs);
  if(!correct) s.anyWrong = true;
  const valuesText = step.inputs.map(inp=>s.stepInputs[inp.key]).join(', ');
  const result = {prompt: step.prompt, valuesText, explain: step.explain, correct};
  const isLastStep = s.stepIndex === steps.length-1;
  if(isLastStep){
    s.stepResults.push(result);
    const problemCorrect = !s.anyWrong;
    s.answered = true; s.lastCorrect = problemCorrect;
    if(problemCorrect) registerCorrectAnswer(s, state.game);
    else registerWrongAnswer(s);
  } else {
    s.pendingResult = result;
    s.answered = true; s.lastCorrect = correct;
  }
  render();
}

function nextLinAlgStep(){
  const s = state.linalgSession;
  s.stepResults.push(s.pendingResult);
  s.pendingResult = null;
  s.stepIndex += 1;
  s.answered = false; s.lastCorrect = null; s.stepInputs = {};
  render();
  focusLinAlgInput();
}

function nextLinAlgQuestion(){
  const s = state.linalgSession;
  if(s.mistakes>=MATH_MAX_MISTAKES){ finishLinAlgPractice(); return; }
  const topic = linalgTopicByKey(s.topicKey);
  const problem = topic.build();
  s.problem = problem; s.steps = normalizeSteps(problem);
  s.stepIndex=0; s.stepInputs={}; s.stepResults=[]; s.anyWrong=false; s.pendingResult=null;
  s.answered=false; s.lastCorrect=null;
  render();
  focusLinAlgInput();
}

function finishLinAlgPractice(){
  const s = state.linalgSession;

// ---- discrete math learning: Month 4 of the planned progression (algebra ->
// calculus -> linear algebra -> discrete math -> probability). Same
// architecture as the previous three months, but the answer shape varies
// more per topic than any month so far: plain integers (factorial, gcd),
// a binary string (decimal_to_binary — checked as a normalized string, not a
// number), a comma-separated sorted list (the three set operations — parsed
// and compared as arrays so element order in the typed answer doesn't
// matter), and a literal "true"/"false" word (the propositional-logic
// topic). Set problems are built from one shared helper that partitions a
// shuffled number pool into "only in A", "only in B" and "in both", so
// union/intersection/difference always have a well-defined, non-trivial
// answer instead of risking an accidental empty set.
function factorial(n){ let r=1; for(let i=2;i<=n;i++) r*=i; return r; }
function setText(arr){ return `{${arr.join(', ')}}`; }
function parseSetAnswer(str){
  if(str==null) return null;
  const cleaned = str.replace(/[{}]/g,'').trim();
  if(cleaned==='') return [];
  return cleaned.split(',').map(s=>Number(s.trim())).filter(n=>!Number.isNaN(n)).sort((a,b)=>a-b);
}
function arraysEqual(a,b){ return a.length===b.length && a.every((v,i)=>v===b[i]); }
function discBuildSets(){
  const pool = Array.from({length:12},(_,i)=>i+1);
  for(let i=pool.length-1;i>0;i--){ const j=randInt(0,i); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  const onlyACount = randInt(2,3), onlyBCount = randInt(2,3), sharedCount = randInt(1,2);
  const onlyA = pool.slice(0, onlyACount).sort((a,b)=>a-b);
  const onlyB = pool.slice(onlyACount, onlyACount+onlyBCount).sort((a,b)=>a-b);
  const shared = pool.slice(onlyACount+onlyBCount, onlyACount+onlyBCount+sharedCount).sort((a,b)=>a-b);
  const A = [...onlyA, ...shared].sort((a,b)=>a-b);
  const B = [...onlyB, ...shared].sort((a,b)=>a-b);
  return {A, B, onlyA, onlyB, shared};
}
function parseBool(str){
  if(str==null) return null;
  const s = str.trim().toLowerCase();
  if(['true','t','1'].includes(s)) return true;
  if(['false','f','0'].includes(s)) return false;
  return null;
}
const DISC_LOGIC_TEMPLATES = [
  {expr:'P ∧ Q', calc:(P,Q)=>P&&Q},
  {expr:'P ∨ Q', calc:(P,Q)=>P||Q},
  {expr:'¬P', calc:(P,Q)=>!P},
  {expr:'¬Q', calc:(P,Q)=>!Q},
  {expr:'P → Q', calc:(P,Q)=>(!P)||Q},
  {expr:'P ⊕ Q', calc:(P,Q)=>P!==Q},
  {expr:'¬P ∨ Q', calc:(P,Q)=>(!P)||Q},
  {expr:'P ∧ ¬Q', calc:(P,Q)=>P&&!Q},
  {expr:'¬(P ∧ Q)', calc:(P,Q)=>!(P&&Q)},
];

function discProblemFactorial(){
  const n = randInt(3,8);
  const terms = []; for(let i=n;i>=1;i--) terms.push(i);
  const answer = factorial(n);
  return {
    promptText: t('discFactorialPrompt', {n}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('discFactorialExplain', {expr:terms.join(' × '), answer}),
  };
}
function discProblemPermutations(){
  const n = randInt(4,9);
  const r = randInt(2, n-1);
  const terms = []; let answer = 1;
  for(let i=0;i<r;i++){ terms.push(n-i); answer *= (n-i); }
  return {
    promptText: t('discPermutationsPrompt', {n, r}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('discPermutationsExplain', {expr:terms.join(' × '), answer}),
  };
}
function discProblemCombinations(){
  const n = randInt(4,10);
  const r = randInt(1, n-1);
  const answer = factorial(n)/(factorial(r)*factorial(n-r));
  return {
    promptText: t('discCombinationsPrompt', {n, r}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('discCombinationsExplain', {n, r, nr:n-r, answer}),
  };
}
function discProblemSetUnion(){
  const {A,B} = discBuildSets();
  const union = [...new Set([...A,...B])].sort((a,b)=>a-b);
  return {
    promptText: t('discSetUnionPrompt', {A:setText(A), B:setText(B)}),
    inputs: [{key:'ans', placeholder:t('discSetAnswerPlaceholder')}],
    check(vals){ return arraysEqual(parseSetAnswer(vals.ans)||[], union); },
    explain: t('discSetUnionExplain', {result:setText(union)}),
  };
}
function discProblemSetIntersection(){
  const {A,B,shared} = discBuildSets();
  return {
    promptText: t('discSetIntersectionPrompt', {A:setText(A), B:setText(B)}),
    inputs: [{key:'ans', placeholder:t('discSetAnswerPlaceholder')}],
    check(vals){ return arraysEqual(parseSetAnswer(vals.ans)||[], shared); },
    explain: t('discSetIntersectionExplain', {result:setText(shared)}),
  };
}
function discProblemSetDifference(){
  const {A,B,onlyA} = discBuildSets();
  return {
    promptText: t('discSetDifferencePrompt', {A:setText(A), B:setText(B)}),
    inputs: [{key:'ans', placeholder:t('discSetAnswerPlaceholder')}],
    check(vals){ return arraysEqual(parseSetAnswer(vals.ans)||[], onlyA); },
    explain: t('discSetDifferenceExplain', {result:setText(onlyA)}),
  };
}
function discProblemPowerSetSize(){
  const n = randInt(2,6);
  const pool = Array.from({length:n},(_,i)=>i+1);
  const answer = Math.pow(2,n);
  return {
    promptText: t('discPowerSetPrompt', {S:setText(pool), n}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('discPowerSetExplain', {n, answer}),
  };
}
function discProblemBinToDec(){
  const bits = randInt(4,8);
  let bin = '1';
  for(let i=1;i<bits;i++) bin += (Math.random()<0.5?'0':'1');
  const answer = parseInt(bin,2);
  return {
    promptText: t('discBinToDecPrompt', {bin}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('discBinToDecExplain', {bin, answer}),
  };
}
function discProblemDecToBin(){
  const dec = randInt(5,200);
  const answer = dec.toString(2);
  return {
    promptText: t('discDecToBinPrompt', {dec}),
    inputs: [{key:'ans', placeholder:t('discBinaryAnswerPlaceholder')}],
    check(vals){ return (vals.ans||'').trim().replace(/^0+(?=\d)/,'')===answer; },
    explain: t('discDecToBinExplain', {dec, answer}),
  };
}
function discProblemModular(){
  const n = randInt(3,12);
  const a = randInt(10,99);
  const answer = a % n;
  const q = Math.floor(a/n);
  return {
    promptText: t('discModularPrompt', {a, n}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('discModularExplain', {a, n, q, product:q*n, answer}),
  };
}
function discProblemGcd(){
  const a = randInt(12,96), b = randInt(12,96);
  const answer = gcd(a,b);
  return {
    promptText: t('discGcdPrompt', {a, b}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('discGcdExplain', {a, b, answer}),
  };
}
function discProblemLcm(){
  const a = randInt(2,20), b = randInt(2,20);
  const g = gcd(a,b);
  const answer = (a*b)/g;
  return {
    promptText: t('discLcmPrompt', {a, b}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('discLcmExplain', {a, b, g, product:a*b, answer}),
  };
}
function discProblemLogic(){
  const tmpl = DISC_LOGIC_TEMPLATES[randInt(0,DISC_LOGIC_TEMPLATES.length-1)];
  const P = Math.random()<0.5, Q = Math.random()<0.5;
  const answer = tmpl.calc(P,Q);
  return {
    promptText: t('discLogicPrompt', {expr:tmpl.expr, P:P?'True':'False', Q:Q?'True':'False'}),
    inputs: [{key:'ans', placeholder:t('discBoolAnswerPlaceholder')}],
    check(vals){ return parseBool(vals.ans)===answer; },
    explain: t('discLogicExplain', {expr:tmpl.expr, answer: answer?'True':'False'}),
  };
}

const DISC_TOPICS = [
  {key:'factorial', build:discProblemFactorial},
  {key:'permutations', build:discProblemPermutations},

function renderDiscPractice(){
  const s = state.discSession;
  const steps = s.steps;
  const multiStep = steps.length > 1;
  const stepIndex = s.stepIndex;
  const curStep = steps[stepIndex];
  const isLastStep = stepIndex === steps.length-1;
  const willFinish = s.mistakes >= MATH_MAX_MISTAKES;

  const inputBox = (inp) => {
    if(inp.fracInput){
      const numVal = s.stepInputs[inp.key+'_num']||'', denVal = s.stepInputs[inp.key+'_den']||'';

            style="font-size:20px; font-family:var(--font-display); font-weight:700; text-align:center;"
            ${s.answered?'disabled':''} value="${numVal}"
            oninput="setFracInputPart(state.discSession,'${inp.key}','num',this.value)">
          <div class="frac-input-bar"></div>
          <input class="algebra-input" type="text" inputmode="numeric" autocomplete="off"
            style="font-size:20px; font-family:var(--font-display); font-weight:700; text-align:center;"
            ${s.answered?'disabled':''} value="${denVal}"
            oninput="setFracInputPart(state.discSession,'${inp.key}','den',this.value)">
        </div>

    }
    return `
    <div style="flex:1;">
      ${inp.label ? `<div style="font-size:12px; color:var(--snow-dim); margin-bottom:4px;">${inp.label}</div>` : ''}
      <input class="disc-input algebra-input" data-key="${inp.key}" type="text" autocomplete="off"
        placeholder="${inp.placeholder||''}"
        style="text-align:center; font-size:20px; font-family:var(--font-display); font-weight:700; width:100%;"
        ${s.answered?'disabled':''} value="${(s.stepInputs[inp.key]||'')}"
        oninput="state.discSession.stepInputs['${inp.key}']=this.value">
    </div>`;
  };

  const inputsHtml = curStep.matrixShape
    ? `<div style="display:grid; grid-template-columns:repeat(${curStep.matrixShape[1]}, 1fr); gap:10px; max-width:240px; margin:0 auto;">${curStep.inputs.map(inputBox).join('')}</div>`
    : `<div style="display:flex; gap:12px; align-items:flex-end; justify-content:center;">${curStep.inputs.map(inputBox).join('')}</div>`;

  const stepRowHtml = (r) => `
    <div class="step-row done ${r.correct?'correct':'wrong'}">
      <div class="step-label"><span class="step-icon">${r.correct?'✅':'❌'}</span>${r.prompt?enhanceMath(r.prompt):''}</div>
      <div class="step-values">${enhanceMath(r.valuesText)}</div>
      <div class="step-explain">${enhanceMath(r.explain)}</div>
    </div>`;
  const doneRowsHtml = multiStep ? s.stepResults.map(stepRowHtml).join('') : '';

  let activeStepHtml = '';
  if(!(s.answered && isLastStep)){
    if(!s.answered){
      activeStepHtml = multiStep ? `
        <div class="step-row active">
          <div class="step-label">${t('stepLabel',{n:stepIndex+1, total:steps.length})}</div>
          ${curStep.prompt ? `<div class="step-prompt">${enhanceMath(curStep.prompt)}</div>` : ''}
          ${inputsHtml}
          <button class="btn btn-primary btn-block" style="margin-top:12px;" onclick="submitDiscStep()">${t('checkBtn')}</button>
        </div>` : `
        ${inputsHtml}
        <button class="btn btn-primary btn-block" onclick="submitDiscStep()">${t('checkBtn')}</button>`;
    } else {
      const r = s.pendingResult;
      activeStepHtml = `
        <div class="step-row done ${r.correct?'correct':'wrong'}">
          <div class="step-label"><span class="step-icon">${r.correct?'✅':'❌'}</span>${r.prompt?enhanceMath(r.prompt):''}</div>
          <div class="step-values">${enhanceMath(r.valuesText)}</div>
          <div class="step-explain">${enhanceMath(r.explain)}</div>
          <button class="btn btn-light btn-block" style="margin-top:10px;" onclick="nextDiscStep()">${t('nextStepBtn')}</button>
        </div>`;
    }
  }

  const feedback = (s.answered && isLastStep) ? `
    <div class="feedback-bar ${s.lastCorrect?'good':'bad'}">
      <div class="fb-text">
        <div class="fb-title">${s.lastCorrect? t('correctFeedback',{n:s.lastXpGain}) : t('notQuiteFeedback')}</div>
        ${!multiStep ? `<div class="fb-sub">${enhanceMath(curStep.explain)}</div>` : ''}
      </div>
      <button class="btn btn-light" onclick="nextDiscQuestion()">${willFinish ? t('finishBtn'):t('continueBtn')}</button>
    </div>` : '';

  return `
  ${topbar({back:'exitDiscPractice()'})}

    <div style="display:flex; justify-content:space-between; align-items:center; margin:6px 0 10px;">

      <div style="font-size:12px; color:var(--snow-dim); text-align:right;">${t('correctAnswersLabel')}: ${s.correct}${s.combo>=3?`<br><span style="color:var(--gold);">${comboBadge(s.combo)} ${t('comboLabel',{n:s.combo})}</span>`:''}</div>

      ${multiStep ? `<div class="step-list">${doneRowsHtml}${activeStepHtml}</div>` : activeStepHtml}
    </div>
  </div>
  ${feedback}
  `;
}

function submitDiscStep(){
  const s = state.discSession;
  if(!s || s.answered) return;
  const steps = s.steps;
  const step = steps[s.stepIndex];
  for(const inp of step.inputs){ if(!s.stepInputs[inp.key]) return; }
  const correct = step.check(s.stepInputs);
  if(!correct) s.anyWrong = true;
  const valuesText = step.inputs.map(inp=>s.stepInputs[inp.key]).join(', ');
  const result = {prompt: step.prompt, valuesText, explain: step.explain, correct};
  const isLastStep = s.stepIndex === steps.length-1;
  if(isLastStep){
    s.stepResults.push(result);
    const problemCorrect = !s.anyWrong;
    s.answered = true; s.lastCorrect = problemCorrect;
    if(problemCorrect) registerCorrectAnswer(s, state.game);
    else registerWrongAnswer(s);
  } else {
    s.pendingResult = result;
    s.answered = true; s.lastCorrect = correct;
  }
  render();
}

function nextDiscStep(){
  const s = state.discSession;
  s.stepResults.push(s.pendingResult);
  s.pendingResult = null;
  s.stepIndex += 1;
  s.answered = false; s.lastCorrect = null; s.stepInputs = {};
  render();
  focusDiscInput();
}

function nextDiscQuestion(){
  const s = state.discSession;
  if(s.mistakes>=MATH_MAX_MISTAKES){ finishDiscPractice(); return; }
  const topic = discTopicByKey(s.topicKey);
  const problem = topic.build();
  s.problem = problem; s.steps = normalizeSteps(problem);
  s.stepIndex=0; s.stepInputs={}; s.stepResults=[]; s.anyWrong=false; s.pendingResult=null;
  s.answered=false; s.lastCorrect=null;
  render();
  focusDiscInput();
}

function finishDiscPractice(){
  const s = state.discSession;
  if(!state.game.discrete) state.game.discrete = {};
  const rec = state.game.discrete[s.topicKey] || (state.game.discrete[s.topicKey] = {best:0});
  s.isNewBest = s.correct > rec.best;
  if(s.isNewBest) rec.best = s.correct;
  touchStreak();
  s.newAchievements = checkAchievements(state.game);
  state.screen='disc_complete';
  render();
}

function renderDiscComplete(){
  const s = state.discSession;
  const best = state.game.discrete[s.topicKey].best;

  return `

// ---- probability learning: Month 5 of the planned progression (algebra ->
// calculus -> linear algebra -> discrete math -> probability). Same
// architecture as the previous four months. Almost every answer here is a
// probability, so almost every topic reuses the SAME reduced-fraction
// input/check as algebra's "fractions" topic (typed as "p/q", parsed and
// auto-reduced by the existing parseFraction/gcd helpers from that section)
// rather than inventing a new answer format — the one exception is
// probability_to_odds, which asks for two integers (favorable, against)
// since odds aren't conventionally written as a single fraction.
function fracText(p,q){ return `${p}/${q}`; }
function combinations(n,r){ return factorial(n)/(factorial(r)*factorial(n-r)); }
const PROB_CARD_EVENTS = ['king','heart','red','face','ace'];
const PROB_CARD_FAVORABLE = {king:4, heart:13, red:26, face:12, ace:4};
const DICE_SUM_COUNTS = {2:1,3:2,4:3,5:4,6:5,7:6,8:5,9:4,10:3,11:2,12:1};

function probProblemSimple(){
  const favorable = randInt(2,9);
  const other = randInt(2,9);
  const total = favorable+other;
  const g = gcd(favorable,total); const rp=favorable/g, rq=total/g;
  return {
    promptText: t('probSimplePrompt', {favorable, other}),
    inputs: [{key:'ans', placeholder:t('probFractionAnswerPlaceholder'), fracInput:true}],
    check(vals){ const f=parseFraction(vals.ans); return !!f && f.p===rp && f.q===rq; },
    explain: t('probSimpleExplain', {favorable, total, rp, rq}),
  };
}
function probProblemComplement(){
  const q = randInt(3,12);
  let p; do{ p = randInt(1,q-1); } while(gcd(p,q)!==1);
  const np = q-p; const g=gcd(np,q); const rp=np/g, rq=q/g;
  return {
    promptText: t('probComplementPrompt', {p, q}),
    inputs: [{key:'ans', placeholder:t('probFractionAnswerPlaceholder'), fracInput:true}],
    check(vals){ const f=parseFraction(vals.ans); return !!f && f.p===rp && f.q===rq; },
    explain: t('probComplementExplain', {p, q, np, rp, rq}),
  };
}
function probProblemIndependentAnd(){
  let p1,q1; do{ q1=randInt(2,8); p1=randInt(1,q1-1); } while(gcd(p1,q1)!==1);
  let p2,q2; do{ q2=randInt(2,8); p2=randInt(1,q2-1); } while(gcd(p2,q2)!==1);
  const num = p1*p2, den = q1*q2;
  const g = gcd(num,den); const rp=num/g, rq=den/g;
  return {
    promptText: t('probIndependentAndPrompt', {p1,q1,p2,q2}),
    inputs: [{key:'ans', placeholder:t('probFractionAnswerPlaceholder'), fracInput:true}],
    check(vals){ const f=parseFraction(vals.ans); return !!f && f.p===rp && f.q===rq; },
    explain: t('probIndependentAndExplain', {p1,q1,p2,q2,num,den,rp,rq}),
  };
}
function probProblemMutuallyExclusiveOr(){
  let p1,q1,p2,q2,num,den;
  do{
    q1=randInt(2,8); p1=randInt(1,q1-1);
    q2=randInt(2,8); p2=randInt(1,q2-1);
    num = p1*q2+p2*q1; den = q1*q2;
  } while(gcd(p1,q1)!==1 || gcd(p2,q2)!==1 || num>den);
  const g = gcd(num,den); const rp=num/g, rq=den/g;
  return {
    promptText: t('probMutuallyExclusiveOrPrompt', {p1,q1,p2,q2}),
    inputs: [{key:'ans', placeholder:t('probFractionAnswerPlaceholder'), fracInput:true}],
    check(vals){ const f=parseFraction(vals.ans); return !!f && f.p===rp && f.q===rq; },
    explain: t('probMutuallyExclusiveOrExplain', {p1,q1,p2,q2,num,den,rp,rq}),
  };
}
function probProblemConditional(){
  const q = randInt(4,12);
  const b = randInt(2,q-1);
  const a = randInt(1,b);
  const g = gcd(a,b); const rp=a/g, rq=b/g;
  return {
    promptText: t('probConditionalPrompt', {a, q, b}),
    inputs: [{key:'ans', placeholder:t('probFractionAnswerPlaceholder'), fracInput:true}],
    check(vals){ const f=parseFraction(vals.ans); return !!f && f.p===rp && f.q===rq; },
    explain: t('probConditionalExplain', {a, q, b, rp, rq}),
  };
}
function probProblemDiceSum(){
  const sums = Object.keys(DICE_SUM_COUNTS).map(Number);
  const target = sums[randInt(0,sums.length-1)];
  const favorable = DICE_SUM_COUNTS[target];
  const g = gcd(favorable,36); const rp=favorable/g, rq=36/g;
  return {
    promptText: t('probDiceSumPrompt', {target}),
    inputs: [{key:'ans', placeholder:t('probFractionAnswerPlaceholder'), fracInput:true}],
    check(vals){ const f=parseFraction(vals.ans); return !!f && f.p===rp && f.q===rq; },
    explain: t('probDiceSumExplain', {favorable, target, rp, rq}),
  };
}
function probProblemCard(){
  const key = PROB_CARD_EVENTS[randInt(0,PROB_CARD_EVENTS.length-1)];
  const favorable = PROB_CARD_FAVORABLE[key];
  const g = gcd(favorable,52); const rp=favorable/g, rq=52/g;
  return {
    promptText: t('probCardPrompt_'+key),
    inputs: [{key:'ans', placeholder:t('probFractionAnswerPlaceholder'), fracInput:true}],
    check(vals){ const f=parseFraction(vals.ans); return !!f && f.p===rp && f.q===rq; },
    explain: t('probCardExplain', {favorable, rp, rq}),
  };
}
function probProblemCombinatorial(){
  const n = randInt(6,12);
  const k = randInt(2,4);
  const r = randInt(2, Math.min(k, n-1));
  const favorable = combinations(k,r), total = combinations(n,r);
  const g = gcd(favorable,total); const rp=favorable/g, rq=total/g;
  return {
    promptText: t('probCombinatorialPrompt', {n, k, r}),
    inputs: [{key:'ans', placeholder:t('probFractionAnswerPlaceholder'), fracInput:true}],
    check(vals){ const f=parseFraction(vals.ans); return !!f && f.p===rp && f.q===rq; },
    explain: t('probCombinatorialExplain', {k, r, n, favorable, total, rp, rq}),
  };
}
function probProblemExpectedValue(){
  const d = [2,3,4,5,6][randInt(0,4)];
  const k = randInt(1,d-1);
  const dk = d-k;
  const V1 = randInt(1,10)*d, V2 = randInt(1,10)*d;
  const term1 = k*V1, term2 = dk*V2;
  const answer = (term1+term2)/d;
  return {
    promptText: t('probExpectedValuePrompt', {k, d, V1, dk, V2}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('probExpectedValueExplain', {k, d, V1, dk, V2, term1, term2, d2:d, answer}),
  };
}
function probProblemBinomial(){
  const n = randInt(3,6);
  const k = randInt(0,n);
  const favorable = combinations(n,k), total = Math.pow(2,n);
  const g = gcd(favorable,total); const rp=favorable/g, rq=total/g;
  return {
    promptText: t('probBinomialPrompt', {n, k}),
    inputs: [{key:'ans', placeholder:t('probFractionAnswerPlaceholder'), fracInput:true}],
    check(vals){ const f=parseFraction(vals.ans); return !!f && f.p===rp && f.q===rq; },
    explain: t('probBinomialExplain', {n, k, favorable, total, rp, rq}),
  };
}
function probProblemOddsToProb(){
  let a,b; do{ a=randInt(1,9); b=randInt(1,9); } while(gcd(a,b)!==1);
  const total = a+b;
  const g = gcd(a,total); const rp=a/g, rq=total/g;
  return {
    promptText: t('probOddsToProbPrompt', {a, b}),
    inputs: [{key:'ans', placeholder:t('probFractionAnswerPlaceholder'), fracInput:true}],
    check(vals){ const f=parseFraction(vals.ans); return !!f && f.p===rp && f.q===rq; },
    explain: t('probOddsToProbExplain', {a, b, total, rp, rq}),
  };
}
function probProblemProbToOdds(){
  const q = randInt(3,12);
  let p; do{ p = randInt(1,q-1); } while(gcd(p,q)!==1);
  const against = q-p;
  const g = gcd(p,against); const rp=p/g, ra=against/g;
  return {
    promptText: t('probProbToOddsPrompt', {p, q}),
    inputs: [{key:'fav', label:t('probFavorableLabel')}, {key:'against', label:t('probAgainstLabel')}],
    check(vals){ return Number(vals.fav)===rp && Number(vals.against)===ra; },
    explain: t('probProbToOddsExplain', {p, q, against, rp, ra}),
  };
}
function probProblemAtLeastOne(){
  const d = randInt(2,6);
  const n = randInt(2,4);
  const dn = Math.pow(d,n), d1n = Math.pow(d-1,n);
  const num = dn-d1n, den = dn;
  const g = gcd(num,den); const rp=num/g, rq=den/g;
  return {
    promptText: t('probAtLeastOnePrompt', {d, n}),
    inputs: [{key:'ans', placeholder:t('probFractionAnswerPlaceholder'), fracInput:true}],
    check(vals){ const f=parseFraction(vals.ans); return !!f && f.p===rp && f.q===rq; },
    explain: t('probAtLeastOneExplain', {d, n, dm1:d-1, d1n, dn, num, rp, rq}),
  };
}

        <div class="frac-input">

            style="font-size:20px; font-family:var(--font-display); font-weight:700; text-align:center;"
            ${s.answered?'disabled':''} value="${numVal}"
            oninput="setFracInputPart(state.probSession,'${inp.key}','num',this.value)">
          <div class="frac-input-bar"></div>
          <input class="algebra-input" type="text" inputmode="numeric" autocomplete="off"
            style="font-size:20px; font-family:var(--font-display); font-weight:700; text-align:center;"
            ${s.answered?'disabled':''} value="${denVal}"
            oninput="setFracInputPart(state.probSession,'${inp.key}','den',this.value)">
        </div>
      </div>`;
    }
    return `
    <div style="flex:1;">
      ${inp.label ? `<div style="font-size:12px; color:var(--snow-dim); margin-bottom:4px;">${inp.label}</div>` : ''}
      <input class="prob-input algebra-input" data-key="${inp.key}" type="text" autocomplete="off"
        placeholder="${inp.placeholder||''}"
        style="text-align:center; font-size:20px; font-family:var(--font-display); font-weight:700; width:100%;"
        ${s.answered?'disabled':''} value="${(s.stepInputs[inp.key]||'')}"
        oninput="state.probSession.stepInputs['${inp.key}']=this.value">
    </div>`;
  };

  const inputsHtml = curStep.matrixShape
    ? `<div style="display:grid; grid-template-columns:repeat(${curStep.matrixShape[1]}, 1fr); gap:10px; max-width:240px; margin:0 auto;">${curStep.inputs.map(inputBox).join('')}</div>`
    : `<div style="display:flex; gap:12px; align-items:flex-end; justify-content:center;">${curStep.inputs.map(inputBox).join('')}</div>`;

  const stepRowHtml = (r) => `
    <div class="step-row done ${r.correct?'correct':'wrong'}">
      <div class="step-label"><span class="step-icon">${r.correct?'✅':'❌'}</span>${r.prompt?enhanceMath(r.prompt):''}</div>
      <div class="step-values">${enhanceMath(r.valuesText)}</div>
      <div class="step-explain">${enhanceMath(r.explain)}</div>
    </div>`;
  const doneRowsHtml = multiStep ? s.stepResults.map(stepRowHtml).join('') : '';

  let activeStepHtml = '';
  if(!(s.answered && isLastStep)){
    if(!s.answered){
      activeStepHtml = multiStep ? `
        <div class="step-row active">
          <div class="step-label">${t('stepLabel',{n:stepIndex+1, total:steps.length})}</div>
          ${curStep.prompt ? `<div class="step-prompt">${enhanceMath(curStep.prompt)}</div>` : ''}
          ${inputsHtml}
          <button class="btn btn-primary btn-block" style="margin-top:12px;" onclick="submitProbStep()">${t('checkBtn')}</button>
        </div>` : `
        ${inputsHtml}
        <button class="btn btn-primary btn-block" onclick="submitProbStep()">${t('checkBtn')}</button>`;
    } else {
      const r = s.pendingResult;
      activeStepHtml = `
        <div class="step-row done ${r.correct?'correct':'wrong'}">
          <div class="step-label"><span class="step-icon">${r.correct?'✅':'❌'}</span>${r.prompt?enhanceMath(r.prompt):''}</div>
          <div class="step-values">${enhanceMath(r.valuesText)}</div>
          <div class="step-explain">${enhanceMath(r.explain)}</div>
          <button class="btn btn-light btn-block" style="margin-top:10px;" onclick="nextProbStep()">${t('nextStepBtn')}</button>
        </div>`;
    }
  }

  const feedback = (s.answered && isLastStep) ? `
    <div class="feedback-bar ${s.lastCorrect?'good':'bad'}">
      <div class="fb-text">
        <div class="fb-title">${s.lastCorrect? t('correctFeedback',{n:s.lastXpGain}) : t('notQuiteFeedback')}</div>
        ${!multiStep ? `<div class="fb-sub">${enhanceMath(curStep.explain)}</div>` : ''}
      </div>
      <button class="btn btn-light" onclick="nextProbQuestion()">${willFinish ? t('finishBtn'):t('continueBtn')}</button>
    </div>` : '';

  return `
  ${topbar({back:'exitProbPractice()'})}
  <div class="lesson">
    <div style="display:flex; justify-content:space-between; align-items:center; margin:6px 0 10px;">
      <div class="hearts-row">${Array.from({length:MATH_MAX_MISTAKES}).map((_,i)=>`<span>${i<(MATH_MAX_MISTAKES-s.mistakes)?'❤️':'🩶'}</span>`).join('')}</div>
      <div style="font-size:12px; color:var(--snow-dim); text-align:right;">${t('correctAnswersLabel')}: ${s.correct}${s.combo>=3?`<br><span style="color:var(--gold);">${comboBadge(s.combo)} ${t('comboLabel',{n:s.combo})}</span>`:''}</div>
    </div>
    <div class="q-wrap">
      <div class="q-card">
        <div class="q-eyebrow">${t('probTopicTitle_'+s.topicKey)}</div>
        <div class="q-prompt" style="font-size:22px;">${enhanceMath(s.problem.promptText)}</div>
      </div>
      ${multiStep ? `<div class="step-list">${doneRowsHtml}${activeStepHtml}</div>` : activeStepHtml}
    </div>
  </div>
  ${feedback}
  `;
}

function submitProbStep(){
  const s = state.probSession;
  if(!s || s.answered) return;
  const steps = s.steps;
  const step = steps[s.stepIndex];
  for(const inp of step.inputs){ if(!s.stepInputs[inp.key]) return; }
  const correct = step.check(s.stepInputs);
  if(!correct) s.anyWrong = true;
  const valuesText = step.inputs.map(inp=>s.stepInputs[inp.key]).join(', ');
  const result = {prompt: step.prompt, valuesText, explain: step.explain, correct};
  const isLastStep = s.stepIndex === steps.length-1;
  if(isLastStep){
    s.stepResults.push(result);
    const problemCorrect = !s.anyWrong;
    s.answered = true; s.lastCorrect = problemCorrect;
    if(problemCorrect) registerCorrectAnswer(s, state.game);
    else registerWrongAnswer(s);
  } else {
    s.pendingResult = result;
    s.answered = true; s.lastCorrect = correct;
  }
  render();
}

function nextProbStep(){
  const s = state.probSession;
  s.stepResults.push(s.pendingResult);
  s.pendingResult = null;
  s.stepIndex += 1;
  s.answered = false; s.lastCorrect = null; s.stepInputs = {};
  render();
  focusProbInput();
}

function nextProbQuestion(){
  const s = state.probSession;
  if(s.mistakes>=MATH_MAX_MISTAKES){ finishProbPractice(); return; }
  const topic = probTopicByKey(s.topicKey);
  const problem = topic.build();
  s.problem = problem; s.steps = normalizeSteps(problem);
  s.stepIndex=0; s.stepInputs={}; s.stepResults=[]; s.anyWrong=false; s.pendingResult=null;
  s.answered=false; s.lastCorrect=null;
  render();
  focusProbInput();
}

function finishProbPractice(){
  const s = state.probSession;
  if(!state.game.probability) state.game.probability = {};
  const rec = state.game.probability[s.topicKey] || (state.game.probability[s.topicKey] = {best:0});
  s.isNewBest = s.correct > rec.best;
  if(s.isNewBest) rec.best = s.correct;
  touchStreak();
  s.newAchievements = checkAchievements(state.game);
  state.screen='prob_complete';
  render();
}

function renderProbComplete(){
  const s = state.probSession;
  const best = state.game.probability[s.topicKey].best;
  const lvl = xpLevel(state.game.xp);
  return `
  ${topbar()}
  <div class="complete ${appLangClass()}">
    <div class="medal">${s.isNewBest ? '🏆' : '🎯'}</div>
    <h2>${s.isNewBest ? t('newBestReached') : t('checkpointReached')}</h2>
    <div class="stat-row">

    </div>

// ---- statistics learning: Month 6 of the planned progression (algebra ->
// calculus -> linear algebra -> discrete math -> probability -> statistics).
// Same architecture as the previous five months. Every dataset is
// constructed backwards from a clean answer (deviations that sum to zero for
// variance, ± the same magnitude for standard deviation so the variance is
// always a perfect square, sums that divide evenly for mean/weighted
// average, quartile positions pre-set to repeated values so Q1/Q3 never
// require averaging into a fraction) rather than generating random numbers
// and hoping the statistic comes out clean.
function statProblemMean(){
  const n = randInt(4,7);
  let vals, sum;
  do{
    vals = Array.from({length:n},()=>randInt(1,30));
    sum = vals.reduce((a,b)=>a+b,0);
  } while(sum % n !== 0);
  const answer = sum/n;
  return {
    promptText: t('statMeanPrompt', {vals:vals.join(', ')}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals2){ return Number(vals2.ans)===answer; },
    explain: t('statMeanExplain', {sum, n, answer}),
  };
}
function statProblemMedian(){
  const n = [5,7,9][randInt(0,2)];
  const vals = Array.from({length:n},()=>randInt(1,50)).sort((a,b)=>a-b);
  const answer = vals[(n-1)/2];
  const shuffled = [...vals];
  for(let i=shuffled.length-1;i>0;i--){ const j=randInt(0,i); [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]; }
  return {
    promptText: t('statMedianPrompt', {vals:shuffled.join(', ')}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals2){ return Number(vals2.ans)===answer; },
    explain: t('statMedianExplain', {sorted:vals.join(', '), answer}),
  };
}
function statProblemMode(){
  const repeated = randInt(1,20);
  const pool = [repeated, repeated, repeated];
  while(pool.length<7){
    const v = randInt(1,20);
    if(v!==repeated && pool.filter(x=>x===v).length<2) pool.push(v);
  }
  for(let i=pool.length-1;i>0;i--){ const j=randInt(0,i); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  return {
    promptText: t('statModePrompt', {vals:pool.join(', ')}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals2){ return Number(vals2.ans)===repeated; },
    explain: t('statModeExplain', {repeated}),
  };
}
function statProblemRange(){
  const n = randInt(5,8);
  const vals = Array.from({length:n},()=>randInt(1,50));
  const max = Math.max(...vals), min = Math.min(...vals);
  const answer = max-min;
  return {
    promptText: t('statRangePrompt', {vals:vals.join(', ')}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals2){ return Number(vals2.ans)===answer; },
    explain: t('statRangeExplain', {max, min, answer}),
  };
}
const STAT_DEVIATION_SETS = [
  [-3,-1,1,3], [-2,-2,2,2], [-1,-1,1,1],
  [-4,-2,0,2,4], [-2,-1,0,1,2],
  [-4,-4,-2,2,4,4],
];
function statProblemVariance(){
  const dev = STAT_DEVIATION_SETS[randInt(0,STAT_DEVIATION_SETS.length-1)];
  const n = dev.length;
  const k = randInt(1,3);
  const mean = randInt(10,40);
  const vals = dev.map(d=>mean + d*k);
  const sumSq = dev.reduce((s,d)=>s+(d*k)*(d*k),0);
  const answer = sumSq/n;
  return {
    promptText: t('statVariancePrompt', {vals:vals.join(', ')}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals2){ return Number(vals2.ans)===answer; },
    explain: t('statVarianceExplain', {mean, sumSq, n, answer}),
  };
}
function statProblemStdDev(){
  const n = [4,6,8][randInt(0,2)];
  const a = randInt(2,9);
  const mean = randInt(10,40);
  const half = n/2;
  const dev = [...Array(half).fill(-a), ...Array(half).fill(a)];
  for(let i=dev.length-1;i>0;i--){ const j=randInt(0,i); [dev[i],dev[j]]=[dev[j],dev[i]]; }
  const vals = dev.map(d=>mean+d);
  const variance = a*a;
  const answer = a;
  return {
    promptText: t('statStdDevPrompt', {vals:vals.join(', ')}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals2){ return Number(vals2.ans)===answer; },
    explain: t('statStdDevExplain', {mean, variance, answer}),
  };
}
function statProblemZScore(){
  const mean = randInt(20,80);
  const sd = randInt(2,10);
  const k = nonZeroRandInt(-3,3);
  const x = mean + k*sd;
  const answer = k;
  return {
    promptText: t('statZScorePrompt', {x, mean, sd}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('statZScoreExplain', {x, mean, diff:x-mean, sd, answer}),
  };
}
function statProblemPercentage(){
  const whole = [20,25,40,50,80,100,200][randInt(0,6)];
  let part;
  do{ part = randInt(1,whole-1); } while((part*100)%whole!==0);
  const answer = (part*100)/whole;
  return {
    promptText: t('statPercentagePrompt', {part, whole}),
    inputs: [{key:'ans', placeholder:t('statPercentAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('statPercentageExplain', {part, whole, answer}),
  };
}
function statProblemWeightedAverage(){
  const w1=randInt(1,4), w2=randInt(1,4), w3=randInt(1,4);
  const totalW = w1+w2+w3;
  let s1,s2,s3, sum;
  do{
    s1=randInt(50,100); s2=randInt(50,100); s3=randInt(50,100);
    sum = s1*w1+s2*w2+s3*w3;
  } while(sum % totalW !== 0);
  const answer = sum/totalW;
  return {
    promptText: t('statWeightedAvgPrompt', {s1,w1,s2,w2,s3,w3}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('statWeightedAvgExplain', {s1,w1,s2,w2,s3,w3,sum,totalW,answer}),
  };
}
function statProblemIQR(){
  const Q1 = randInt(10,30);
  const Q3 = Q1 + randInt(10,30);
  const item0 = Q1 - randInt(1,5);
  const item3 = Q1 + randInt(1, Math.max(1, Math.floor((Q3-Q1)/2)));
  const item4 = item3 + randInt(0, Math.max(0, Q3-item3-1));
  const item7 = Q3 + randInt(1,5);
  const sorted = [item0, Q1, Q1, item3, item4, Q3, Q3, item7];
  const answer = Q3 - Q1;
  const shuffled = [...sorted];
  for(let i=shuffled.length-1;i>0;i--){ const j=randInt(0,i); [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]; }
  return {
    promptText: t('statIQRPrompt', {vals:shuffled.join(', ')}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals2){ return Number(vals2.ans)===answer; },
    explain: t('statIQRExplain', {sorted:sorted.join(', '), Q1, Q3, answer}),
  };
}
function statProblemMidrange(){
  const n = randInt(5,8);
  const half = randInt(5,40);
  const min = randInt(1,30);
  const max = min + half*2;
  const middle = Array.from({length:n-2},()=>randInt(min+1,max-1));
  const vals = [min, max, ...middle];
  for(let i=vals.length-1;i>0;i--){ const j=randInt(0,i); [vals[i],vals[j]]=[vals[j],vals[i]]; }
  const answer = (min+max)/2;
  return {
    promptText: t('statMidrangePrompt', {vals:vals.join(', ')}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals2){ return Number(vals2.ans)===answer; },
    explain: t('statMidrangeExplain', {min, max, answer}),
  };
}
function statProblemFrequency(){
  const target = randInt(1,15);
  const freq = randInt(2,4);
  const vals = [];
  for(let i=0;i<freq;i++) vals.push(target);
  const extra = randInt(4,7);
  for(let i=0;i<extra;i++){
    let v; do{ v = randInt(1,15); } while(v===target);
    vals.push(v);
  }
  for(let i=vals.length-1;i>0;i--){ const j=randInt(0,i); [vals[i],vals[j]]=[vals[j],vals[i]]; }
  return {
    promptText: t('statFrequencyPrompt', {vals:vals.join(', '), target}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals2){ return Number(vals2.ans)===freq; },
    explain: t('statFrequencyExplain', {target, freq}),
  };
}
function statProblemCumulative(){
  const n = randInt(8,12);
  const vals = Array.from({length:n},()=>randInt(1,50));
  const threshold = randInt(10,45);
  const answer = vals.filter(v=>v<=threshold).length;
  return {
    promptText: t('statCumulativePrompt', {vals:vals.join(', '), threshold}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals2){ return Number(vals2.ans)===answer; },
    explain: t('statCumulativeExplain', {threshold, answer}),
  };
}

const STAT_TOPICS = [

  {key:'std_dev', build:statProblemStdDev},

    : `<div style="display:flex; gap:12px; align-items:flex-end; justify-content:center;">${curStep.inputs.map(inputBox).join('')}</div>`;

  const stepRowHtml = (r) => `
    <div class="step-row done ${r.correct?'correct':'wrong'}">
      <div class="step-label"><span class="step-icon">${r.correct?'✅':'❌'}</span>${r.prompt?enhanceMath(r.prompt):''}</div>
      <div class="step-values">${enhanceMath(r.valuesText)}</div>
      <div class="step-explain">${enhanceMath(r.explain)}</div>
    </div>`;
  const doneRowsHtml = multiStep ? s.stepResults.map(stepRowHtml).join('') : '';

  let activeStepHtml = '';
  if(!(s.answered && isLastStep)){
    if(!s.answered){
      activeStepHtml = multiStep ? `
        <div class="step-row active">
          <div class="step-label">${t('stepLabel',{n:stepIndex+1, total:steps.length})}</div>
          ${curStep.prompt ? `<div class="step-prompt">${enhanceMath(curStep.prompt)}</div>` : ''}
          ${inputsHtml}
          <button class="btn btn-primary btn-block" style="margin-top:12px;" onclick="submitStatStep()">${t('checkBtn')}</button>
        </div>` : `
        ${inputsHtml}
        <button class="btn btn-primary btn-block" onclick="submitStatStep()">${t('checkBtn')}</button>`;
    } else {
      const r = s.pendingResult;
      activeStepHtml = `
        <div class="step-row done ${r.correct?'correct':'wrong'}">
          <div class="step-label"><span class="step-icon">${r.correct?'✅':'❌'}</span>${r.prompt?enhanceMath(r.prompt):''}</div>
          <div class="step-values">${enhanceMath(r.valuesText)}</div>
          <div class="step-explain">${enhanceMath(r.explain)}</div>
          <button class="btn btn-light btn-block" style="margin-top:10px;" onclick="nextStatStep()">${t('nextStepBtn')}</button>

    <div class="feedback-bar ${s.lastCorrect?'good':'bad'}">
      <div class="fb-text">
        <div class="fb-title">${s.lastCorrect? t('correctFeedback',{n:s.lastXpGain}) : t('notQuiteFeedback')}</div>
        ${!multiStep ? `<div class="fb-sub">${enhanceMath(curStep.explain)}</div>` : ''}
      </div>
      <button class="btn btn-light" onclick="nextStatQuestion()">${willFinish ? t('finishBtn'):t('continueBtn')}</button>
    </div>` : '';

  return `

      </div>
      ${multiStep ? `<div class="step-list">${doneRowsHtml}${activeStepHtml}</div>` : activeStepHtml}
    </div>
  </div>
  ${feedback}
  `;
}

function submitStatStep(){
  const s = state.statSession;
  if(!s || s.answered) return;
  const steps = s.steps;
  const step = steps[s.stepIndex];
  for(const inp of step.inputs){ if(!s.stepInputs[inp.key]) return; }
  const correct = step.check(s.stepInputs);
  if(!correct) s.anyWrong = true;
  const valuesText = step.inputs.map(inp=>s.stepInputs[inp.key]).join(', ');
  const result = {prompt: step.prompt, valuesText, explain: step.explain, correct};
  const isLastStep = s.stepIndex === steps.length-1;
  if(isLastStep){
    s.stepResults.push(result);
    const problemCorrect = !s.anyWrong;
    s.answered = true; s.lastCorrect = problemCorrect;
    if(problemCorrect) registerCorrectAnswer(s, state.game);
    else registerWrongAnswer(s);
  } else {
    s.pendingResult = result;
    s.answered = true; s.lastCorrect = correct;
  }
  render();
}

function nextStatStep(){
  const s = state.statSession;
  s.stepResults.push(s.pendingResult);
  s.pendingResult = null;
  s.stepIndex += 1;
  s.answered = false; s.lastCorrect = null; s.stepInputs = {};
  render();
  focusStatInput();
}

function nextStatQuestion(){
  const s = state.statSession;
  if(s.mistakes>=MATH_MAX_MISTAKES){ finishStatPractice(); return; }
  const topic = statTopicByKey(s.topicKey);
  const problem = topic.build();
  s.problem = problem; s.steps = normalizeSteps(problem);
  s.stepIndex=0; s.stepInputs={}; s.stepResults=[]; s.anyWrong=false; s.pendingResult=null;
  s.answered=false; s.lastCorrect=null;
  render();
  focusStatInput();
}

function finishStatPractice(){
  const s = state.statSession;
  if(!state.game.statistics) state.game.statistics = {};
  const rec = state.game.statistics[s.topicKey] || (state.game.statistics[s.topicKey] = {best:0});
  s.isNewBest = s.correct > rec.best;
  if(s.isNewBest) rec.best = s.correct;
  touchStreak();
  s.newAchievements = checkAchievements(state.game);
  state.screen='stat_complete';
  render();
}

function renderStatComplete(){
  const s = state.statSession;
  const best = state.game.statistics[s.topicKey].best;
  const lvl = xpLevel(state.game.xp);
  return `

  <div class="complete ${appLangClass()}">

function geomProblemRectangleArea(){

  return {
    promptText: t('geomRectAreaPrompt', {l, w}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('geomRectAreaExplain', {l, w, answer}),
  };
}
function geomProblemRectanglePerimeter(){
  const l = randInt(3,30), w = randInt(3,30);

    promptText: t('geomRectPerimeterPrompt', {l, w}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },

}
function geomProblemTriangleArea(){

  return {

function geomProblemTrianglePerimeter(){

function geomProblemDistance(){
  const [dx0,dy0,dist] = LINALG_TRIPLES[randInt(0,LINALG_TRIPLES.length-1)];

  const dx = (swap?dy0:dx0) * (Math.random()<0.5?-1:1);

}

function submitGeomStep(){
