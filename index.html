    bizTitle_financial_accounting: "Financial Accounting", bizExplain_financial_accounting: "Financial accounting produces standardized statements — the income statement, balance sheet and cash flow statement — for external users like investors, lenders and regulators, following accounting standards.", bizQuestion_financial_accounting: "What branch of accounting produces standardized statements for external users like investors and lenders?",
    bizTitle_income_statement: "Income Statement", bizExplain_income_statement: "The income statement reports revenue, subtracts the cost of goods sold to find gross profit, then subtracts period expenses to arrive at profit for the period.", bizQuestion_income_statement: "Complete the income statement below.",
    bizTitle_work_in_process: "Work in Process", bizExplain_work_in_process: "Work in Process (WIP) is inventory that has entered production but is not yet finished — it holds the direct materials, direct labour and overhead applied so far.", bizQuestion_work_in_process: "What term describes inventory that has started production but is not yet finished?",
    bizTitle_cogm: "Cost of Goods Manufactured", bizExplain_cogm: "Cost of Goods Manufactured (COGM) adds opening Work in Process to total manufacturing costs incurred during the period, then subtracts closing Work in Process.", bizQuestion_cogm: "Complete the schedule of Cost of Goods Manufactured below.",
    bizTitle_cogs: "Cost of Goods Sold", bizExplain_cogs: "Cost of Goods Sold (COGS) adds opening Finished Goods inventory to the Cost of Goods Manufactured during the period, then subtracts closing Finished Goods inventory.", bizQuestion_cogs: "Complete the Cost of Goods Sold schedule below.",
    bizTitle_balance_sheet: "Balance Sheet", bizExplain_balance_sheet: "The balance sheet shows what a business owns and owes at a point in time. Total Assets always equal Total Liabilities plus Total Equity.", bizQuestion_balance_sheet: "Complete the balance sheet below.",
    bizTitle_probability: "Probability", bizExplain_probability: "Probability is a mathematical language and framework used to describe and measure the likelihood of events or the distribution of random variables.", bizQuestion_probability: "What term describes the mathematical framework used to measure the likelihood of events or the distribution of random variables?",
    bizTitle_uncertainty_quantification: "Uncertainty Quantification", bizExplain_uncertainty_quantification: "Uncertainty Quantification (UQ) is the broader applied science of identifying, measuring, and propagating all sources of doubt and variability — including computer models, physical systems, and incomplete data — to see how they impact real-world outcomes.", bizQuestion_uncertainty_quantification: "What term describes the applied science of identifying, measuring and propagating all sources of doubt and variability to see how they impact real-world outcomes?",
    bizTitle_statistical_learning: "Statistical Learning", bizExplain_statistical_learning: "Statistical learning developed within the statistics discipline, with an emphasis on models, interpretability and uncertainty quantification — in contrast to machine learning, which emerged from computer science with an emphasis on large-scale applications and predictive performance.", bizQuestion_statistical_learning: "What term describes the statistics-discipline approach to learning from data, emphasizing models, interpretability and uncertainty quantification?",
    bizTitle_reducible_error: "Reducible Error", bizExplain_reducible_error: "Reducible error is the part of prediction error due to the model f-hat being imperfect. It can be reduced by using better data or a better algorithm.", bizQuestion_reducible_error: "What term describes the part of prediction error that can be reduced with better data or a better algorithm?",
    bizTitle_irreducible_error: "Irreducible Error", bizExplain_irreducible_error: "Irreducible error is the variability in Y due to random noise (epsilon) that cannot be removed even if you knew the true function f exactly. Even a perfect model can't predict better than this floor.", bizQuestion_irreducible_error: "What term describes the noise in the data that no model, however good, can ever predict away?",
    bizTitle_parametric_model: "Parametric Model", bizExplain_parametric_model: "A parametric model specifies a functional form for f — like a linear model — and estimates a finite set of parameters from the training data. It needs relatively few observations but may not fit the true relationship well.", bizQuestion_parametric_model: "What term describes a model that specifies a fixed functional form and estimates a finite set of parameters from the data?",
    bizTitle_non_parametric_model: "Non-Parametric Model", bizExplain_non_parametric_model: "A non-parametric model makes no explicit assumption about the functional form of f. It's more flexible and can fit complex patterns, but needs more data and is more prone to overfitting.", bizQuestion_non_parametric_model: "What term describes a model that makes no explicit assumption about the functional form being estimated?",
    bizTitle_overfitting: "Overfitting", bizExplain_overfitting: "Overfitting happens when a flexible model fits the training data extremely well — including its noise — so that training error keeps falling while test error on new data starts rising.", bizQuestion_overfitting: "What term describes a model fitting the training data so closely (including its noise) that test error on new data gets worse?",
    bizTitle_bias_variance_tradeoff: "Bias-Variance Trade-off", bizExplain_bias_variance_tradeoff: "As model flexibility increases, variance (how much the fit would change with a different training set) increases while bias (error from approximating reality with too simple a model) decreases. The best model minimizes the sum of the two.", bizQuestion_bias_variance_tradeoff: "What term describes how a model's error splits into two components that move in opposite directions as flexibility changes?",
    bizTitle_decision_boundary: "Decision Boundary", bizExplain_decision_boundary: "In a two-class classification problem, the decision boundary is the set of points where the predicted class probability is exactly 50% — on one side an observation is assigned to one class, on the other side to the remaining class.", bizQuestion_decision_boundary: "What term describes the set of points where a classifier's predicted probability is exactly 50%, splitting the two classes?",
    bizTitle_regression: "Regression", bizExplain_regression: "Regression is used when the target Y is quantitative, like a price or a temperature. It's the counterpart to classification, which is used for qualitative targets.", bizQuestion_regression: "What term describes predicting a quantitative target, like a price, rather than a category?",
    bizTitle_classification: "Classification", bizExplain_classification: "Classification is used when the target Y is qualitative — it takes values in a finite set of classes, like spam/not spam. A classifier assigns each observation to the class with the highest estimated probability.", bizQuestion_classification: "What term describes predicting a qualitative target by assigning each observation to one of a finite set of classes?",
    bizTitle_mse: "Mean Squared Error", bizExplain_mse: "Training MSE measures fit on the data used to train the model; it always falls as flexibility increases. Test MSE, measured on fresh data, is what actually matters — it eventually rises again once the model starts overfitting.", bizQuestion_mse: "Complete the training and test MSE schedule below.",
    bizTitle_misclassification_rate: "Misclassification Rate", bizExplain_misclassification_rate: "The misclassification (test error) rate is the fraction of test observations a classifier gets wrong — 1 minus the fraction correct, usually expressed as a percentage.", bizQuestion_misclassification_rate: "Complete the classifier accuracy schedule below.",
    bizTitle_supervised_learning: "Supervised Learning", bizExplain_supervised_learning: "Supervised learning is the process of learning a function f from labeled training data — pairs of predictors X and a known response Y — as in Y = f(X) + epsilon. Linear regression is one of the simplest supervised learning approaches.", bizQuestion_supervised_learning: "What term describes learning a function from labeled (X, Y) training pairs, like linear regression does?",
    bizTitle_cross_validation: "Cross-Validation", bizExplain_cross_validation: "Cross-validation is used as a practical proxy for estimating test MSE directly from the training data, when a large held-out test set isn't available.", bizQuestion_cross_validation: "What technique estimates test MSE from the training data alone, used when a separate test set isn't available?",
    bizTitle_simple_linear_regression: "Simple Linear Regression", bizExplain_simple_linear_regression: "Simple linear regression models a quantitative response Y using a single predictor X: Y = β0 + β1X + ε, where β0 is the intercept and β1 is the slope.", bizQuestion_simple_linear_regression: "What term describes modelling a quantitative response using a single predictor, Y = β0 + β1X + ε?",
    bizTitle_ordinary_least_squares: "Ordinary Least Squares", bizExplain_ordinary_least_squares: "Ordinary least squares (OLS) chooses the coefficient estimates that minimize the residual sum of squares (RSS) — the total squared gap between actual and predicted values. In code this is one line: sm.OLS(y, X).fit().", bizQuestion_ordinary_least_squares: "What method chooses regression coefficients by minimizing the residual sum of squares?",
    bizTitle_residual_standard_error: "Residual Standard Error", bizExplain_residual_standard_error: "The Residual Standard Error (RSE) is the average size of a residual, RSE = sqrt(RSS / (n − 2)). A smaller RSE means the model's predictions are closer to the actual values.", bizQuestion_residual_standard_error: "What term describes the average size of a residual, calculated as the square root of RSS divided by (n − 2)?",
    bizTitle_standard_error: "Standard Error", bizExplain_standard_error: "The standard error (SE) of an estimate tells us how much it would vary if we repeated the study with a new sample — a smaller SE means a more reliable estimate.", bizQuestion_standard_error: "What term describes how much an estimate would vary if the study were repeated with a new sample?",
    bizTitle_confidence_interval: "Confidence Interval", bizExplain_confidence_interval: "A 95% confidence interval is a range of values, such as β1 ± 2·SE(β1), such that with 95% probability the range contains the true unknown value of the parameter.", bizQuestion_confidence_interval: "What term describes a range of values expected to contain the true parameter with a stated probability, like 95%?",
    bizTitle_hypothesis_testing: "Hypothesis Testing", bizExplain_hypothesis_testing: "Testing H0: β1 = 0 against Ha: β1 ≠ 0 uses a t-statistic (the estimate divided by its standard error). A small p-value (typically below 0.05) means the observed association is unlikely under H0, so we reject H0 and conclude X is associated with Y.", bizQuestion_hypothesis_testing: "What term describes testing whether a coefficient equals zero using a t-statistic and p-value?",
    bizTitle_multiple_linear_regression: "Multiple Linear Regression", bizExplain_multiple_linear_regression: "Multiple linear regression extends simple linear regression to several predictors: Y = β0 + β1X1 + β2X2 + ... + βpXp + ε. Each coefficient βj is the average effect on Y of a one-unit increase in Xj, holding all other predictors fixed.", bizQuestion_multiple_linear_regression: "What term describes a linear regression model with more than one predictor?",
    bizTitle_dummy_variable: "Dummy Variable", bizExplain_dummy_variable: "A qualitative (categorical) predictor, like home-owner Yes/No, is encoded as a dummy variable taking the value 1 or 0. A categorical variable with K levels needs K − 1 dummy variables, with one level left as the baseline.", bizQuestion_dummy_variable: "What term describes a 0/1 variable used to encode a qualitative predictor like home-owner Yes/No?",
    bizTitle_collinearity: "Collinearity", bizExplain_collinearity: "Collinearity (or multicollinearity) occurs when two or more predictors are closely related. It inflates the standard errors of the coefficients, measured by the Variance Inflation Factor (VIF) — values much greater than 5-10 are problematic.", bizQuestion_collinearity: "What term describes two or more predictors being closely related, which inflates coefficient standard errors?",
    bizTitle_heteroscedasticity: "Heteroscedasticity", bizExplain_heteroscedasticity: "Heteroscedasticity means the spread of residuals grows as fitted values grow, visible as a fan shape in a residual plot — violating the assumption of constant error variance. A log or Box-Cox transformation of Y often helps.", bizQuestion_heteroscedasticity: "What term describes the spread of residuals growing with fitted values, visible as a fan shape in a residual plot?",
    bizTitle_f_test: "F-Test", bizExplain_f_test: "The F-test checks whether the predictors, as a group, explain more variation in Y than would be expected by chance — a large F statistic (with a small p-value) means at least one predictor is genuinely related to Y.", bizQuestion_f_test: "What test checks whether a group of predictors, together, explain more variation in Y than expected by chance?",
    bizTitle_r_squared: "R-Squared", bizExplain_r_squared: "R-squared is the fraction of variance in Y explained by the model: R² = (TSS − RSS) / TSS. Values close to 1 mean the model explains most of the variation; values close to 0 mean it explains very little.", bizQuestion_r_squared: "Complete the R-squared schedule below.",
    bizTitle_subset_selection: "Best Subset / Subset Selection", bizExplain_subset_selection: "The general strategy of choosing a smaller subset of the p predictors that are believed to be most related to the response, then fitting ordinary least squares using only that subset. Best subset selection considers every possible combination of predictors, while forward and backward stepwise selection search a much smaller set of models.", bizQuestion_subset_selection: "What is the general name for choosing a smaller subset of predictors and fitting OLS on just that subset, instead of using all p predictors?",
    bizTitle_forward_stepwise_selection: "Forward Stepwise Selection", bizExplain_forward_stepwise_selection: "Starts with a model containing no predictors, then repeatedly adds the one predictor that most improves the fit, one at a time. Produces a sequence of models M0, M1, M2, ... where each model has one more predictor than the last. Training RSS always decreases as predictors are added, so a separate method like cross-validation is needed to pick the best model in the sequence.", bizQuestion_forward_stepwise_selection: "Which subset selection method starts with no predictors and adds one predictor at a time, each step choosing the addition that most improves the fit?",
    bizTitle_variable_selection: "Variable Selection", bizExplain_variable_selection: "The broad process of deciding which of the p available predictors should be included in the final model. Subset selection and stepwise methods choose variables explicitly, including or excluding them, while the Lasso performs variable selection implicitly by shrinking unhelpful coefficients to exactly zero.", bizQuestion_variable_selection: "What is the general term for the process of deciding which predictors to include in a regression model?",
    bizTitle_regularization: "Regularization / Shrinkage", bizExplain_regularization: "Fits a model using all p predictors but adds a penalty that shrinks the coefficient estimates toward zero. Reduces variance at the cost of a small increase in bias, which can lower overall test error compared to ordinary least squares. Ridge regression and the Lasso are the two most common regularization methods.", bizQuestion_regularization: "What is the general term for fitting a model on all predictors while penalizing the size of the coefficients to shrink them toward zero?",
    bizTitle_ridge_regression: "Ridge Regression", bizExplain_ridge_regression: "A shrinkage method that fits a model on all p predictors while adding a penalty proportional to the sum of the squared coefficients, the L2 penalty. Larger coefficients are penalized more, shrinking them toward zero but never forcing them to exactly zero. Predictors must be standardized first, since ridge regression is not scale invariant.", bizQuestion_ridge_regression: "Which shrinkage method penalizes the sum of squared coefficients and shrinks them toward, but never exactly to, zero?",
    bizTitle_lasso_regression: "The Lasso", bizExplain_lasso_regression: "A shrinkage method that penalizes the sum of the absolute values of the coefficients, the L1 penalty, instead of their squares. Unlike ridge regression, the Lasso can force some coefficients to be exactly zero when the tuning parameter is large enough, which performs variable selection and produces sparser, more interpretable models.", bizQuestion_lasso_regression: "Which shrinkage method uses an L1 penalty and can shrink some coefficients to exactly zero, effectively performing variable selection?",
    bizTitle_l2_penalty: "L2 Penalty", bizExplain_l2_penalty: "The penalty term used by ridge regression, equal to the tuning parameter lambda times the sum of the squared coefficients. Because it squares each coefficient, it shrinks large coefficients more aggressively than small ones, but it never sets a coefficient to exactly zero.", bizQuestion_l2_penalty: "What penalty term, equal to lambda times the sum of squared coefficients, does ridge regression add to the residual sum of squares?",
    bizTitle_l1_penalty: "L1 Penalty", bizExplain_l1_penalty: "The penalty term used by the Lasso, equal to the tuning parameter lambda times the sum of the absolute values of the coefficients. Its geometry allows coefficient estimates to land exactly on zero, which is why the Lasso can perform variable selection while ridge regression cannot.", bizQuestion_l1_penalty: "What penalty term, equal to lambda times the sum of the absolute values of the coefficients, does the Lasso add to the residual sum of squares?",
    bizTitle_tuning_parameter: "Tuning Parameter (λ)", bizExplain_tuning_parameter: "The parameter lambda that controls the strength of shrinkage in ridge regression and the Lasso. When lambda equals zero, the penalty has no effect and the fit matches ordinary least squares. As lambda increases, coefficients shrink further toward zero and the model becomes less flexible. The best value of lambda is chosen using cross-validation.", bizQuestion_tuning_parameter: "What is the name of the parameter that controls how much shrinkage ridge regression or the Lasso applies, and is typically chosen by cross-validation?",
    bizTitle_standardization: "Standardizing Predictors", bizExplain_standardization: "Rescaling each predictor to have a standard deviation of one before fitting ridge regression or the Lasso. Unlike ordinary least squares, shrinkage penalties are not scale invariant, so predictors measured in different units would be penalized unfairly without this step.", bizQuestion_standardization: "What is the process of rescaling predictors to have standard deviation one, required before fitting ridge regression or the Lasso?",
    bizTitle_k_fold_cross_validation: "K-Fold Cross-Validation", bizExplain_k_fold_cross_validation: "Randomly divides the data into K equally sized folds. Each fold is held out once as a validation set while the model is trained on the remaining K minus one folds, producing K estimates of test error that are averaged together. Common choices are K equals 5 or K equals 10, which balance bias and variance better than the simple validation-set approach.", bizQuestion_k_fold_cross_validation: "Which cross-validation method randomly splits the data into K equally sized groups, then trains on K-1 of them and validates on the one held out, repeating K times?",
    bizTitle_information_criteria: "Information Criteria (Cp, AIC, BIC)", bizExplain_information_criteria: "A family of methods that adjust the training error by adding a penalty for the number of predictors in the model, allowing models of different sizes to be compared directly on the training data without a validation set. Mallow's Cp and AIC penalize each added predictor by roughly the same amount, while BIC applies a heavier penalty and tends to favor smaller models.", bizQuestion_information_criteria: "What family of methods adjusts training error with a penalty for the number of predictors, so models of different sizes can be compared without cross-validation?",
    bizTitle_adjusted_r_squared: "Adjusted R-Squared", bizExplain_adjusted_r_squared: "A variation of R-squared that adds a penalty for the number of predictors in the model, so it does not automatically increase every time a new predictor is added the way ordinary R-squared does. A higher adjusted R-squared indicates a better balance between model fit and model size, making it useful for comparing models with different numbers of predictors.", bizQuestion_adjusted_r_squared: "Which version of R-squared adds a penalty for the number of predictors so it does not always increase when a new predictor is added?",
    bizTitle_linear_regression_vs_equation: "Linear Regression vs. Linear Equation", bizExplain_linear_regression_vs_equation: "A linear equation such as y = mx + b is a deterministic rule that gives one exact y for every x, with no room for error. A linear regression model adds a random error term, Y = β0 + β1X + ε, to reflect that real data scatters around the line; its coefficients are estimated from data rather than known exactly, so its predictions carry uncertainty that a plain equation does not.", bizQuestion_linear_regression_vs_equation: "What does a linear regression model add to a plain linear equation (y = mx + b) to account for real data not falling exactly on the line?",
    bizTitle_logistic_regression: "Logistic Regression", bizExplain_logistic_regression: "Models the probability that a binary outcome equals 1 using the logistic (sigmoid) function applied to a linear combination of predictors, so the predicted probability always stays between 0 and 1 — unlike plain linear regression, which can predict below 0 or above 1.", bizQuestion_logistic_regression: "What method models a binary outcome's probability using the sigmoid function, keeping predictions between 0 and 1?",
    bizTitle_sigmoid_function: "Sigmoid (Logistic) Function", bizExplain_sigmoid_function: "The S-shaped curve p(X) = e^(β0+β1X) / (1 + e^(β0+β1X)) that squashes any real-valued linear predictor into a probability strictly between 0 and 1, no matter what values the coefficients or X take.", bizQuestion_sigmoid_function: "What S-shaped function converts a linear predictor into a probability between 0 and 1 in logistic regression?",
    bizTitle_log_odds: "Log-Odds (Logit)", bizExplain_log_odds: "The natural log of the odds, log(p/(1-p)). Under logistic regression this quantity is linear in the predictors, which is what lets the model's coefficients be estimated and interpreted much like an ordinary linear regression.", bizQuestion_log_odds: "What is the natural log of p/(1-p) called — the quantity that is linear in the predictors under logistic regression?",
    bizTitle_odds_ratio: "Odds Ratio (e^β)", bizExplain_odds_ratio: "e raised to a logistic-regression coefficient; tells you the multiplicative change in the odds of the positive class for a one-unit increase in that predictor, holding the others fixed.", bizQuestion_odds_ratio: "What do you call e^β1 in logistic regression — the multiplicative change in odds for a one-unit increase in X?",
    bizTitle_maximum_likelihood_estimation: "Maximum Likelihood Estimation", bizExplain_maximum_likelihood_estimation: "The method used to fit logistic regression: search over the coefficients for the values that make the actually-observed 0s and 1s as probable as possible under the model, by multiplying each observation's predicted probability (or 1 minus it) together and maximising that product.", bizQuestion_maximum_likelihood_estimation: "What estimation method picks the coefficients that make the observed data as probable as possible, used to fit logistic regression?",
    bizTitle_classification_threshold: "Classification Threshold", bizExplain_classification_threshold: "The cutoff probability (0.5 by default) used to convert a predicted probability into a class prediction. Lowering it trades precision for recall; raising it trades recall for precision — no single threshold is universally correct.", bizQuestion_classification_threshold: "What is the name for the cutoff probability (default 0.5) used to turn a predicted probability into a predicted class?",
    bizTitle_confusion_matrix: "Confusion Matrix", bizExplain_confusion_matrix: "A 2×2 table crossing predicted class against actual class — true positives, true negatives, false positives and false negatives — that every other classification metric (precision, recall, F1, etc.) is calculated from.", bizQuestion_confusion_matrix: "What 2×2 table of TP, TN, FP and FN is used to evaluate a binary classifier?",
    bizTitle_precision: "Precision", bizExplain_precision: "Of everything the model predicted as positive, the fraction that was actually positive: TP / (TP + FP). Matters most when false alarms are costly, like spam filtering, where you don't want to delete legitimate email.", bizQuestion_precision: "What metric measures, of everything predicted positive, how many are truly positive (TP / (TP+FP))?",
    bizTitle_recall_sensitivity: "Recall (Sensitivity)", bizExplain_recall_sensitivity: "Of everything actually positive, the fraction the model correctly found: TP / (TP + FN). Matters most when missing a true case is costly, like medical screening, where you'd rather have a false alarm than miss a real case.", bizQuestion_recall_sensitivity: "What metric measures, of everything actually positive, how many the model correctly found (TP / (TP+FN))?",
    bizTitle_specificity: "Specificity", bizExplain_specificity: "Of everything actually negative, the fraction the model correctly rejected: TN / (TN + FP). Equal to 1 minus the false positive rate (Type I error).", bizQuestion_specificity: "What metric measures, of everything actually negative, how many the model correctly rejected (TN / (TN+FP))?",
    bizTitle_f1_score: "F1 Score", bizExplain_f1_score: "The harmonic mean of precision and recall, 2·(Precision·Recall)/(Precision+Recall); a single number that balances both when neither alone tells the full story about a classifier.", bizQuestion_f1_score: "What single metric is the harmonic mean of precision and recall?",
    bizTitle_roc_curve: "ROC Curve", bizExplain_roc_curve: "A plot of the true positive rate against the false positive rate as the classification threshold is swept from 0 to 1. A perfect classifier hugs the top-left corner; a random classifier traces the diagonal.", bizQuestion_roc_curve: "What curve plots true positive rate against false positive rate as the classification threshold varies?",
    bizTitle_auc: "AUC (Area Under the Curve)", bizExplain_auc: "Summarises the ROC curve in a single number between 0 and 1: 0.5 means no better than chance, 1.0 means a perfect classifier. It equals the probability the model ranks a randomly chosen positive instance higher than a randomly chosen negative one.", bizQuestion_auc: "What single number, between 0.5 (chance) and 1.0 (perfect), summarises the ROC curve?",
    bizTitle_naive_bayes: "Naive Bayes", bizExplain_naive_bayes: "A classifier that assumes every feature is independent given the class label, then combines each feature's 'typical-ness' for a class via Bayes' theorem. The independence assumption is usually wrong, but the classifier still works well in practice, especially when there are many features.", bizQuestion_naive_bayes: "What classifier assumes features are conditionally independent given the class, then combines them with Bayes' theorem?",
    bizTitle_k_nearest_neighbours: "K-Nearest Neighbours (KNN)", bizExplain_k_nearest_neighbours: "A non-parametric classifier that finds the K training points closest to a query point and predicts the majority class among them. Small K gives a flexible, jagged decision boundary (high variance); large K gives a smooth, rigid one (high bias).", bizQuestion_k_nearest_neighbours: "What non-parametric classifier predicts the majority class among the K closest training points to a query?",
    bizTitle_bayes_classifier: "Bayes Classifier", bizExplain_bayes_classifier: "The theoretical gold-standard classifier: it assigns every point to whichever class has the highest true conditional probability, achieving the lowest possible test error. It's unattainable in practice because the true conditional distribution of Y given X is never actually known.", bizQuestion_bayes_classifier: "What unattainable, theoretical 'gold standard' classifier achieves the lowest possible test error by using the true (unknown) class probabilities?",
    bizTitle_softmax_regression: "Softmax (Multinomial) Regression", bizExplain_softmax_regression: "The generalisation of logistic regression to more than two classes: each class gets its own linear score, and the softmax function converts all the scores into probabilities that sum to 1. It's also the standard output layer for multi-class neural networks.", bizQuestion_softmax_regression: "What generalises logistic regression to K > 2 classes by converting per-class linear scores into probabilities that sum to 1?",
    bizTitle_decision_tree: "Decision Tree", bizExplain_decision_tree: "A model that predicts a response by partitioning the feature space into rectangular regions via a sequence of yes/no questions, then predicting a constant (the mean, or the majority class) within each region. Easy to interpret but often less accurate on its own than other methods.", bizQuestion_decision_tree: "What model partitions the feature space into regions via a sequence of yes/no questions, predicting a constant in each region?",
    bizTitle_recursive_binary_splitting: "Recursive Binary Splitting", bizExplain_recursive_binary_splitting: "The greedy, top-down algorithm used to grow a decision tree: at each step, try every predictor and cutpoint, and pick whichever single split reduces the error the most right now — without looking ahead to what might work best overall.", bizQuestion_recursive_binary_splitting: "What greedy, top-down algorithm builds a tree one split at a time, always picking whichever split is best right now?",
    bizTitle_terminal_node: "Terminal Node (Leaf)", bizExplain_terminal_node: "An end region of a decision tree that is not split any further. Every training (and test) observation that falls into it receives the same prediction.", bizQuestion_terminal_node: "What is the end region of a decision tree called, where every observation gets the same prediction?",
    bizTitle_tree_pruning: "Tree Pruning", bizExplain_tree_pruning: "Cutting a fully-grown, overfit decision tree back to a smaller, simpler subtree to improve its performance on new data, since a maximal tree fits the training data (including its noise) too closely.", bizQuestion_tree_pruning: "What process cuts a fully-grown, overfit tree back to a smaller subtree?",
    bizTitle_cost_complexity_pruning: "Cost-Complexity Pruning", bizExplain_cost_complexity_pruning: "Also called weakest-link pruning. Scores each candidate subtree by how well it fits the data plus a penalty α times its number of leaves, so bigger trees 'cost' more. α = 0 keeps the full tree; the best α is chosen by cross-validation.", bizQuestion_cost_complexity_pruning: "What pruning method scores subtrees by fit-to-data plus a size penalty α, with the best α chosen by cross-validation?",
    bizTitle_gini_index: "Gini Index", bizExplain_gini_index: "An impurity measure for classification-tree splits: near 0 when a node is almost entirely one class (pure), and largest when the classes are evenly mixed. The default splitting criterion in most tree implementations.", bizQuestion_gini_index: "What impurity measure, near 0 for a pure node and largest for an evenly mixed node, is the default split criterion for classification trees?",
    bizTitle_entropy_cross_entropy: "Entropy (Cross-Entropy)", bizExplain_entropy_cross_entropy: "An alternative impurity measure to the Gini index: also near 0 for a pure node, largest when classes are evenly split. Mathematically equivalent to the cross-entropy loss used in neural networks; produces trees very similar to Gini in practice.", bizQuestion_entropy_cross_entropy: "What impurity measure, mathematically equivalent to the cross-entropy loss in neural networks, is an alternative to the Gini index?",
    bizTitle_classification_error_rate: "Classification Error Rate", bizExplain_classification_error_rate: "The simplest way to judge a tree split — how often the tree's prediction would be wrong in a region — but too crude in practice, since it doesn't reward splits that make a region purer unless they change the majority class.", bizQuestion_classification_error_rate: "What overly-crude split criterion just measures how often the tree's prediction would be wrong in a region?",
    bizTitle_bagging: "Bagging (Bootstrap Aggregation)", bizExplain_bagging: "Reduces variance by drawing many bootstrap samples from the training data, fitting a fully-grown tree to each, and averaging their predictions (or taking a majority vote for classification). Works because individual trees are high-variance but low-bias, and averaging cancels out the variance.", bizQuestion_bagging: "What technique reduces variance by fitting a tree to each of many bootstrap samples and averaging the predictions?",
    bizTitle_bootstrap_sample: "Bootstrap Sample", bizExplain_bootstrap_sample: "A resampled training set created by sampling the original data with replacement — the foundation both bagging and random forests are built on.", bizQuestion_bootstrap_sample: "What do you call a resampled training set created by sampling the original data with replacement?",
    bizTitle_random_forest: "Random Forest", bizExplain_random_forest: "Improves on bagging by decorrelating the trees: at every split, only a random subset of m predictors (typically √p for classification) is even considered, so no single strong predictor can dominate every tree. If m = p, a random forest is exactly bagging.", bizQuestion_random_forest: "What ensemble method improves on bagging by only considering a random subset of m predictors at each split?",
    bizTitle_ml_variable_importance: "Variable Importance", bizExplain_ml_variable_importance: "For a bagged or random-forest ensemble, the total amount a predictor decreases error (RSS or Gini index) when it's split on, averaged across all the trees. A large value means the predictor matters — but only relative to the others, not as an absolute effect size.", bizQuestion_ml_variable_importance: "What ensemble-tree measure records how much a predictor decreases RSS or Gini index on average across all trees?",
    bizTitle_boosting: "Boosting", bizExplain_boosting: "Builds trees sequentially rather than independently: each new tree focuses on correcting the mistakes of the ensemble built so far. Learns slowly but often achieves very high accuracy; XGBoost and LightGBM are popular fast, regularised implementations.", bizQuestion_boosting: "What ensemble method builds trees sequentially, each one correcting the previous ensemble's mistakes?",
    bizTitle_ensemble_method: "Ensemble Method", bizExplain_ensemble_method: "A general term for combining many individual models — like many decision trees — into one predictor that's more accurate than any single model alone. Bagging, random forests and boosting are the three main tree-based ensemble methods.", bizQuestion_ensemble_method: "What general term describes combining many models together to get better predictions than any single model alone?",
    bizTitle_interpretability_accuracy_tradeoff: "Interpretability vs Accuracy", bizExplain_interpretability_accuracy_tradeoff: "A single decision tree is fully interpretable but comparatively weak; ensemble methods sacrifice that interpretability for substantial gains in accuracy. Variable importance scores partially restore interpretability, but for high-stakes decisions needing a clear reason for each prediction, a single pruned tree can still be preferable.", bizQuestion_interpretability_accuracy_tradeoff: "What trade-off describes how ensembles like random forests gain accuracy but lose the easy interpretability of a single tree?",
    bizTitle_capm: "CAPM", bizExplain_capm: "The Capital Asset Pricing Model estimates an asset's expected return as the risk-free rate plus a risk premium: E(Ri) = rf + βi[E(Rm) − rf]. It tells an investor whether an asset's expected return compensates them fairly for the market risk they are taking on.", bizQuestion_capm: "What model estimates an asset's expected return as the risk-free rate plus beta times the market risk premium?",
    bizTitle_cost_of_equity: "Cost of Equity", bizExplain_cost_of_equity: "The required return that equity investors expect from investing in a firm's shares, and the return the firm must earn on equity-financed projects to satisfy them. It is typically estimated using CAPM: Re = rf + βe[E(Rm) − rf].", bizQuestion_cost_of_equity: "What is the required return that shareholders expect to earn, usually estimated with CAPM?",
    bizTitle_cost_of_debt: "Cost of Debt", bizExplain_cost_of_debt: "The expected return required by a firm's creditors, such as lenders and bondholders. If a bond has little to no default risk, its yield to maturity is a reasonable estimate of the cost of debt, but significant default risk requires adjusting that yield downward.", bizQuestion_cost_of_debt: "What is the expected return required by a firm's lenders and bondholders, usually estimated from bond yields?",
    bizTitle_yield_to_maturity: "Yield to Maturity", bizExplain_yield_to_maturity: "The promised return on a bond if it is held to maturity and makes all scheduled interest and principal payments, calculated as the bond's internal rate of return. When default risk is significant, the yield to maturity overstates the bond's true expected return.", bizQuestion_yield_to_maturity: "What is the name for a bond's promised return assuming it makes every scheduled payment, which overstates expected return when default risk is significant?",
    bizTitle_debt_default_adjustment: "Adjusting YTM for Default", bizExplain_debt_default_adjustment: "When a bond carries meaningful default risk, its cost of debt is estimated by subtracting the expected loss from default off the yield to maturity: Rd = YTM − pL, where p is the probability of default and L is the expected loss rate. This adjustment can also be made by estimating the bond's debt beta and applying CAPM.", bizQuestion_debt_default_adjustment: "What formula adjusts a risky bond's yield to maturity downward for the probability and expected loss rate of default?",
    bizTitle_debt_beta: "Debt Beta", bizExplain_debt_beta: "A measure of how sensitive a bond's returns are to the overall market, used with CAPM to estimate the cost of debt when a reliable yield to maturity is unavailable. Because bond markets trade much less frequently than share markets, debt betas are usually taken from published estimates by credit rating rather than estimated directly.", bizQuestion_debt_beta: "What measure of a bond's market sensitivity, usually published by credit rating rather than estimated directly, can be used with CAPM to estimate the cost of debt?",
    bizTitle_market_vs_firm_specific_risk: "Market vs. Firm-Specific Risk", bizExplain_market_vs_firm_specific_risk: "Total risk in an asset's return can be split into market (systematic) risk, which is driven by broad economic movements and captured by beta, and firm-specific (idiosyncratic) risk, which is unique to the company. Only market risk is priced by investors and therefore determines the cost of equity, since firm-specific risk can be diversified away.", bizQuestion_market_vs_firm_specific_risk: "Which type of risk, market or firm-specific, is priced by investors and used to determine the cost of equity?",
    bizTitle_wacc: "WACC", bizExplain_wacc: "The Weighted Average Cost of Capital blends a firm's cost of equity and after-tax cost of debt, weighted by their share of the firm's total market value: WACC = (E/(D+E))Re + (D/(D+E))Rd(1 − tc). It represents the overall return a firm must earn on its investments to satisfy both debt and equity investors.", bizQuestion_wacc: "What single rate blends a firm's cost of equity and after-tax cost of debt, weighted by their share of total firm value?",
    bizTitle_pretax_wacc: "Pretax-WACC", bizExplain_pretax_wacc: "Also called the asset cost of capital or unlevered cost of capital, this is the weighted average of a levered comparable firm's cost of equity and cost of debt without adjusting for the tax shield on interest: RA = RU = (E/(D+E))Re + (D/(D+E))Rd. It estimates the cost of capital for a project financed entirely by equity.", bizQuestion_pretax_wacc: "What rate, also called the asset cost of capital, estimates a project's cost of capital when it is financed entirely by equity?",
    bizTitle_comparable_firm_method: "Comparable Firm Method", bizExplain_comparable_firm_method: "Since most projects are not themselves publicly traded, their cost of capital is often estimated using a comparable firm operating in the same line of business. If the comparable firm is unlevered, its cost of equity is used directly; if it is levered, its debt and equity are combined into a pretax-WACC or WACC estimate.", bizQuestion_comparable_firm_method: "What approach estimates a project's cost of capital using a publicly traded firm in the same line of business?",
    bizTitle_capital_budgeting: "Capital Budgeting", bizExplain_capital_budgeting: "The process of analyzing investment projects and deciding which to accept, typically involving forecasting free cash flows, estimating the cost of capital, analyzing uncertainty, applying a decision rule such as NPV, and performing a post-audit after the project starts.", bizQuestion_capital_budgeting: "What is the process of analyzing investment projects and deciding which ones a firm should accept called?",
    bizTitle_incremental_cash_flow: "Incremental Cash Flow", bizExplain_incremental_cash_flow: "A cash flow is incremental only if it is a direct consequence of accepting the project, meaning it would not occur if the project were rejected. Only incremental, after-tax cash flows belong in a project's free cash flow forecast.", bizQuestion_incremental_cash_flow: "What term describes a cash flow that occurs only because a project is accepted, and would not occur otherwise?",
    bizTitle_free_cash_flow: "Free Cash Flow (FCF)", bizExplain_free_cash_flow: "A project's free cash flow starts from unlevered net income, adds back depreciation and amortization, subtracts capital expenditures, and subtracts the change in net working capital: FCF = NI + D − CapEx − ΔNWC. It excludes financing costs like interest, since the project is evaluated independently of how it is financed.", bizQuestion_free_cash_flow: "What is the formula for a project's after-tax free cash flow, starting from unlevered net income?",
    bizTitle_project_opportunity_cost: "Opportunity Cost", bizExplain_project_opportunity_cost: "The value of the best alternative use of a resource the project consumes, such as a warehouse that could otherwise be rented out. Opportunity costs are real costs of the project and must be included in its free cash flows even though no cash changes hands directly.", bizQuestion_project_opportunity_cost: "What is the value of the best alternative use of a resource a project consumes, which must be included in its cash flows?",
    bizTitle_sunk_cost: "Sunk Cost", bizExplain_sunk_cost: "A cost that has already been paid or will be paid regardless of whether the project is accepted or rejected, such as a market survey completed last year. Sunk costs are not incremental and must be excluded from a project's cash flow forecast: let bygones be bygones.", bizQuestion_sunk_cost: "What term describes a cost already incurred, or that will be incurred either way, which should be excluded from a project's cash flows?",
    bizTitle_project_side_effects: "Project Side Effects", bizExplain_project_side_effects: "Also called project externalities, these are the effects a project has on a firm's other cash flows. A negative side effect, such as a new product cannibalizing sales of an existing one, is a cost; a positive side effect, such as a synergy that boosts sales elsewhere, is a benefit, and both must be included.", bizQuestion_project_side_effects: "What term describes the effect a new project has on a firm's other cash flows, whether it is negative (cannibalization) or positive (synergy)?",
    bizTitle_net_salvage_value: "Net Salvage Value", bizExplain_net_salvage_value: "The after-tax cash flow from selling an asset at the end of a project, equal to the sale price minus tax on any capital gain or loss: Sale Price − [tax rate × (Sale Price − Net Book Value)]. Net book value equals the asset's purchase price minus accumulated depreciation.", bizQuestion_net_salvage_value: "What is the after-tax cash flow from selling a project's equipment at the end of its life called?",
    bizTitle_sensitivity_analysis: "Sensitivity Analysis", bizExplain_sensitivity_analysis: "A method of project risk analysis that changes the value of one and only one input variable at a time, such as sales volume or unit cost, to see how it affects the project's NPV. It isolates the impact of each individual assumption on the investment decision.", bizQuestion_sensitivity_analysis: "What risk-analysis method changes one input variable at a time to see its effect on NPV?",
    bizTitle_scenario_analysis: "Scenario Analysis", bizExplain_scenario_analysis: "A method of project risk analysis that changes the values of several input variables simultaneously, modeling a coherent scenario such as a recession or a competitor's aggressive pricing, to see how it affects the project's NPV.", bizQuestion_scenario_analysis: "What risk-analysis method changes several input variables together, as part of one coherent scenario, to see the effect on NPV?",
    bizTitle_break_even_analysis: "Break-Even Analysis", bizExplain_break_even_analysis: "A method of project risk analysis that finds the value of an input variable, such as the level of sales, that makes a project's NPV exactly equal to zero. It identifies how far a key assumption could fall before the project stops being worthwhile.", bizQuestion_break_even_analysis: "What risk-analysis method finds the level of an input variable that makes a project's NPV equal to zero?",
    bizTitle_real_option: "Real Option", bizExplain_real_option: "The right, but not the obligation, for managers to take some future action that alters a project's cash flows, such as expanding, abandoning, or delaying it. Real option value is not captured by a standard NPV analysis and must be added separately: NPV with option = NPV without option + value of the option.", bizQuestion_real_option: "What is the right, but not the obligation, to take a future action that alters a project's cash flows called?",
    bizTitle_growth_option: "Growth (Expansion) Option", bizExplain_growth_option: "A real option that lets a firm invest further in a project if it creates the opportunity to make other profitable investments that would not otherwise be available. It has value when conditions such as demand turn out better than expected, since the firm can choose to expand rather than being forced to.", bizQuestion_growth_option: "Which real option lets a firm invest further in a project when it creates access to other profitable follow-on investments?",
    bizTitle_abandonment_option: "Abandonment Option", bizExplain_abandonment_option: "A real option that lets a firm stop a project before the end of its physical life, for example by selling the equipment, if its cash flows turn out worse than expected. It raises a project's expected profitability and lowers its risk by capping the downside.", bizQuestion_abandonment_option: "Which real option lets a firm stop a project early, capping its losses, if results turn out worse than expected?",
    bizTitle_timing_option: "Timing (Delay) Option", bizExplain_timing_option: "A real option, also called the option to delay, that lets a firm wait to start a project until more information about demand or costs is available, at the cost of giving up any cash flows during the wait. It has value when there is significant uncertainty that will be resolved over time.", bizQuestion_timing_option: "Which real option lets a firm wait for more information before committing to a project, at the cost of foregone cash flows during the delay?",
    bizTitle_capital_structure: "Capital Structure", bizExplain_capital_structure: "The mix of debt, equity, and other securities a firm uses to raise capital from investors. A central question in corporate finance is whether some mix of debt and equity maximizes firm value, that is, whether there is an optimal debt-to-equity ratio.", bizQuestion_capital_structure: "What term describes the mix of debt and equity securities a firm uses to raise capital?",
    bizTitle_leverage: "Leverage", bizExplain_leverage: "The extent to which a firm relies on debt financing; the more debt it carries, the more levered it is. Leverage is commonly measured with a debt ratio such as the debt-to-equity ratio (D/E) or the debt-to-capital ratio (D/(D+E)).", bizQuestion_leverage: "What term describes the extent to which a firm relies on debt financing, often measured by the debt-to-equity ratio?",
    bizTitle_unlevered_equity: "Unlevered Equity", bizExplain_unlevered_equity: "Equity in a firm with no debt (D = 0, E > 0). Because there are no debt holders to pay first, unlevered equity holders receive the full cash flows generated by the firm's assets.", bizQuestion_unlevered_equity: "What is equity in a firm with zero debt called?",
    bizTitle_levered_equity: "Levered Equity", bizExplain_levered_equity: "Equity in a firm that has both debt and equity outstanding (D > 0, E > 0). Levered equity holders are paid only after debt holders receive their promised payments, which makes levered equity riskier than unlevered equity in the same firm.", bizQuestion_levered_equity: "What is equity in a firm that also has debt outstanding called?",
    bizTitle_mm_proposition_1: "MM Proposition I", bizExplain_mm_proposition_1: "MM Proposition I states that in a perfect capital market, the value of a firm does not depend on its capital structure: V = A = U = D + E. Firm value is determined solely by the cash flows its assets generate, not by how those assets are financed, because the Law of One Price implies the market value of the assets must equal the combined market value of the debt and equity claims on them.", bizQuestion_mm_proposition_1: "Which MM proposition states that, in a perfect capital market, a firm's value does not depend on its capital structure?",
    bizTitle_law_of_one_price: "Law of One Price", bizExplain_law_of_one_price: "In competitive markets, securities or portfolios of securities with identical cash flows must have the same price. This principle underlies MM Proposition I: since a firm's total cash flows do not change with its capital structure, the combined market value of its debt and equity cannot change either.", bizQuestion_law_of_one_price: "What principle states that securities or portfolios with the same cash flows must trade at the same price?",
    bizTitle_homemade_leverage: "Homemade Leverage", bizExplain_homemade_leverage: "Investors borrowing or lending on their own account to create a personally preferred level of leverage, when a firm's chosen capital structure does not match what they want. Because investors can borrow and lend at the same rate as the firm in a perfect market, homemade leverage is a perfect substitute for the firm's own leverage, so the firm's capital structure choice cannot affect its value.", bizQuestion_homemade_leverage: "What term describes investors borrowing or lending on their own to replicate a preferred level of leverage?",
    bizTitle_mm_proposition_2: "MM Proposition II", bizExplain_mm_proposition_2: "MM Proposition II states that a levered firm's cost of equity equals the unlevered cost of equity plus a risk premium proportional to its degree of leverage: Re = Ru + (D/E)(Ru − Rd). Leverage increases the risk borne by equity holders, since debt holders are paid first, so equity holders demand a higher return as leverage rises.", bizQuestion_mm_proposition_2: "Which MM proposition states that a levered firm's cost of equity rises with its degree of leverage: Re = Ru + (D/E)(Ru − Rd)?",
    bizTitle_equity_beta_leverage: "Equity Beta and Leverage", bizExplain_equity_beta_leverage: "Leverage affects the risk of a firm's equity in the same way it affects its cost of equity: βe = βU + (D/E)(βU − βd). As a firm takes on more debt, its equity beta rises, reflecting the additional risk that equity holders bear from being paid after debt holders.", bizQuestion_equity_beta_leverage: "What formula shows how a levered firm's equity beta rises with its degree of leverage?",
    bizTitle_wacc_leverage_irrelevance: "WACC Is Unaffected by Leverage", bizExplain_wacc_leverage_irrelevance: "In a perfect capital market, leverage does not affect a firm's overall cost of capital: RA = RU = RWACC. Although debt is cheaper than equity, taking on more of it makes the remaining equity riskier and more expensive, and these two effects exactly offset each other.", bizQuestion_wacc_leverage_irrelevance: "In a perfect capital market, what happens to a firm's overall WACC as it takes on more leverage?",

    bizTitle_compound_interest: "Compound Interest",
    bizExplain_compound_interest: "Compound interest is interest calculated on both the amount you originally invested or borrowed (the principal) and all the interest that has already accumulated. Because each period's interest gets added back to the principal, growth accelerates over time — this is why starting to invest early matters so much.",
    bizQuestion_compound_interest: "What term describes interest earned on both the principal and previously earned interest?",

    bizTitle_diversification: "Diversification",
    bizExplain_diversification: "Diversification means spreading your money across different investments — stocks, bonds, industries, countries — instead of putting it all in one place. If one investment performs badly, others may offset the loss, reducing overall risk without necessarily reducing expected return.",
    bizQuestion_diversification: "What term describes spreading investments across different assets to reduce risk?",

    bizTitle_cash_flow: "Cash Flow",
    bizExplain_cash_flow: "Cash flow is the net amount of money moving into and out of a business over a period of time. Positive cash flow means more money is coming in than going out; negative cash flow means the opposite — even a profitable company can fail if it runs out of cash.",
    bizQuestion_cash_flow: "What term describes the net amount of money moving in and out of a business?",

    bizTitle_liquidity: "Liquidity",
    bizExplain_liquidity: "Liquidity describes how quickly and easily an asset can be converted into cash without losing value. Cash itself is perfectly liquid; real estate is illiquid because selling it takes time and effort. Businesses need enough liquid assets to cover short-term obligations.",
    bizQuestion_liquidity: "What term describes how easily an asset can be converted into cash?",

    bizTitle_roi: "Return on Investment",
    bizExplain_roi: "Return on Investment (ROI) measures how much profit an investment generates relative to its cost. It's calculated as (Gain − Cost) ÷ Cost, expressed as a percentage. A higher ROI means the investment was more efficient at generating profit.",
    bizQuestion_roi: "What metric measures the profit an investment generates relative to its cost?",

    bizTitle_ipo: "IPO",
    bizExplain_ipo: "An IPO, or Initial Public Offering, is the first time a private company sells shares of stock to the public on a stock exchange. It lets the company raise money from public investors, but also means it must start disclosing financial information regularly.",
    bizQuestion_ipo: "What is it called when a private company first sells shares to the public?",

    bizTitle_supply_demand: "Supply and Demand",
    bizExplain_supply_demand: "Supply and demand describes how price is determined in a market. As price rises, suppliers want to sell more (supply increases) but buyers want less (demand decreases). The price where the supply and demand curves meet is called equilibrium — where the market naturally settles.",
    bizQuestion_supply_demand: "What term describes the price point where supply and demand curves intersect?",

    bizTitle_opportunity_cost: "Opportunity Cost",
    bizExplain_opportunity_cost: "Opportunity cost is the value of the next-best alternative you give up when you make a choice. If you spend an hour studying instead of working a job that pays $20/hour, your opportunity cost of studying is $20 — even though no money actually changed hands.",
    bizQuestion_opportunity_cost: "What term describes the value of the next-best option you give up when making a choice?",

    bizTitle_inflation: "Inflation",
    bizExplain_inflation: "Inflation is the rate at which the general price level of goods and services rises over time, reducing the purchasing power of money. Moderate inflation is normal in a healthy economy, but high inflation erodes savings and makes planning difficult.",
    bizQuestion_inflation: "What term describes a general rise in prices over time that reduces money's purchasing power?",

    bizTitle_gdp: "GDP",
    bizExplain_gdp: "GDP, or Gross Domestic Product, is the total monetary value of all finished goods and services produced within a country in a given period. It's the most common measure of the size and health of a country's economy.",
    bizQuestion_gdp: "What is the total value of all goods and services produced in a country called?",

    bizTitle_elasticity: "Elasticity",
    bizExplain_elasticity: "Elasticity measures how much the quantity demanded (or supplied) of a good changes when its price changes. A good is 'elastic' if demand changes a lot with price, like luxury items; it's 'inelastic' if demand barely changes, like essential medicine.",
    bizQuestion_elasticity: "What term describes how much quantity demanded changes in response to a price change?",

    bizTitle_monopoly: "Monopoly",
    bizExplain_monopoly: "A monopoly exists when a single company is the only seller of a good or service in a market, giving it significant control over price since there's no competition. Governments often regulate monopolies to protect consumers.",
    bizQuestion_monopoly: "What term describes a market with only one seller controlling supply?",

    bizTitle_apple: "Apple",
    bizExplain_apple: "Apple Inc. was founded in 1976 by Steve Jobs, Steve Wozniak, and Ronald Wayne in Cupertino, California. It's best known for the iPhone, Mac computers, and iPad, and became the first U.S. company to reach a $3 trillion market valuation.",
    bizQuestion_apple: "Which company makes the iPhone and is headquartered in Cupertino, California?",

    bizTitle_google: "Google",
    bizExplain_google: "Google was founded in 1998 by Larry Page and Sergey Brin as a search engine. Its parent company, Alphabet, now also owns YouTube and Android — Google's primary revenue source is online advertising.",
    bizQuestion_google: "Which company's parent is Alphabet and makes most of its money from online advertising?",

    bizTitle_amazon: "Amazon",
    bizExplain_amazon: "Amazon started in 1994 as an online bookstore founded by Jeff Bezos. It has grown into the world's largest e-commerce retailer and also runs Amazon Web Services (AWS), the leading cloud computing platform, which generates most of its profit.",
    bizQuestion_amazon: "Which company started as an online bookstore and now runs the leading cloud platform, AWS?",

    bizTitle_microsoft: "Microsoft",
    bizExplain_microsoft: "Microsoft was founded in 1975 by Bill Gates and Paul Allen. It's best known for the Windows operating system and Office software, and is now a major player in cloud computing through Azure, having invested heavily in OpenAI.",
    bizQuestion_microsoft: "Which company makes Windows and Office, and invested heavily in OpenAI?",

    bizTitle_tesla: "Tesla",
    bizExplain_tesla: "Tesla was founded in 2003 and is led by Elon Musk. It's best known for electric vehicles, but also builds energy storage products like the Powerwall and solar panels, aiming to accelerate the world's shift to sustainable energy.",
    bizQuestion_tesla: "Which electric vehicle company also makes the Powerwall energy storage product?",

    bizTitle_nvidia: "Nvidia",

    bizQuestion_nvidia: "Which company's GPU chips became central to the AI boom of the 2020s?",

    calcLearn_limits: "极限回答的问题是：当x越来越接近某个点c时，f(x)会趋近于什么值？对于连续函数（比如多项式），可以直接代入：lim(x→c) f(x) = f(c)。\n\n有时候直接代入会得到0/0——这叫做“不定型”。遇到这种情况，先把分子和分母因式分解，约去公因式，再代入。\n\n例题：lim(x→2) (x² - 4)/(x - 2)。\n代入x=2得到0/0，所以先因式分解：(x-2)(x+2)/(x-2) = x+2（当x≠2时）。\n再代入：2 + 2 = 4。",

    calcLearn_quotient_rule: "对于商 f(x) = u(x)/v(x)，商法则是：(u/v)' = (u'v - uv') / v²。\n\n例题：若 u(x) = x，v(x) = x + 1，求(u/v)'(x)。\nu' = 1，v' = 1。\n(u/v)' = [1·(x+1) - x·1] / (x+1)² = 1 / (x+1)²。",

    seqLearn_geometric_series_infinite: "|r| < 1 ཡིན་ན, མཐའ་མེད་འཕར་འགྲིག་སྡོམ་རྩིས་ཚད་ཡོད་པའི་བསྡོམས་ཤིག་ལ་འདུས་འགྲོ: S = a₁/(1-r)།\n\nདཔེར་བརྗོད། ཐོག་མའི་ཚན་པ4, ཆ་མཉམ་ཚད1/2ཡིན་པའི་མཐའ་མེད་འཕར་འགྲིག་སྡོམ་རྩིས་ཀྱི་བསྡོམས་འཚོལ་ཤིག།\nS = 4/(1-1/2) = 4/(1/2) = 8།",

    seqTopicTitle_sigma_linear: "Σ (སིག་མ) རྟགས།", seqTopicDesc_sigma_linear: "Σ རྟགས་ཀྱིས་བརྗོད་པའི་བསྡོམས་རྩིས།",
    seqLearn_sigma_linear: "Σ (སིག་མ) རྟགས་ཀྱིས་བསྡོམས་བསྡུས་སུ་འབྲི: Σ i=1 ནས n བར f(i) ཞེས་པའི་དོན་ནི f(1), f(2), ..., f(n) བསྡོམས་པ་ཡིན། མིང་ཚིག་རིམ་འགྲིག་ཅན་ལ, འདི་རིམ་འགྲིག་སྡོམ་རྩིས་དང་མཚུངས།\n\nདཔེར་བརྗོད། Σ i=1 ནས4བར (2i+1) རྩིས་ཤིག།\nཚན་པ: 3, 5, 7, 9། བསྡོམས = 24།",

    seqTopicTitle_sum_first_n: "ཐོག་མའི་གྲངས n ཡི་བསྡོམས།", seqTopicDesc_sum_first_n: "1 + 2 + 3 + ... + n འཚོལ།",
    seqLearn_sum_first_n: "ཐོག་མའི་ཡང་དག་གྲངས n ཡི་བསྡོམས་ལ་མགྱོགས་ཐབས་ཀྱི་གྲུབ་ཆ་ཡོད: 1+2+...+n = n(n+1)/2།\n\nདཔེར་བརྗོད། ཐོག་མའི་ཡང་དག་གྲངས10ཡི་བསྡོམས་འཚོལ་ཤིག།\n10×11/2 = 55།",

    seqTopicTitle_fibonacci: "སྔ་མ་གཉིས་བསྡོམས་གོ་རིམ།", seqTopicDesc_fibonacci: "ཚན་པ་རེ་རེ་སྔ་མ་གཉིས་ཀྱི་བསྡོམས་ཡིན་པའི་གོ་རིམ་ནང་ཚན་པ་ཞིག་འཚོལ།",
    seqLearn_fibonacci: "སྔ་མ་གཉིས་བསྡོམས་གོ་རིམ་ཞིག་ཐོག་མའི་ཐང་གཉིས་ནས་འགོ་ཚུགས, དེ་རྗེས་ཚན་པ་རེ་རེ་སྔ་མའི་ཚན་པ་གཉིས་ཀྱི་བསྡོམས: aₙ = a_(n-1) + a_(n-2)།\n\nདཔེར་བརྗོད། གོ་རིམ་ཞིག1, 1ནས་འགོ་ཚུགས་ནས་སྒྲིག་གཞི་འདི་ལྟར་མུ་མཐུད་ན, ཚན་པ6པ་འཚོལ་ཤིག།\n1, 1, 2, 3, 5, 8—ཚན་པ6པ་ནི8ཡིན།",

    seqFibonacciExplain: "{a1}, {a2} ནས་འགོ་ཚུགས་ནས་ཚན་པ་རེ་རེ་བཟོས་ན, ཚན་པ {n} པ = {answer} ཐོན།",

function t(key, vars){
  let s = (I18N[state.appLang] && I18N[state.appLang][key]) || I18N.en[key] || key;
  if(vars) Object.keys(vars).forEach(k=>{ s = s.split('{'+k+'}').join(vars[k]); });
  return s;
}

// ---- rendering ----------------------------------------------------------------
const app = document.getElementById('app');
function render(){ app.innerHTML = screens[state.screen](); if(state.currentUser) saveGame(); }

// Enter key on the mental math / algebra practice screens does whatever the
// primary button would: submit the typed answer, or (once answered, when
// the input is disabled and no longer receiving key events) advance to the
// next question. Attached once at the document level rather than on the
// input itself so it still works after the input gets disabled/re-rendered.
document.addEventListener('keydown', function(e){
  if(e.key !== 'Enter') return;
  if(state.screen === 'math_practice' && state.mathSession){
    if(state.mathSession.answered) nextMathQuestion();
    else submitMathAnswer();
  } else {
    // Every other math mode shares the same guided step-engine: Enter
    // submits the current step, then either reveals the next step or (once
    // the last step of the problem is answered) advances to a new problem.
    const modeByScreen = {
      algebra_practice: ['algebraSession','Algebra'], calc_practice: ['calcSession','Calc'],
      linalg_practice: ['linalgSession','LinAlg'], disc_practice: ['discSession','Disc'],
      prob_practice: ['probSession','Prob'], stat_practice: ['statSession','Stat'],
      geom_practice: ['geomSession','Geom'], trig_practice: ['trigSession','Trig'],
      cplx_practice: ['cplxSession','Cplx'], seq_practice: ['seqSession','Seq'],
      mat_practice: ['matSession','Mat'],
      coordgeom_practice: ['coordgeomSession','CoordGeom'], numtheory_practice: ['numtheorySession','NumTheory'],
    };
    const mode = modeByScreen[state.screen];
    if(mode){
      const [sessionKey, S] = mode;
      const s = state[sessionKey];
      if(s){
        if(!s.answered) window['submit'+S+'Step']();
        else if(s.stepIndex === s.steps.length-1) window['next'+S+'Question']();
        else window['next'+S+'Step']();
      }
    }
  }
});

function topbar(opts){
  opts = opts||{};
  return `
  <div class="topbar">
    ${opts.back ? `<button class="iconbtn" onclick='${opts.back}'>←</button>` : `<div class="brand"><span>⛰️</span>Yeshe<span class="peak">·</span></div>`}
    <div style="display:flex; gap:8px; align-items:center;">
      <div class="stat" title="${t('dayStreak')}">🔥 ${state.game.streak}</div>
      <div class="stat" title="${t('totalXP')}">⭐ ${state.game.xp}</div>
      <button class="iconbtn" title="${t('heartsLabel')}" onclick="goProfile()">${state.game.hearts<=1?'💔':'❤️'} ${state.game.hearts}</button>
      ${state.currentUser ? `<button class="iconbtn" style="padding:0; overflow:hidden;" title="${t('myProgress')}" onclick="goProfile()">${renderAvatarHTML(state.currentUser, state.avatar, 30, false)}</button>` : ''}
    </div>
  </div>`;
}

function readVal(id){ const el = document.getElementById(id); return el ? el.value.trim() : ''; }

async function doSignup(){
  const username = readVal('auth_username');
  const email = readVal('auth_email');
  const password = readVal('auth_password');
  const password2 = readVal('auth_password2');
  if(!username || username.length<3){ state.authError=t('errUsernameLength'); render(); return; }
  if(!/^[a-zA-Z0-9_.-]+$/.test(username)){ state.authError=t('errUsernameChars'); render(); return; }
  if(!password || password.length<4){ state.authError=t('errPasswordLength'); render(); return; }
  if(password!==password2){ state.authError=t('errPasswordMismatch'); render(); return; }

  try {
    const res = await fetch('/api/signup', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username, email: email||null, password, name:''})
    });
    const data = await res.json();
    if(!res.ok){
      state.authError = (data.error || t('errSignupFailed')) + (data.details ? ' — ' + data.details : '');
      render();
      return;
    }

    const usernameKey = (data.user.username || username).toLowerCase();
    saveSession({currentUser: usernameKey});
    state.currentUser = usernameKey;
    state.game = loadGame(usernameKey);
    state.subscription = data.user.subscription || state.subscription;
    state.avatar = data.user.avatar || state.avatar;
    state.authError = '';
    state.screen = 'pick_language';
    render();
  } catch(e) {
    state.authError = t('errConnection') + e.message;
    render();
  }
}

async function doLogin(){
  const username = readVal('auth_username');
  const password = readVal('auth_password');
  if(!username || !password){ state.authError=t('errEnterCreds'); render(); return; }

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username, password})
    });
    const data = await res.json();
    if(!res.ok){
      state.authError = (data.error || t('errLoginFailed')) + (data.details ? ' — ' + data.details : '');
      render();
      return;
    }

    const usernameKey = (data.user.username || username).toLowerCase();
    saveSession({currentUser: usernameKey});
    state.currentUser = usernameKey;
    state.game = loadGame(usernameKey);
    state.subscription = data.user.subscription || state.subscription;
    state.avatar = data.user.avatar || state.avatar;
    state.authError = '';
    state.screen = 'pick_language';
    render();
  } catch(e) {
    state.authError = t('errConnection') + e.message;
    render();
  }
}

function doLogout(){
  saveSession({currentUser:null, token:null});
  const lang = state.appLang;
  state = defaultAppState();
  state.appLang = lang;
  state.screen = 'auth';
  state.authMode = 'login';

}

// ---- mental math: a language-agnostic practice mode, independent of the
// TRACKS/LEVELS vocab structure above. Typed numeric answers rather than
// multiple choice. Unlimited questions per session, ending after 3 wrong
// answers (its own local strike counter — not tied to the app's global
// hearts economy, which regenerates slowly and is shared with vocab
// lessons; that would make "unlimited" a lie). ---------------------------
function randInt(min, max){ return min + Math.floor(Math.random()*(max-min+1)); }

function buildMathProblem(difficulty){
  const op = ['+','-','×','÷'][randInt(0,3)];
  let a, b, answer;
  if(difficulty==='easy'){
    if(op==='+'){ a=randInt(1,50); b=randInt(1,50); answer=a+b; }
    else if(op==='-'){ a=randInt(1,50); b=randInt(1,a); answer=a-b; }
    else if(op==='×'){ a=randInt(1,12); b=randInt(1,12); answer=a*b; }
    else { b=randInt(1,12); answer=randInt(1,12); a=b*answer; }
  } else if(difficulty==='medium'){
    if(op==='+'){ a=randInt(10,200); b=randInt(10,200); answer=a+b; }
    else if(op==='-'){ a=randInt(10,300); b=randInt(1,a); answer=a-b; }
    else if(op==='×'){ a=randInt(10,99); b=randInt(2,12); answer=a*b; }
    else { b=randInt(2,12); answer=randInt(2,50); a=b*answer; }
  } else { // hard
    if(op==='+'){ a=randInt(100,999); b=randInt(100,999); answer=a+b; }
    else if(op==='-'){ a=randInt(200,999); b=randInt(1,a); answer=a-b; }
    else if(op==='×'){ a=randInt(11,99); b=randInt(11,99); answer=a*b; }
    else { b=randInt(2,25); answer=randInt(2,80); a=b*answer; }
  }
  return {a, op, b, answer};
}
const MATH_MAX_MISTAKES = 3;

// ---- shared gamification: combo streaks, achievements, XP levels ----------
// Used identically by mental math, algebra and calculus so the reward loop
// feels the same everywhere rather than being a one-off for whichever
// module happens to get built last.
const ACHIEVEMENTS = [
  {key:'first_steps', icon:'🌱', titleKey:'achFirstStepsTitle', descKey:'achFirstStepsDesc', check:g=>g.totalCorrect>=1},
  {key:'combo_5', icon:'🔥', titleKey:'achCombo5Title', descKey:'achCombo5Desc', check:g=>g.bestCombo>=5},
  {key:'combo_10', icon:'⚡', titleKey:'achCombo10Title', descKey:'achCombo10Desc', check:g=>g.bestCombo>=10},
  {key:'century', icon:'💯', titleKey:'achCenturyTitle', descKey:'achCenturyDesc', check:g=>g.totalCorrect>=100},
  {key:'explorer', icon:'🧭', titleKey:'achExplorerTitle', descKey:'achExplorerDesc', check:g=>
    Object.values(g.math||{}).some(x=>x.best>0) &&
    Object.values(g.algebra||{}).some(x=>x.best>0) &&
    Object.values(g.calculus||{}).some(x=>x.best>0)
  },
  {key:'streak_7', icon:'🗓️', titleKey:'achStreak7Title', descKey:'achStreak7Desc', check:g=>g.streak>=7},
  {key:'streak_30', icon:'🏔️', titleKey:'achStreak30Title', descKey:'achStreak30Desc', check:g=>g.streak>=30},
];
function checkAchievements(game){
  if(!game.achievements) game.achievements=[];
  const unlocked = [];
  for(const a of ACHIEVEMENTS){
    if(!game.achievements.includes(a.key) && a.check(game)){
      game.achievements.push(a.key);
      unlocked.push(a);
    }
  }
  return unlocked;
}
function xpLevel(xp){
  const level = Math.floor(xp/100)+1;
  const into = xp%100;
  return {level, into, span:100};
}
// Bonus XP scales with the streak already built BEFORE this answer, so an
// isolated correct answer still earns the original flat 10 (no regression),
// while a run of consecutive correct answers earns progressively more,
// capped at +10 so it stays a bonus rather than runaway inflation.
function registerCorrectAnswer(session, game){
  const bonus = Math.min(session.combo||0, 10);
  session.combo = (session.combo||0) + 1;
  if(session.combo > (session.maxCombo||0)) session.maxCombo = session.combo;
  if(session.combo > (game.bestCombo||0)) game.bestCombo = session.combo;
  game.totalCorrect = (game.totalCorrect||0) + 1;
  const xpGain = 10 + bonus;
  session.correct += 1;
  session.xpEarned += xpGain;
  session.lastXpGain = xpGain;
  game.xp += xpGain;
  return xpGain;
}
function registerWrongAnswer(session){

// Hints (hard difficulty only, opt-in): a short strategy note plus, for
// multiplication/division, a 1-12 lookup table built off one operand — the
// operand itself, for ×, since the standard algorithm always ends up
// multiplying it by single digits; the divisor, for ÷, since checking
// "divisor × ? = dividend" against the table is the standard technique.
// Doesn't hand over the final answer directly except by coincidence (e.g. a
// small quotient landing inside the 1-12 range), which is fine for a hint.
function mathHintData(q){
  if(q.op==='+') return {formula:t('hintFormulaAdd'), table:null};
  if(q.op==='-') return {formula:t('hintFormulaSub'), table:null};
  const base = q.op==='×' ? q.a : q.b;
  const rows = Array.from({length:12}, (_,i)=>({n:i+1, val:base*(i+1)}));
  return {formula: q.op==='×' ? t('hintFormulaMul') : t('hintFormulaDiv'), table:rows, base};
}

// Contextual mental-math tricks/tips, checked against the actual numbers in
// the current problem rather than shown generically — e.g. "round-and-
// adjust" only fires when an operand is actually close to a multiple of
// ten. Returns zero or more localized tip strings.
function roundAdjust(n){
  const rem = n % 10;
  if(rem>=8) return {rounded:n+(10-rem), diff:10-rem, dir:'up'};
  if(rem>0 && rem<=2) return {rounded:n-rem, diff:rem, dir:'down'};
  return null;
}
function mathTricksFor(q){
  const tips = [];
  if(q.op==='+'){
    let info = roundAdjust(q.b), val = q.b;
    if(!info){ info = roundAdjust(q.a); val = q.a; }
    if(info) tips.push(t(info.dir==='up' ? 'trickRoundUpAdd' : 'trickRoundDownAdd', {val, rounded:info.rounded, diff:info.diff}));
  } else if(q.op==='-'){
    const info = roundAdjust(q.b);
    if(info) tips.push(t(info.dir==='up' ? 'trickRoundUpSub' : 'trickRoundDownSub', {val:q.b, rounded:info.rounded, diff:info.diff}));
  } else if(q.op==='×'){
    if(q.a===11 || q.b===11){
      tips.push(t('trick11'));
    } else {
      const infoA = roundAdjust(q.a), infoB = roundAdjust(q.b);
      let chosen=null, val=null, other=null;
      if(infoA && (!infoB || infoA.diff<=infoB.diff)){ chosen=infoA; val=q.a; other=q.b; }
      else if(infoB){ chosen=infoB; val=q.b; other=q.a; }
      if(chosen) tips.push(t(chosen.dir==='up' ? 'trickRoundUpMul' : 'trickRoundDownMul', {val, rounded:chosen.rounded, diff:chosen.diff, other}));
    }
  } else { // ÷
    const divTricks = {4:'trickDiv4', 5:'trickDiv5', 8:'trickDiv8', 20:'trickDiv20', 25:'trickDiv25'};
    if(divTricks[q.b]) tips.push(t(divTricks[q.b]));
  }
  return tips;
}

function submitMathAnswer(){
  const s = state.mathSession;
  if(!s || s.answered) return;
  const q = s.current;
  if(s.input===''){ return; }
  const correct = Number(s.input) === q.answer;
  s.answered = true; s.lastCorrect = correct;
  if(correct) registerCorrectAnswer(s, state.game);
  else registerWrongAnswer(s);
  render();
}

  const s = state.mathSession;
  if(s.mistakes>=MATH_MAX_MISTAKES){ finishMathPractice(); return; }
  s.answered=false; s.lastCorrect=null; s.input=''; s.showHint=false;
  s.current = buildMathProblem(s.difficulty);

  focusMathInput();
}

function finishMathPractice(){
  const s = state.mathSession;
  if(!state.game.math) state.game.math = {easy:{best:0}, medium:{best:0}, hard:{best:0}};
  const rec = state.game.math[s.difficulty] || (state.game.math[s.difficulty] = {best:0});
  s.isNewBest = s.correct > rec.best;
  if(s.isNewBest) rec.best = s.correct;

  s.newAchievements = checkAchievements(state.game);
