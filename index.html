}
function buildProductionBudgetStatement(hard){
  const sales = randInt(500,5000)*10;
  const endingFG = randInt(50,500)*10;
  const beginningFG = randInt(50,500)*10;
  const totalNeeded = sales+endingFG;
  const unitsToProduce = totalNeeded-beginningFG;
  return [
    {label:'Budgeted Unit Sales', value:sales, key:'sales', blank:false},
    {label:'Add: Desired Ending Finished Goods', value:endingFG, key:'endingFG', blank:false},
    {label:'Total Units Needed', value:totalNeeded, key:'totalNeeded', blank:hard},
    {label:'Less: Beginning Finished Goods', value:beginningFG, key:'beginningFG', blank:false},
    {label:'Units to be Produced', value:unitsToProduce, key:'unitsToProduce', blank:true},
  ];
}
function buildCostPlusPricingStatement(hard){
  const dm = randInt(5,50)*100;
  const dl = randInt(5,50)*100;
  const oh = randInt(2,30)*100;
  const jobCost = dm+dl+oh;
  const markupPct = randInt(1,10)*5;
  const price = jobCost*(100+markupPct)/100;
  return [
    {label:'Direct Materials', value:dm, key:'dm', blank:false},
    {label:'Direct Labour', value:dl, key:'dl', blank:false},
    {label:'Overhead Applied', value:oh, key:'oh', blank:false},
    {label:'Total Job Cost', value:jobCost, key:'jobCost', blank:hard},
    {label:'Markup (%)', value:markupPct, key:'markupPct', blank:false},
    {label:'Price', value:price, key:'price', blank:true},
  ];
}
function buildMSEStatement(hard){
  const nOptions = [4,5,8,10,20];
  const nTrain = nOptions[randInt(0,nOptions.length-1)];
  const nTest = nOptions[randInt(0,nOptions.length-1)];
  const mseTrain = randInt(2,40);
  const mseTest = mseTrain + randInt(1,20);
  const sseTrain = nTrain*mseTrain;
  const sseTest = nTest*mseTest;
  return [
    {label:'Training SSE (Sum of Squared Errors)', value:sseTrain, key:'sseTrain', blank:false},
    {label:'Training Observations (n)', value:nTrain, key:'nTrain', blank:false},
    {label:'Training MSE', value:mseTrain, key:'mseTrain', blank:hard},
    {label:'Test SSE (Sum of Squared Errors)', value:sseTest, key:'sseTest', blank:false},
    {label:'Test Observations (n)', value:nTest, key:'nTest', blank:false},
    {label:'Test MSE', value:mseTest, key:'mseTest', blank:true},
  ];
}
function buildAccuracyStatement(hard){
  const misclassified = randInt(5,40);
  const correct = 100-misclassified;
  const rate = misclassified;
  return [
    {label:'Total Test Observations', value:100, key:'total', blank:false},
    {label:'Misclassified Observations', value:misclassified, key:'misclassified', blank:false},
    {label:'Correct Predictions', value:correct, key:'correct', blank:hard},
    {label:'Misclassification Rate (%)', value:rate, key:'rate', blank:true},
  ];
}
function buildRSquaredStatement(hard){
  const tss = randInt(2,20)*100;
  const r2Pct = randInt(10,90);
  const rss = (tss/100)*(100-r2Pct);
  const explained = tss-rss;
  return [
    {label:'Total Sum of Squares (TSS)', value:tss, key:'tss', blank:false},
    {label:'Residual Sum of Squares (RSS)', value:rss, key:'rss', blank:false},
    {label:'Variance Explained (TSS − RSS)', value:explained, key:'explained', blank:hard},
    {label:'R-squared (%)', value:r2Pct, key:'r2Pct', blank:true},
  ];
}

function bizConceptByKey(category, key){ return BUSINESS_CONCEPTS[category].find(c=>c.key===key); }
const BUSINESS_MAX_MISTAKES = 5;
function normalizeTermAnswer(s){
  return (s||'').toLowerCase().trim().replace(/[.,!?'"()]/g,'').replace(/\s+/g,' ');
}
function checkBusinessTyped(concept, typed){
  const norm = normalizeTermAnswer(typed);
  const all = [].concat(concept.acceptedAnswers.en, concept.acceptedAnswers.zh, concept.acceptedAnswers.bo);
  return all.some(a => normalizeTermAnswer(a) === norm);
}

function renderBusinessMenu(){
  const cats = [
    {key:'finance', icon:'💰', titleKey:'bizFinanceTitle', descKey:'bizFinanceDesc'},
    {key:'economics', icon:'📉', titleKey:'bizEconomicsTitle', descKey:'bizEconomicsDesc'},
    {key:'tech', icon:'💻', titleKey:'bizTechTitle', descKey:'bizTechDesc'},
    {key:'mgmtacct', icon:'📊', titleKey:'bizMgmtAcctTitle', descKey:'bizMgmtAcctDesc'},
    {key:'finacct', icon:'📑', titleKey:'bizFinAcctTitle', descKey:'bizFinAcctDesc'},
    {key:'ml', icon:'🤖', titleKey:'bizMlTitle', descKey:'bizMlDesc'},
    {key:'corpfin', icon:'🏛️', titleKey:'bizCorpfinTitle', descKey:'bizCorpfinDesc'},
  ];
  const endlessOn = !!state.businessEndlessMode;
  const cards = cats.map(cat=>{
    const rec = state.game.business && state.game.business[cat.key];
    const rounds = rec ? rec.rounds : 0;
    const bestEndless = rec ? (rec.bestEndless||0) : 0;
    const progressLabel = endlessOn
      ? (bestEndless ? t('bizEndlessBestLabel',{n:bestEndless}) : t('startArrow'))
      : (rounds ? t('bizRoundsLabel',{n:rounds}) : t('startArrow'));
    const action = WEEK_META[cat.key] ? `openCategoryWeekMenu('${cat.key}')` : (endlessOn ? `startBusinessEndless('${cat.key}')` : `startBusinessRound('${cat.key}')`);
    return `
    <button class="track-card" onclick="${action}">
      <div class="glyph">${cat.icon}</div>
      <div>
        <div class="tc-title">${t(cat.titleKey)}</div>
        <div class="tc-sub">${t(cat.descKey)}</div>
      </div>
      <div class="tc-progress">${progressLabel}</div>
    </button>`;
  }).join('');

  return `
  ${topbar({back:'goHome()'})}
  <div class="home ${appLangClass()}">
    <div class="hero">
      <h1>${t('businessTitle')}</h1>
      <div class="sub">${t('businessSub')}</div>
    </div>
    <div class="profile-card" style="display:flex; align-items:center; justify-content:space-between; gap:12px; text-align:left;">
      <div>
        <div class="tc-title" style="font-size:15px;">${t('bizEndlessModeTitle')}</div>
        <div class="tc-sub">${t('bizEndlessModeDesc')}</div>
      </div>
      <button class="biz-switch ${endlessOn?'on':''}" onclick="toggleBusinessEndlessMode()" aria-pressed="${endlessOn}"><span class="biz-switch-knob"></span></button>
    </div>
    <div class="track-grid">${cards}</div>
    <button class="track-card" onclick="openQuizBankMenu()">
      <div class="glyph">📝</div>
      <div>
        <div class="tc-title">${t('quizBankCardTitle')}</div>
        <div class="tc-sub">${t('quizBankCardDesc')}</div>
      </div>
      <div class="tc-progress">${t('startArrow')}</div>
    </button>
  </div>
  `;
}

function toggleBusinessEndlessMode(){
  state.businessEndlessMode = !state.businessEndlessMode;
  render();
}

// ---- Week picker: any category whose concepts span several lecture weeks
// (currently Machine Learning and Corporate Finance) gets a shared sub-menu
// (mirroring the Quiz Bank's part picker), letting learners drill one week
// at a time or everything at once. Each card also surfaces a mastery
// breakdown, and the ranked list below the cards sorts every concept
// weakest-first so learners see what to review. Chrome i18n keys follow the
// pattern `${category}WeekMenuTitle`, `${category}Week${n}Title/Desc`, etc.
const WEEK_META = {
  ml: {
    1: {titleKey:'mlWeek1Title', descKey:'mlWeek1Desc'},
    2: {titleKey:'mlWeek2Title', descKey:'mlWeek2Desc'},
    3: {titleKey:'mlWeek3Title', descKey:'mlWeek3Desc'},
    4: {titleKey:'mlWeek4Title', descKey:'mlWeek4Desc'},
    5: {titleKey:'mlWeek5Title', descKey:'mlWeek5Desc'},
  },
  corpfin: {
    1: {titleKey:'corpfinWeek1Title', descKey:'corpfinWeek1Desc'},
    2: {titleKey:'corpfinWeek2Title', descKey:'corpfinWeek2Desc'},
    3: {titleKey:'corpfinWeek3Title', descKey:'corpfinWeek3Desc'},
  },
};
const WEEK_MENU_GLYPH = {ml:'🤖', corpfin:'🏛️'};
function bizMasteryCounts(category, weekFilter){
  const pool = bizConceptPool(category, weekFilter);
  const counts = {mastered:0, practicing:0, learning:0, fresh:0};
  pool.forEach(c=>{
    const lvl = masteryLevel(c.key);
    if(lvl==='mastered') counts.mastered++;
    else if(lvl==='practicing') counts.practicing++;
    else if(lvl==='learning') counts.learning++;
    else counts.fresh++;
  });
  return counts;
}
function bizMasteryLabelHtml(category, weekFilter){
  const mc = bizMasteryCounts(category, weekFilter);
  return t('mlMasteryLabel',{mastered:mc.mastered, practicing:mc.practicing, learning:mc.learning, fresh:mc.fresh});
}
function openCategoryWeekMenu(category){ state.weekMenuCategory = category; state.screen='biz_week_menu'; render(); }
function categoryStartFromWeekMenu(weekFilter){
  const category = state.weekMenuCategory;
  if(state.businessEndlessMode) startBusinessEndless(category, weekFilter);
  else startBusinessRound(category, weekFilter);
}
function renderCategoryWeekMenu(){
  const category = state.weekMenuCategory;
  const weekMeta = WEEK_META[category];
  const weekCards = Object.keys(weekMeta).map(Number).map(w=>{
    const meta = weekMeta[w];
    const count = bizConceptPool(category, w).length;
    return `
    <button class="track-card" onclick="categoryStartFromWeekMenu(${w})">
      <div class="glyph">${w}</div>
      <div>
        <div class="tc-title">${t(meta.titleKey)}</div>
        <div class="tc-sub">${t(meta.descKey)}</div>
        <div class="tc-sub" style="margin-top:2px; font-size:11px;">${bizMasteryLabelHtml(category, w)}</div>
      </div>
      <div class="tc-progress">${count}</div>
    </button>`;
  }).join('');
  const allCard = `
    <button class="track-card" onclick="categoryStartFromWeekMenu(null)">
      <div class="glyph">${WEEK_MENU_GLYPH[category]||'📚'}</div>
      <div>
        <div class="tc-title">${t(category+'AllWeeksTitle')}</div>
        <div class="tc-sub">${t(category+'AllWeeksDesc')}</div>
        <div class="tc-sub" style="margin-top:2px; font-size:11px;">${bizMasteryLabelHtml(category, null)}</div>
      </div>
      <div class="tc-progress">${BUSINESS_CONCEPTS[category].length}</div>
    </button>`;
  const rankOrder = {new:0, learning:1, practicing:2, mastered:3};
  const ranked = [...BUSINESS_CONCEPTS[category]].sort((a,b)=>rankOrder[masteryLevel(a.key)] - rankOrder[masteryLevel(b.key)]).slice(0,8);
  const rankedHtml = ranked.map(c=>{
    const lvl = masteryLevel(c.key);
    return `
    <div style="display:flex; align-items:center; justify-content:space-between; padding:7px 0; border-bottom:1px solid rgba(255,255,255,.06);">
      <div style="font-size:13.5px;">${c.icon} ${t(c.titleKey)} <span style="color:var(--snow-dim); font-size:11px;">· W${c.week}</span></div>
      <div style="font-size:12px; white-space:nowrap;">${masteryBadge(lvl)} ${t(masteryLabelKey(lvl))}</div>
    </div>`;
  }).join('');
  return `
  ${topbar({back:'backToBusinessMenu()'})}
  <div class="home ${appLangClass()}">
    <div class="hero">
      <h1>${t(category+'WeekMenuTitle')}</h1>
      <div class="sub">${t(category+'WeekMenuSub')}</div>
    </div>
    <div class="track-grid">${allCard}${weekCards}</div>
    <div class="profile-card" style="text-align:left;">
      <div class="tc-title" style="font-size:15px; margin-bottom:4px;">${t('bizMasteryRankingTitle')}</div>
      ${rankedHtml}
    </div>
  </div>
  `;
}

// Some categories (currently only Machine Learning) tag each concept with
// the lecture week it came from. weekFilter narrows the round/endless pool
// to just that week; categories/concepts without week tags ignore it.
function bizConceptPool(category, weekFilter){
  const list = BUSINESS_CONCEPTS[category];
  return weekFilter ? list.filter(c=>c.week===weekFilter) : list;
}
function startBusinessRound(category, weekFilter){
  const picks = shuffled(bizConceptPool(category, weekFilter)).slice(0,3);
  state.businessSession = {
    category, weekFilter: weekFilter||null, concepts:picks, learnIndex:0, endless:false,
    quizConcept:null, quizType:null, quizOptions:null, selected:null, input:'', answered:false, lastCorrect:null,
    xpEarned:0, lastXpGain:0, statementRows:null, stmtInputs:{},
  };
  state.screen = 'business_learn';
  render();
}

function renderBusinessLearn(){
  const s = state.businessSession;
  const concept = s.concepts[s.learnIndex];
  const isLast = s.learnIndex >= s.concepts.length - 1;
  return `
  ${topbar({back:'backFromBusinessSession()'})}
  <div class="home ${appLangClass()}">
    <div style="font-size:12px; color:var(--snow-dim); text-align:center;">${t('bizLearnEyebrow',{n:s.learnIndex+1, total:s.concepts.length})}</div>
    <div class="hero" style="padding-top:4px;">
      <h1 style="font-size:26px;">${concept.icon} ${t(concept.titleKey)}</h1>
    </div>
    <div class="profile-card" style="text-align:left;">
      <div style="font-size:14.5px; color:var(--snow-dim);">${formatReadableText(t(concept.explainKey))}</div>
      ${concept.diagram ? `<div style="margin-top:14px; background:rgba(255,255,255,.04); border-radius:12px; padding:10px;">${concept.diagram()}</div>` : ''}
    </div>
    <button class="btn btn-primary btn-block" onclick="nextBusinessLearn()">${isLast ? t('bizStartQuizBtn') : t('bizNextConceptBtn')}</button>
  </div>
  `;
}

function nextBusinessLearn(){
  const s = state.businessSession;
  s.learnIndex += 1;
  if(s.learnIndex >= s.concepts.length){ startBusinessQuiz(); return; }
  render();
}

function startBusinessQuiz(){
  const s = state.businessSession;
  const pool = s.endless ? bizConceptPool(s.category, s.weekFilter) : s.concepts;
  const concept = pool[randInt(0, pool.length-1)];
  const exposure = (state.game.conceptExposure && state.game.conceptExposure[concept.key]) || 0;
  s.quizConcept = concept;
  s.quizOptions = null;
  s.statementRows = null;
  s.stmtInputs = {};
  if(concept.quizVariant==='statement'){
    s.quizType = 'statement';
    s.statementRows = concept.buildStatement(exposure > 0);
  } else {
    s.quizType = exposure===0 ? 'mcq' : 'typed';
    if(s.quizType==='mcq'){
      const distractorPool = bizConceptPool(s.category, s.weekFilter).filter(c=>c.key!==concept.key);
      const distractors = shuffled(distractorPool).slice(0,3);
      s.quizOptions = shuffled([concept, ...distractors]).map(c=>({key:c.key, label:t(c.titleKey), correct:c.key===concept.key}));
    }
  }
  s.selected = null; s.input=''; s.answered = false; s.lastCorrect = null;
  state.screen = s.endless ? 'business_endless' : 'business_quiz';
  render();
  if(s.quizType==='typed') setTimeout(()=>{ const el=document.querySelector('.biz-input'); if(el) el.focus(); }, 30);
}

function businessEyebrowKey(s){
  return s.quizType==='mcq' ? 'bizMcqEyebrow' : (s.quizType==='statement' ? 'bizStatementEyebrow' : 'bizTypedEyebrow');
}

function renderBusinessQuizBody(s){
  const mcqHtml = s.quizType==='mcq' ? `
    <div class="options">
      ${s.quizOptions.map(o=>{
        let cls = 'opt';
        if(s.answered){
          if(o.correct) cls += ' correct reveal';
          else if(o.key===s.selected && !o.correct) cls += ' wrong reveal';
          else cls += ' disabled reveal';
        }
        return `<button class="${cls}" ${s.answered?'':`onclick="submitBusinessMcq('${o.key}')"`}><span>${o.label}</span></button>`;
      }).join('')}
    </div>` : '';

  const typedHtml = s.quizType==='typed' ? `
    <div class="field" style="align-items:center; gap:12px;">
      <input class="biz-input algebra-input" type="text" autocomplete="off"
        placeholder="${t('bizTypedPlaceholder')}"
        style="text-align:center; font-size:20px; font-family:var(--font-display); font-weight:700; width:100%;"
        ${s.answered?'disabled':''} value="${s.input}"
        oninput="state.businessSession.input=this.value">
      ${!s.answered ? `<button class="btn btn-primary btn-block" onclick="submitBusinessTyped()">${t('checkBtn')}</button>` : ''}
    </div>` : '';

  const statementHtml = s.quizType==='statement' ? `
    <div class="profile-card" style="text-align:left;">
      ${renderStatementTable(s.statementRows, {inputs:s.stmtInputs, answered:s.answered, correctness:s.stmtCorrectness||{}})}
    </div>
    ${!s.answered ? `<button class="btn btn-primary btn-block" onclick="submitBusinessStatement()">${t('checkBtn')}</button>` : ''}` : '';

  return mcqHtml + typedHtml + statementHtml;
}

function businessFeedbackBar(s){
  if(!s.answered) return '';
  const concept = s.quizConcept;
  const showAnswerHint = !s.lastCorrect && s.quizType!=='statement';
  if(s.endless){
    const willFinish = s.mistakes >= BUSINESS_MAX_MISTAKES;
    return `
    <div class="feedback-bar ${s.lastCorrect?'good':'bad'}">
      <div class="fb-text">
        <div class="fb-title">${s.lastCorrect? t('correctFeedback',{n:s.lastXpGain}) : t('notQuiteFeedback')}</div>
        ${showAnswerHint ? `<div class="fb-sub">${t('answerPrefix')}${t(concept.titleKey)}</div>` : ''}
      </div>
      <button class="btn btn-light" onclick="nextBusinessEndlessQuestion()">${willFinish ? t('finishBtn') : t('continueBtn')}</button>
    </div>`;
  }
  return `
    <div class="feedback-bar ${s.lastCorrect?'good':'bad'}">
      <div class="fb-text">
        <div class="fb-title">${s.lastCorrect? t('correctFeedback',{n:s.xpEarned}) : t('notQuiteFeedback')}</div>
        ${showAnswerHint ? `<div class="fb-sub">${t('answerPrefix')}${t(concept.titleKey)}</div>` : ''}
      </div>
      <button class="btn btn-light" onclick="finishBusinessRound()">${t('bizSeeResultBtn')}</button>
    </div>`;
}

function renderBusinessQuiz(){
  const s = state.businessSession;
  const concept = s.quizConcept;
  return `
  ${topbar({back:'backFromBusinessSession()'})}
  <div class="lesson">
    <div style="font-size:12px; color:var(--snow-dim); text-align:center; margin-bottom:6px;">${t(businessEyebrowKey(s))}</div>
    <div class="q-wrap">
      <div class="q-card">
        <div class="q-eyebrow">${t('bizQuizEyebrow')}</div>
        <div class="q-prompt" style="font-size:21px;">${t(concept.questionKey)}</div>
      </div>
      ${renderBusinessQuizBody(s)}
    </div>
  </div>
  ${businessFeedbackBar(s)}
  `;
}

function renderBusinessEndless(){
  const s = state.businessSession;
  const concept = s.quizConcept;
  return `
  ${topbar({back:'exitBusinessEndless()'})}
  <div class="lesson">
    <div style="display:flex; justify-content:space-between; align-items:center; margin:6px 0 10px;">
      <div class="hearts-row">${Array.from({length:BUSINESS_MAX_MISTAKES}).map((_,i)=>`<span>${i<(BUSINESS_MAX_MISTAKES-s.mistakes)?'❤️':'🩶'}</span>`).join('')}</div>
      <div style="font-size:12px; color:var(--snow-dim); text-align:right;">${t('correctAnswersLabel')}: ${s.correct}${s.combo>=3?`<br><span style="color:var(--gold);">${comboBadge(s.combo)} ${t('comboLabel',{n:s.combo})}</span>`:''}</div>
    </div>
    <div style="font-size:12px; color:var(--snow-dim); text-align:center; margin-bottom:6px;">${t(businessEyebrowKey(s))}</div>
    <div class="q-wrap">
      <div class="q-card">
        <div class="q-eyebrow">${t('bizQuizEyebrow')}</div>
        <div class="q-prompt" style="font-size:21px;">${t(concept.questionKey)}</div>
      </div>
      ${renderBusinessQuizBody(s)}
    </div>
  </div>
  ${businessFeedbackBar(s)}
  `;
}

function nextBusinessEndlessQuestion(){
  const s = state.businessSession;
  if(s.mistakes>=BUSINESS_MAX_MISTAKES){ finishBusinessEndless(); return; }
  startBusinessQuiz();
}

// Categories with a week picker should send the topbar back button to that
// picker instead of straight to the Business Concepts menu, so leaving a
// mid-week round doesn't lose the learner's week filter.
function backFromBusinessSession(){
  const s = state.businessSession;
  if(s && WEEK_META[s.category]){ state.weekMenuCategory = s.category; state.screen='biz_week_menu'; render(); return; }
  state.screen='business_menu'; render();
}
function exitBusinessEndless(){ backFromBusinessSession(); }

function finishBusinessEndless(){
  const s = state.businessSession;
  if(!state.game.business) state.game.business = {};
  const rec = state.game.business[s.category] || (state.game.business[s.category] = {rounds:0});
  s.isNewBest = s.correct > (rec.bestEndless||0);
  if(s.isNewBest) rec.bestEndless = s.correct;
  touchStreak();
  s.newAchievements = checkAchievements(state.game);
  state.screen = 'business_endless_result';
  render();
}

function renderBusinessEndlessResult(){
  const s = state.businessSession;
  const rec = state.game.business[s.category];
  const lvl = xpLevel(state.game.xp);
  return `
  ${topbar()}
  <div class="complete ${appLangClass()}">
    <div class="medal">${s.isNewBest ? '🏆' : '🎯'}</div>
    <h2>${s.isNewBest ? t('newBestReached') : t('bizEndlessOverTitle')}</h2>
    <div class="stat-row">
      <div class="stat-box"><div class="val">${s.correct}</div><div class="lab">${t('correctAnswersLabel')}</div></div>
      <div class="stat-box"><div class="val">+${s.xpEarned}</div><div class="lab">${t('xpEarnedLabel')}</div></div>
      <div class="stat-box"><div class="val">🔥 ${state.game.streak}</div><div class="lab">${t('dayStreak')}</div></div>
    </div>
    <div style="color:var(--snow-dim); font-size:13px;">${t('bizEndlessBestLabel',{n:rec.bestEndless||0})} · ${t('levelLabel',{n:lvl.level})}</div>
    ${achievementBannerHtml(s.newAchievements)}
    <button class="btn btn-primary btn-block" onclick="startBusinessEndless('${s.category}', ${s.weekFilter||'null'})">${t('bizEndlessRestartBtn')}</button>
    <button class="btn btn-ghost btn-block" onclick="backToBusinessMenu()">${t('backToBusinessMenuBtn')}</button>
  </div>`;
}

function startBusinessEndless(category, weekFilter){
  state.businessSession = {
    category, weekFilter: weekFilter||null, concepts:null, learnIndex:0, endless:true,
    quizConcept:null, quizType:null, quizOptions:null, selected:null, input:'', answered:false, lastCorrect:null,
    xpEarned:0, lastXpGain:0, statementRows:null, stmtInputs:{},
    correct:0, mistakes:0, combo:0, maxCombo:0, isNewBest:false, newAchievements:[],
  };
  startBusinessQuiz();
}

// ---- ACCT1102 Quiz Bank: a 400-question exam-practice deck (Topics 1-4),
// separate from the concept-teaching engine above since MCQ/True-False/
// Calculation/Fill-in-table/Short-answer questions don't fit the teach-then-
// recall pattern. MCQ and True/False are auto-graded; Calculation, Fill-in-
// table and Short-answer are reveal-and-self-mark, since those have
// multi-part or free-form answers that aren't safely auto-gradable at this
// scale. Runs through a finite shuffled deck (not an infinite drill) and
// tracks a best score per part. ---------------------------------------------
function openQuizBankMenu(){
  state.screen = 'quiz_bank_menu';
  render();
}
function renderQuizBankMenu(){
  const bestScores = (state.game.quizBank && state.game.quizBank.best) || {};
  const learnRounds = (state.game.quizBank && state.game.quizBank.learnRounds) || {};
  const learnOn = !!state.quizBankLearnMode;
  const startAction = (partId) => learnOn ? `startQuizBankLearnRound(${partId})` : `startQuizBankSession(${partId})`;
  const progressLabel = (partKey, count) => {
    if(learnOn){
      const rounds = learnRounds[partKey];
      return rounds ? t('bizRoundsLabel',{n:rounds}) : t('startArrow');
    }
    const best = bestScores[partKey];
    return best!=null ? t('quizBankBestLabel',{n:best,total:count}) : t('startArrow');
  };
  const parts = QUIZ_BANK_PARTS.map(p=>{
    const count = QUIZ_BANK.filter(q=>q.part===p.id).length;
    return `
    <button class="track-card" onclick="${startAction(p.id)}">
      <div class="glyph">${p.id}</div>
      <div>
        <div class="tc-title">${p.title}</div>
        <div class="tc-sub">${t('quizBankQuestionCount',{n:count})}</div>
      </div>
      <div class="tc-progress">${progressLabel(p.id, count)}</div>
    </button>`;
  }).join('');
  const allCard = `
    <button class="track-card" onclick="${startAction("'all'")}">
      <div class="glyph">🏆</div>
      <div>
        <div class="tc-title">${t('quizBankAllTitle')}</div>
        <div class="tc-sub">${t('quizBankQuestionCount',{n:QUIZ_BANK.length})}</div>
      </div>
      <div class="tc-progress">${progressLabel('all', QUIZ_BANK.length)}</div>
    </button>`;
  return `
  ${topbar({back:'backToBusinessMenu()'})}
  <div class="home ${appLangClass()}">
    <div class="hero">
      <h1>${t('quizBankMenuTitle')}</h1>
      <div class="sub">${t('quizBankMenuSub')}</div>
    </div>
    <div class="profile-card" style="display:flex; align-items:center; justify-content:space-between; gap:12px; text-align:left;">
      <div>
        <div class="tc-title" style="font-size:15px;">${t('quizBankLearnModeTitle')}</div>
        <div class="tc-sub">${t('quizBankLearnModeDesc')}</div>
      </div>
      <button class="biz-switch ${learnOn?'on':''}" onclick="toggleQuizBankLearnMode()" aria-pressed="${learnOn}"><span class="biz-switch-knob"></span></button>
    </div>
    <div class="track-grid">${parts}${allCard}</div>
  </div>
  `;
}

function startQuizBankSession(partFilter){
  partFilter = partFilter==='all' ? 'all' : Number(partFilter);
  const pool = partFilter==='all' ? QUIZ_BANK : QUIZ_BANK.filter(q=>q.part===partFilter);
  state.quizBankSession = {
    partFilter, mode:'quiz', queue: shuffled(pool), index:0, correct:0, mistakes:0, combo:0, maxCombo:0,
    xpEarned:0, lastXpGain:0, answered:false, revealed:false, selected:null, tfSelected:null, lastCorrect:null,
    typedAnswer:'', newAchievements:[], isNewBest:false,
  };
  state.screen = 'quiz_bank_session';
  render();
}
function exitQuizBank(){ state.screen='business_menu'; render(); }

function toggleQuizBankLearnMode(){
  state.quizBankLearnMode = !state.quizBankLearnMode;
  render();
}

// ---- "learn 3, then get tested on 1" mode for the quiz bank, mirroring the
// Business Concepts teach-then-quiz loop: study 3 random questions (prompt +
// worked answer, with the correct option highlighted for mcq/tf) up front,
// then the actual test is a single question drawn from those same 3, reusing
// the existing quiz-bank test-taking screen/functions unchanged.
function startQuizBankLearnRound(partFilter){
  partFilter = partFilter==='all' ? 'all' : Number(partFilter);
  const pool = partFilter==='all' ? QUIZ_BANK : QUIZ_BANK.filter(q=>q.part===partFilter);
  state.quizBankSession = {
    partFilter, mode:'learn', learnQuestions: shuffled(pool).slice(0,3), learnIndex:0,
    queue:null, index:0, correct:0, mistakes:0, combo:0, maxCombo:0,
    xpEarned:0, lastXpGain:0, answered:false, revealed:false, selected:null, tfSelected:null, lastCorrect:null,
    typedAnswer:'', newAchievements:[], isNewBest:false,
  };
  state.screen = 'quiz_bank_teach';
  render();
}

function renderQuizBankTeach(){
  const s = state.quizBankSession;
  const q = s.learnQuestions[s.learnIndex];
  const isLast = s.learnIndex >= s.learnQuestions.length - 1;
  let revealHtml = '';
  if(q.type==='mcq'){
    revealHtml = `<div class="options">${q.opts.map((opt,idx)=>
      `<button class="opt ${idx===q.ans?'correct reveal':'disabled reveal'}" disabled><span>${opt}</span></button>`
    ).join('')}</div>`;
  } else if(q.type==='tf'){
    revealHtml = `<div class="options">
      <button class="opt ${q.ans===true?'correct reveal':'disabled reveal'}" disabled><span>${t('quizBankTrueBtn')}</span></button>
      <button class="opt ${q.ans===false?'correct reveal':'disabled reveal'}" disabled><span>${t('quizBankFalseBtn')}</span></button>
    </div>`;
  }
  return `
  ${topbar({back:'exitQuizBank()'})}
  <div class="lesson">
    <div class="q-wrap">
      ${(q.type==='mcq'||q.type==='tf') ? `
      <div class="q-card">
        <div class="q-eyebrow">${t('bizLearnEyebrow',{n:s.learnIndex+1, total:s.learnQuestions.length})}</div>
        <div class="q-prompt" style="font-size:19px;">${q.q}</div>
      </div>` : `
      <div class="q-eyebrow" style="text-align:center;">${t('bizLearnEyebrow',{n:s.learnIndex+1, total:s.learnQuestions.length})}</div>
      <div class="profile-card" style="text-align:left;">
        <div class="qb-prompt-card">${formatReadableText(q.q)}</div>
      </div>`}
      ${revealHtml}
      <div class="profile-card" style="text-align:left;">
        <div style="font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--gold); margin-bottom:6px;">${t('quizBankAnswerLabel')}</div>
        <div style="font-size:14.5px; color:var(--snow-dim);">${formatReadableText(q.exp)}</div>
      </div>
      <button class="btn btn-primary btn-block" onclick="nextQuizBankTeach()">${isLast ? t('bizStartQuizBtn') : t('bizNextConceptBtn')}</button>
    </div>
  </div>
  `;
}

function nextQuizBankTeach(){
  const s = state.quizBankSession;
  s.learnIndex += 1;
  if(s.learnIndex >= s.learnQuestions.length){ startQuizBankLearnTest(); return; }
  render();
}

function startQuizBankLearnTest(){
  const s = state.quizBankSession;
  const picked = s.learnQuestions[randInt(0, s.learnQuestions.length-1)];
  s.queue = [picked];
  s.index = 0;
  s.answered = false; s.revealed = false; s.selected = null; s.tfSelected = null; s.lastCorrect = null; s.typedAnswer = '';
  state.screen = 'quiz_bank_session';

// ---- mastery tracking: per-question/per-concept correct-vs-wrong history,
// independent of conceptExposure (which only counts exposures, not
// correctness, and drives MCQ -> typed progression). A "streak" of 3+
// consecutive correct answers marks a concept mastered; used to rank
// concepts on the Machine Learning week menu so learners see what to
// review next. -----------------------------------------------------------
function recordMastery(key, correct){
  if(!state.game.conceptMastery) state.game.conceptMastery = {};
  const m = state.game.conceptMastery[key] || (state.game.conceptMastery[key] = {correct:0, wrong:0, streak:0});
  if(correct){ m.correct += 1; m.streak += 1; }
  else { m.wrong += 1; m.streak = 0; }
}
function masteryStats(key){
  return (state.game.conceptMastery && state.game.conceptMastery[key]) || {correct:0, wrong:0, streak:0};
}
function masteryLevel(key){
  const m = masteryStats(key);
  const attempts = m.correct + m.wrong;
  if(attempts===0) return 'new';
  if(m.streak>=3) return 'mastered';
  if(attempts>=2 && m.correct/attempts>=0.6) return 'practicing';
  return 'learning';
}
function masteryBadge(level){
  return {new:'🆕', learning:'📖', practicing:'💪', mastered:'🏆'}[level] || '🆕';
}
function masteryLabelKey(level){
  return {new:'masteryNew', learning:'masteryLearning', practicing:'masteryPracticing', mastered:'masteryMastered'}[level];
}

function finalizeQuizBankAnswer(s){
  recordMastery('qb_'+s.queue[s.index].id, s.lastCorrect);
  if(s.lastCorrect) s.lastXpGain = registerCorrectAnswer(s, state.game);
  else { registerWrongAnswer(s); s.lastXpGain = 0; }
}

// ---- text-to-speech: reads quiz prompts aloud in bo/zh/en ---------------------
// English + Chinese use high-quality Azure neural voices (server-side proxy at
// /api/tts, cached on disk) with a male/female choice saved per device — unless
// a real human recording exists for that exact word/sentence (made via
// /record.html, stored at audio/<lang>/<wordId>.webm), in which case the
// recording is used instead. Tibetan has no usable TTS voice on any provider,
// so it relies on a real recording entirely; if the recording is missing, or
// Azure isn't configured yet, everything falls back to the browser's built-in
// speechSynthesis so the app still says *something*.
const TTS_LANG = { bo: 'bo-CN', zh: 'zh-CN', en: 'en-US' };
function loadVoicePref(){
  const fallback = {en:'female', zh:'female'};
  try{
    const raw = safeStorage.get(VOICE_PREF_KEY);
    if(raw) return Object.assign(fallback, JSON.parse(raw));
  } catch(e){}
  return fallback;
}
function saveVoicePref(){ safeStorage.set(VOICE_PREF_KEY, JSON.stringify(state.voicePref)); }
function setVoicePref(lang, gender){ state.voicePref[lang] = gender; saveVoicePref(); render(); }

function pickBrowserVoice(bcp47){
  if(!('speechSynthesis' in window)) return null;
  const voices = window.speechSynthesis.getVoices();
  const base = bcp47.split('-')[0].toLowerCase();
  return voices.find(v=>v.lang && v.lang.toLowerCase()===bcp47.toLowerCase())
      || voices.find(v=>v.lang && v.lang.toLowerCase().startsWith(base))
      || null;
}
function speakBrowserFallback(text, lang){
  if(!('speechSynthesis' in window) || !text) return;
  try{
    window.speechSynthesis.cancel();
    const bcp47 = TTS_LANG[lang] || lang;
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = bcp47;
    const voice = pickBrowserVoice(bcp47);
    if(voice) utter.voice = voice;
    window.speechSynthesis.speak(utter);
  } catch(e){ /* speech synthesis unsupported or blocked on this device */ }
}

const ttsAudio = new Audio();
// Each language tries its candidate sources in order, falling through on any
// failure (file missing, Azure not configured, network error) until it hits
// the last-resort browser speechSynthesis. All three languages (bo, en, zh)
// can have a real recording (see /record.html), tried first when one exists;
// en and zh can then fall back to Azure; every language ends at the browser
// fallback so something always plays.
function speak(text, lang, wordId){
  if(!text) return;
  try{ ttsAudio.pause(); }catch(e){}

  const candidates = [];
  if(wordId && (lang==='bo' || lang==='en' || lang==='zh')){
    candidates.push('/audio/'+lang+'/'+encodeURIComponent(wordId)+'.webm');
  }
  if(lang==='en' || lang==='zh'){
    const gender = (state.voicePref && state.voicePref[lang]) || 'female';
    candidates.push('/api/tts?text='+encodeURIComponent(text)+'&lang='+lang+'&voice='+gender);
  }

  function tryNext(){
    const src = candidates.shift();
    if(!src){ speakBrowserFallback(text, lang); return; }
    let moved = false;
    const advance = () => { if(moved) return; moved = true; tryNext(); };
    ttsAudio.onerror = advance;
    ttsAudio.src = src;
    const playPromise = ttsAudio.play();
    if(playPromise && playPromise.catch) playPromise.catch(advance);
  }
  tryNext();
}
function speakPrompt(){
  const s = state.session;
  const q = s && s.exercises[s.qIndex];
  if(q) speak(q.prompt, q.promptLang, q.wordId);
}

function startLesson(groupKey){

    trackId:track.id, worldIdx:levelIdx, groupKey,
    exercises: buildExercises(track, group),
    qIndex:0, mistakes:0, answered:false, xpEarned:0
  };
  state.screen='lesson';
  render();
  speakPrompt();
}

function renderLesson(){
  const s = state.session;
  const track = trackById(s.trackId);
  const total = s.exercises.length;
  const q = s.exercises[s.qIndex];
  const pct = Math.round((s.qIndex/total)*100);

  const optsHtml = q.options.map(o=>{
    let cls = 'opt '+scriptClass(track.answerLang);
    if(o.text.length>20) cls+=' long';
    if(s.answered){
      if(o.correct) cls+=' correct reveal';
      else if(o.id===s.picked && !o.correct) cls+=' wrong reveal';
      else cls+=' disabled reveal';
    }
    return `<button class="${cls}" ${s.answered?'':`onclick="answer('${o.id}')"`}>
      <span>${o.text}</span>
      ${o.sub?`<span class="opt-sub">${o.sub}</span>`:''}
    </button>`;
  }).join('');

  const feedback = s.answered ? `
    <div class="feedback-bar ${s.lastCorrect?'good':'bad'}">
      <div class="fb-text">
        <div class="fb-title">${s.lastCorrect? t('correctFeedback',{n:10}) : t('notQuiteFeedback')}</div>
        ${!s.lastCorrect ? `<div class="fb-sub">${t('answerPrefix')}${q.options.find(o=>o.correct).text}</div>` : ''}
      </div>
      <button class="btn btn-light" onclick="nextQuestion()">${s.qIndex+1>=total ? t('finishBtn'):t('continueBtn')}</button>
    </div>` : '';

  return `
  ${topbar({back:'exitLesson()'})}
  <div class="lesson">
    <div class="progressbar"><div class="progressbar-fill" style="width:${pct}%"></div></div>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
      <div class="hearts-row">${Array.from({length:HEARTS_MAX}).map((_,i)=>`<span>${i<state.game.hearts?'❤️':'🩶'}</span>`).join('')}</div>
      <div style="font-size:12px; color:var(--snow-dim);">${s.qIndex+1} / ${total}</div>
    </div>
    <div class="q-wrap">
      <div class="q-card">
        <div class="q-eyebrow">${t('translateEyebrow')}</div>
        <div style="display:flex; align-items:center; justify-content:center; gap:10px;">
          <div class="q-prompt ${scriptClass(q.promptLang)} ${q.prompt.length>20?'long':''}">${q.prompt}</div>
          <button class="iconbtn" style="width:32px; height:32px; font-size:15px; flex-shrink:0;" title="${t('playAudio')}" onclick="speakPrompt()">🔊</button>
        </div>
        ${q.promptSub?`<div class="q-translit">${q.promptSub}</div>`:''}
      </div>
      <div class="options">${optsHtml}</div>
    </div>
  </div>
  ${feedback}
  `;
}

function answer(optId){
  const s = state.session;
  const q = s.exercises[s.qIndex];
  const opt = q.options.find(o=>o.id===optId);
  s.answered = true; s.picked = optId; s.lastCorrect = opt.correct;
  if(opt.correct){
    s.xpEarned += 10; state.game.xp += 10;
  } else {
    s.mistakes += 1;
    if(state.game.hearts===HEARTS_MAX) state.game.lastHeartTime = Date.now();
    state.game.hearts = Math.max(0, state.game.hearts-1);
    if(state.game.hearts===0){ render(); setTimeout(()=>{ state.screen='outofhearts'; render(); }, 550); return; }
  }
  render();
}

function nextQuestion(){
  const s = state.session;
  if(state.game.hearts<=0){ state.screen='outofhearts'; render(); return; }
  s.qIndex += 1; s.answered=false; s.picked=null;
  if(s.qIndex>=s.exercises.length){ finishLesson(); return; }
  render();
  speakPrompt();
}

function finishLesson(){
  const s = state.session;
  const total = s.exercises.length;
  let stars = 1;
  if(s.mistakes===0) stars=3; else if(s.mistakes<=Math.ceil(total*0.34)) stars=2;
  const p = trackProgress(s.trackId);
  const key = lessonKey(s.worldIdx, s.groupKey);
  p.completed[key] = Math.max(p.completed[key]||0, stars);
  if(stars===3) { state.game.xp += 20; s.xpEarned += 20; }
  touchStreak();
  state.screen='complete';
  render();
}

function renderComplete(){
  const s = state.session;
  const total = s.exercises.length;
  const stars = trackProgress(s.trackId).completed[lessonKey(s.worldIdx,s.groupKey)];
  return `
  ${topbar()}
  <div class="complete ${appLangClass()}">
    <div class="medal">${stars===3?'🏆':stars===2?'🥈':'🥉'}</div>
    <h2>${t('checkpointReached')}</h2>
    <div class="stars-final">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
    <div class="stat-row">
      <div class="stat-box"><div class="val">+${s.xpEarned}</div><div class="lab">${t('xpEarnedLabel')}</div></div>
      <div class="stat-box"><div class="val">${total-s.mistakes}/${total}</div><div class="lab">${t('firstTryCorrect')}</div></div>
      <div class="stat-box"><div class="val">🔥 ${state.game.streak}</div><div class="lab">${t('dayStreak')}</div></div>
    </div>
    <button class="btn btn-primary btn-block" onclick="backToLessonList()">${t('continueClimbing')}</button>
  </div>`;
}

function renderOutOfHearts(){
  const eta = nextHeartEta();
  return `
  ${topbar()}
  <div class="complete ${appLangClass()}">
    <div class="medal">💔</div>
    <h2>${t('outOfHearts')}</h2>
    <p style="color:var(--snow-dim); max-width:280px;">${t('heartsRefillText')} ${eta?t('nextHeartIn',{n:eta}):''} ${t('heartsRefillTail')}</p>
    <button class="btn btn-primary btn-block" onclick="retrySameLesson()">${t('tryAgainBtn')}</button>
    <button class="btn btn-ghost btn-block" onclick="backToLessonList()">${t('backToBaseCamp')}</button>
  </div>`;
}
function retrySameLesson(){
  regenHearts();
  if(state.game.hearts<=0){ render(); return; }
  startLesson(state.session.groupKey);
}
function backToLessonList(){ state.screen='lessonlist'; render(); }
function exitLesson(){ state.screen='lessonlist'; render(); }

// ---- avatars: DiceBear character or uploaded photo ----------------------------
function renderAvatarHTML(username, avatar, sizePx, animated){
  if(avatar && avatar.type==='photo'){
    const src = '/avatar/'+encodeURIComponent(username)+'?v='+encodeURIComponent(avatar.updatedAt||'0');
    return `<div class="avatar-circle ${animated?'animated':''}" style="width:${sizePx}px; height:${sizePx}px;"><img src="${src}" alt=""></div>`;
  }
  if(avatar && avatar.type==='avataaar' && avatar.options){
    const src = dicebearUrl(avatar.options, username);
    return `<div class="avatar-circle ${animated?'animated':''}" style="width:${sizePx}px; height:${sizePx}px;"><img src="${src}" alt=""></div>`;
  }
  return `<div class="avatar-circle avatar-bg-gray ${animated?'animated':''}" style="width:${sizePx}px; height:${sizePx}px;"><div class="avatar-base" style="font-size:${Math.round(sizePx*0.5)}px;">🏔️</div></div>`;
}

function openAvatarEditor(){
  state.avatarError = '';
  if(state.avatar.type==='avataaar' && state.avatar.options) state.avatarDraft = Object.assign({}, state.avatar.options);
  state.avatarTab = state.avatar.type==='photo' ? 'photo' : 'character';
  state.screen = 'avatar_editor';
  render();
}
function setAvatarTab(tab){ state.avatarTab = tab; state.avatarError=''; render(); }
function setAvatarDraftPart(part, value){ state.avatarDraft[part] = value; render(); }

function renderAvatarEditor(){
  const d = state.avatarDraft;
  const preview = renderAvatarHTML(state.currentUser, {type:'avataaar', options:d}, 110, true);

  const categoryRows = AVATAAAR_CATEGORIES.map(cat => {
    const items = AVATAAAR_OPTIONS[cat.key].map(v => {
      const swatch = cat.kind==='color'
        ? `<div style="width:100%; height:100%; border-radius:50%; background:#${v};"></div>`
        : `<img src="${avatarThumbUrl(cat.key, v)}" alt="${humanizeAvatarOption(v)}" title="${humanizeAvatarOption(v)}" loading="lazy">`;
      return `<div class="avatar-swatch ${cat.kind==='style'?'avatar-swatch-thumb':''} ${d[cat.key]===v?'selected':''}" onclick="setAvatarDraftPart('${cat.key}','${v}')">${swatch}</div>`;
    }).join('');
    return `<div style="font-size:12px; color:var(--snow-dim); margin-bottom:6px;">${t(cat.labelKey)}</div><div class="avatar-picker-row">${items}</div>`;
  }).join('');

  const characterPanel = `
    <div style="text-align:center; margin-bottom:18px;">${preview}</div>
    ${categoryRows}
    ${state.avatarError ? `<div style="color:#ff8080; font-size:13px; margin-top:6px;">${state.avatarError}</div>` : ''}
    <button class="btn btn-primary btn-block" style="margin-top:16px;" ${state.avatarSaving?'disabled':''} onclick="saveCharacterAvatar()">${state.avatarSaving?t('avatarSaving'):t('avatarSave')}</button>
  `;

  const currentPhoto = state.avatar.type==='photo' ? renderAvatarHTML(state.currentUser, state.avatar, 96, true) : '';
  const photoPanel = `
    ${currentPhoto ? `<div style="text-align:center; margin-bottom:14px;">${currentPhoto}</div>` : ''}
    <div style="font-size:13px; color:var(--snow-dim); margin-bottom:14px; text-align:center;">${t('avatarPhotoHint')}</div>
    <input type="file" accept="image/*" id="avatar_photo_input" style="display:none;" onchange="handleAvatarPhotoSelect(event)">
    <button class="btn btn-primary btn-block" ${state.avatarSaving?'disabled':''} onclick="document.getElementById('avatar_photo_input').click()">${state.avatarSaving?t('avatarSaving'):t('avatarChoosePhoto')}</button>
    ${state.avatarError ? `<div style="color:#ff8080; font-size:13px; margin-top:10px; text-align:center;">${state.avatarError}</div>` : ''}
  `;

  return `
  ${topbar({back:'goProfile()'})}
  <div class="profile ${appLangClass()}">
    <div class="profile-card">
      <h2 style="text-align:center; margin-bottom:14px;">${t('avatarEditorTitle')}</h2>
      <div class="avatar-tabs">
        <button class="avatar-tab ${state.avatarTab==='character'?'active':''}" onclick="setAvatarTab('character')">${t('avatarTabMascot')}</button>
        <button class="avatar-tab ${state.avatarTab==='photo'?'active':''}" onclick="setAvatarTab('photo')">${t('avatarTabPhoto')}</button>
      </div>
      ${state.avatarTab==='character' ? characterPanel : photoPanel}
    </div>
  </div>`;
}

async function saveCharacterAvatar(){
  state.avatarSaving = true; state.avatarError=''; render();
  try{
    const res = await fetch('/api/avatar/character', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username: state.currentUser, options: state.avatarDraft})
    });
    const data = await res.json();
    if(!res.ok){ state.avatarError = data.error || t('errConnection'); state.avatarSaving=false; render(); return; }
    state.avatar = data.avatar;
    state.avatarSaving = false;
    state.screen = 'profile';
    render();
  } catch(e){
    state.avatarSaving = false;
    state.avatarError = t('errConnection') + e.message;
    render();
  }
}

function handleAvatarPhotoSelect(event){
  const file = event.target.files && event.target.files[0];
  if(!file) return;
  state.avatarError = '';
  const img = new Image();
  const reader = new FileReader();
  reader.onload = () => {
    img.onload = () => {
      // Center-crop to square, downscale to a small consistent size.
      const size = 320;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const srcSize = Math.min(img.width, img.height);
      const sx = (img.width - srcSize)/2, sy = (img.height - srcSize)/2;
      ctx.drawImage(img, sx, sy, srcSize, srcSize, 0, 0, size, size);
      canvas.toBlob(blob => { if(blob) uploadAvatarPhoto(blob); }, 'image/jpeg', 0.85);
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

async function uploadAvatarPhoto(blob){
  state.avatarSaving = true; state.avatarError=''; render();
  try{
    const res = await fetch('/api/avatar/photo/'+encodeURIComponent(state.currentUser), {
      method:'POST', headers:{'Content-Type':'image/jpeg'}, body: blob
    });
    const data = await res.json();
    if(!res.ok){ state.avatarError = data.error || t('errConnection'); state.avatarSaving=false; render(); return; }
    state.avatar = data.avatar;
    state.avatarSaving = false;
    state.screen = 'profile';
    render();
  } catch(e){
    state.avatarSaving = false;
    state.avatarError = t('errConnection') + e.message;
    render();
  }
}

function renderProfile(){
  const totalDone = Object.values(state.game.tracks).reduce((n,t)=>n+Object.keys(t.completed).length,0);
  const eta = nextHeartEta();
  const lvl = xpLevel(state.game.xp);
  const unlockedSet = new Set(state.game.achievements||[]);
  const badgeRow = ACHIEVEMENTS.map(a=>{
    const on = unlockedSet.has(a.key);
    return `<div title="${t(a.titleKey)} — ${t(a.descKey)}" style="width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:22px; background:rgba(255,255,255,${on?'.1':'.04'}); border:1px solid rgba(255,255,255,${on?'.18':'.08'}); opacity:${on?'1':'.35'}; filter:${on?'none':'grayscale(1)'};">${a.icon}</div>`;
  }).join('');
  return `
  ${topbar({back:'goHome()'})}
  <div class="profile ${appLangClass()}">
    <div class="profile-card" style="text-align:center; cursor:pointer;" onclick="openAvatarEditor()">
      ${renderAvatarHTML(state.currentUser, state.avatar, 72, true)}
      <div style="margin:0 auto;">
        <h2 style="margin-top:6px;">${t('basecampClimber')}</h2>
        <div style="color:var(--snow-dim); font-size:13px; margin-top:2px;">${t('signedInAs', {user: '<strong>'+state.currentUser+'</strong>', n: totalDone, s: totalDone===1?'':'s'})}</div>
        <div style="color:var(--gold); font-size:12px; margin-top:8px; font-weight:600;">${t('avatarEditLink')}</div>
      </div>
    </div>
    <div class="profile-grid">
      <div class="profile-card"><div class="val" style="font-family:var(--font-display); font-size:22px; color:var(--gold);">⭐ ${state.game.xp}</div><div class="lab" style="font-size:12px; color:var(--snow-dim); margin-top:4px;">${t('totalXP')}</div></div>
      <div class="profile-card"><div class="val" style="font-family:var(--font-display); font-size:22px; color:var(--gold);">🔥 ${state.game.streak}</div><div class="lab" style="font-size:12px; color:var(--snow-dim); margin-top:4px;">${t('dayStreak')}</div></div>
      <div class="profile-card"><div class="val" style="font-family:var(--font-display); font-size:22px; color:var(--gold);">${state.game.hearts}/${HEARTS_MAX}</div><div class="lab" style="font-size:12px; color:var(--snow-dim); margin-top:4px;">${t('heartsLabel')}${eta?t('nextInM',{n:eta}):''}</div></div>
      <div class="profile-card"><div class="val" style="font-family:var(--font-display); font-size:22px; color:var(--gold);">${totalDone}</div><div class="lab" style="font-size:12px; color:var(--snow-dim); margin-top:4px;">${t('modulesDoneLabel')}</div></div>
    </div>
    <div class="profile-card">
      <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;">
        <div style="font-weight:600;">${t('levelLabel',{n:lvl.level})}</div>
        <div style="font-size:12px; color:var(--snow-dim);">${lvl.into}/${lvl.span} ${t('xpToNextLevel')}</div>
      </div>
      <div class="progressbar"><div class="progressbar-fill" style="width:${lvl.into}%"></div></div>
    </div>
    <div class="profile-card">
      <div style="font-weight:600; margin-bottom:12px;">${t('achievementsLabel')} (${unlockedSet.size}/${ACHIEVEMENTS.length})</div>
      <div style="display:flex; flex-wrap:wrap; gap:8px;">${badgeRow}</div>
    </div>
    <div class="profile-card">
      <div style="font-weight:600; margin-bottom:12px;">${t('voiceSettings')}</div>
      <div style="font-size:12px; color:var(--snow-dim); margin-bottom:6px;">${t('englishVoice')}</div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:4px;">
        <button class="btn ${state.voicePref.en==='female'?'btn-primary':'btn-ghost'}" style="font-size:13px;" onclick="setVoicePref('en','female')">${t('voiceFemale')}</button>
        <button class="btn ${state.voicePref.en==='male'?'btn-primary':'btn-ghost'}" style="font-size:13px;" onclick="setVoicePref('en','male')">${t('voiceMale')}</button>
      </div>
      <div style="font-size:11px; color:var(--snow-dim); opacity:.8; margin-bottom:14px;">${t('englishVoiceNote')}</div>
      <div style="font-size:12px; color:var(--snow-dim); margin-bottom:6px;">${t('chineseVoice')}</div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
        <button class="btn ${state.voicePref.zh==='female'?'btn-primary':'btn-ghost'}" style="font-size:13px;" onclick="setVoicePref('zh','female')">${t('voiceFemale')}</button>
        <button class="btn ${state.voicePref.zh==='male'?'btn-primary':'btn-ghost'}" style="font-size:13px;" onclick="setVoicePref('zh','male')">${t('voiceMale')}</button>
      </div>
    </div>
    <button class="btn btn-ghost btn-block" onclick="resetProgress()">${t('resetAllProgress')}</button>
    <button class="btn btn-ghost btn-block" onclick="doLogout()">${t('logOut')}</button>
  </div>`;
}
function resetProgress(){
  if(!confirm(t('resetConfirm'))) return;
  state.game = defaultGame();
  saveGame();
  render();
}

// ---- navigation ---------------------------------------------------------------
function goHome(){ regenHearts(); state.screen='home'; render(); }
function goProfile(){ regenHearts(); state.screen='profile'; render(); }
function openTrack(id){ regenHearts(); state.currentTrack=id; state.screen='map'; render(); }

render();
</script>
