
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yeshe · ཡེ་ཤེས་ · 耶喜</title>
<meta name="description" content="Yeshe — learn English, Chinese and Tibetan through Tibetan. A gamified 40-module route from Base Camp to the Summit.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231B2A47'/%3E%3Cpath d='M15 72 L38 34 L50 52 L60 38 L85 72 Z' fill='%23F3F7FB'/%3E%3Ccircle cx='60' cy='26' r='7' fill='%23E8A33D'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Tibetan:wght@400;600;700&family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12213B;
    --sky-deep:#152647;
    --sky-mid:#233A66;
    --snow:#F5F8FC;
    --snow-dim:#DCE4F0;
    --gold:#E8A33D;
    --gold-dim:#B87F2A;
    --ice:#4FB4D8;
    --good:#3FAE72;
    --bad:#E1584B;
    --flag-blue:#3D6FB4;
    --flag-white:#F5F8FC;
    --flag-red:#C4443A;
    --flag-green:#4C9A63;
    --flag-yellow:#E3B23C;
    --radius:18px;
    --shadow: 0 10px 30px rgba(10,18,36,.35);
    --font-display:'Space Grotesk', 'Noto Sans Tibetan', sans-serif;
    --font-body:'Inter','Noto Sans SC','Noto Sans Tibetan',sans-serif;
    --font-bo:'Noto Sans Tibetan','Inter',sans-serif;
    --font-zh:'Noto Sans SC','Inter',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:var(--font-body);
    background:
      radial-gradient(1200px 600px at 50% -10%, #24406f 0%, transparent 60%),
      linear-gradient(180deg, var(--sky-deep) 0%, var(--sky-mid) 55%, #16283f 100%);
    color:var(--snow);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative; overflow-x:hidden;}
  h1,h2,h3{font-family:var(--font-display); margin:0; letter-spacing:.01em;}
  button{font-family:var(--font-body); cursor:pointer;}
  .lang-bo{font-family:var(--font-bo);}
  .lang-zh{font-family:var(--font-zh);}

  .flagstrip{display:flex; height:6px; width:100%;}
  .flagstrip span{flex:1;}
  .flagstrip span:nth-child(1){background:var(--flag-blue);}
  .flagstrip span:nth-child(2){background:var(--flag-white);}
  .flagstrip span:nth-child(3){background:var(--flag-red);}
  .flagstrip span:nth-child(4){background:var(--flag-green);}
  .flagstrip span:nth-child(5){background:var(--flag-yellow);}

  .topbar{display:flex; align-items:center; justify-content:space-between; padding:14px 18px; gap:10px;}
  .topbar .stat{display:flex; align-items:center; gap:5px; font-weight:600; font-size:14px; background:rgba(255,255,255,.06); padding:6px 10px; border-radius:999px; border:1px solid rgba(255,255,255,.08);}
  .iconbtn{background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.1); color:var(--snow); width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:18px;}
  .brand{display:flex; align-items:center; gap:8px; font-family:var(--font-display); font-weight:700; font-size:20px; letter-spacing:.02em;}
  .brand .peak{color:var(--gold);}

  .home{padding:8px 20px 40px; display:flex; flex-direction:column; gap:22px;}
  .hero{text-align:center; padding:22px 6px 6px;}
  .hero h1{font-size:34px; color:var(--snow);}
  .hero .sub{margin-top:8px; font-size:15px; color:var(--snow-dim); line-height:1.5;}
  .track-grid{display:grid; grid-template-columns:1fr; gap:14px;}
  .track-card{
    text-align:left; border:1px solid rgba(255,255,255,.1); border-radius:var(--radius);
    background:linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
    padding:18px; display:flex; align-items:center; gap:14px; color:var(--snow);
    box-shadow:var(--shadow); position:relative; overflow:hidden;
  }
  .track-card:active{transform:scale(.98);}
  .track-card .glyph{font-size:30px; width:54px; height:54px; border-radius:14px; display:flex; align-items:center; justify-content:center; background:rgba(232,163,61,.15); flex-shrink:0;}
  .track-card .tc-title{font-family:var(--font-display); font-weight:700; font-size:19px;}
  .track-card .tc-native{font-size:15px; color:var(--gold); margin-top:2px;}
  .track-card .tc-sub{font-size:12.5px; color:var(--snow-dim); margin-top:4px;}
  .track-card .tc-progress{margin-left:auto; font-size:12px; color:var(--snow-dim); text-align:right; flex-shrink:0;}

  .section-heading{font-size:12px; text-transform:uppercase; letter-spacing:.1em; color:var(--gold); font-weight:700; margin:0 2px -8px;}
  .stats-strip{
    display:flex; align-items:center; justify-content:space-between; width:100%; text-align:left;
    border:1px solid rgba(255,255,255,.1); border-radius:14px; padding:14px 16px;
    background:linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
    color:var(--snow); box-shadow:var(--shadow);
  }
  .stats-strip:active{transform:scale(.98);}
  .stats-strip .stat-chips{display:flex; gap:14px;}
  .stats-strip .stat-chip{display:flex; flex-direction:column; align-items:flex-start; gap:1px;}
  .stats-strip .stat-chip .v{font-family:var(--font-display); font-weight:700; font-size:16px;}
  .stats-strip .stat-chip .l{font-size:10px; color:var(--snow-dim);}
  .stats-strip .see-more{font-size:12px; color:var(--gold); font-weight:600; flex-shrink:0;}
  .practice-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .practice-tile{
    display:flex; flex-direction:column; align-items:center; gap:7px; text-align:center;
    border:1px solid rgba(255,255,255,.1); border-radius:16px; padding:16px 6px 12px;
    background:linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
    color:var(--snow); box-shadow:var(--shadow);
  }
  .practice-tile:active{transform:scale(.97);}
  .practice-tile .glyph{font-size:24px; width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; background:rgba(232,163,61,.15);}
  .practice-tile .pt-title{font-family:var(--font-display); font-weight:700; font-size:12.5px; line-height:1.25;}

  .map-wrap{flex:1; display:flex; flex-direction:column;}
  .map-scroll{flex:1; padding:20px 10px 50px; position:relative;}
  .route{position:relative; padding:10px 30px; display:flex; flex-direction:column; align-items:center; gap:56px;}
  .route::before{
    content:''; position:absolute; left:50%; top:20px; bottom:20px; width:4px; transform:translateX(-50%);
    background:repeating-linear-gradient(180deg, rgba(245,248,252,.35) 0 10px, transparent 10px 20px);
    z-index:0;
  }
  .node{position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:8px;}
  .node.left{align-self:flex-start; margin-left:6%;}
  .node.right{align-self:flex-end; margin-right:6%;}
  .node-btn{
    width:78px; height:78px; border-radius:50%; border:4px solid var(--sky-deep);
    display:flex; align-items:center; justify-content:center; font-size:28px;
    box-shadow:0 8px 0 rgba(0,0,0,.25), var(--shadow);
    background:linear-gradient(160deg,#DDB25E,var(--gold-dim));
  }
  .node-btn.locked{background:linear-gradient(160deg,#5b6b86,#3a465c); color:rgba(255,255,255,.6);}
  .node-btn.done{background:linear-gradient(160deg,#6BC98F,var(--good));}
  .node-btn:active{transform:translateY(4px); box-shadow:0 4px 0 rgba(0,0,0,.25);}
  .node-label{font-family:var(--font-display); font-weight:700; font-size:13px; text-align:center; max-width:126px;}
  .node-sub{font-size:11.5px; color:var(--snow-dim); text-align:center; max-width:130px;}
  .node-stars{display:flex; gap:2px; font-size:12px; color:var(--gold);}
  .world-block{position:relative; padding-top:6px; width:100%;}
  .world-title{text-align:center; font-family:var(--font-display); font-weight:700; font-size:16px; color:var(--snow); margin-bottom:2px;}
  .world-subtitle{text-align:center; font-size:12px; color:var(--gold); margin-bottom:18px;}

  .lesson{flex:1; display:flex; flex-direction:column; padding:0 20px 24px;}
  .progressbar{height:10px; border-radius:999px; background:rgba(255,255,255,.12); overflow:hidden; margin:6px 0 4px;}
  .progressbar-fill{height:100%; background:linear-gradient(90deg,var(--ice),var(--gold)); transition:width .35s ease;}
  .hearts-row{display:flex; gap:4px; font-size:16px;}
  .q-wrap{flex:1; display:flex; flex-direction:column; justify-content:center; gap:26px; padding:14px 0;}
  .q-card{text-align:center;}
  .q-eyebrow{font-size:12px; text-transform:uppercase; letter-spacing:.12em; color:var(--snow-dim); margin-bottom:10px;}
  .q-prompt{font-family:var(--font-display); font-size:36px; font-weight:700; line-height:1.25;}
  .q-prompt.script-bo{font-family:var(--font-bo); font-size:34px;}
  .q-prompt.script-zh{font-family:var(--font-zh); font-size:38px;}
  .q-prompt.long{font-size:22px; line-height:1.35;}
  .q-prompt.long.script-bo{font-size:21px;}
  .q-prompt.long.script-zh{font-size:24px;}
  .q-translit{margin-top:8px; color:var(--gold); font-size:15px; font-style:italic;}
  .options{display:grid; grid-template-columns:1fr; gap:12px;}
  .opt{
    border:2px solid rgba(255,255,255,.14); background:rgba(255,255,255,.05); color:var(--snow);
    border-radius:14px; padding:15px 16px; font-size:18px; font-weight:600; text-align:left;
    display:flex; flex-direction:column; gap:2px;
  }
  .opt .opt-sub{font-size:12px; font-weight:400; color:var(--snow-dim);}
  .opt.script-bo{font-family:var(--font-bo);}
  .opt.script-zh{font-family:var(--font-zh);}
  .opt.long{font-size:15px;}
  .opt:active{transform:scale(.98);}
  .opt.correct{border-color:var(--good); background:rgba(63,174,114,.22);}
  .opt.wrong{border-color:var(--bad); background:rgba(225,88,75,.22);}
  .opt.disabled{pointer-events:none; opacity:.55;}
  .opt.reveal{pointer-events:none;}

  .feedback-bar{position:sticky; bottom:0; margin:0 -20px -24px; padding:18px 20px 22px; display:flex; align-items:center; gap:14px;}
  .feedback-bar.good{background:rgba(63,174,114,.92);}
  .feedback-bar.bad{background:rgba(225,88,75,.92);}
  .feedback-bar .fb-text{flex:1;}
  .fb-title{font-family:var(--font-display); font-weight:700; font-size:16px;}
  .fb-sub{font-size:13px; opacity:.9; margin-top:2px;}
  .btn{
    border:none; border-radius:14px; padding:14px 18px; font-family:var(--font-display); font-weight:700;
    font-size:15px; letter-spacing:.02em; box-shadow:0 4px 0 rgba(0,0,0,.2);
  }
  .btn-primary{background:var(--gold); color:#241704;}
  .btn-primary:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.2);}
  .btn-light{background:var(--snow); color:var(--ink);}
  .btn-ghost{background:rgba(255,255,255,.12); color:var(--snow);}
  .btn-block{width:100%;}

  .complete{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px 26px; text-align:center; gap:18px;}
  .complete .medal{font-size:70px;}
  .complete h2{font-size:26px;}
  .stat-row{display:flex; gap:14px; width:100%;}
  .stat-box{flex:1; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); border-radius:14px; padding:14px 8px;}
  .stat-box .val{font-family:var(--font-display); font-size:22px; font-weight:700; color:var(--gold);}
  .stat-box .lab{font-size:11.5px; color:var(--snow-dim); margin-top:2px;}
  .stars-final{font-size:34px; letter-spacing:6px;}

  .locked-panel{padding:22px; text-align:center; background:rgba(255,255,255,.05); border:1px dashed rgba(255,255,255,.25); border-radius:16px; margin:10px 0;}
  .locked-panel h3{margin-bottom:6px;}
  .locked-panel p{color:var(--snow-dim); font-size:13.5px; line-height:1.5;}
  .roadmap-row{display:flex; gap:10px; align-items:baseline; padding:8px 2px; border-bottom:1px solid rgba(255,255,255,.08); text-align:left;}
  .roadmap-row:last-child{border-bottom:none;}
  .roadmap-num{color:var(--gold); font-family:var(--font-display); font-weight:700; font-size:13px; width:24px; flex-shrink:0;}
  .roadmap-label{font-size:14px;}

  .profile{padding:16px 20px 40px; display:flex; flex-direction:column; gap:16px;}
  .profile-card{background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); border-radius:16px; padding:18px;}
  .profile-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}

  /* ---- avatars: mascot (emoji composition) or uploaded photo ---------------- */
  @keyframes avatarBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
  .avatar-circle{
    position:relative; border-radius:50%; display:flex; align-items:center; justify-content:center;
    overflow:hidden; flex:none; background:linear-gradient(160deg,#3a4a6b,#233a66);
  }
  .avatar-circle.animated{animation:avatarBob 3s ease-in-out infinite;}
  .avatar-circle img{width:100%; height:100%; object-fit:cover;}
  .avatar-circle .avatar-base{display:flex; align-items:center; justify-content:center; width:100%; height:100%;}
  .avatar-bg-gray{background:linear-gradient(160deg,#8B95A6,#5B6576);}

  .avatar-picker-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
  .avatar-swatch{
    width:40px; height:40px; border-radius:50%; border:2px solid transparent; background:rgba(255,255,255,.08);
    display:flex; align-items:center; justify-content:center; font-size:20px; cursor:pointer; color:var(--snow);
  }
  .avatar-swatch.avatar-swatch-thumb{
    width:54px; height:54px; border-radius:14px; overflow:hidden; padding:0;
  }
  .avatar-swatch.avatar-swatch-thumb img{width:100%; height:100%; object-fit:cover;}
  .avatar-swatch.selected{border-color:var(--gold); box-shadow:0 0 0 2px rgba(232,163,61,.3); background:rgba(232,163,61,.15);}
  .avatar-tabs{display:flex; gap:8px; background:rgba(255,255,255,.06); border-radius:12px; padding:4px; margin-bottom:16px;}
  .avatar-tab{flex:1; border:none; background:transparent; color:var(--snow-dim); font-family:var(--font-display); font-weight:700; font-size:13px; padding:9px 0; border-radius:9px;}
  .avatar-tab.active{background:var(--gold); color:#241704;}

  .footer-note{text-align:center; font-size:11px; color:rgba(245,248,252,.4); padding:10px 30px 26px;}

  .auth-tabs{display:flex; gap:8px; background:rgba(255,255,255,.06); border-radius:12px; padding:4px; margin:4px 0 6px;}
  .auth-tab{flex:1; border:none; background:transparent; color:var(--snow-dim); font-family:var(--font-display); font-weight:700; font-size:14px; padding:10px 0; border-radius:9px;}
  .auth-tab.active{background:var(--gold); color:#241704;}
  .field{display:flex; flex-direction:column; gap:6px;}
  .field label{font-size:12.5px; color:var(--snow-dim); font-weight:600;}
  .field input{
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.14); border-radius:12px;
    padding:12px 14px; color:var(--snow); font-size:15px; font-family:var(--font-body);
  }
  .field input:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .algebra-input{
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.14); border-radius:12px;
    padding:12px 14px; color:var(--snow); font-family:var(--font-display);
  }
  .algebra-input:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .algebra-input::placeholder{color:var(--snow-dim); opacity:.6;}
  .stmt-table{width:100%; border-collapse:collapse; font-size:14px;}
  .stmt-row{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid rgba(255,255,255,.1);}
  .stmt-row:last-child{border-bottom:none; padding-top:10px; border-top:2px solid rgba(255,255,255,.25); font-weight:700;}
  .stmt-label{color:var(--snow-dim); flex:1;}
  .stmt-row:last-child .stmt-label{color:var(--snow);}
  .stmt-value{font-family:var(--font-display); font-weight:700; min-width:90px; text-align:right;}
  .stmt-input{
    width:100px; text-align:right; font-family:var(--font-display); font-weight:700; font-size:14px;
    background:rgba(255,255,255,.07); border:1px solid var(--gold); border-radius:8px; color:var(--snow); padding:6px 8px;
  }
  .stmt-value.stmt-correct{color:var(--good);}
  .stmt-value.stmt-wrong{color:var(--bad);}
  .biz-switch{width:48px; height:28px; border-radius:999px; background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.25); position:relative; flex-shrink:0; padding:0; cursor:pointer; transition:background .15s ease;}
  .biz-switch.on{background:var(--gold); border-color:var(--gold);}
  .biz-switch-knob{position:absolute; top:2px; left:2px; width:22px; height:22px; border-radius:50%; background:var(--snow); transition:left .15s ease; box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .biz-switch.on .biz-switch-knob{left:22px;}
  .auth-error{background:rgba(225,88,75,.18); border:1px solid rgba(225,88,75,.5); color:var(--snow); border-radius:10px; padding:10px 12px; font-size:13px;}

  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }
  ::selection{background:var(--gold); color:#241704;}
</style>
</head>

<div id="app"></div>

<script>
/* =========================================================================
   YESHE — data + engine
   Content lives in three places:
     WORDBANK      — one entry per vocabulary item (en / zh / bo + bo_tr / zh_py)
     LESSON_GROUPS — the 10 modules that make up Level 1 ("Base Camp"), fully built
     LEVELS        — the 4 levels on the route (mirrors a 40-module curriculum:
                      words → sentences → conversations → ideas). Only Level 1
                      has exercises; Levels 2–4 carry a numbered roadmap of
                      what's coming, shown as a "coming soon" panel — never
                      gated behind progress; every level is open any time.
   The four *courses* (English via Tibetan, Chinese via Tibetan, Tibetan via
   Chinese, Tibetan via English) are NOT separately authored — buildExercises()
   generates all four directions from this one shared word bank by swapping
   which language is the prompt and which is the answer.
   ========================================================================= */

// bo_tr is a rough Lhasa-dialect romanization for learner support only.
// IMPORTANT: this vocabulary was assembled for a working prototype and should
// be reviewed by a native Tibetan speaker/linguist and a Mandarin speaker
// before real learners use it (see README "Content review").
const WORDBANK = [
  // module 01 — greetings & introductions
  {id:'hello',    cat:'greetings', en:'Hello',     zh:'你好',   zh_py:'nǐ hǎo',   bo:'བཀྲ་ཤིས་བདེ་ལེགས', bo_tr:'tashi delek'},
  {id:'thankyou', cat:'greetings', en:'Thank you', zh:'谢谢',   zh_py:'xièxie',   bo:'ཐུགས་རྗེ་ཆེ',       bo_tr:'thuk-je-che'},
  {id:'yes',      cat:'greetings', en:'Yes',       zh:'是',     zh_py:'shì',      bo:'ཡིན',              bo_tr:'yin'},
  {id:'no',       cat:'greetings', en:'No',        zh:'不是',   zh_py:'bú shì',   bo:'མིན',              bo_tr:'min'},
  {id:'goodbye',  cat:'greetings', en:'Goodbye',   zh:'再见',   zh_py:'zàijiàn',  bo:'བདེ་མོ་གནང་',       bo_tr:'de-mo nang'},
  {id:'sorry',    cat:'greetings', en:'Sorry',     zh:'对不起', zh_py:'duìbùqǐ',  bo:'དགོངས་དག',          bo_tr:'gong-dak'},
  // module 02 — numbers & counting
  {id:'one',   cat:'numbers', en:'One',   zh:'一', zh_py:'yī',  bo:'གཅིག',  bo_tr:'chik'},
  {id:'two',   cat:'numbers', en:'Two',   zh:'二', zh_py:'èr',  bo:'གཉིས',  bo_tr:'nyi'},
  {id:'three', cat:'numbers', en:'Three', zh:'三', zh_py:'sān', bo:'གསུམ',  bo_tr:'sum'},
  {id:'four',  cat:'numbers', en:'Four',  zh:'四', zh_py:'sì',  bo:'བཞི',   bo_tr:'zhi'},
  {id:'five',  cat:'numbers', en:'Five',  zh:'五', zh_py:'wǔ',  bo:'ལྔ',    bo_tr:'nga'},
  {id:'six',   cat:'numbers', en:'Six',   zh:'六', zh_py:'liù', bo:'དྲུག',  bo_tr:'druk'},

  {id:'sent999', cat:'advanced2', en:'If you study hard, you will gradually improve.', zh:'努力学习的话，就会逐渐进步。', bo:'སྦྱོང་བརྩོན་བྱས་ན་རིམ་བཞིན་ཡར་རྒྱས་འགྲོ་གི་རེད།'},
  {id:'sent1000', cat:'advanced2', en:'I want to learn Tibetan well and communicate with many people in Tibetan.', zh:'我想学好藏文，用藏语和很多人交流。', bo:'ངས་བོད་ཡིག་ཡག་པོ་སྦྱོང་ནས་མི་མང་པོ་དང་བོད་སྐད་ཀྱིས་ཁ་བརྡ་བྱེད་འདོད།'},
  // Corporate Finance module 1 — Corporate Finance Basics
  {id:'cf1', cat:'corpfin', en:'Corporate finance is a field concerned with the financial management of a company.', zh:'企业财务是关于公司财务管理的一门学科。', bo:'ཁེ་ལས་དངུལ་རྩ་ནི་ཁེ་ལས་ཀྱི་དངུལ་རྩའི་དོ་དམ་སྐོར་གྱི་རིག་ཚན་ཞིག་ཡིན།'},
  {id:'cf2', cat:'corpfin', en:'How a company should raise money is very important.', zh:'公司应该如何筹集资金非常重要。', bo:'ཁེ་ལས་ཀྱིས་དངུལ་ཇི་ལྟར་བསྡུ་དགོས་པ་གལ་ཆེན་པོ་ཡིན།'},
  {id:'cf3', cat:'corpfin', en:'How a company should use money is also very important.', zh:'公司应该如何使用资金也同样重要。', bo:'ཁེ་ལས་ཀྱིས་དངུལ་ཇི་ལྟར་བཀོལ་དགོས་པའང་གལ་ཆེན་པོ་ཡིན།'},
  {id:'cf4', cat:'corpfin', en:'The goal of corporate finance is to increase the value of the company.', zh:'企业财务的目标是提升公司的价值。', bo:'ཁེ་ལས་དངུལ་རྩའི་དམིགས་ཡུལ་ནི་ཁེ་ལས་ཀྱི་རིན་ཐང་འཕེལ་བ་ཡིན།'},
  {id:'cf5', cat:'corpfin', en:'The value of a company is related to financial decisions.', zh:'公司的价值与财务决策有关。', bo:'ཁེ་ལས་ཀྱི་རིན་ཐང་ནི་དངུལ་རྩའི་ཐག་གཅོད་དང་འབྲེལ་བ་ཡོད།'},
  {id:'cf6', cat:'corpfin', en:'The financial manager analyzes the company\'s financial situation.', zh:'财务经理分析公司的财务状况。', bo:'དངུལ་རྩའི་དོ་དམ་པས་ཁེ་ལས་ཀྱི་དངུལ་རྩའི་གནས་སྟངས་ལ་དཔྱད་པ་བྱེད།'},
  {id:'cf7', cat:'corpfin', en:'A company can obtain capital through different channels.', zh:'公司可以通过不同的渠道获得资本。', bo:'ཁེ་ལས་ཀྱིས་མ་རྩ་མ་འདྲ་བའི་ལམ་ནས་ཐོབ་ཐུབ།'},
  {id:'cf8', cat:'corpfin', en:'Capital is the money needed for a company to expand its business.', zh:'资本是公司扩展业务所需的资金。', bo:'མ་རྩ་ནི་ཁེ་ལས་ཀྱི་ལས་གཞི་སྤེལ་བར་མཁོ་བའི་དངུལ་ཡིན།'},
  {id:'cf9', cat:'corpfin', en:'The capital structure affects the company\'s risk.', zh:'资本结构会影响公司的风险。', bo:'མ་རྩའི་གྲུབ་ཚུལ་གྱིས་ཁེ་ལས་ཀྱི་ཉེན་ཁ་ལ་ཤུགས་རྐྱེན་ཐེབས།'},
  {id:'cf10', cat:'corpfin', en:'A company needs a financial plan.', zh:'公司需要一份财务计划。', bo:'ཁེ་ལས་ཀྱིས་དངུལ་རྩའི་འཆར་གཞི་ཞིག་དགོས།'},
  {id:'cf11', cat:'corpfin', en:'The financial plan forecasts future financial needs.', zh:'财务计划预测未来的资金需求。', bo:'དངུལ་རྩའི་འཆར་གཞིས་མ་འོངས་པའི་དངུལ་རྩའི་དགོས་མཁོ་སྔོན་དཔག་བྱེད།'},
  {id:'cf12', cat:'corpfin', en:'A company should set clear financial targets.', zh:'公司应该设立明确的财务目标。', bo:'ཁེ་ལས་ཀྱིས་དངུལ་རྩའི་དམིགས་ཚད་གསལ་པོ་འཛུགས་དགོས།'},
  {id:'cf13', cat:'corpfin', en:'A company\'s profit is an important financial result.', zh:'公司的利润是重要的财务成果。', bo:'ཁེ་ལས་ཀྱི་ཁེ་བཟང་ནི་དངུལ་རྩའི་གྲུབ་འབྲས་གལ་ཆེན་ཞིག་ཡིན།'},
  {id:'cf14', cat:'corpfin', en:'If profit is high, the company\'s value can increase.', zh:'如果利润高，公司的价值就能提升。', bo:'ཁེ་བཟང་ཆེ་ན་ཁེ་ལས་ཀྱི་རིན་ཐང་འཕེལ་ཐུབ།'},
  {id:'cf15', cat:'corpfin', en:'Attention must also be paid to the flow of cash.', zh:'也需要关注现金的流动。', bo:'དངུལ་རྐྱང་གི་འགྲོ་འོང་ལའང་དོ་སྣང་བྱེད་དགོས།'},
  {id:'cf16', cat:'corpfin', en:'A company\'s cash flow is very important.', zh:'公司的现金流非常重要。', bo:'ཁེ་ལས་ཀྱི་དངུལ་རྐྱང་འབབ་རྒྱུན་ནི་གལ་ཆེན་པོ་ཡིན།'},
  {id:'cf17', cat:'corpfin', en:'A company may face difficulties without cash.', zh:'公司如果没有现金可能会遇到困难。', bo:'ཁེ་ལས་ཀྱིས་དངུལ་རྐྱང་མེད་པར་དཀའ་ངལ་འཕྲད་སྲིད།'},
  {id:'cf18', cat:'corpfin', en:'Having cash gives the company flexibility.', zh:'拥有现金能给公司带来灵活性。', bo:'དངུལ་རྐྱང་ཡོད་པས་ཁེ་ལས་ལ་གཤིས་བབ་ཀྱི་ནུས་པ་སྤྲོད།'},
  {id:'cf19', cat:'corpfin', en:'A company must account for future cash flow.', zh:'公司必须核算未来的现金流。', bo:'ཁེ་ལས་ཀྱིས་མ་འོངས་པའི་དངུལ་རྐྱང་འབབ་རྒྱུན་བརྩི་དགོས།'},
  {id:'cf20', cat:'corpfin', en:'Every financial decision carries risk.', zh:'每一项财务决策都有风险。', bo:'དངུལ་རྩའི་ཐག་གཅོད་རེ་རེར་ཉེན་ཁ་ཡོད།'},
  // Corporate Finance module 2 — Financial Statements

  {id:'cf22', cat:'corpfin', en:'There are three main financial statements.', zh:'主要的财务报表有三种。', bo:'རྩིས་ཁྲ་གཙོ་བོ་གསུམ་ཡོད།'},

  {id:'cf24', cat:'corpfin', en:'There is also an income statement.', zh:'也有一份损益表。', bo:'ཁེ་གྱོང་རྩིས་ཁྲ་ཞིག་ཀྱང་ཡོད།'},
  {id:'cf25', cat:'corpfin', en:'There is also a cash flow statement.', zh:'也有一份现金流量表。', bo:'དངུལ་རྐྱང་འབབ་རྒྱུན་རྩིས་ཁྲ་ཞིག་ཀྱང་ཡོད།'},
  {id:'cf26', cat:'corpfin', en:'Fixed assets are important assets of a company.', zh:'固定资产是公司重要的资产。', bo:'གཏན་འཇགས་རྒྱུ་དངོས་ནི་ཁེ་ལས་ཀྱི་རྒྱུ་དངོས་གལ་ཆེན་ཞིག་ཡིན།'},
  {id:'cf27', cat:'corpfin', en:'Cash is part of a company\'s assets.', zh:'现金是资产的一部分。', bo:'དངུལ་རྐྱང་ནི་རྒྱུ་དངོས་ཀྱི་ཆ་ཤས་ཡིན།'},
  {id:'cf28', cat:'corpfin', en:'Debt is a company\'s liability.', zh:'债务是公司的负债。', bo:'བུ་ལོན་ནི་ཁེ་ལས་ཀྱི་འགན་འཁྲི་ཡིན།'},
  {id:'cf29', cat:'corpfin', en:'Equity capital represents the owner\'s rights.', zh:'股权资本代表所有者的权益。', bo:'བདག་དབང་མ་རྩ་ནི་བདག་པོའི་དབང་ཆ་མཚོན་པ་ཡིན།'},
  {id:'cf30', cat:'corpfin', en:'The balance between assets and liabilities is very important.', zh:'资产与负债之间的平衡非常重要。', bo:'རྒྱུ་དངོས་དང་བུ་ལོན་གྱི་དོ་མཉམ་གལ་ཆེན་པོ་ཡིན།'},
  {id:'cf31', cat:'corpfin', en:'If a company\'s assets increase, its capital may also increase.', zh:'如果公司的资产增加，资本也可能随之增加。', bo:'ཁེ་ལས་ཀྱི་རྒྱུ་དངོས་འཕེལ་ན་མ་རྩའང་འཕེལ་སྲིད།'},
  {id:'cf32', cat:'corpfin', en:'If debt is too much, risk may increase.', zh:'如果债务过多，风险可能会增加。', bo:'བུ་ལོན་མང་དྲགས་ན་ཉེན་ཁ་འཕེལ་སྲིད།'},
  {id:'cf33', cat:'corpfin', en:'Reading financial statements is the basis of financial work.', zh:'阅读财务报表是财务工作的基础。', bo:'རྩིས་ཁྲ་ཀློག་པ་ནི་དངུལ་རྩའི་ལས་ཀའི་གཞི་རྩ་ཡིན།'},
  {id:'cf34', cat:'corpfin', en:'Based on financial statements, a company\'s condition can be analyzed.', zh:'根据财务报表可以分析公司的状况。', bo:'རྩིས་ཁྲ་ལ་བརྟེན་ནས་ཁེ་ལས་ཀྱི་གནས་བབ་དཔྱད་ཐུབ།'},
  {id:'cf35', cat:'corpfin', en:'The income statement shows the company\'s revenue.', zh:'损益表显示公司的收入。', bo:'ཁེ་གྱོང་རྩིས་ཁྲས་ཁེ་ལས་ཀྱི་ཡོང་འབབ་སྟོན།'},
  {id:'cf36', cat:'corpfin', en:'Revenue is the foundation of a company\'s survival.', zh:'收入是公司生存的基础。', bo:'ཡོང་འབབ་ནི་ཁེ་ལས་ཀྱི་འཚོ་གནས་ཀྱི་གཞི་རྩ་ཡིན།'},
  {id:'cf37', cat:'corpfin', en:'Expenses are the company\'s spending.', zh:'支出是公司的花费。', bo:'ཟད་གྲོན་ནི་ཁེ་ལས་ཀྱི་དངུལ་གཏོང་སྒོ་ཡིན།'},
  {id:'cf38', cat:'corpfin', en:'Profit is obtained after subtracting expenses from revenue.', zh:'收入减去支出后得到利润。', bo:'ཡོང་འབབ་ནས་ཟད་གྲོན་ཕུད་རྗེས་ཁེ་བཟང་ཐོབ།'},
  {id:'cf39', cat:'corpfin', en:'Profit is the difference between revenue and expenses.', zh:'利润是收入与支出之间的差额。', bo:'ཁེ་བཟང་ནི་ཡོང་འབབ་དང་ཟད་གྲོན་གྱི་ཁྱད་པར་ཡིན།'},
  {id:'cf40', cat:'corpfin', en:'Financial statements have different time periods.', zh:'财务报表有不同的时间区间。', bo:'རྩིས་ཁྲ་ལ་དུས་ཚོད་ཀྱི་བར་ཁྱད་ཡོད།'},
  // Corporate Finance module 3 — Cash Flow
  {id:'cf41', cat:'corpfin', en:'Cash flow is the movement of cash.', zh:'现金流是现金的流入和流出。', bo:'དངུལ་རྐྱང་འབབ་རྒྱུན་ནི་དངུལ་རྐྱང་གི་འགྲོ་འོང་ཡིན།'},

  {id:'cf147', cat:'corpfin', en:'A company estimates the cost of capital.', zh:'公司会估算资本成本。', bo:'ཁེ་ལས་ཀྱིས་མ་རྩའི་གྲོན་གྲོན་ཚོད་དཔག་བྱེད།'},

  {id:'cf153', cat:'corpfin', en:'Money now has greater value.', zh:'现在的钱价值更高。', bo:'ད་ལྟའི་དངུལ་ལ་རིན་ཐང་ཆེ་བ་ཡོད།'},

  {id:'cf157', cat:'corpfin', en:'Future cash can be discounted to present value.', zh:'未来的现金可以折算为现值。', bo:'མ་འོངས་དངུལ་རྐྱང་ད་ལྟའི་རིན་ཐང་ལ་ཕབ་ཐུབ།'},
  {id:'cf158', cat:'corpfin', en:'The discount rate is the rate used to discount cash.', zh:'折现率是用于折算现金的比率。', bo:'ཕབ་ཚད་ནི་དངུལ་རྐྱང་ཕབ་པའི་ཚད་ཡིན།'},

  {id:'cf162', cat:'corpfin', en:'As time lengthens, the effect of discounting grows.', zh:'随着时间的延长，折现的影响也会增大。', bo:'དུས་ཚོད་རིང་བ་དང་མཉམ་དུ་ཕབ་པའི་ཤུགས་འཕེལ།'},
  {id:'cf163', cat:'corpfin', en:'The value of money is also related to risk.', zh:'货币的价值也与风险有关。', bo:'དངུལ་གྱི་རིན་ཐང་ལ་ཉེན་ཁ་ཡང་འབྲེལ་བ་ཡོད།'},

  {id:'cf174', cat:'corpfin', en:'Revenue forecasting is part of valuation.', zh:'收入预测是估值的一部分。', bo:'ཡོང་འབབ་ཀྱི་སྔོན་དཔག་ནི་རིན་ཐང་དཔྱད་པའི་ཆ་ཤས་ཡིན།'},

  {id:'cf176', cat:'corpfin', en:'A forecast of capital investment is needed.', zh:'需要对资本投资进行预测。', bo:'མ་རྩའི་མ་འཇོག་གི་སྔོན་དཔག་དགོས།'},
  {id:'cf177', cat:'corpfin', en:'Cash flow forecasting is very important.', zh:'现金流预测非常重要。', bo:'དངུལ་རྐྱང་གི་སྔོན་དཔག་ནི་གལ་ཆེན་པོ་ཡིན།'},

  // Corporate Finance module 11 — Discounted Cash Flow

  {id:'cf185', cat:'corpfin', en:'The length of the forecast period varies.', zh:'预测期的长短各不相同。', bo:'སྔོན་དཔག་གི་དུས་ཡུན་རིང་ཐུང་ཡོད།'},

  {id:'cf187', cat:'corpfin', en:'The growth rate of cash is important.', zh:'现金的增长率很重要。', bo:'དངུལ་རྐྱང་གི་འཕེལ་ཚད་གལ་ཆེ།'},
  {id:'cf188', cat:'corpfin', en:'If the growth rate is high, value may increase.', zh:'如果增长率高，价值可能会增加。', bo:'འཕེལ་ཚད་མཐོ་ན་རིན་ཐང་འཕེལ་སྲིད།'},
  {id:'cf189', cat:'corpfin', en:'If the growth rate is low, value may be low.', zh:'如果增长率低，价值可能较低。', bo:'འཕེལ་ཚད་དམའ་ན་རིན་ཐང་དམའ་སྲིད།'},
  {id:'cf190', cat:'corpfin', en:'The discounted cash flow method looks at the future company.', zh:'现金流折现法着眼于公司的未来。', bo:'དངུལ་རྐྱང་ཕབ་པའི་ཐབས་ཀྱིས་མ་འོངས་ཁེ་ལས་ལ་ལྟ།'},
  {id:'cf191', cat:'corpfin', en:'Valuation requires data.', zh:'估值需要数据。', bo:'རིན་ཐང་དཔྱད་པར་གཞི་གྲངས་དགོས།'},
  {id:'cf192', cat:'corpfin', en:'If the data is wrong, the valuation may also be wrong.', zh:'如果数据有误，估值也可能出错。', bo:'གཞི་གྲངས་ནོར་ན་རིན་ཐང་དཔྱད་པའང་ནོར་སྲིད།'},
  {id:'cf193', cat:'corpfin', en:'The company\'s history can be used for cash forecasting.', zh:'可以利用公司的历史数据进行现金预测。', bo:'དངུལ་རྐྱང་སྔོན་དཔག་ལ་ཁེ་ལས་ཀྱི་ལོ་རྒྱུས་བཀོལ་ཐུབ།'},
  {id:'cf194', cat:'corpfin', en:'Market conditions must also be analyzed.', zh:'也必须分析市场情况。', bo:'ཁྲོམ་རའི་གནས་ཚུལ་ཀྱང་དཔྱད་དགོས།'},

  {id:'ec33', cat:'econ', en:'Macroeconomics studies a nation\'s economy.', zh:'宏观经济学研究一个国家的经济。', bo:'སྤྱི་ཁོག་དཔལ་འབྱོར་གྱིས་རྒྱལ་ཁབ་ཀྱི་དཔལ་འབྱོར་ལ་ཞིབ་འཇུག་བྱེད།'},
  {id:'ec34', cat:'econ', en:'Economics pays attention to how much a country produces.', zh:'经济学关注一个国家的生产多少。', bo:'རྒྱལ་ཁབ་ཀྱི་ཐོན་སྐྱེད་མང་ཉུང་ལ་དཔལ་འབྱོར་གྱིས་དོ་སྣང་བྱེད།'},

  {id:'ec36', cat:'econ', en:'A country\'s standard of living is related to its economy.', zh:'一个国家的生活水平与经济相关。', bo:'རྒྱལ་ཁབ་ཀྱི་འཚོ་བའི་ཆུ་ཚད་དཔལ་འབྱོར་དང་འབྲེལ་ཡོད།'},

  {id:'ec39', cat:'econ', en:'Economics analyzes many issues.', zh:'经济学分析很多问题。', bo:'དཔལ་འབྱོར་རིག་པས་གནད་དོན་མང་པོ་དབྱེ་ཞིབ་བྱེད།'},
  {id:'ec40', cat:'econ', en:'Statistics are important for economic analysis.', zh:'统计数据对经济分析很重要。', bo:'གྲངས་ཐོ་ནི་དཔལ་འབྱོར་དབྱེ་ཞིབ་ལ་གལ་ཆེན་ཡིན།'},
  {id:'ec41', cat:'econ', en:'If statistics are accurate, they help analysis.', zh:'如果统计数据准确，就有助于分析。', bo:'གྲངས་ཐོ་ཡང་དག་པ་ཡིན་ན་དབྱེ་ཞིབ་ལ་ཕན་ཐོགས།'},
  {id:'ec42', cat:'econ', en:'Economists analyze based on data.', zh:'经济学家依据数据进行分析。', bo:'དཔལ་འབྱོར་པས་གཞི་གྲངས་ལ་བརྟེན་ནས་དབྱེ་ཞིབ་བྱེད།'},
  {id:'ec43', cat:'econ', en:'Economic conditions change over time.', zh:'经济状况随时间变化。', bo:'དཔལ་འབྱོར་གྱི་གནས་ཚུལ་དུས་དང་བསྟུན་ནས་འགྱུར་གྱི་ཡོད།'},
  {id:'ec44', cat:'econ', en:'Market prices may change daily.', zh:'市场价格可能每天变化。', bo:'ཁྲོམ་རའི་རིན་གོང་ཉིན་རེར་འགྱུར་སྲིད།'},
  {id:'ec45', cat:'econ', en:'People\'s needs may also change.', zh:'人们的需求也可能发生变化。', bo:'མི་ཚོའི་དགོས་མཁོ་ཡང་འགྱུར་སྲིད།'},
  {id:'ec46', cat:'econ', en:'A business\'s plan depends on economic conditions.', zh:'企业的计划取决于经济状况。', bo:'ཁེ་ལས་ཀྱི་འཆར་གཞི་དཔལ་འབྱོར་གནས་ཚུལ་ལ་བརྟེན་གྱི་ཡོད།'},
  {id:'ec47', cat:'econ', en:'One country\'s economy is connected to others.', zh:'一个国家的经济与其他国家相关。', bo:'རྒྱལ་ཁབ་གཅིག་གི་དཔལ་འབྱོར་ནི་རྒྱལ་ཁབ་གཞན་དང་འབྲེལ་ཡོད།'},
  {id:'ec48', cat:'econ', en:'Countries trade with one another.', zh:'各国相互进行贸易。', bo:'རྒྱལ་ཁབ་ཚོས་ཕན་ཚུན་ཚོང་རྒྱག་གི་ཡོད།'},
  {id:'ec49', cat:'econ', en:'International trade connects many countries.', zh:'国际贸易连接着许多国家。', bo:'རྒྱལ་སྤྱིའི་ཚོང་ལས་རྒྱལ་ཁབ་མང་པོ་འབྲེལ་བ་བྱེད།'},
  {id:'ec50', cat:'econ', en:'Studying economics helps understand trade conditions.', zh:'学习经济学有助于理解贸易情况。', bo:'དཔལ་འབྱོར་རིག་པ་སློབ་པས་ཉོ་ཚོང་གི་གནས་ཚུལ་རྟོགས་ཐུབ།'},
  // Economics module 2 — Supply & Demand
  {id:'ec51', cat:'econ', en:'Demand is the quantity of goods people want to buy.', zh:'需求是人们想要购买的商品数量。', bo:'དགོས་མཁོ་ནི་མི་ཚོས་ཉོ་འདོད་པའི་ཐོན་རྫས་ཀྱི་ཚད་ཡིན།'},
  {id:'ec52', cat:'econ', en:'Supply is the quantity sellers can provide.', zh:'供给是卖方能够提供的数量。', bo:'མཁོ་སྤྲོད་ནི་བཙོང་མཁན་གྱིས་མཁོ་འདོན་བྱེད་ཐུབ་པའི་ཚད་ཡིན།'},
  {id:'ec53', cat:'econ', en:'Both demand and supply affect market prices.', zh:'需求和供给都会影响市场价格。', bo:'དགོས་མཁོ་དང་མཁོ་སྤྲོད་གཉིས་ཀྱིས་ཁྲོམ་རའི་རིན་གོང་ལ་ཤུགས་རྐྱེན་བྱེད།'},
  {id:'ec54', cat:'econ', en:'If the price is low, demand may be higher.', zh:'如果价格低，需求可能会更多。', bo:'རིན་གོང་དམའ་བ་ཡིན་ན་དགོས་མཁོ་མང་བ་ཡོང་སྲིད།'},
  {id:'ec55', cat:'econ', en:'If the price is high, demand may be lower.', zh:'如果价格高，需求可能会较少。', bo:'རིན་གོང་མཐོ་བ་ཡིན་ན་དགོས་མཁོ་ཉུང་བ་ཡོང་སྲིད།'},
  {id:'ec56', cat:'econ', en:'If the price is high, businesses may supply more.', zh:'如果价格高，企业可能会提供更多供给。', bo:'རིན་གོང་མཐོ་བ་ཡིན་ན་ཁེ་ལས་ཀྱིས་མཁོ་སྤྲོད་མང་བ་བྱེད་སྲིད།'},
  {id:'ec57', cat:'econ', en:'If the price is low, supply may be less.', zh:'如果价格低，供给可能会较少。', bo:'རིན་གོང་དམའ་བ་ཡིན་ན་མཁོ་སྤྲོད་ཉུང་བ་བྱེད་སྲིད།'},
  {id:'ec58', cat:'econ', en:'The demand curve represents the relationship between demand and price.', zh:'需求曲线体现了需求与价格之间的关系。', bo:'དགོས་མཁོའི་ཐིག་ནི་དགོས་མཁོ་དང་རིན་གོང་གི་འབྲེལ་བ་མཚོན་པ་ཡིན།'},
  {id:'ec59', cat:'econ', en:'The supply curve represents the relationship between supply and price.', zh:'供给曲线体现了供给与价格之间的关系。', bo:'མཁོ་སྤྲོད་ཀྱི་ཐིག་གིས་མཁོ་སྤྲོད་དང་རིན་གོང་གི་འབྲེལ་བ་མཚོན།'},
  {id:'ec60', cat:'econ', en:'Where demand and supply meet is market equilibrium.', zh:'需求与供给相遇之处就是市场均衡。', bo:'དགོས་མཁོ་དང་མཁོ་སྤྲོད་འཕྲད་ས་ལ་ཁྲོམ་རའི་ཚད་སྙོམས་ཡོད།'},
  {id:'ec61', cat:'econ', en:'The equilibrium price is the price determined by the market.', zh:'均衡价格是由市场决定的价格。', bo:'ཚད་སྙོམས་རིན་གོང་ནི་ཁྲོམ་རས་གཏན་འཁེལ་བྱས་པའི་རིན་གོང་ཞིག་ཡིན།'},
  {id:'ec62', cat:'econ', en:'The equilibrium quantity is related to the amount traded.', zh:'均衡数量与交易的数量有关。', bo:'ཚད་སྙོམས་ཚད་ནི་ཉོ་ཚོང་གི་ཚད་དང་འབྲེལ་ཡོད།'},
  {id:'ec63', cat:'econ', en:'If demand increases, the price may rise.', zh:'如果需求增加，价格可能会上涨。', bo:'དགོས་མཁོ་འཕར་ན་རིན་གོང་འཕར་སྲིད།'},
  {id:'ec64', cat:'econ', en:'If supply increases, the price may fall.', zh:'如果供给增加，价格可能会下降。', bo:'མཁོ་སྤྲོད་འཕར་ན་རིན་གོང་དམའ་རུ་འགྲོ་སྲིད།'},
  {id:'ec65', cat:'econ', en:'If demand falls, sales volume may also fall.', zh:'如果需求减少，销售量也可能减少。', bo:'དགོས་མཁོ་ཆག་ན་བཙོང་ཚད་ཀྱང་ཆག་སྲིད།'},
  {id:'ec66', cat:'econ', en:'If supply falls, market prices may rise.', zh:'如果供给减少，市场价格可能会上涨。', bo:'མཁོ་སྤྲོད་ཆག་ན་ཁྲོམ་རའི་རིན་གོང་འཕར་སྲིད།'},
  {id:'ec67', cat:'econ', en:'There are many factors that affect prices.', zh:'有很多因素会影响价格。', bo:'རིན་གོང་ལ་ཤུགས་རྐྱེན་བྱེད་པའི་རྒྱུ་མང་པོ་ཡོད།'},
  {id:'ec68', cat:'econ', en:'If people\'s income rises, demand may increase.', zh:'如果人们的收入增加，需求可能会增加。', bo:'མི་ཚོའི་ཡོང་འབབ་འཕར་ན་དགོས་མཁོ་འཕར་སྲིད།'},
  {id:'ec69', cat:'econ', en:'If the price of one good rises, demand for its substitute may increase.', zh:'如果一种商品的价格上涨，其替代品的需求可能会增加。', bo:'ཐོན་རྫས་གཅིག་གི་རིན་གོང་འཕར་ན་ཚབ་རྫས་ལ་དགོས་མཁོ་འཕར་སྲིད།'},
  {id:'ec70', cat:'econ', en:'A substitute good is a good that can be used in place of another.', zh:'替代品是可以用来替代另一种商品的商品。', bo:'ཚབ་རྫས་ནི་ཐོན་རྫས་གཅིག་གི་ཚབ་ཏུ་སྤྱོད་ཐུབ་པའི་ཐོན་རྫས་ཡིན།'},
  {id:'ec71', cat:'econ', en:'Complementary goods are goods needed together.', zh:'互补品是需要一起使用的商品。', bo:'ཟུར་སྤྱོད་ཐོན་རྫས་ནི་ཕན་ཚུན་ལ་དགོས་པའི་ཐོན་རྫས་ཡིན།'},
  {id:'ec72', cat:'econ', en:'A phone and its charger are related complementary goods.', zh:'手机和它的充电器是相互关联的互补品。', bo:'ཁ་པར་དང་ཁ་པར་གྱི་གློག་སྒྲོན་ནི་ཕན་ཚུན་འབྲེལ་བའི་ཐོན་རྫས་ཡིན།'},
  {id:'ec73', cat:'econ', en:'Changes in demand sensitivity affect trading volume.', zh:'需求敏感度的变化会影响交易量。', bo:'དགོས་མཁོའི་གཤིས་འགྱུར་གྱིས་ཉོ་ཚོང་གི་ཚད་ལ་ཤུགས་རྐྱེན་བྱེད།'},
  {id:'ec74', cat:'econ', en:'Goods with high demand sensitivity have prices that change easily.', zh:'需求敏感度高的商品，其价格容易发生变化。', bo:'དགོས་མཁོའི་གཤིས་འགྱུར་ཆེ་བའི་ཐོན་རྫས་ཀྱི་རིན་གོང་འགྱུར་སླ་བ་ཡིན།'},
  {id:'ec75', cat:'econ', en:'Supply sensitivity is also important to the market.', zh:'供给敏感度对市场也很重要。', bo:'མཁོ་སྤྲོད་ཀྱི་གཤིས་འགྱུར་ཡང་ཁྲོམ་རར་གལ་ཆེན་ཡིན།'},
  {id:'ec76', cat:'econ', en:'If there are more sellers, supply may be greater.', zh:'如果卖方增多，供给可能会更多。', bo:'བཙོང་མཁན་མང་ན་མཁོ་སྤྲོད་མང་བ་ཡོང་སྲིད།'},
  {id:'ec77', cat:'econ', en:'If production costs fall, supply may increase.', zh:'如果生产成本下降，供给可能会增加。', bo:'ཐོན་སྐྱེད་ཀྱི་གོང་གུད་ཆག་ན་མཁོ་སྤྲོད་འཕར་སྲིད།'},
  {id:'ec78', cat:'econ', en:'If factory wages rise, production costs may increase.', zh:'如果工厂工资上涨，生产成本可能会增加。', bo:'བཟོ་གྲྭའི་གླ་ཆ་འཕར་ན་ཐོན་སྐྱེད་གོང་གུད་འཕར་སྲིད།'},
  {id:'ec79', cat:'econ', en:'If material prices rise, a business\'s costs may increase.', zh:'如果原材料价格上涨，企业的成本可能会增加。', bo:'རྒྱུ་ཆའི་རིན་གོང་འཕར་ན་ཁེ་ལས་ཀྱི་གོང་གུད་འཕར་སྲིད།'},
  {id:'ec80', cat:'econ', en:'Price is a signal of the market.', zh:'价格是市场的信号。', bo:'རིན་གོང་ནི་ཁྲོམ་རའི་བརྡ་རྟགས་ཤིག་ཡིན།'},
  {id:'ec81', cat:'econ', en:'Price helps buyers make choices.', zh:'价格帮助买方做出选择。', bo:'རིན་གོང་གིས་ཉོ་མཁན་ལ་གདམ་ག་བྱེད་པར་རོགས་བྱེད།'},
  {id:'ec82', cat:'econ', en:'Price signals to sellers what and how much to produce.', zh:'价格向卖方传达该生产什么以及多少的信息。', bo:'རིན་གོང་གིས་བཙོང་མཁན་ལ་ཐོན་སྐྱེད་གང་འདྲ་བྱེད་དགོས་མིན་བརྡ་སྤྲོད།'},
  {id:'ec83', cat:'econ', en:'If market demand is high, business may grow.', zh:'如果市场需求大，生意可能会增长。', bo:'ཁྲོམ་རའི་དགོས་མཁོ་མང་ན་ཚོང་ལས་འཕེལ་སྲིད།'},
  {id:'ec84', cat:'econ', en:'If market demand is low, business may decline.', zh:'如果市场需求小，生意可能会下滑。', bo:'ཁྲོམ་རའི་དགོས་མཁོ་ཉུང་ན་ཚོང་ལས་ཆག་སྲིད།'},
  {id:'ec85', cat:'econ', en:'Businesses forecast demand.', zh:'企业预测需求。', bo:'ཁེ་ལས་ཀྱིས་དགོས་མཁོ་སྔོན་དཔག་བྱེད།'},
  {id:'ec86', cat:'econ', en:'Demand forecasting helps businesses make plans.', zh:'需求预测有助于企业制定计划。', bo:'དགོས་མཁོ་སྔོན་དཔག་གིས་ཁེ་ལས་ལ་འཆར་གཞི་བཟོ་བར་ཕན་ཐོགས།'},
  {id:'ec87', cat:'econ', en:'Both supply and demand may change.', zh:'供给和需求都可能发生变化。', bo:'མཁོ་སྤྲོད་དང་དགོས་མཁོ་གཉིས་ཀ་འགྱུར་སྲིད།'},
  {id:'ec88', cat:'econ', en:'Market equilibrium is not always the same.', zh:'市场均衡并不总是一成不变的。', bo:'ཁྲོམ་རའི་སྙོམས་གནས་ནི་རྟག་པར་གཅིག་པ་མིན།'},
  {id:'ec89', cat:'econ', en:'As conditions change, equilibrium may also change.', zh:'随着情况的变化，均衡也可能发生变化。', bo:'གནས་སྟངས་འགྱུར་བ་དང་བསྟུན་ནས་སྙོམས་གནས་ཀྱང་འགྱུར་སྲིད།'},
  {id:'ec90', cat:'econ', en:'Demand and supply are the two foundations of the market.', zh:'需求与供给是市场的两大基础。', bo:'དགོས་མཁོ་དང་མཁོ་སྤྲོད་ནི་ཁྲོམ་རའི་གཞི་རྩ་གཉིས་ཡིན།'},
  {id:'ec91', cat:'econ', en:'The number of buyers affects demand.', zh:'买方的数量会影响需求。', bo:'ཉོ་མཁན་གྱི་གྲངས་ཚད་ཀྱིས་དགོས་མཁོ་ལ་ཤུགས་རྐྱེན་བྱེད།'},
  {id:'ec92', cat:'econ', en:'The number of sellers affects supply.', zh:'卖方的数量会影响供给。', bo:'བཙོང་མཁན་གྱི་གྲངས་ཚད་ཀྱིས་མཁོ་སྤྲོད་ལ་ཤུགས་རྐྱེན་བྱེད།'},
  {id:'ec93', cat:'econ', en:'If population grows, demand for many goods may increase.', zh:'如果人口增长，对很多商品的需求可能会增加。', bo:'མི་འབོར་འཕར་ན་ཐོན་རྫས་མང་པོར་དགོས་མཁོ་འཕར་སྲིད།'},
  {id:'ec94', cat:'econ', en:'Time of year affects demand for some goods.', zh:'季节会影响一些商品的需求。', bo:'དུས་ཚོད་ཀྱིས་ཐོན་རྫས་ཁ་ཤས་ཀྱི་དགོས་མཁོ་ལ་ཤུགས་རྐྱེན་བྱེད།'},
  {id:'ec95', cat:'econ', en:'In summer, demand for cooling devices may be higher.', zh:'夏天，制冷设备的需求可能会更高。', bo:'དབྱར་ཁར་གྲང་སྒྲིག་འཕྲུལ་ཆས་ལ་དགོས་མཁོ་མང་བ་ཡོང་སྲིད།'},
  {id:'ec96', cat:'econ', en:'In winter, demand for heating devices may be higher.', zh:'冬天，取暖设备的需求可能会更高。', bo:'དགུན་ཁར་དྲོད་འཕྲུལ་ཆས་ལ་དགོས་མཁོ་མང་བ་ཡོང་སྲིད།'},
  {id:'ec97', cat:'econ', en:'Businesses may change prices depending on market conditions.', zh:'企业可能会根据市场情况调整价格。', bo:'ཁྲོམ་རའི་གནས་ཚུལ་ལ་བརྟེན་ནས་ཁེ་ལས་ཀྱིས་རིན་གོང་བརྗེ་སྲིད།'},
  {id:'ec98', cat:'econ', en:'Fair competition in the marketplace affects prices.', zh:'市场中的公平竞争会影响价格。', bo:'ཚོང་ཁྲོམ་གྱི་དྲང་བདེན་འགྲན་རྩོད་ཀྱིས་རིན་གོང་ལ་ཤུགས་རྐྱེན་བྱེད།'},
  {id:'ec99', cat:'econ', en:'Knowing market conditions is important for business.', zh:'了解市场情况对做生意很重要。', bo:'ཁྲོམ་རའི་གནས་ཚུལ་ཤེས་པ་ནི་ཚོང་ལས་ལ་གལ་ཆེན་ཡིན།'},
  {id:'ec100', cat:'econ', en:'Understanding supply and demand helps understand the market.', zh:'了解供求关系有助于理解市场。', bo:'དགོས་མཁོ་དང་མཁོ་སྤྲོད་ཤེས་པས་ཁྲོམ་ར་རྟོགས་ཐུབ།'},
  // Economics module 3 — Markets & Competition
  {id:'ec101', cat:'econ', en:'In many markets, there are many sellers and buyers.', zh:'在很多市场中，有很多卖方和买方。', bo:'ཁྲོམ་ར་མང་པོར་བཙོང་མཁན་དང་ཉོ་མཁན་མང་པོ་ཡོད།'},
  {id:'ec102', cat:'econ', en:'Competition is an important market condition.', zh:'竞争是重要的市场状况。', bo:'འགྲན་རྩོད་ནི་ཁྲོམ་རའི་གནས་ཚུལ་གལ་ཆེན་ཞིག་ཡིན།'},
  {id:'ec103', cat:'econ', en:'If there are many businesses, competition may be intense.', zh:'如果企业很多，竞争可能会很激烈。', bo:'ཁེ་ལས་མང་པོ་ཡོད་ན་འགྲན་རྩོད་ཆེ་སྲིད།'},
  {id:'ec104', cat:'econ', en:'If competition is intense, businesses may provide better service.', zh:'如果竞争激烈，企业可能会提供更好的服务。', bo:'འགྲན་རྩོད་ཆེ་ན་ཁེ་ལས་ཀྱིས་ཞབས་ཞུ་ཡག་པོ་བྱེད་སྲིད།'},
  {id:'ec105', cat:'econ', en:'Businesses seek ways to meet buyers\' needs.', zh:'企业寻求满足买方需求的方法。', bo:'ཁེ་ལས་ཀྱིས་ཉོ་མཁན་གྱི་དགོས་མཁོ་སྐོང་ཐབས་འཚོལ་གྱི་ཡོད།'},
  {id:'ec106', cat:'econ', en:'In a free market, many businesses compete.', zh:'在自由市场中，很多企业相互竞争。', bo:'ཁྲོམ་ར་རང་དབང་ནང་ཁེ་ལས་མང་པོས་འགྲན་རྩོད་བྱེད།'},
  {id:'ec107', cat:'econ', en:'If one business controls the entire market, it\'s called a monopoly.', zh:'如果一家企业控制整个市场，这被称为垄断。', bo:'ཁེ་ལས་གཅིག་གིས་ཁྲོམ་ར་ཡོངས་ལ་དབང་བ་ཡོད་ན་དེ་ལ་དབང་གནས་ཁྲོམ་ར་ཟེར།'},
  {id:'ec108', cat:'econ', en:'A monopoly business can strongly influence market prices.', zh:'垄断企业能够对市场价格产生很大影响。', bo:'དབང་གནས་ཁེ་ལས་ཀྱིས་ཁྲོམ་རའི་རིན་གོང་ལ་ཤུགས་ཆེན་བྱེད་ཐུབ།'},
  {id:'ec109', cat:'econ', en:'Without competition, buyers have fewer choices.', zh:'没有竞争，买方的选择就较少。', bo:'འགྲན་རྩོད་མེད་ན་ཉོ་མཁན་ལ་གདམ་ག་ཉུང་བ་ཡོད།'},
  {id:'ec110', cat:'econ', en:'Competition encourages businesses to innovate.', zh:'竞争促使企业进行创新。', bo:'འགྲན་རྩོད་ཀྱིས་ཁེ་ལས་ལ་གསར་གཏོད་བྱེད་པར་སྐུལ་སློང་བྱེད།'},
  {id:'ec111', cat:'econ', en:'Innovation can create new products.', zh:'创新能够创造新产品。', bo:'གསར་གཏོད་ཀྱིས་ཐོན་རྫས་གསར་པ་སྐྱེད་ཐུབ།'},
  {id:'ec112', cat:'econ', en:'Businesses seek ways to lower costs.', zh:'企业寻求降低成本的方法。', bo:'ཁེ་ལས་ཀྱིས་གོང་གུད་དམའ་རུ་གཏོང་ཐབས་འཚོལ་གྱི་ཡོད།'},
  {id:'ec113', cat:'econ', en:'If costs are low, business profit may increase.', zh:'如果成本低，企业利润可能会增加。', bo:'གོང་གུད་དམའ་བ་ཡིན་ན་ཁེ་ལས་ཀྱི་ཁེ་བཟང་འཕར་སྲིད།'},
  {id:'ec114', cat:'econ', en:'Market competition may drive prices down.', zh:'市场竞争可能会拉低价格。', bo:'ཁྲོམ་རའི་འགྲན་རྩོད་ཀྱིས་རིན་གོང་དམའ་རུ་གཏོང་སྲིད།'},
  {id:'ec115', cat:'econ', en:'Large businesses can operate large-scale trade.', zh:'大企业能够经营大规模的贸易。', bo:'ཁེ་ལས་ཆེན་པོ་ཚོས་ཚོང་རྒྱ་ཆེན་པོ་བསྐྱོང་ཐུབ།'},
  {id:'ec116', cat:'econ', en:'Small businesses may focus on small market segments.', zh:'小企业可能会专注于小的市场细分。', bo:'ཁེ་ལས་ཆུང་བ་ཚོས་ཁྲོམ་རའི་ས་ཁོངས་ཆུང་ཆུང་ལ་དམིགས་སྲིད།'},
  {id:'ec117', cat:'econ', en:'If the market is transparent, competition among businesses may also be clear.', zh:'如果市场透明，企业间的竞争也可能变得清晰。', bo:'ཁྲོམ་ར་ཁ་གསལ་བ་ཡིན་ན་ཁེ་ལས་ཀྱི་འགྲན་རྩོད་ཀྱང་གསལ་བ་ཡོང་སྲིད།'},
  {id:'ec118', cat:'econ', en:'Businesses pay attention to the quality of goods.', zh:'企业关注商品的质量。', bo:'ཁེ་ལས་ཀྱིས་ཚོང་རྫས་ཀྱི་སྤུས་ཀ་ལ་དོ་སྣང་བྱེད།'},
  {id:'ec119', cat:'econ', en:'Buyer trust is important to businesses.', zh:'买方的信任对企业很重要。', bo:'ཉོ་མཁན་གྱི་ཡིད་ཆེས་ནི་ཁེ་ལས་ལ་གལ་ཆེན་ཡིན།'},
  {id:'ec120', cat:'econ', en:'If quality is good, there may be more buyers.', zh:'如果质量好，买方可能会更多。', bo:'སྤུས་ཀ་ཡག་པོ་ཡིན་ན་ཉོ་མཁན་མང་བ་ཡོང་སྲིད།'},
  {id:'ec121', cat:'econ', en:'Businesses may change the features of goods.', zh:'企业可能会改变商品的特征。', bo:'ཁེ་ལས་ཀྱིས་ཚོང་རྫས་ཀྱི་ཁྱད་ཆོས་འགྱུར་སྲིད།'},
  {id:'ec122', cat:'econ', en:'Product features may change buyer demand.', zh:'商品特征可能会改变买方的需求。', bo:'ཚོང་རྫས་ཀྱི་ཁྱད་ཆོས་ཀྱིས་ཉོ་མཁན་གྱི་དགོས་མཁོ་འགྱུར་སྲིད།'},
  {id:'ec123', cat:'econ', en:'Competition is necessary for business continuity.', zh:'竞争是维持生意持续经营所必需的。', bo:'ཚོང་ལས་ཀྱི་རྒྱུན་ལ་འགྲན་རྩོད་དགོས།'},
  {id:'ec124', cat:'econ', en:'If market conditions change, businesses must change strategy.', zh:'如果市场情况变化，企业必须改变策略。', bo:'ཁྲོམ་རའི་གནས་སྟངས་འགྱུར་ན་ཁེ་ལས་ཀྱིས་ཐབས་བྱུས་བརྗེ་དགོས།'},
  {id:'ec125', cat:'econ', en:'Business strategy is an important choice for a company.', zh:'经营策略是企业的重要选择。', bo:'ཚོང་ལས་ཀྱི་ཐབས་བྱུས་ནི་ཁེ་ལས་ཀྱི་གདམ་ག་གལ་ཆེན་ཡིན།'},
  {id:'ec126', cat:'econ', en:'Businesses study the behavior of competitors.', zh:'企业研究竞争对手的行为。', bo:'ཁེ་ལས་ཀྱིས་འགྲན་རྩོད་པའི་རྣམ་པ་ཞིབ་འཇུག་བྱེད།'},
  {id:'ec127', cat:'econ', en:'There may be many businesses in one market segment.', zh:'一个市场细分中可能存在很多企业。', bo:'ཁྲོམ་རའི་ས་ཁོངས་གཅིག་ལ་ཁེ་ལས་མང་པོ་ཡོད་སྲིད།'},
  {id:'ec128', cat:'econ', en:'Each business uses different ways to attract buyers.', zh:'每家企业都使用不同的方法吸引买方。', bo:'ཁེ་ལས་རེ་རེས་ཉོ་མཁན་འགུག་ཐབས་མི་འདྲ་བ་སྤྱོད་ཀྱི་ཡོད།'},
  {id:'ec129', cat:'econ', en:'Not just price — quality is also important.', zh:'不仅是价格，质量也很重要。', bo:'རིན་གོང་ཁོ་ན་མ་ཡིན་པར་སྤུས་ཀ་ཡང་གལ་ཆེན་ཡིན།'},
  {id:'ec130', cat:'econ', en:'Speed of service affects buyer choices.', zh:'服务速度会影响买方的选择。', bo:'ཞབས་ཞུའི་མྱུར་ཚད་ཀྱིས་ཉོ་མཁན་གྱི་གདམ་ག་ལ་ཤུགས་རྐྱེན་བྱེད།'},
  {id:'ec131', cat:'econ', en:'There are different types of market structures.', zh:'市场结构有不同的类型。', bo:'ཁྲོམ་ར་མངའ་དབང་གི་རྣམ་པ་མི་འདྲ་བ་ཡོད།'},
  {id:'ec132', cat:'econ', en:'Law is important for fair competition to happen.', zh:'法律对实现公平竞争很重要。', bo:'འགྲན་རྩོད་དྲང་མོ་ཡོང་བར་ཁྲིམས་ལ་གལ་ཆེན་ཡོད།'},
  {id:'ec133', cat:'econ', en:'The government may oversee market competition.', zh:'政府可能会监督市场竞争。', bo:'སྲིད་གཞུང་གིས་ཁྲོམ་རའི་འགྲན་རྩོད་ལ་ལྟ་ཞིབ་བྱེད་སྲིད།'},
  {id:'ec134', cat:'econ', en:'Competition law may restrict the power of some businesses.', zh:'竞争法可能会限制一些企业的权力。', bo:'འགྲན་རྩོད་ཁྲིམས་ཀྱིས་ཁེ་ལས་ཁ་ཤས་ཀྱི་དབང་ཆ་བཀག་སྲིད།'},
  {id:'ec135', cat:'econ', en:'If market power is too great, buyers may be affected.', zh:'如果市场权力过大，买方可能会受到影响。', bo:'ཁྲོམ་རའི་དབང་ཆ་ཆེ་ན་ཉོ་མཁན་ལ་དོ་ཕོག་ཡོང་སྲིད།'},
  {id:'ec136', cat:'econ', en:'New businesses may face difficulty entering the market.', zh:'新企业进入市场可能会面临困难。', bo:'ཁེ་ལས་གསར་པ་ཁྲོམ་རར་ཞུགས་པར་དཀའ་ངལ་ཡོད་སྲིད།'},
  {id:'ec137', cat:'econ', en:'Barriers to market entry involve many costs.', zh:'进入市场的壁垒涉及很多成本。', bo:'ཁྲོམ་རར་ཞུགས་པའི་བཀག་རྐྱེན་ལ་གོང་གུད་མང་པོ་ཡོད།'},
  {id:'ec138', cat:'econ', en:'Needing large capital is one barrier.', zh:'需要大量资金是一种壁垒。', bo:'མ་དངུལ་མང་པོ་དགོས་པ་ནི་བཀག་རྐྱེན་ཞིག་ཡིན།'},
  {id:'ec139', cat:'econ', en:'Having technology rights is also a barrier.', zh:'拥有技术权利也是一种壁垒。', bo:'ལག་རྩལ་དབང་ཆ་ཡོད་པ་ཡང་བཀག་རྐྱེན་ཞིག་ཡིན།'},
  {id:'ec140', cat:'econ', en:'Market competition is a subject of economic study.', zh:'市场竞争是经济学研究的课题。', bo:'ཁྲོམ་རའི་འགྲན་རྩོད་ནི་དཔལ་འབྱོར་ཞིབ་འཇུག་གི་གནད་དོན་ཡིན།'},
  {id:'ec141', cat:'econ', en:'If buyers have many choices, the market becomes diverse.', zh:'如果买方有很多选择，市场就会变得多样化。', bo:'ཉོ་མཁན་གྱི་གདམ་ག་མང་ན་ཁྲོམ་ར་སྣ་མང་ཡོང་སྲིད།'},
  {id:'ec142', cat:'econ', en:'Sellers must always watch market conditions.', zh:'卖方必须时刻关注市场情况。', bo:'བཙོང་མཁན་ཚོས་ཁྲོམ་རའི་གནས་ཚུལ་རྟག་ཏུ་ལྟ་དགོས།'},

  {id:'ec146', cat:'econ', en:'Businesses seek new buyers.', zh:'企业寻求新的买方。', bo:'ཁེ་ལས་ཀྱིས་ཉོ་མཁན་གསར་པ་འཚོལ་གྱི་ཡོད།'},
  {id:'ec147', cat:'econ', en:'Businesses put new products into the market.', zh:'企业将新产品推向市场。', bo:'ཁེ་ལས་ཀྱིས་རང་གི་ཐོན་རྫས་གསར་པ་ཁྲོམ་རར་འཇོག་གི་ཡོད།'},
  {id:'ec148', cat:'econ', en:'There is risk in business, but there are also opportunities.', zh:'经商有风险，但也有机遇。', bo:'ཚོང་ལས་ལ་ཉེན་ཁ་ཡོད་ཀྱང་གོ་སྐབས་ཡང་ཡོད།'},

  {id:'ec153', cat:'econ', en:'Land is another factor of production.', zh:'土地是另一种生产要素。', bo:'ས་ཆ་ནི་ཐོན་སྐྱེད་ཀྱི་རྒྱུ་ཆ་གཞན་ཞིག་ཡིན།'},
  {id:'ec154', cat:'econ', en:'Capital is also used in production.', zh:'资本也被用于生产。', bo:'མ་རྩ་ཡང་ཐོན་སྐྱེད་ལ་སྤྱོད་ཀྱི་ཡོད།'},
  {id:'ec155', cat:'econ', en:'Technology can speed up production.', zh:'技术能够加快生产速度。', bo:'ལག་རྩལ་གྱིས་ཐོན་སྐྱེད་མྱུར་དུ་གཏོང་ཐུབ།'},
  {id:'ec156', cat:'econ', en:'New machines can increase work efficiency.', zh:'新机器能够提升工作效率。', bo:'འཕྲུལ་ཆས་གསར་པས་ལས་ཀའི་ནུས་པ་འཕེལ་ཐུབ།'},
  {id:'ec157', cat:'econ', en:'Worker skill benefits production.', zh:'劳动者的技能有利于生产。', bo:'ལས་མིའི་ལག་རྩལ་གྱིས་ཐོན་སྐྱེད་ལ་ཕན་ཐོགས།'},
  {id:'ec158', cat:'econ', en:'Education can increase worker capability.', zh:'教育能够提升劳动者的能力。', bo:'སློབ་གསོས་ལས་མིའི་ནུས་པ་འཕེལ་ཐུབ།'},
  {id:'ec159', cat:'econ', en:'Worker knowledge is an important resource that is not capital.', zh:'劳动者的知识是重要的、非资本类的资源。', bo:'ལས་མིའི་ཤེས་བྱ་ནི་མ་རྩ་མིན་པའི་ཐོན་ཁུངས་གལ་ཆེན་ཞིག་ཡིན།'},
  {id:'ec160', cat:'econ', en:'If production efficiency increases, more goods can be made.', zh:'如果生产效率提高，就能生产更多商品。', bo:'ཐོན་སྐྱེད་ནུས་པ་འཕར་ན་ཐོན་རྫས་མང་བ་བཟོ་ཐུབ།'},
  {id:'ec161', cat:'econ', en:'Work efficiency is the relationship between time and output.', zh:'工作效率是时间与产出之间的关系。', bo:'ལས་ཀའི་ནུས་པ་ནི་དུས་ཚོད་དང་ཐོན་རྫས་ཀྱི་འབྲེལ་བ་ཡིན།'},
  {id:'ec162', cat:'econ', en:'One worker can produce many goods in one period.', zh:'一名劳动者能在一段时间内生产很多商品。', bo:'ལས་མི་གཅིག་གིས་དུས་ཚོད་གཅིག་ནང་ཐོན་རྫས་མང་པོ་བཟོ་ཐུབ།'},
  {id:'ec163', cat:'econ', en:'If production efficiency is high, costs may be lower.', zh:'如果生产效率高，成本可能会更低。', bo:'ཐོན་སྐྱེད་ནུས་པ་མཐོ་ན་གོང་གུད་དམའ་བ་ཡོང་སྲིད།'},
  {id:'ec164', cat:'econ', en:'Worker wages are an important cost for a business.', zh:'劳动者工资是企业的一项重要成本。', bo:'ལས་མིའི་གླ་ཆ་ནི་ཁེ་ལས་ཀྱི་གོང་གུད་གལ་ཆེན་ཞིག་ཡིན།'},
  {id:'ec165', cat:'econ', en:'Costs include fixed costs and variable costs.', zh:'成本包括固定成本和变动成本。', bo:'གོང་གུད་ལ་གཏན་འཁེལ་གོང་གུད་དང་འགྱུར་བའི་གོང་གུད་ཡོད།'},
  {id:'ec166', cat:'econ', en:'Fixed costs may not change even if output changes.', zh:'即使产量变化，固定成本也可能不变。', bo:'གཏན་འཁེལ་གོང་གུད་ནི་ཐོན་ཚད་འགྱུར་ཡང་འགྱུར་མི་སྲིད།'},
  {id:'ec167', cat:'econ', en:'Variable costs change in line with output.', zh:'变动成本随产量变化。', bo:'འགྱུར་བའི་གོང་གུད་ནི་ཐོན་ཚད་དང་བསྟུན་ནས་འགྱུར།'},
  {id:'ec168', cat:'econ', en:'Total cost is the sum of all costs.', zh:'总成本是所有成本的总和。', bo:'སྤྱིའི་གོང་གུད་ནི་གོང་གུད་ཚང་མའི་བསྡོམས་རྩིས་ཡིན།'},
  {id:'ec169', cat:'econ', en:'Average cost is the average cost per unit of goods.', zh:'平均成本是每单位商品的平均成本。', bo:'ཆ་སྙོམས་གོང་གུད་ནི་ཐོན་རྫས་རེ་རེའི་ཆ་སྙོམས་གོང་གུད་ཡིན།'},

  {id:'ec172', cat:'econ', en:'Buying machines requires funding.', zh:'购买机器需要资金。', bo:'འཕྲུལ་ཆས་ཉོ་བར་མ་དངུལ་དགོས།'},
  {id:'ec173', cat:'econ', en:'When investing capital, businesses consider future benefits.', zh:'投资资本时，企业会考虑未来的收益。', bo:'ཁེ་ལས་ཀྱིས་མ་རྩ་འཇོག་སྐབས་མ་འོངས་པའི་ཁེ་ཕན་ལ་བསམ་གཞིག་བྱེད།'},

  {id:'ec175', cat:'econ', en:'There is risk in investing capital.', zh:'投资资本存在风险。', bo:'མ་རྩ་འཇོག་པའི་ཉེན་ཁ་ཡོད།'},
