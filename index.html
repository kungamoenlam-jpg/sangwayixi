  const isLastStep = s.stepIndex === steps.length-1;
  if(isLastStep){
    s.stepResults.push(result);
    const problemCorrect = !s.anyWrong;
    s.answered = true; s.lastCorrect = problemCorrect;
    if(problemCorrect) registerCorrectAnswer(s, state.game);
    else registerWrongAnswer(s);
  } else {
    s.pendingResult = result;
    s.answered = true; s.lastCorrect = correct;
  }
  render();
}

function nextGeomStep(){
  const s = state.geomSession;
  s.stepResults.push(s.pendingResult);
  s.pendingResult = null;
  s.stepIndex += 1;
  s.answered = false; s.lastCorrect = null; s.stepInputs = {};
  render();
  focusGeomInput();
}

  s.answered=false; s.lastCorrect=null;
  render();
  focusGeomInput();
}

function finishGeomPractice(){

// ---- trigonometry learning: Month 8, continuing the extended progression.
// Same architecture as the previous seven months. Angle-based topics are
// restricted to a curated set of "standard" angles (multiples of 30°/45°)
// so every sin/cos/tan value, radian conversion, and law-of-sines/cosines
// result stays exact — never falling back to a decimal approximation of an
// irrational value. Radian answers are typed as a "p/q" coefficient of π
// (reusing algebra's parseFraction), matching how geometry's circle
// formulas handle π.
function piFracText(p,q){
  if(q===1) return p===1 ? 'π' : `${p}π`;
  return `${p}π/${q}`;
}
const TRIG_DEG_RAD_MAP = {30:[1,6],45:[1,4],60:[1,3],90:[1,2],120:[2,3],135:[3,4],150:[5,6],180:[1,1],210:[7,6],225:[5,4],240:[4,3],270:[3,2],300:[5,3],315:[7,4],330:[11,6]};
const TRIG_UNIT_CIRCLE = {
  0:{sin:['0'],cos:['1'],tan:['0']},
  30:{sin:['1/2'],cos:['√3/2','sqrt(3)/2'],tan:['√3/3','sqrt(3)/3']},
  45:{sin:['√2/2','sqrt(2)/2'],cos:['√2/2','sqrt(2)/2'],tan:['1']},
  60:{sin:['√3/2','sqrt(3)/2'],cos:['1/2'],tan:['√3','sqrt(3)']},
  90:{sin:['1'],cos:['0']},
  120:{sin:['√3/2','sqrt(3)/2'],cos:['-1/2'],tan:['-√3','-sqrt(3)']},
  135:{sin:['√2/2','sqrt(2)/2'],cos:['-√2/2','-sqrt(2)/2'],tan:['-1']},
  150:{sin:['1/2'],cos:['-√3/2','-sqrt(3)/2'],tan:['-√3/3','-sqrt(3)/3']},
  180:{sin:['0'],cos:['-1'],tan:['0']},
  210:{sin:['-1/2'],cos:['-√3/2','-sqrt(3)/2'],tan:['√3/3','sqrt(3)/3']},
  225:{sin:['-√2/2','-sqrt(2)/2'],cos:['-√2/2','-sqrt(2)/2'],tan:['1']},
  240:{sin:['-√3/2','-sqrt(3)/2'],cos:['-1/2'],tan:['√3','sqrt(3)']},
  270:{sin:['-1'],cos:['0']},
  300:{sin:['-√3/2','-sqrt(3)/2'],cos:['1/2'],tan:['-√3','-sqrt(3)']},
  315:{sin:['-√2/2','-sqrt(2)/2'],cos:['√2/2','sqrt(2)/2'],tan:['-1']},
  330:{sin:['-1/2'],cos:['√3/2','sqrt(3)/2'],tan:['-√3/3','-sqrt(3)/3']},
};
const TRIG_PRIMITIVE_TRIPLES = [[3,4,5],[5,12,13],[8,15,17],[7,24,25],[20,21,29]];
const TRIG_LAW_COS_60 = [[3,8,7],[5,8,7]];
const TRIG_LAW_COS_120 = [[3,5,7],[7,8,13]];
const TRIG_INVERSE_TABLE = {
  arcsin: {'0':0, '1/2':30, '√2/2':45, '√3/2':60, '1':90},
  arccos: {'1':0, '√3/2':30, '√2/2':45, '1/2':60, '0':90},
  arctan: {'0':0, '√3/3':30, '1':45, '√3':60},
};
const TRIG_EQ_VALUES = { sin: {0:'0',30:'1',45:'√2',60:'√3',90:'2'}, cos: {0:'2',30:'√3',45:'√2',60:'1',90:'0'} };

function trigProblemDegToRad(){
  const degs = Object.keys(TRIG_DEG_RAD_MAP).map(Number);
  const deg = degs[randInt(0,degs.length-1)];
  const [p,q] = TRIG_DEG_RAD_MAP[deg];
  return {
    promptText: t('trigDegToRadPrompt', {deg}),
    inputs: [{key:'ans', placeholder:t('trigRadianAnswerPlaceholder')}],
    check(vals){ const f=parseFraction(vals.ans); return !!f && f.p===p && f.q===q; },
    explain: t('trigDegToRadExplain', {deg, p, q, radText:piFracText(p,q)}),
  };
}
function trigProblemRadToDeg(){
  const degs = Object.keys(TRIG_DEG_RAD_MAP).map(Number);
  const deg = degs[randInt(0,degs.length-1)];
  const [p,q] = TRIG_DEG_RAD_MAP[deg];
  return {
    promptText: t('trigRadToDegPrompt', {radText:piFracText(p,q)}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===deg; },
    explain: t('trigRadToDegExplain', {radText:piFracText(p,q), deg}),
  };
}
function trigProblemUnitCircle(){
  const angles = Object.keys(TRIG_UNIT_CIRCLE).map(Number);
  const angle = angles[randInt(0,angles.length-1)];
  const fnsAvail = Object.keys(TRIG_UNIT_CIRCLE[angle]);
  const fn = fnsAvail[randInt(0,fnsAvail.length-1)];
  const accepted = TRIG_UNIT_CIRCLE[angle][fn].map(s=>s.toLowerCase().replace(/\s+/g,''));
  return {
    promptText: t('trigUnitCirclePrompt', {expr:`${fn}(${angle}°)`}),
    inputs: [{key:'ans', placeholder:t('algTrigAnswerPlaceholder')}],
    check(vals){ const norm=(vals.ans||'').toLowerCase().replace(/\s+/g,''); return accepted.includes(norm); },
    explain: t('trigUnitCircleExplain', {expr:`${fn}(${angle}°)`, answer:TRIG_UNIT_CIRCLE[angle][fn][0]}),
  };
}
function trigProblemPythagIdentity(){
  const [a,b,c] = TRIG_PRIMITIVE_TRIPLES[randInt(0,TRIG_PRIMITIVE_TRIPLES.length-1)];
  const giveSin = Math.random()<0.5;
  const givenVal = giveSin ? a : b;
  const answer = giveSin ? b : a;
  return {
    promptText: t(giveSin?'trigPythagIdentitySinPrompt':'trigPythagIdentityCosPrompt', {given:givenVal, c}),
    inputs: [{key:'ans', placeholder:t('probFractionAnswerPlaceholder'), fracInput:true}],
    check(vals){ const f=parseFraction(vals.ans); return !!f && f.p===answer && f.q===c; },
    explain: t('trigPythagIdentityExplain', {given:givenVal, c, givenSq:givenVal*givenVal, cSq:c*c, diff:c*c-givenVal*givenVal, answer}),
  };
}
function trigProblemReferenceAngle(){
  const opts = [100,110,130,140,160,170,190,200,220,230,250,260,280,290,310,320,340,350];
  const angle = opts[randInt(0,opts.length-1)];
  let ref;
  if(angle<=180) ref = 180-angle;
  else if(angle<=270) ref = angle-180;
  else ref = 360-angle;
  return {
    promptText: t('trigReferenceAnglePrompt', {angle}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===ref; },
    explain: t('trigReferenceAngleExplain', {angle, ref}),
  };
}
function trigProblemCoterminal(){
  const base = randInt(1,359);
  const k = [1,-1,2][randInt(0,2)];
  const given = base + k*360;
  return {
    promptText: t('trigCoterminalPrompt', {given}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===base; },
    explain: t('trigCoterminalExplain', {given, answer:base}),
  };
}
function trigProblemArcLength(){
  const degs = Object.keys(TRIG_DEG_RAD_MAP).map(Number);
  const deg = degs[randInt(0,degs.length-1)];
  const [p,q] = TRIG_DEG_RAD_MAP[deg];
  const k = randInt(1,5);
  const r = q*k;
  const answer = k*p;
  return {
    promptText: t('trigArcLengthPrompt', {r, angleText:piFracText(p,q)}),
    inputs: [{key:'ans', placeholder:t('geomPiCoeffPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('trigArcLengthExplain', {r, angleText:piFracText(p,q), answer}),
  };
}
function trigProblemSectorArea(){
  const degs = Object.keys(TRIG_DEG_RAD_MAP).map(Number);
  const deg = degs[randInt(0,degs.length-1)];
  const [p,q] = TRIG_DEG_RAD_MAP[deg];
  const k = randInt(1,3);
  const r = 2*q*k;
  const answer = 2*q*k*k*p;
  return {
    promptText: t('trigSectorAreaPrompt', {r, angleText:piFracText(p,q)}),
    inputs: [{key:'ans', placeholder:t('geomPiCoeffPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('trigSectorAreaExplain', {r, angleText:piFracText(p,q), answer}),
  };
}
function trigProblemLawOfCosines(){
  const use60 = Math.random()<0.5;
  const list = use60?TRIG_LAW_COS_60:TRIG_LAW_COS_120;
  const base = list[randInt(0,list.length-1)];
  const k = randInt(1,4);
  const [a,b,c] = base.map(x=>x*k);
  const angle = use60?60:120;
  return {
    promptText: t('trigLawCosPrompt', {a, b, angle}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===c; },
    explain: t(use60?'trigLawCosExplain60':'trigLawCosExplain120', {a, b, aSq:a*a, bSq:b*b, ab:a*b, cSq:c*c, c}),
  };
}
function trigProblemLawOfSines(){
  const aIs30 = Math.random()<0.5;
  let a, answer;
  if(aIs30){ a = randInt(1,15); answer = 2*a; }
  else { a = randInt(1,15)*2; answer = a/2; }
  const angleA = aIs30?30:90, angleB = aIs30?90:30;
  return {
    promptText: t('trigLawSinesPrompt', {angleA, a, angleB}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('trigLawSinesExplain', {angleA, angleB, a, answer}),
  };
}
function trigProblemAmplitudePeriod(){
  const A = randInt(1,10) * (Math.random()<0.5?-1:1);
  const B = [1,2,3,4,5,6][randInt(0,5)];
  const amplitude = Math.abs(A);
  const g = gcd(2,B); const pc_p = 2/g, pc_q = B/g;
  return {
    promptText: t('trigAmplitudePeriodPrompt', {A, B}),
    inputs: [
      {key:'amp', label:t('trigAmplitudeLabel'), placeholder:t('algNumericAnswerPlaceholder')},
      {key:'period', label:t('trigPeriodLabel'), placeholder:t('probFractionAnswerPlaceholder'), fracInput:true},
    ],
    check(vals){ const f=parseFraction(vals.period); return Number(vals.amp)===amplitude && !!f && f.p===pc_p && f.q===pc_q; },
    explain: t('trigAmplitudePeriodExplain', {amplitude, periodText:piFracText(pc_p,pc_q)}),
  };
}
function trigProblemInverseTrig(){
  const fns = Object.keys(TRIG_INVERSE_TABLE);
  const fn = fns[randInt(0,fns.length-1)];
  const valsList = Object.keys(TRIG_INVERSE_TABLE[fn]);
  const val = valsList[randInt(0,valsList.length-1)];
  const answer = TRIG_INVERSE_TABLE[fn][val];
  return {
    promptText: t('trigInverseTrigPrompt', {expr:`${fn}(${val})`}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals2){ return Number(vals2.ans)===answer; },
    explain: t('trigInverseTrigExplain', {expr:`${fn}(${val})`, answer}),
  };
}
function trigProblemEquation(){
  const fn = ['sin','cos'][randInt(0,1)];
  const angles = Object.keys(TRIG_EQ_VALUES[fn]).map(Number);
  const angle = angles[randInt(0,angles.length-1)];
  const rhs = TRIG_EQ_VALUES[fn][angle];
  const lhs = `2${fn}(θ)`;
  return {
    promptText: t('trigEquationPrompt', {lhs, rhs}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===angle; },
    explain: t('trigEquationExplain', {lhs, rhs, angle}),
  };
}

function renderTrigPractice(){
  const s = state.trigSession;
  const steps = s.steps;
  const multiStep = steps.length > 1;
  const stepIndex = s.stepIndex;
  const curStep = steps[stepIndex];
  const isLastStep = stepIndex === steps.length-1;
  const willFinish = s.mistakes >= MATH_MAX_MISTAKES;

  const inputBox = (inp) => {
    if(inp.fracInput){

          <div class="frac-input-bar"></div>
          <input class="algebra-input" type="text" inputmode="numeric" autocomplete="off"
            style="font-size:20px; font-family:var(--font-display); font-weight:700; text-align:center;"
            ${s.answered?'disabled':''} value="${denVal}"
            oninput="setFracInputPart(state.trigSession,'${inp.key}','den',this.value)">
        </div>
      </div>`;
    }
    return `
    <div style="flex:1;">
      ${inp.label ? `<div style="font-size:12px; color:var(--snow-dim); margin-bottom:4px;">${inp.label}</div>` : ''}
      <input class="trig-input algebra-input" data-key="${inp.key}" type="text" autocomplete="off"
        placeholder="${inp.placeholder||''}"
        style="text-align:center; font-size:20px; font-family:var(--font-display); font-weight:700; width:100%;"
        ${s.answered?'disabled':''} value="${(s.stepInputs[inp.key]||'')}"
        oninput="state.trigSession.stepInputs['${inp.key}']=this.value">
    </div>`;
  };

    ? `<div style="display:grid; grid-template-columns:repeat(${curStep.matrixShape[1]}, 1fr); gap:10px; max-width:240px; margin:0 auto;">${curStep.inputs.map(inputBox).join('')}</div>`

      </div>
      ${multiStep ? `<div class="step-list">${doneRowsHtml}${activeStepHtml}</div>` : activeStepHtml}
    </div>
  </div>
  ${feedback}
  `;
}

function submitTrigStep(){
  const s = state.trigSession;
  if(!s || s.answered) return;
  const steps = s.steps;
  const step = steps[s.stepIndex];
  for(const inp of step.inputs){ if(!s.stepInputs[inp.key]) return; }
  const correct = step.check(s.stepInputs);
  if(!correct) s.anyWrong = true;
  const valuesText = step.inputs.map(inp=>s.stepInputs[inp.key]).join(', ');
  const result = {prompt: step.prompt, valuesText, explain: step.explain, correct};
  const isLastStep = s.stepIndex === steps.length-1;
  if(isLastStep){
    s.stepResults.push(result);
    const problemCorrect = !s.anyWrong;
    s.answered = true; s.lastCorrect = problemCorrect;
    if(problemCorrect) registerCorrectAnswer(s, state.game);
    else registerWrongAnswer(s);
  } else {
    s.pendingResult = result;
    s.answered = true; s.lastCorrect = correct;
  }
  render();
}

function nextTrigStep(){
  const s = state.trigSession;
  s.stepResults.push(s.pendingResult);
  s.pendingResult = null;
  s.stepIndex += 1;
  s.answered = false; s.lastCorrect = null; s.stepInputs = {};
  render();
  focusTrigInput();
}

function nextTrigQuestion(){
  const s = state.trigSession;
  if(s.mistakes>=MATH_MAX_MISTAKES){ finishTrigPractice(); return; }
  const topic = trigTopicByKey(s.topicKey);
  const problem = topic.build();
  s.problem = problem; s.steps = normalizeSteps(problem);
  s.stepIndex=0; s.stepInputs={}; s.stepResults=[]; s.anyWrong=false; s.pendingResult=null;
  s.answered=false; s.lastCorrect=null;
  render();
  focusTrigInput();
}

function finishTrigPractice(){
  const s = state.trigSession;
  if(!state.game.trig) state.game.trig = {};
  const rec = state.game.trig[s.topicKey] || (state.game.trig[s.topicKey] = {best:0});
  s.isNewBest = s.correct > rec.best;
  if(s.isNewBest) rec.best = s.correct;
  touchStreak();
  s.newAchievements = checkAchievements(state.game);
  state.screen='trig_complete';
  render();
}

function renderTrigComplete(){

// ---- complex numbers learning: Month 9, closing out the extended
// progression (algebra -> calculus -> linear algebra -> discrete math ->
// probability -> statistics -> geometry -> trigonometry -> complex numbers)
// by tying several of those months together — moduli reuse the same
// Pythagorean triples as linear algebra's vector magnitude and geometry's
// distance formula, arguments and De Moivre's theorem reuse trigonometry's
// standard angles, and the quadratic-roots topic reuses algebra's
// signedCoeffTerm helper for displaying the equation. Division is
// engineered backwards from a clean integer quotient (pick the quotient and
// the divisor, then multiply them to get the dividend) the same way linear
// algebra's inverse topic was, since dividing two arbitrary Gaussian
// integers rarely lands on an integer result.
function complexText(a,b){
  const sign = b>=0 ? '+' : '-';
  return `${a} ${sign} ${Math.abs(b)}i`;
}
function ordinal(n){
  const rem100 = n%100;
  if(rem100>=11 && rem100<=13) return `${n}th`;
  const rem10 = n%10;
  if(rem10===1) return `${n}st`;
  if(rem10===2) return `${n}nd`;
  if(rem10===3) return `${n}rd`;
  return `${n}th`;
}
const CPLX_I_POWERS = [[1,0],[0,1],[-1,0],[0,-1]];
const CPLX_ARG_POINTS = [[1,0,0],[1,1,45],[0,1,90],[-1,1,135],[-1,0,180],[-1,-1,225],[0,-1,270],[1,-1,315]];
const CPLX_AXIS_ANGLES = [0,90,180,270];

function cplxProblemAddition(){
  const a=randInt(-9,9), b=randInt(-9,9), c=randInt(-9,9), d=randInt(-9,9);
  const re=a+c, im=b+d;
  return {
    promptText: t('cplxAddPrompt', {z1:complexText(a,b), z2:complexText(c,d)}),
    inputs: [{key:'re',label:'Re'},{key:'im',label:'Im'}],
    check(vals){ return Number(vals.re)===re && Number(vals.im)===im; },
    explain: t('cplxAddExplain', {a,b,c,d,re,im}),
  };
}
function cplxProblemSubtraction(){
  const a=randInt(-9,9), b=randInt(-9,9), c=randInt(-9,9), d=randInt(-9,9);
  const re=a-c, im=b-d;
  return {
    promptText: t('cplxSubPrompt', {z1:complexText(a,b), z2:complexText(c,d)}),
    inputs: [{key:'re',label:'Re'},{key:'im',label:'Im'}],
    check(vals){ return Number(vals.re)===re && Number(vals.im)===im; },
    explain: t('cplxSubExplain', {a,b,c,d,re,im}),
  };
}
function cplxProblemMultiplication(){
  const a=randInt(-6,6), b=randInt(-6,6), c=randInt(-6,6), d=randInt(-6,6);
  const re=a*c-b*d, im=a*d+b*c;
  return {
    promptText: t('cplxMulPrompt', {z1:complexText(a,b), z2:complexText(c,d)}),
    inputs: [{key:'re',label:'Re'},{key:'im',label:'Im'}],
    check(vals){ return Number(vals.re)===re && Number(vals.im)===im; },
    explain: t('cplxMulExplain', {a,b,c,d,ac:a*c,bd:b*d,ad:a*d,bc:b*c,re,im}),
  };
}
function cplxProblemDivision(){
  const p=randInt(-6,6), q=randInt(-6,6);
  let c,d; do{ c=randInt(-5,5); d=randInt(-5,5); } while(c===0&&d===0);
  const a = p*c-q*d, b = p*d+q*c;
  return {
    promptText: t('cplxDivPrompt', {z1:complexText(a,b), z2:complexText(c,d)}),
    inputs: [{key:'re',label:'Re'},{key:'im',label:'Im'}],
    check(vals){ return Number(vals.re)===p && Number(vals.im)===q; },
    explain: t('cplxDivExplain', {a, b, c, d, conj:complexText(c,-d), denom:c*c+d*d, p, q}),
  };
}
function cplxProblemConjugate(){
  const a=randInt(-9,9), b=nonZeroRandInt(-9,9);
  return {
    promptText: t('cplxConjPrompt', {z:complexText(a,b)}),
    inputs: [{key:'re',label:'Re'},{key:'im',label:'Im'}],
    check(vals){ return Number(vals.re)===a && Number(vals.im)===-b; },
    explain: t('cplxConjExplain', {a, b, answer:complexText(a,-b)}),
  };
}
function cplxProblemModulus(){
  const [a0,b0,c] = LINALG_TRIPLES[randInt(0,LINALG_TRIPLES.length-1)];
  const swap = Math.random()<0.5;
  const a = (swap?b0:a0)*(Math.random()<0.5?-1:1);
  const b = (swap?a0:b0)*(Math.random()<0.5?-1:1);
  return {
    promptText: t('cplxModulusPrompt', {z:complexText(a,b)}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===c; },
    explain: t('cplxModulusExplain', {aSq:a*a, bSq:b*b, sum:a*a+b*b, c}),
  };
}
function cplxProblemPowersOfI(){
  const n = randInt(1,20);
  const [re,im] = CPLX_I_POWERS[n%4];
  return {
    promptText: t('cplxPowersIPrompt', {n}),
    inputs: [{key:'re',label:'Re'},{key:'im',label:'Im'}],
    check(vals){ return Number(vals.re)===re && Number(vals.im)===im; },
    explain: t('cplxPowersIExplain', {n, rem:n%4, answer:complexText(re,im)}),
  };
}
function cplxProblemArgument(){
  const k = randInt(1,5);
  const [x0,y0,angle] = CPLX_ARG_POINTS[randInt(0,CPLX_ARG_POINTS.length-1)];
  const x=x0*k, y=y0*k;
  return {
    promptText: t('cplxArgumentPrompt', {z:complexText(x,y)}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===angle; },
    explain: t('cplxArgumentExplain', {angle}),
  };
}
function cplxProblemPolarToRect(){
  const r = randInt(1,15);
  const angle = CPLX_AXIS_ANGLES[randInt(0,3)];
  let re,im;
  if(angle===0){ re=r; im=0; } else if(angle===90){ re=0; im=r; } else if(angle===180){ re=-r; im=0; } else { re=0; im=-r; }
  return {
    promptText: t('cplxPolarToRectPrompt', {r, angle}),
    inputs: [{key:'re',label:'Re'},{key:'im',label:'Im'}],
    check(vals){ return Number(vals.re)===re && Number(vals.im)===im; },
    explain: t('cplxPolarToRectExplain', {answer:complexText(re,im)}),
  };
}
function cplxProblemDeMoivre(){
  const angle = [30,45,60,90,120,135,150,180][randInt(0,7)];
  const n = randInt(2,6);
  let answer = (angle*n) % 360;
  if(answer<0) answer += 360;
  return {
    promptText: t('cplxDeMoivrePrompt', {angle, n, nOrd:ordinal(n)}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('cplxDeMoivreExplain', {angle, n, product:angle*n, answer}),
  };
}
function cplxProblemRootsOfUnity(){
  const n = [2,3,4,5,6,8,9,10,12][randInt(0,8)];
  const answer = 360/n;
  return {
    promptText: t('cplxRootsUnityPrompt', {n, nOrd:ordinal(n)}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('cplxRootsUnityExplain', {n, answer}),
  };
}
function cplxProblemQuadraticRoots(){
  const p = randInt(-6,6), q = randInt(1,6);
  const b = -2*p, c = p*p+q*q;
  const expr = `x²${signedCoeffTerm(b,'x')}${signedCoeffTerm(c,'')} = 0`;
  return {
    promptText: t('cplxQuadRootsPrompt', {expr}),
    inputs: [{key:'re',label:'Re'},{key:'im',label:'Im (positive)'}],
    check(vals){ return Number(vals.re)===p && Number(vals.im)===q; },
    explain: t('cplxQuadRootsExplain', {b, c, p, q}),
  };
}
function cplxProblemModulusProduct(){
  const [a1,b1,m1] = LINALG_TRIPLES[randInt(0,LINALG_TRIPLES.length-1)];
  const [a2,b2,m2] = LINALG_TRIPLES[randInt(0,LINALG_TRIPLES.length-1)];
  const swap1 = Math.random()<0.5, swap2 = Math.random()<0.5;
  const x1=(swap1?b1:a1)*(Math.random()<0.5?-1:1), y1=(swap1?a1:b1)*(Math.random()<0.5?-1:1);
  const x2=(swap2?b2:a2)*(Math.random()<0.5?-1:1), y2=(swap2?a2:b2)*(Math.random()<0.5?-1:1);
  const answer = m1*m2;
  return {
    promptText: t('cplxModulusProductPrompt', {z1:complexText(x1,y1), z2:complexText(x2,y2)}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('cplxModulusProductExplain', {m1, m2, answer}),
  };
}

function submitCplxStep(){
  const s = state.cplxSession;
  if(!s || s.answered) return;
  const steps = s.steps;
  const step = steps[s.stepIndex];
  for(const inp of step.inputs){ if(!s.stepInputs[inp.key]) return; }
  const correct = step.check(s.stepInputs);
  if(!correct) s.anyWrong = true;
  const valuesText = step.inputs.map(inp=>s.stepInputs[inp.key]).join(', ');
  const result = {prompt: step.prompt, valuesText, explain: step.explain, correct};
  const isLastStep = s.stepIndex === steps.length-1;
  if(isLastStep){
    s.stepResults.push(result);
    const problemCorrect = !s.anyWrong;
    s.answered = true; s.lastCorrect = problemCorrect;
    if(problemCorrect) registerCorrectAnswer(s, state.game);
    else registerWrongAnswer(s);
  } else {
    s.pendingResult = result;
    s.answered = true; s.lastCorrect = correct;
  }
  render();
}

function nextCplxStep(){
  const s = state.cplxSession;
  s.stepResults.push(s.pendingResult);
  s.pendingResult = null;
  s.stepIndex += 1;
  s.answered = false; s.lastCorrect = null; s.stepInputs = {};
  render();
  focusCplxInput();
}

function nextCplxQuestion(){

  s.stepIndex=0; s.stepInputs={}; s.stepResults=[]; s.anyWrong=false; s.pendingResult=null;
  s.answered=false; s.lastCorrect=null;
  render();
  focusCplxInput();
}

function finishCplxPractice(){

// ---- sequences & series learning: Month 10, extending the progression
// further. Same architecture as the previous nine months. Series sums are
// deliberately picked so they never need construction tricks: an arithmetic
// series' sum n(a1+an)/2 is always an integer because n(n-1) is always even,
// and a geometric series with integer first term and integer ratio is a sum
// of integers by definition — only the infinite geometric series (whose
// ratio must be a proper fraction) needs to be built backwards from a clean
// answer, the same way probability's fraction topics were.
function seqProblemArithmeticNth(){
  const a1 = randInt(-20,20), d = nonZeroRandInt(-9,9), n = randInt(5,20);
  const answer = a1+(n-1)*d;
  return {
    promptText: t('seqArithNthPrompt', {a1,d,n}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('seqArithNthExplain', {a1,d,n,answer}),
  };
}
function seqProblemGeometricNth(){
  const a1 = randInt(1,5), r = [2,3,-2,-3][randInt(0,3)], n = randInt(2,6);
  const answer = a1*Math.pow(r,n-1);
  return {
    promptText: t('seqGeomNthPrompt', {a1,r,n}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('seqGeomNthExplain', {a1,r,n,answer}),
  };
}
function seqProblemArithSeriesSum(){
  const a1 = randInt(-10,10), d = nonZeroRandInt(-5,5), n = randInt(4,15);
  const an = a1+(n-1)*d;
  const answer = n*(a1+an)/2;
  return {
    promptText: t('seqArithSeriesSumPrompt', {a1,d,n}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('seqArithSeriesSumExplain', {a1,d,n,an,answer}),
  };
}
function seqProblemGeomSeriesSum(){
  const a1 = randInt(1,5), r = [2,3,-2,-3][randInt(0,3)], n = randInt(3,6);
  let sum=0, term=a1;
  for(let i=0;i<n;i++){ sum+=term; term*=r; }
  return {
    promptText: t('seqGeomSeriesSumPrompt', {a1,r,n}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===sum; },
    explain: t('seqGeomSeriesSumExplain', {a1,r,n,sum}),
  };
}
function seqProblemGeomSeriesInfinite(){
  const k = randInt(2,6);
  const m = randInt(1,10);
  const a1 = m*(k-1);
  const answer = m*k;
  return {
    promptText: t('seqGeomSeriesInfinitePrompt', {a1, k}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('seqGeomSeriesInfiniteExplain', {a1, k, answer}),
  };
}
function seqProblemSigmaLinear(){
  const c = randInt(1,5), d = randInt(-5,5), n = randInt(3,10);
  const expr = `${c}i${signedCoeffTerm(d,'')}`;
  const term1 = c*n*(n+1)/2, term2 = d*n;
  const answer = term1+term2;
  return {
    promptText: t('seqSigmaLinearPrompt', {expr, n}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('seqSigmaLinearExplain', {term1, term2, answer}),
  };
}
function seqProblemSumFirstN(){
  const n = randInt(5,30);
  const answer = n*(n+1)/2;
  return {
    promptText: t('seqSumFirstNPrompt', {n}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('seqSumFirstNExplain', {n, product:n*(n+1), answer}),
  };
}
function seqProblemSumOfSquares(){
  const n = randInt(3,15);
  const answer = n*(n+1)*(2*n+1)/6;
  return {
    promptText: t('seqSumOfSquaresPrompt', {n}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('seqSumOfSquaresExplain', {n, twonp1:2*n+1, answer}),
  };
}
function seqProblemFibonacci(){
  const a1 = randInt(1,5), a2 = randInt(1,5);
  const n = randInt(5,10);
  let prev=a1, curr=a2;
  for(let i=3;i<=n;i++){ const next=prev+curr; prev=curr; curr=next; }
  return {
    promptText: t('seqFibonacciPrompt', {a1,a2,n}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===curr; },
    explain: t('seqFibonacciExplain', {a1,a2,n,answer:curr}),
  };
}
function seqProblemRecursive(){
  const a1 = randInt(1,5), k = randInt(2,3), c = randInt(-5,5), n = randInt(3,6);
  let curr = a1;
  for(let i=2;i<=n;i++){ curr = k*curr+c; }
  return {
    promptText: t('seqRecursivePrompt', {a1,k,c,n}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===curr; },
    explain: t('seqRecursiveExplain', {a1,k,c,n,answer:curr}),
  };
}
function seqProblemCommonDifference(){
  const d = nonZeroRandInt(-9,9);
  const a1 = randInt(-20,20);
  const m = randInt(2,10), n = randInt(1,m-1);
  const am = a1+(m-1)*d, an = a1+(n-1)*d;
  return {
    promptText: t('seqCommonDiffPrompt', {m, am, n, an}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===d; },
    explain: t('seqCommonDiffExplain', {am, an, diff:am-an, mn:m-n, d}),
  };
}
function seqProblemCommonRatio(){
  // Restricted to positive ratios: a negative r is indistinguishable from
  // its positive counterpart whenever the term gap (m-n) is even, since
  // both give the exact same am/an — that ambiguity would let a correct
  // answer get marked wrong, so it's avoided rather than special-cased.
  const r = [2,3,4,5][randInt(0,3)];
  const a1 = randInt(1,5);
  const n = randInt(1,4), m = n+randInt(1,3);
  const an = a1*Math.pow(r,n-1), am = a1*Math.pow(r,m-1);
  return {
    promptText: t('seqCommonRatioPrompt', {n, an, m, am}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===r; },
    explain: t('seqCommonRatioExplain', {am, an, ratioPow:m-n, r}),
  };
}
function seqProblemConvergence(){
  const q = randInt(2,9);
  let p;
  if(Math.random()<0.5){ p = randInt(1,q-1)*(Math.random()<0.5?-1:1); }
  else { p = randInt(q+1,q+9)*(Math.random()<0.5?-1:1); }
  const converges = Math.abs(p) < q;
  const absP = Math.abs(p);
  const compareText = converges ? `${absP}/${q} < 1` : `${absP}/${q} ≥ 1`;
  return {
    promptText: t('seqConvergencePrompt', {p, q}),
    inputs: [{key:'ans', placeholder:t('discBoolAnswerPlaceholder')}],
    check(vals){ return parseBool(vals.ans)===converges; },
    explain: t('seqConvergenceExplain', {absP, q, compareText, resultWord: converges?t('seqConverges'):t('seqDiverges')}),
  };
}

        <div class="step-row active">
          <div class="step-label">${t('stepLabel',{n:stepIndex+1, total:steps.length})}</div>

        </div>`;

function submitSeqStep(){
  const s = state.seqSession;
  if(!s || s.answered) return;
  const steps = s.steps;
  const step = steps[s.stepIndex];
  for(const inp of step.inputs){ if(!s.stepInputs[inp.key]) return; }
  const correct = step.check(s.stepInputs);
  if(!correct) s.anyWrong = true;
  const valuesText = step.inputs.map(inp=>s.stepInputs[inp.key]).join(', ');
  const result = {prompt: step.prompt, valuesText, explain: step.explain, correct};
  const isLastStep = s.stepIndex === steps.length-1;
  if(isLastStep){
    s.stepResults.push(result);
    const problemCorrect = !s.anyWrong;
    s.answered = true; s.lastCorrect = problemCorrect;
    if(problemCorrect) registerCorrectAnswer(s, state.game);
    else registerWrongAnswer(s);
  } else {
    s.pendingResult = result;
    s.answered = true; s.lastCorrect = correct;
  }
  render();
}

function nextSeqStep(){
  const s = state.seqSession;
  s.stepResults.push(s.pendingResult);
  s.pendingResult = null;
  s.stepIndex += 1;
  s.answered = false; s.lastCorrect = null; s.stepInputs = {};
  render();
  focusSeqInput();
}

function nextSeqQuestion(){
  const s = state.seqSession;
  if(s.mistakes>=MATH_MAX_MISTAKES){ finishSeqPractice(); return; }
  const topic = seqTopicByKey(s.topicKey);
  const problem = topic.build();
  s.problem = problem; s.steps = normalizeSteps(problem);
  s.stepIndex=0; s.stepInputs={}; s.stepResults=[]; s.anyWrong=false; s.pendingResult=null;
  s.answered=false; s.lastCorrect=null;
  render();
  focusSeqInput();
}

function finishSeqPractice(){
  const s = state.seqSession;
  if(!state.game.sequences) state.game.sequences = {};
  const rec = state.game.sequences[s.topicKey] || (state.game.sequences[s.topicKey] = {best:0});
  s.isNewBest = s.correct > rec.best;
  if(s.isNewBest) rec.best = s.correct;
  touchStreak();
  s.newAchievements = checkAchievements(state.game);
  state.screen='seq_complete';
  render();
}

// rank, trace, eigenvalues, and matrix-property questions. Reuses linear
// algebra's matrixText/matrixShape (for the 2x2-grid input layout) and
// algebra's leadTerm/signedCoeffTerm (for displaying the system of
// equations in Cramer's rule) rather than re-deriving them. Eigenvalues are
// engineered from a symmetric matrix built off a Pythagorean triple (the
// same LINALG_TRIPLES used by linear algebra's vector magnitude) so the
// characteristic equation's discriminant is always a perfect square and the
// two eigenvalues come out as clean integers.
function matProblemCramersRule(){
  let a,b,c,d;
  do{ a=randInt(-6,6); b=randInt(-6,6); c=randInt(-6,6); d=randInt(-6,6); } while(a*d-b*c===0);
  const x0=randInt(-8,8), y0=randInt(-8,8);
  const e=a*x0+b*y0, f=c*x0+d*y0;
  const D = a*d-b*c, Dx = e*d-b*f, Dy = a*f-e*c;
  return {
    promptText: t('matCramersPrompt', {
      eq1:`${leadTerm(a,'x')}${signedCoeffTerm(b,'y')} = ${e}`,
      eq2:`${leadTerm(c,'x')}${signedCoeffTerm(d,'y')} = ${f}`,
    }),
    steps: [
      {
        prompt: t('matCramersStep1Prompt'),
        inputs: [{key:'D', placeholder:t('algNumericAnswerPlaceholder')}],
        check(vals){ return Number(vals.D)===D; },
        explain: t('matCramersStep1Explain', {a, d, b, c, ad:a*d, bc:b*c, D}),
      },
      {
        prompt: t('matCramersStep2Prompt'),
        inputs: [{key:'Dx',label:'Dx'},{key:'Dy',label:'Dy'}],
        check(vals){ return Number(vals.Dx)===Dx && Number(vals.Dy)===Dy; },
        explain: t('matCramersStep2Explain', {e, d, b, f, Dx, a, c, Dy}),
      },
      {
        prompt: t('matCramersStep3Prompt'),
        inputs: [{key:'x',label:'x'},{key:'y',label:'y'}],
        check(vals){ return Number(vals.x)===x0 && Number(vals.y)===y0; },
        explain: t('matCramersStep3Explain', {Dx, D, x0, Dy, y0}),
      },
    ],
  };
}
function matProblemPower(){
  const a=randInt(-5,5), b=randInt(-5,5), c=randInt(-5,5), d=randInt(-5,5);
  const c11=a*a+b*c, c12=a*b+b*d, c21=c*a+d*c, c22=c*b+d*d;
  return {
    promptText: t('matPowerPrompt', {A:matrixHTML([[a,b],[c,d]])}),
    inputs: [{key:'c11'},{key:'c12'},{key:'c21'},{key:'c22'}],
    matrixShape: [2,2],
    check(vals){ return Number(vals.c11)===c11 && Number(vals.c12)===c12 && Number(vals.c21)===c21 && Number(vals.c22)===c22; },
    explain: t('matPowerExplain', {C:matrixHTML([[c11,c12],[c21,c22]])}),
  };
}
function matProblemRank(){
  const kind = randInt(0,2);
  let A, rank;
  if(kind===0){ A=[[0,0],[0,0]]; rank=0; }
  else if(kind===1){
    const a=nonZeroRandInt(-5,5), b=nonZeroRandInt(-5,5);
    const k=nonZeroRandInt(-3,3);
    A=[[a,b],[a*k,b*k]]; rank=1;
  } else {
    let a,b,c,d; do{ a=randInt(-5,5); b=randInt(-5,5); c=randInt(-5,5); d=randInt(-5,5); } while(a*d-b*c===0);
    A=[[a,b],[c,d]]; rank=2;
  }
  return {
    promptText: t('matRankPrompt', {A:matrixHTML(A)}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===rank; },
    explain: t('matRankExplain', {rank}),
  };
}
function matProblemTrace(){
  const use3 = Math.random()<0.5;
  if(use3){
    const m = Array.from({length:3},()=>Array.from({length:3},()=>randInt(-9,9)));
    const trace = m[0][0]+m[1][1]+m[2][2];
    return {
      promptText: t('matTracePrompt', {A:matrixHTML(m)}),
      inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
      check(vals){ return Number(vals.ans)===trace; },
      explain: t('matTrace3Explain', {d1:m[0][0], d2:m[1][1], d3:m[2][2], answer:trace}),
    };
  }
  const a=randInt(-9,9), b=randInt(-9,9), c=randInt(-9,9), d=randInt(-9,9);
  const trace=a+d;
  return {
    promptText: t('matTracePrompt', {A:matrixHTML([[a,b],[c,d]])}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===trace; },
    explain: t('matTrace2Explain', {a, d, answer:trace}),
  };
}
function matProblemEigenvalues(){
  const [leg1,leg2,h] = LINALG_TRIPLES[randInt(0,LINALG_TRIPLES.length-1)];
  const m = randInt(-10,10);
  const a = m+leg1, d = m-leg1, b = leg2;
  const trace = a+d, det = a*d-b*b;
  const lambda1 = m-h, lambda2 = m+h;
  return {
    promptText: t('matEigenvaluesPrompt', {A:matrixHTML([[a,b],[b,d]])}),
    steps: [
      {
        prompt: t('matEigenvaluesStep1Prompt'),
        inputs: [{key:'trace',label:t('matTraceLabel')},{key:'det',label:t('matDetLabel')}],
        check(vals){ return Number(vals.trace)===trace && Number(vals.det)===det; },
        explain: t('matEigenvaluesStep1Explain', {a, d, trace, b, det}),
      },
      {
        prompt: t('matEigenvaluesStep2Prompt'),
        inputs: [{key:'small',label:t('algSmallerRootLabel')},{key:'large',label:t('algLargerRootLabel')}],
        check(vals){ return Number(vals.small)===lambda1 && Number(vals.large)===lambda2; },
        explain: t('matEigenvaluesStep2Explain', {trace, det, lambda1, lambda2}),
      },
    ],
  };
}
function matProblemDetScalarProperty(){
  const detA = randInt(1,9)*(Math.random()<0.5?-1:1);
  const k = nonZeroRandInt(-5,5);
  const answer = k*k*detA;
  return {
    promptText: t('matDetScalarPropPrompt', {detA, k}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('matDetScalarPropExplain', {k, kSq:k*k, detA, answer}),
  };
}
function matProblemDetProductProperty(){
  const detA = randInt(1,9)*(Math.random()<0.5?-1:1), detB = randInt(1,9)*(Math.random()<0.5?-1:1);
  const answer = detA*detB;
  return {
    promptText: t('matDetProductPropPrompt', {detA, detB}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('matDetProductPropExplain', {detA, detB, answer}),
  };
}
function matProblemHomogeneous(){
  const trivialOnly = Math.random()<0.5;
  let a,b,c,d;
  if(trivialOnly){ do{ a=randInt(-6,6); b=randInt(-6,6); c=randInt(-6,6); d=randInt(-6,6); } while(a*d-b*c===0); }
  else { a=randInt(-6,6); b=randInt(-6,6); const k=nonZeroRandInt(-3,3); c=a*k; d=b*k; }
  return {
    promptText: t('matHomogeneousPrompt', {A:matrixHTML([[a,b],[c,d]])}),
    inputs: [{key:'ans', placeholder:t('discBoolAnswerPlaceholder')}],
    check(vals){ return parseBool(vals.ans)===trivialOnly; },
    explain: t('matHomogeneousExplain', {det:a*d-b*c, answer: trivialOnly?'True':'False'}),
  };
}
function matProblemFindScalar(){
  let a,b,c,d; do{ a=randInt(-5,5); b=randInt(-5,5); c=randInt(-5,5); d=randInt(-5,5); } while(a===0&&b===0&&c===0&&d===0);
  const k = nonZeroRandInt(-6,6);
  const B = [[k*a,k*b],[k*c,k*d]];
  return {
    promptText: t('matFindScalarPrompt', {A:matrixHTML([[a,b],[c,d]]), B:matrixHTML(B)}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===k; },
    explain: t('matFindScalarExplain', {k}),
  };
}
function matProblemLinearCombo(){
  const a11=randInt(-9,9), a12=randInt(-9,9), a21=randInt(-9,9), a22=randInt(-9,9);
  const b11=randInt(-9,9), b12=randInt(-9,9), b21=randInt(-9,9), b22=randInt(-9,9);
  const k1=nonZeroRandInt(-4,4), k2=nonZeroRandInt(-4,4);
  const c11=k1*a11+k2*b11, c12=k1*a12+k2*b12, c21=k1*a21+k2*b21, c22=k1*a22+k2*b22;
  return {
    promptText: t('matLinearComboPrompt', {k1, A:matrixHTML([[a11,a12],[a21,a22]]), k2, B:matrixHTML([[b11,b12],[b21,b22]])}),
    inputs: [{key:'c11'},{key:'c12'},{key:'c21'},{key:'c22'}],
    matrixShape:[2,2],
    check(vals){ return Number(vals.c11)===c11 && Number(vals.c12)===c12 && Number(vals.c21)===c21 && Number(vals.c22)===c22; },
    explain: t('matLinearComboExplain', {C:matrixHTML([[c11,c12],[c21,c22]])}),
  };
}
function matProblemSolveForX(){
  const b=randInt(-9,9), c=randInt(-9,9), d=nonZeroRandInt(-9,9);
  const x0=randInt(-9,9);
  const D = x0*d - b*c;
  return {
    promptText: t('matSolveXPrompt', {A:matrixHTML([['x',b],[c,d]]), D}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===x0; },
    explain: t('matSolveXExplain', {b,c,d,bc:b*c,D,sum:D+b*c,x0}),
  };
}
function matProblemSymmetricCheck(){
  const isSym = Math.random()<0.5;
  const a=randInt(-9,9), d=randInt(-9,9), b=randInt(-9,9);
  let c = isSym ? b : b+nonZeroRandInt(-5,5);
  return {
    promptText: t('matSymmetricPrompt', {A:matrixHTML([[a,b],[c,d]])}),
    inputs: [{key:'ans', placeholder:t('discBoolAnswerPlaceholder')}],
    check(vals){ return parseBool(vals.ans)===(b===c); },
    explain: t('matSymmetricExplain', {b, c, answer: (b===c)?'True':'False'}),
  };
}
function matProblemEqualityCheck(){
  const a11=randInt(-9,9), a12=randInt(-9,9), a21=randInt(-9,9), a22=randInt(-9,9);
  const equal = Math.random()<0.5;
  let b11=a11,b12=a12,b21=a21,b22=a22;
  if(!equal){
    const idx = randInt(0,3);
    const delta = nonZeroRandInt(-3,3);
    if(idx===0) b11+=delta; else if(idx===1) b12+=delta; else if(idx===2) b21+=delta; else b22+=delta;
  }
  return {
    promptText: t('matEqualityPrompt', {A:matrixHTML([[a11,a12],[a21,a22]]), B:matrixHTML([[b11,b12],[b21,b22]])}),
    inputs: [{key:'ans', placeholder:t('discBoolAnswerPlaceholder')}],
    check(vals){ return parseBool(vals.ans)===equal; },
    explain: t('matEqualityExplain', {answer: equal?'True':'False'}),
  };
}

  {key:'det_scalar_property', build:matProblemDetScalarProperty},

  state.matSession = {

    stepIndex:0, stepInputs:{}, stepResults:[], anyWrong:false, pendingResult:null,

    combo:0, maxCombo:0, newAchievements:[]
  };

function focusMatInput(){
  setTimeout(()=>{ const el=document.querySelector('.mat-input'); if(el) el.focus(); }, 30);
}

// Renders a single practice card as a sequence of guided steps: most
// problems normalize to exactly one step and render identically to a plain
// one-shot question (no visible change), while problems that define
// multiple steps (e.g. Cramer's rule: D, then Dx/Dy, then x/y) reveal one
// step at a time, each with its own Check button and immediate feedback,
// before the usual XP/hearts feedback bar appears once the whole problem is
// done. This same rendering shape is reused by every math practice mode.
function renderMatPractice(){
  const s = state.matSession;
  const steps = s.steps;
  const multiStep = steps.length > 1;
  const stepIndex = s.stepIndex;
  const curStep = steps[stepIndex];
  const isLastStep = stepIndex === steps.length-1;
  const willFinish = s.mistakes >= MATH_MAX_MISTAKES;

  const inputBox = (inp) => {
    if(inp.fracInput){
      const numVal = s.stepInputs[inp.key+'_num']||'', denVal = s.stepInputs[inp.key+'_den']||'';
      return `
      <div style="flex:1; max-width:110px;">
        ${inp.label ? `<div style="font-size:12px; color:var(--snow-dim); margin-bottom:4px; text-align:center;">${inp.label}</div>` : ''}
        <div class="frac-input">
          <input class="mat-input algebra-input" type="text" inputmode="numeric" autocomplete="off"
            style="font-size:20px; font-family:var(--font-display); font-weight:700; text-align:center;"
            ${s.answered?'disabled':''} value="${numVal}"
            oninput="setFracInputPart(state.matSession,'${inp.key}','num',this.value)">
          <div class="frac-input-bar"></div>
          <input class="algebra-input" type="text" inputmode="numeric" autocomplete="off"
            style="font-size:20px; font-family:var(--font-display); font-weight:700; text-align:center;"
            ${s.answered?'disabled':''} value="${denVal}"
            oninput="setFracInputPart(state.matSession,'${inp.key}','den',this.value)">
        </div>
      </div>`;
    }
    return `
    <div style="flex:1;">
      ${inp.label ? `<div style="font-size:12px; color:var(--snow-dim); margin-bottom:4px;">${inp.label}</div>` : ''}
      <input class="mat-input algebra-input" data-key="${inp.key}" type="text" autocomplete="off"
        placeholder="${inp.placeholder||''}"
        style="text-align:center; font-size:20px; font-family:var(--font-display); font-weight:700; width:100%;"
        ${s.answered?'disabled':''} value="${(s.stepInputs[inp.key]||'')}"
        oninput="state.matSession.stepInputs['${inp.key}']=this.value">
    </div>`;
  };

  const inputsHtml = curStep.matrixShape
    ? `<div style="display:grid; grid-template-columns:repeat(${curStep.matrixShape[1]}, 1fr); gap:10px; max-width:240px; margin:0 auto;">${curStep.inputs.map(inputBox).join('')}</div>`
    : `<div style="display:flex; gap:12px; align-items:flex-end; justify-content:center;">${curStep.inputs.map(inputBox).join('')}</div>`;

  const stepRowHtml = (r) => `
    <div class="step-row done ${r.correct?'correct':'wrong'}">
      <div class="step-label"><span class="step-icon">${r.correct?'✅':'❌'}</span>${r.prompt?enhanceMath(r.prompt):''}</div>
      <div class="step-values">${enhanceMath(r.valuesText)}</div>
      <div class="step-explain">${enhanceMath(r.explain)}</div>
    </div>`;
  const doneRowsHtml = multiStep ? s.stepResults.map(stepRowHtml).join('') : '';

  let activeStepHtml = '';
  if(!(s.answered && isLastStep)){
    if(!s.answered){
      activeStepHtml = multiStep ? `
        <div class="step-row active">
          <div class="step-label">${t('stepLabel',{n:stepIndex+1, total:steps.length})}</div>
          ${curStep.prompt ? `<div class="step-prompt">${enhanceMath(curStep.prompt)}</div>` : ''}
          ${inputsHtml}
          <button class="btn btn-primary btn-block" style="margin-top:12px;" onclick="submitMatStep()">${t('checkBtn')}</button>
        </div>` : `
        ${inputsHtml}
        <button class="btn btn-primary btn-block" onclick="submitMatStep()">${t('checkBtn')}</button>`;
    } else {
      const r = s.pendingResult;
      activeStepHtml = `
        <div class="step-row done ${r.correct?'correct':'wrong'}">
          <div class="step-label"><span class="step-icon">${r.correct?'✅':'❌'}</span>${r.prompt?enhanceMath(r.prompt):''}</div>
          <div class="step-values">${enhanceMath(r.valuesText)}</div>
          <div class="step-explain">${enhanceMath(r.explain)}</div>
          <button class="btn btn-light btn-block" style="margin-top:10px;" onclick="nextMatStep()">${t('nextStepBtn')}</button>
        </div>`;
    }
  }

  const feedback = (s.answered && isLastStep) ? `
    <div class="feedback-bar ${s.lastCorrect?'good':'bad'}">
      <div class="fb-text">
        <div class="fb-title">${s.lastCorrect? t('correctFeedback',{n:s.lastXpGain}) : t('notQuiteFeedback')}</div>
        ${!multiStep ? `<div class="fb-sub">${enhanceMath(curStep.explain)}</div>` : ''}
      </div>
      <button class="btn btn-light" onclick="nextMatQuestion()">${willFinish ? t('finishBtn'):t('continueBtn')}</button>
    </div>` : '';

  return `
  ${topbar({back:'exitMatPractice()'})}
  <div class="lesson">
    <div style="display:flex; justify-content:space-between; align-items:center; margin:6px 0 10px;">
      <div class="hearts-row">${Array.from({length:MATH_MAX_MISTAKES}).map((_,i)=>`<span>${i<(MATH_MAX_MISTAKES-s.mistakes)?'❤️':'🩶'}</span>`).join('')}</div>
      <div style="font-size:12px; color:var(--snow-dim); text-align:right;">${t('correctAnswersLabel')}: ${s.correct}${s.combo>=3?`<br><span style="color:var(--gold);">${comboBadge(s.combo)} ${t('comboLabel',{n:s.combo})}</span>`:''}</div>
    </div>
    <div class="q-wrap">
      <div class="q-card">
        <div class="q-eyebrow">${t('matTopicTitle_'+s.topicKey)}</div>
        <div class="q-prompt" style="font-size:20px;">${enhanceMath(s.problem.promptText)}</div>
      </div>
      ${multiStep ? `<div class="step-list">${doneRowsHtml}${activeStepHtml}</div>` : activeStepHtml}
    </div>
  </div>
  ${feedback}
  `;
}

function submitMatStep(){
  const s = state.matSession;
  if(!s || s.answered) return;
  const steps = s.steps;
  const step = steps[s.stepIndex];
  for(const inp of step.inputs){ if(!s.stepInputs[inp.key]) return; }
  const correct = step.check(s.stepInputs);
  if(!correct) s.anyWrong = true;
  const valuesText = step.inputs.map(inp=>s.stepInputs[inp.key]).join(', ');
  const result = {prompt: step.prompt, valuesText, explain: step.explain, correct};
  const isLastStep = s.stepIndex === steps.length-1;
  if(isLastStep){
    s.stepResults.push(result);
    const problemCorrect = !s.anyWrong;
    s.answered = true; s.lastCorrect = problemCorrect;
    if(problemCorrect) registerCorrectAnswer(s, state.game);
    else registerWrongAnswer(s);
  } else {
    s.pendingResult = result;
    s.answered = true; s.lastCorrect = correct;
  }
  render();
}

function nextMatStep(){
  const s = state.matSession;
  s.stepResults.push(s.pendingResult);
  s.pendingResult = null;
  s.stepIndex += 1;
  s.answered = false; s.lastCorrect = null; s.stepInputs = {};
  render();
  focusMatInput();
}

function nextMatQuestion(){
  const s = state.matSession;
  if(s.mistakes>=MATH_MAX_MISTAKES){ finishMatPractice(); return; }
  const topic = matTopicByKey(s.topicKey);
  const problem = topic.build();
  s.problem = problem; s.steps = normalizeSteps(problem);
  s.stepIndex=0; s.stepInputs={}; s.stepResults=[]; s.anyWrong=false; s.pendingResult=null;
  s.answered=false; s.lastCorrect=null;
  render();
  focusMatInput();
}

function finishMatPractice(){
  const s = state.matSession;
  if(!state.game.matrices) state.game.matrices = {};
  const rec = state.game.matrices[s.topicKey] || (state.game.matrices[s.topicKey] = {best:0});
  s.isNewBest = s.correct > rec.best;
  if(s.isNewBest) rec.best = s.correct;
  touchStreak();
  s.newAchievements = checkAchievements(state.game);
  state.screen='mat_complete';
  render();
}

function renderMatComplete(){
  const s = state.matSession;
  const best = state.game.matrices[s.topicKey].best;
  const lvl = xpLevel(state.game.xp);
  return `
  ${topbar()}
  <div class="complete ${appLangClass()}">
    <div class="medal">${s.isNewBest ? '🏆' : '🎯'}</div>

// ---- coordinate geometry learning: Month 12, lines and shapes in the
// coordinate plane — slope, midpoint, intercepts, parallel/perpendicular
// lines, circles and parabolas. Reuses the same guided step-engine as every
// other math mode; y_intercept and parabola_vertex are genuinely multi-step.
function coordgeomProblemSlope(){
  const dx = randInt(1,4);
  const m = [-4,-3,-2,-1,1,2,3,4][randInt(0,7)];
  const x1 = randInt(-8,8), y1 = randInt(-8,8);
  const x2 = x1+dx, y2 = y1+m*dx;
  const dy = y2-y1;
  return {
    promptText: t('coordgeomSlopePrompt', {x1,y1,x2,y2}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===m; },
    explain: t('coordgeomSlopeExplain', {y2,y1,x2,x1,dy,dx,m}),
  };
}
function coordgeomProblemMidpoint(){
  const mx = randInt(-8,8), my = randInt(-8,8);
  const ox = randInt(1,7), oy = randInt(1,7);
  const x1 = mx-ox, x2 = mx+ox, y1 = my-oy, y2 = my+oy;
  return {
    promptText: t('coordgeomMidpointPrompt', {x1,y1,x2,y2}),
    inputs: [{key:'mx',label:'x'},{key:'my',label:'y'}],
    check(vals){ return Number(vals.mx)===mx && Number(vals.my)===my; },
    explain: t('coordgeomMidpointExplain', {x1,x2,sumX:x1+x2,y1,y2,sumY:y1+y2,mx,my}),
  };
}
function coordgeomProblemSlopeIntercept(){
  const m = nonZeroRandInt(-5,5);
  const x0 = randInt(-6,6);
  const b = randInt(-9,9);
  const y0 = m*x0+b;
  const mExpr = leadTerm(m,'x');
  return {
    promptText: t('coordgeomSlopeInterceptPrompt', {m,x0,y0,mExpr}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===b; },
    explain: t('coordgeomSlopeInterceptExplain', {y0,m,x0,mx0:m*x0,b}),
  };
}
function coordgeomProblemPointOnLine(){
  const m = nonZeroRandInt(-4,4);
  const b = randInt(-6,6);
  const isOn = Math.random()<0.5;
  const x = randInt(-6,6);
  const computedY = m*x+b;
  const y = isOn ? computedY : computedY + nonZeroRandInt(-4,4);
  const mExpr = leadTerm(m,'x');
  const bExpr = signedCoeffTerm(b,'');
  const actual = (y===computedY);
  return {
    promptText: t('coordgeomPointOnLinePrompt', {x,y,mExpr,bExpr}),
    inputs: [{key:'ans', placeholder:t('discBoolAnswerPlaceholder')}],
    check(vals){ return parseBool(vals.ans)===actual; },
    explain: t('coordgeomPointOnLineExplain', {x,mExpr,bExpr,computedY,y,answer: actual?'True':'False'}),
  };
}
function coordgeomProblemParallelCheck(){
  const m1 = nonZeroRandInt(-5,5);
  const isParallel = Math.random()<0.5;
  let m2;
  if(isParallel){ m2 = m1; } else { do{ m2 = nonZeroRandInt(-5,5); }while(m2===m1); }
  return {
    promptText: t('coordgeomParallelPrompt', {m1,m2}),
    inputs: [{key:'ans', placeholder:t('discBoolAnswerPlaceholder')}],
    check(vals){ return parseBool(vals.ans)===isParallel; },
    explain: t('coordgeomParallelExplain', {m1,m2,compareSymbol:isParallel?'=':'≠',answer:isParallel?'True':'False'}),
  };
}
function coordgeomProblemPerpendicularSlope(){
  const q = randInt(2,6);
  let p; do{ p = nonZeroRandInt(-6,6); }while(gcd(Math.abs(p),q)!==1);
  let numerator, denominator;
  if(p<0){ numerator=q; denominator=-p; } else { numerator=-q; denominator=p; }
  return {
    promptText: t('coordgeomPerpSlopePrompt', {p,q}),
    inputs: [{key:'ans', placeholder:t('algFractionAnswerPlaceholder'), fracInput:true}],
    check(vals){ const f=parseFraction(vals.ans); return !!f && f.p===numerator && f.q===denominator; },
    explain: t('coordgeomPerpSlopeExplain', {p,q,numerator,denominator}),
  };
}
function coordgeomProblemXIntercept(){
  const m = nonZeroRandInt(-6,6);
  const x0 = nonZeroRandInt(-6,6);
  const b = -m*x0;
  const mExpr = leadTerm(m,'x');
  const bExpr = signedCoeffTerm(b,'');
  return {
    promptText: t('coordgeomXInterceptPrompt', {mExpr,bExpr}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===x0; },
    explain: t('coordgeomXInterceptExplain', {mExpr,bExpr,m,negB:-b,x0}),
  };
}
function coordgeomProblemYIntercept(){
  const dx = randInt(1,4);
  const m = nonZeroRandInt(-4,4);
  const x1 = randInt(-6,6), y1 = randInt(-6,6);
  const x2 = x1+dx, y2 = y1+m*dx;
  const b = y1 - m*x1;
  const dy = y2-y1;
  return {
    promptText: t('coordgeomYInterceptPrompt', {x1,y1,x2,y2}),
    steps: [
      {
        prompt: t('coordgeomYInterceptStep1Prompt'),
        inputs: [{key:'m', placeholder:t('algNumericAnswerPlaceholder')}],
        check(vals){ return Number(vals.m)===m; },
        explain: t('coordgeomYInterceptStep1Explain', {y2,y1,dy,x2,x1,dx,m}),
      },
      {
        prompt: t('coordgeomYInterceptStep2Prompt'),
        inputs: [{key:'b', placeholder:t('algNumericAnswerPlaceholder')}],
        check(vals){ return Number(vals.b)===b; },
        explain: t('coordgeomYInterceptStep2Explain', {y1,m,x1,mx1:m*x1,b}),
      },
    ],
  };
}
function coordgeomProblemLineIntersection(){
  let m1,m2; do{ m1=nonZeroRandInt(-4,4); m2=nonZeroRandInt(-4,4); }while(m1===m2);
  const x0=randInt(-6,6), y0=randInt(-6,6);
  const b1=y0-m1*x0, b2=y0-m2*x0;
  const m1Expr=leadTerm(m1,'x'), b1Expr=signedCoeffTerm(b1,'');
  const m2Expr=leadTerm(m2,'x'), b2Expr=signedCoeffTerm(b2,'');
  return {
    promptText: t('coordgeomLineIntersectPrompt', {m1Expr,b1Expr,m2Expr,b2Expr}),
    inputs: [{key:'x',label:'x'},{key:'y',label:'y'}],
    check(vals){ return Number(vals.x)===x0 && Number(vals.y)===y0; },
    explain: t('coordgeomLineIntersectExplain', {m1Expr,b1Expr,m2Expr,b2Expr,x0,y0}),
  };
}
function coordgeomProblemCircleCenterRadius(){
  const h=randInt(-6,6), k=randInt(-6,6), r=randInt(2,9);
  const rSq = r*r;
  const hExpr = h>=0 ? `x - ${h}` : `x + ${-h}`;
  const kExpr = k>=0 ? `y - ${k}` : `y + ${-k}`;
  return {
    promptText: t('coordgeomCircleCenterPrompt', {hExpr,kExpr,rSq}),
    inputs: [{key:'h',label:'h'},{key:'k',label:'k'},{key:'r',label:'r'}],
    check(vals){ return Number(vals.h)===h && Number(vals.k)===k && Number(vals.r)===r; },
    explain: t('coordgeomCircleCenterExplain', {h,k,rSq,r}),
  };
}
function coordgeomProblemParabolaVertex(){
  const a = [1,-1,2,-2][randInt(0,3)];
  const x0 = randInt(-5,5);
  const b = -2*a*x0;
  const c = randInt(-6,6);
  const y0 = a*x0*x0+b*x0+c;
  const aExpr = leadTerm(a,'x²'), bExpr=signedCoeffTerm(b,'x'), cExpr=signedCoeffTerm(c,'');
  return {
    promptText: t('coordgeomParabolaVertexPrompt', {aExpr,bExpr,cExpr}),
    steps: [
      {
        prompt: t('coordgeomParabolaVertexStep1Prompt'),
        inputs: [{key:'x', placeholder:t('algNumericAnswerPlaceholder')}],
        check(vals){ return Number(vals.x)===x0; },
        explain: t('coordgeomParabolaVertexStep1Explain', {b,a,twoA:2*a,x0}),
      },
      {
        prompt: t('coordgeomParabolaVertexStep2Prompt'),
        inputs: [{key:'y', placeholder:t('algNumericAnswerPlaceholder')}],
        check(vals){ return Number(vals.y)===y0; },
        explain: t('coordgeomParabolaVertexStep2Explain', {a,x0,b,c,y0}),
      },
    ],
  };
}
function coordgeomProblemReflectX(){
  const x=randInt(-9,9), y=nonZeroRandInt(-9,9);
  return {
    promptText: t('coordgeomReflectXPrompt', {x,y}),
    inputs: [{key:'x',label:'x'},{key:'y',label:'y'}],
    check(vals){ return Number(vals.x)===x && Number(vals.y)===-y; },
    explain: t('coordgeomReflectXExplain', {x,y,negY:-y}),
  };
}
function coordgeomProblemReflectY(){
  const x=nonZeroRandInt(-9,9), y=randInt(-9,9);
  return {
    promptText: t('coordgeomReflectYPrompt', {x,y}),
    inputs: [{key:'x',label:'x'},{key:'y',label:'y'}],
    check(vals){ return Number(vals.x)===-x && Number(vals.y)===y; },
    explain: t('coordgeomReflectYExplain', {x,y,negX:-x}),
  };
}

function renderCoordGeomPractice(){

    <div class="step-row done ${r.correct?'correct':'wrong'}">
      <div class="step-label"><span class="step-icon">${r.correct?'✅':'❌'}</span>${r.prompt?enhanceMath(r.prompt):''}</div>

    </div>`;
  const doneRowsHtml = multiStep ? s.stepResults.map(stepRowHtml).join('') : '';

  let activeStepHtml = '';
  if(!(s.answered && isLastStep)){
    if(!s.answered){
      activeStepHtml = multiStep ? `
        <div class="step-row active">
          <div class="step-label">${t('stepLabel',{n:stepIndex+1, total:steps.length})}</div>

function submitCoordGeomStep(){
  const s = state.coordgeomSession;
  if(!s || s.answered) return;
  const steps = s.steps;
  const step = steps[s.stepIndex];
  for(const inp of step.inputs){ if(!s.stepInputs[inp.key]) return; }
  const correct = step.check(s.stepInputs);
  if(!correct) s.anyWrong = true;
  const valuesText = step.inputs.map(inp=>s.stepInputs[inp.key]).join(', ');
  const result = {prompt: step.prompt, valuesText, explain: step.explain, correct};
  const isLastStep = s.stepIndex === steps.length-1;
  if(isLastStep){
    s.stepResults.push(result);
    const problemCorrect = !s.anyWrong;
    s.answered = true; s.lastCorrect = problemCorrect;
    if(problemCorrect) registerCorrectAnswer(s, state.game);
    else registerWrongAnswer(s);
  } else {
    s.pendingResult = result;
    s.answered = true; s.lastCorrect = correct;
  }
  render();
}

function nextCoordGeomStep(){
  const s = state.coordgeomSession;
  s.stepResults.push(s.pendingResult);
  s.pendingResult = null;
  s.stepIndex += 1;
  s.answered = false; s.lastCorrect = null; s.stepInputs = {};
  render();
  focusCoordGeomInput();
}

function nextCoordGeomQuestion(){
  const s = state.coordgeomSession;
  if(s.mistakes>=MATH_MAX_MISTAKES){ finishCoordGeomPractice(); return; }
  const topic = coordgeomTopicByKey(s.topicKey);
  const problem = topic.build();
  s.problem = problem; s.steps = normalizeSteps(problem);
  s.stepIndex=0; s.stepInputs={}; s.stepResults=[]; s.anyWrong=false; s.pendingResult=null;
  s.answered=false; s.lastCorrect=null;
  render();
  focusCoordGeomInput();
}

function finishCoordGeomPractice(){
  const s = state.coordgeomSession;
  if(!state.game.coordgeom) state.game.coordgeom = {};
  const rec = state.game.coordgeom[s.topicKey] || (state.game.coordgeom[s.topicKey] = {best:0});
  s.isNewBest = s.correct > rec.best;
  if(s.isNewBest) rec.best = s.correct;
  touchStreak();
  s.newAchievements = checkAchievements(state.game);
  state.screen='coordgeom_complete';
  render();
}

// ---- number theory learning: Month 13, primes, divisors and modular
// arithmetic beyond Discrete Math's basics — the Euclidean algorithm topic
// is genuinely multi-step, walking the actual division-by-division procedure.
function numtheoryIsPrime(n){
  if(n<2) return false;
  for(let i=2;i*i<=n;i++){ if(n%i===0) return false; }
  return true;
}
function numtheoryProblemIsPrime(){
  const n = randInt(2,97);
  const p = numtheoryIsPrime(n);
  return {
    promptText: t('numtheoryIsPrimePrompt', {n}),
    inputs: [{key:'ans', placeholder:t('discBoolAnswerPlaceholder')}],
    check(vals){ return parseBool(vals.ans)===p; },
    explain: t('numtheoryIsPrimeExplain', {n, sqrtN: Math.floor(Math.sqrt(n)), answer: p?'True':'False'}),
  };
}
function numtheoryProblemSmallestPrimeFactor(){
  let n; do{ n = randInt(4,90); } while(numtheoryIsPrime(n));
  let f=2; while(n%f!==0) f++;
  return {
    promptText: t('numtheorySmallestPrimeFactorPrompt', {n}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===f; },
    explain: t('numtheorySmallestPrimeFactorExplain', {n, f, quotient:n/f}),
  };
}
function numtheoryProblemPrimeFactorCount(){
  const primes=[2,3,5,7,11];
  const k = randInt(2,3);
  const chosen = [];
  while(chosen.length<k){ const pr=primes[randInt(0,primes.length-1)]; if(!chosen.includes(pr)) chosen.push(pr); }
  let n=1; for(const pr of chosen) n*=pr;
  return {
    promptText: t('numtheoryPrimeFactorCountPrompt', {n}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===k; },
    explain: t('numtheoryPrimeFactorCountExplain', {n, factors:chosen.join(' × '), k}),
  };
}
function numtheoryProblemCountDivisors(){
  const p=[2,3,5][randInt(0,2)]; let q; do{ q=[2,3,5][randInt(0,2)]; }while(q===p);
  const a=randInt(1,2), b=randInt(1,2);
  const n = Math.pow(p,a)*Math.pow(q,b);
  const count=(a+1)*(b+1);
  return {
    promptText: t('numtheoryCountDivisorsPrompt', {n}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===count; },
    explain: t('numtheoryCountDivisorsExplain', {n, p,a,q,b,count}),
  };
}
function numtheoryProblemSumProperDivisors(){
  const n = randInt(6,60);
  let sum=0; for(let d=1; d<n; d++) if(n%d===0) sum+=d;
  return {
    promptText: t('numtheorySumProperDivisorsPrompt', {n}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===sum; },
    explain: t('numtheorySumProperDivisorsExplain', {n, sum}),
  };
}
function numtheoryProblemIsPerfect(){
  const PERFECT = [6,28];
  const wantPerfect = Math.random()<0.5;
  let n;
  if(wantPerfect){ n = PERFECT[randInt(0,PERFECT.length-1)]; }
  else { do{ n = randInt(4,40); } while(PERFECT.includes(n)); }
  let sum=0; for(let d=1; d<n; d++) if(n%d===0) sum+=d;
  const actual = sum===n;
  return {
    promptText: t('numtheoryIsPerfectPrompt', {n}),
    inputs: [{key:'ans', placeholder:t('discBoolAnswerPlaceholder')}],
    check(vals){ return parseBool(vals.ans)===actual; },
    explain: t('numtheoryIsPerfectExplain', {n, sum, answer: actual?'True':'False'}),
  };
}
function numtheoryProblemDivisibilityCheck(){
  const b = randInt(2,12);
  const wantDiv = Math.random()<0.5;
  let a;
  if(wantDiv){ a = b*randInt(2,10); }
  else { do{ a = randInt(10,120); } while(a%b===0); }
  const actual = a%b===0;
  return {
    promptText: t('numtheoryDivisibilityPrompt', {a,b}),
    inputs: [{key:'ans', placeholder:t('discBoolAnswerPlaceholder')}],
    check(vals){ return parseBool(vals.ans)===actual; },
    explain: t('numtheoryDivisibilityExplain', {a,b, remainder:a%b, answer: actual?'True':'False'}),
  };
}
function numtheoryProblemDigitalRoot(){
  const n = randInt(10,9999);
  let dr = n; while(dr>=10){ dr = String(dr).split('').reduce((s,d)=>s+Number(d),0); }
  return {
    promptText: t('numtheoryDigitalRootPrompt', {n}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===dr; },
    explain: t('numtheoryDigitalRootExplain', {n, dr}),
  };
}
function numtheoryProblemCoprimeCheck(){
  const a = randInt(4,40);
  let b;
  const wantCoprime = Math.random()<0.5;
  if(wantCoprime){ do{ b = randInt(4,40); } while(gcd(a,b)!==1); }
  else { const commonFactor = nonZeroRandInt(2,6); do{ b = commonFactor*randInt(2,10); }while(gcd(a,b)===1); }
  const g = gcd(a,b);
  const actual = g===1;
  return {
    promptText: t('numtheoryCoprimePrompt', {a,b}),
    inputs: [{key:'ans', placeholder:t('discBoolAnswerPlaceholder')}],
    check(vals){ return parseBool(vals.ans)===actual; },
    explain: t('numtheoryCoprimeExplain', {a,b,g, answer: actual?'True':'False'}),
  };
}
function numtheoryProblemEuclidean(){
  const r1 = randInt(2,9);
  const q2 = randInt(2,5);
  const b = q2*r1;
  const q1 = randInt(1,5);
  const a = q1*b + r1;
  return {
    promptText: t('numtheoryEuclideanPrompt', {a,b}),
    steps: [
      {
        prompt: t('numtheoryEuclideanStep1Prompt', {a,b}),
        inputs: [{key:'q',label:'q'},{key:'r',label:'r'}],
        check(vals){ return Number(vals.q)===q1 && Number(vals.r)===r1; },
        explain: t('numtheoryEuclideanStep1Explain', {a,b,q1,r1}),
      },
      {
        prompt: t('numtheoryEuclideanStep2Prompt', {b, r1}),
        inputs: [{key:'q',label:'q'},{key:'r',label:'r'}],
        check(vals){ return Number(vals.q)===q2 && Number(vals.r)===0; },
        explain: t('numtheoryEuclideanStep2Explain', {b,r1,q2,gcdVal:r1}),
      },
    ],
  };
}
function numtheoryProblemFibonacci(){
  const n = randInt(4,12);
  let a=1,b=1; for(let i=3;i<=n;i++){ const c=a+b; a=b; b=c; }
  const fn = b;
  return {
    promptText: t('numtheoryFibonacciPrompt', {n}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===fn; },
    explain: t('numtheoryFibonacciExplain', {n, fn}),
  };
}
function numtheoryProblemTriangular(){
  const n = randInt(4,20);
  const tn = n*(n+1)/2;
  return {
    promptText: t('numtheoryTriangularPrompt', {n}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===tn; },
    explain: t('numtheoryTriangularExplain', {n, np1:n+1, tn}),
  };
}
function numtheoryProblemPowerMod(){
  const a = randInt(2,9);
  const b = randInt(2,4);
  const n = randInt(3,11);
  let result=1; for(let i=0;i<b;i++) result=(result*a)%n;
  return {
    promptText: t('numtheoryPowerModPrompt', {a,b,n}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===result; },
    explain: t('numtheoryPowerModExplain', {a,b,n,powVal:Math.pow(a,b),result}),
  };
}

  const topic = numtheoryTopicByKey(topicKey);
  const problem = topic.build();
  state.numtheorySession = {
    topicKey, problem, steps: normalizeSteps(problem),
    stepIndex:0, stepInputs:{}, stepResults:[], anyWrong:false, pendingResult:null,
    correct:0, mistakes:0, answered:false, lastCorrect:null, xpEarned:0, isNewBest:false,
    combo:0, maxCombo:0, newAchievements:[]

function focusNumTheoryInput(){
  setTimeout(()=>{ const el=document.querySelector('.numtheory-input'); if(el) el.focus(); }, 30);
}

function renderNumTheoryPractice(){
  const s = state.numtheorySession;
  const steps = s.steps;
  const multiStep = steps.length > 1;
  const stepIndex = s.stepIndex;
  const curStep = steps[stepIndex];
  const isLastStep = stepIndex === steps.length-1;
  const willFinish = s.mistakes >= MATH_MAX_MISTAKES;

  const inputBox = (inp) => {
    if(inp.fracInput){
      const numVal = s.stepInputs[inp.key+'_num']||'', denVal = s.stepInputs[inp.key+'_den']||'';

            oninput="setFracInputPart(state.numtheorySession,'${inp.key}','num',this.value)">
          <div class="frac-input-bar"></div>
          <input class="algebra-input" type="text" inputmode="numeric" autocomplete="off"
            style="font-size:20px; font-family:var(--font-display); font-weight:700; text-align:center;"
            ${s.answered?'disabled':''} value="${denVal}"
            oninput="setFracInputPart(state.numtheorySession,'${inp.key}','den',this.value)">
        </div>
      </div>`;
    }
    return `
    <div style="flex:1;">
      ${inp.label ? `<div style="font-size:12px; color:var(--snow-dim); margin-bottom:4px;">${inp.label}</div>` : ''}
      <input class="numtheory-input algebra-input" data-key="${inp.key}" type="text" autocomplete="off"
        placeholder="${inp.placeholder||''}"
        style="text-align:center; font-size:20px; font-family:var(--font-display); font-weight:700; width:100%;"
        ${s.answered?'disabled':''} value="${(s.stepInputs[inp.key]||'')}"
        oninput="state.numtheorySession.stepInputs['${inp.key}']=this.value">
    </div>`;
  };

  const inputsHtml = curStep.matrixShape
    ? `<div style="display:grid; grid-template-columns:repeat(${curStep.matrixShape[1]}, 1fr); gap:10px; max-width:240px; margin:0 auto;">${curStep.inputs.map(inputBox).join('')}</div>`
    : `<div style="display:flex; gap:12px; align-items:flex-end; justify-content:center;">${curStep.inputs.map(inputBox).join('')}</div>`;

  const stepRowHtml = (r) => `
    <div class="step-row done ${r.correct?'correct':'wrong'}">
      <div class="step-label"><span class="step-icon">${r.correct?'✅':'❌'}</span>${r.prompt?enhanceMath(r.prompt):''}</div>
      <div class="step-values">${enhanceMath(r.valuesText)}</div>
      <div class="step-explain">${enhanceMath(r.explain)}</div>
    </div>`;
  const doneRowsHtml = multiStep ? s.stepResults.map(stepRowHtml).join('') : '';

  let activeStepHtml = '';
  if(!(s.answered && isLastStep)){
    if(!s.answered){
      activeStepHtml = multiStep ? `
        <div class="step-row active">
          <div class="step-label">${t('stepLabel',{n:stepIndex+1, total:steps.length})}</div>
          ${curStep.prompt ? `<div class="step-prompt">${enhanceMath(curStep.prompt)}</div>` : ''}
          ${inputsHtml}
          <button class="btn btn-primary btn-block" style="margin-top:12px;" onclick="submitNumTheoryStep()">${t('checkBtn')}</button>
        </div>` : `
        ${inputsHtml}
        <button class="btn btn-primary btn-block" onclick="submitNumTheoryStep()">${t('checkBtn')}</button>`;
    } else {
      const r = s.pendingResult;
      activeStepHtml = `
        <div class="step-row done ${r.correct?'correct':'wrong'}">
          <div class="step-label"><span class="step-icon">${r.correct?'✅':'❌'}</span>${r.prompt?enhanceMath(r.prompt):''}</div>
          <div class="step-values">${enhanceMath(r.valuesText)}</div>
          <div class="step-explain">${enhanceMath(r.explain)}</div>
          <button class="btn btn-light btn-block" style="margin-top:10px;" onclick="nextNumTheoryStep()">${t('nextStepBtn')}</button>
        </div>`;
    }
  }

  </div>

}

function submitNumTheoryStep(){
  const s = state.numtheorySession;
  if(!s || s.answered) return;
  const steps = s.steps;
  const step = steps[s.stepIndex];
  for(const inp of step.inputs){ if(!s.stepInputs[inp.key]) return; }
  const correct = step.check(s.stepInputs);
  if(!correct) s.anyWrong = true;
  const valuesText = step.inputs.map(inp=>s.stepInputs[inp.key]).join(', ');
  const result = {prompt: step.prompt, valuesText, explain: step.explain, correct};
  const isLastStep = s.stepIndex === steps.length-1;
  if(isLastStep){
    s.stepResults.push(result);
    const problemCorrect = !s.anyWrong;
    s.answered = true; s.lastCorrect = problemCorrect;
    if(problemCorrect) registerCorrectAnswer(s, state.game);
    else registerWrongAnswer(s);
  } else {
    s.pendingResult = result;
    s.answered = true; s.lastCorrect = correct;
  }
  render();
}

function nextNumTheoryStep(){
  const s = state.numtheorySession;
  s.stepResults.push(s.pendingResult);
  s.pendingResult = null;
  s.stepIndex += 1;
  s.answered = false; s.lastCorrect = null; s.stepInputs = {};
  render();
  focusNumTheoryInput();
}

function nextNumTheoryQuestion(){
  const s = state.numtheorySession;
  if(s.mistakes>=MATH_MAX_MISTAKES){ finishNumTheoryPractice(); return; }
  const topic = numtheoryTopicByKey(s.topicKey);
  const problem = topic.build();
  s.problem = problem; s.steps = normalizeSteps(problem);
  s.stepIndex=0; s.stepInputs={}; s.stepResults=[]; s.anyWrong=false; s.pendingResult=null;
  s.answered=false; s.lastCorrect=null;
  render();
  focusNumTheoryInput();
}

function finishNumTheoryPractice(){
  const s = state.numtheorySession;
  if(!state.game.numtheory) state.game.numtheory = {};
  const rec = state.game.numtheory[s.topicKey] || (state.game.numtheory[s.topicKey] = {best:0});
  s.isNewBest = s.correct > rec.best;
  if(s.isNewBest) rec.best = s.correct;
  touchStreak();
  s.newAchievements = checkAchievements(state.game);
  state.screen='numtheory_complete';
  render();
}

function diagramDiversification(){
  const r=45, c=2*Math.PI*r;
  const slices = [30,25,25,20];
  const colors = ['var(--gold)','var(--ice)','var(--good)','var(--bad)'];
  let offset=0;
  const circles = slices.map((pct,i)=>{
    const len = c*pct/100;
    const dash = `${len} ${c-len}`;
    const dashoffset = -offset;
    offset += len;
    return `<circle cx="70" cy="70" r="${r}" fill="none" style="stroke:${colors[i]}" stroke-width="26" stroke-dasharray="${dash}" stroke-dashoffset="${dashoffset}"/>`;
  }).join('');
  return `<svg viewBox="0 0 280 140" style="width:100%; height:auto;">
    <g transform="rotate(-90 70 70)">${circles}</g>
    <text x="148" y="42" style="fill:var(--gold); font-size:10px;">■ ${t('bizLabelStocks')}</text>
    <text x="148" y="62" style="fill:var(--ice); font-size:10px;">■ ${t('bizLabelBonds')}</text>

// ---- financial statement "figures": a plain HTML table (label left, value
// right), reused both as a read-only worked example on the Learn screen and
// as an interactive fill-in-the-blank exercise during the quiz — the
// "figures of financial statements where the user can fill in missing
// information based on calculation" the user asked for. Money is formatted
// accounting-style (parentheses for negatives) since that's the convention
// used throughout the source lecture slides, and typed answers accept that
// same style back (parens, a leading minus, $ signs, thousands commas).
function formatMoney(n){
  const neg = n<0;
  const s = Math.abs(Math.round(n)).toLocaleString('en-US');
  return neg ? `(${s})` : s;
}
function normalizeMoneyAnswer(str){
  if(!str) return null;
  let s = String(str).trim().replace(/[$,\s]/g,'');
  let neg = false;
  if(/^\(.*\)$/.test(s)){ neg = true; s = s.slice(1,-1); }
  if(s.startsWith('-')){ neg = true; s = s.slice(1); }
  if(s==='') return null;
  const num = parseFloat(s);
  if(isNaN(num)) return null;
  return neg ? -num : num;
}
// Breaks dense, comma/semicolon-packed exam-bank prose (e.g. "Steel: Direct,
// Inventoriable. Maintenance staff: Indirect, Inventoriable. ...") into
// separate readable lines, bolding "Label:" prefixes and turning semicolon-
// separated lists into bullet points. Used for Quiz Bank questions/answers
// and concept explanations, all of which are static authored text (no user
// input), so no HTML escaping is needed.
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
function formatReadableText(text){
  if(!text) return '';
  const sentences = text.split(/\.\s+/)
    .map((s,i,arr) => (i<arr.length-1 && !/[.!?:]$/.test(s)) ? s+'.' : s)
    .map(s=>s.trim()).filter(Boolean);
  return sentences.map(sentence=>{
    const m = sentence.match(/^([^:]{2,60}):\s*(.+)$/);
    let label = null, rest = sentence;
    if(m){ label = m[1].trim(); rest = m[2].trim(); }
    const semiItems = rest.split(';').map(x=>x.trim()).filter(Boolean);
    if(semiItems.length >= 2){
      const items = semiItems.map(it=>`<li>${it.replace(/\.$/,'')}</li>`).join('');
      return `${label?`<div class="qb-line"><strong>${label}:</strong></div>`:''}<ul class="qb-list">${items}</ul>`;
    }
    return `<div class="qb-line">${label?`<strong>${label}:</strong> `:''}${rest}</div>`;
  }).join('');
}
function checkStatementAnswer(rows, inputs){
  const correctness = {};
  let allCorrect = true;
  rows.filter(r=>r.blank).forEach(r=>{
    const typed = normalizeMoneyAnswer(inputs[r.key]);
    const ok = typed!==null && Math.abs(typed - r.value) < 0.5;
    correctness[r.key] = ok;
    if(!ok) allCorrect = false;
  });
  return {allCorrect, correctness};
}
function renderStatementTable(rows, opts){
  opts = opts || {};
  const plain = !!opts.plain;
  const inputs = opts.inputs || {};
  const answered = !!opts.answered;
  const correctness = opts.correctness || {};
  const rowsHtml = rows.map(r=>{
    if(!plain && r.blank && !answered){
      return `<div class="stmt-row"><div class="stmt-label">${r.label}</div><input class="stmt-input" data-key="${r.key}" type="text" inputmode="numeric" placeholder="?" value="${inputs[r.key]||''}" oninput="state.businessSession.stmtInputs['${r.key}']=this.value"></div>`;
    }
    if(!plain && r.blank && answered){
      const ok = correctness[r.key];
      return `<div class="stmt-row"><div class="stmt-label">${r.label}</div><div class="stmt-value ${ok?'stmt-correct':'stmt-wrong'}">${formatMoney(r.value)}</div></div>`;
    }
    return `<div class="stmt-row"><div class="stmt-label">${r.label}</div><div class="stmt-value">${formatMoney(r.value)}</div></div>`;
  }).join('');
  return `<div class="stmt-table">${rowsHtml}</div>`;
}

function buildOverAppliedStatement(hard){

  const variance = actualOH-appliedOH;
