    cplxLearn_complex_multiplication: "To multiply complex numbers, expand like binomials and use i² = -1: (a+bi)(c+di) = (ac - bd) + (ad + bc)i.\n\nExample: multiply (2 + 3i) and (1 - 2i).\n(2)(1) - (3)(-2) = 2 + 6 = 8. (2)(-2) + (3)(1) = -4 + 3 = -1.\nResult: 8 - i.",
    cplxMulPrompt: "Multiply: ({z1}) × ({z2})",
    cplxMulExplain: "Real: ac - bd = ({a})({c}) - ({b})({d}) = {ac} - {bd} = {re}. Imaginary: ad + bc = ({a})({d}) + ({b})({c}) = {ad} + {bc} = {im}.",

    cplxTopicTitle_complex_division: "Complex Division", cplxTopicDesc_complex_division: "Divide two complex numbers",
    cplxLearn_complex_division: "To divide complex numbers, multiply top and bottom by the conjugate of the denominator, which clears the imaginary part from the bottom.\n\nExample: divide (8 - i) by (2 - 2i).\n(8-i)(2+2i) / [(2-2i)(2+2i)] = (16+16i-2i-2i²)/(4+4) = (16+14i+2)/8 = (18+14i)/8 = 2.25 + 1.75i (not always this clean — this app only asks for divisions that land on whole numbers).",
    cplxDivPrompt: "Divide: ({z1}) ÷ ({z2})",
    cplxDivExplain: "Multiply by the conjugate {conj}: the denominator becomes {c}² + {d}² = {denom}. The result simplifies to {p} + {q}i.",

    cplxTopicTitle_complex_conjugate: "Complex Conjugate", cplxTopicDesc_complex_conjugate: "Find the conjugate of a complex number",
    cplxLearn_complex_conjugate: "The conjugate of a+bi, written a-bi, flips the sign of the imaginary part.\n\nExample: find the conjugate of 5 - 3i.\n5 + 3i.",
    cplxConjPrompt: "Find the conjugate of {z}.",
    cplxConjExplain: "Flip the sign of the imaginary part: {answer}.",

    cplxTopicTitle_complex_modulus: "Complex Modulus", cplxTopicDesc_complex_modulus: "Find the distance from a complex number to the origin",
    cplxLearn_complex_modulus: "The modulus of a+bi is its distance from the origin in the complex plane: |a+bi| = √(a² + b²).\n\nExample: find the modulus of 3 + 4i.\n|3+4i| = √(9+16) = √25 = 5.",
    cplxModulusPrompt: "Find the modulus of {z}.",
    cplxModulusExplain: "|z| = √({aSq} + {bSq}) = √{sum} = {c}.",

    cplxTopicTitle_powers_of_i: "Powers of i", cplxTopicDesc_powers_of_i: "Find i raised to a power",
    cplxLearn_powers_of_i: "Powers of i cycle every 4: i¹=i, i²=-1, i³=-i, i⁴=1, then it repeats. To find iⁿ, find the remainder of n divided by 4.\n\nExample: find i⁷.\n7 ÷ 4 leaves remainder 3, and i³ = -i. So i⁷ = -i.",
    cplxPowersIPrompt: "Find i^{n}.",
    cplxPowersIExplain: "{n} ÷ 4 leaves remainder {rem}, and that power of i is {answer}.",

    cplxTopicTitle_argument: "Argument of a Complex Number", cplxTopicDesc_argument: "Find the angle of a complex number in standard position",
    cplxLearn_argument: "The argument of a complex number is the angle its position makes with the positive real axis, measured counterclockwise.\n\nExample: find the argument of 1 + i.\nThis point is at 45° — equally far along the real and imaginary axes in the first quadrant.",
    cplxArgumentPrompt: "Find the argument (in degrees) of {z}.",
    cplxArgumentExplain: "This point lies at {angle}° from the positive real axis.",

    cplxTopicTitle_polar_to_rectangular: "Polar to Rectangular", cplxTopicDesc_polar_to_rectangular: "Convert a complex number from polar to rectangular form",
    cplxLearn_polar_to_rectangular: "A complex number with modulus r and argument θ converts to rectangular form a+bi using a = r·cos(θ), b = r·sin(θ). At the axis angles (0°, 90°, 180°, 270°), this is especially clean since cos and sin are each 0, 1 or -1.\n\nExample: convert r=5, θ=90° to rectangular form.\na = 5·cos(90°) = 0, b = 5·sin(90°) = 5. Result: 5i.",
    cplxPolarToRectPrompt: "Convert to rectangular form: modulus {r}, argument {angle}°.",
    cplxPolarToRectExplain: "At {angle}°, the result is {answer}.",

    cplxTopicTitle_de_moivre: "De Moivre's Theorem", cplxTopicDesc_de_moivre: "Find the resulting angle after raising a complex number to a power",
    cplxLearn_de_moivre: "De Moivre's theorem says [r(cos θ + i sin θ)]ⁿ = rⁿ(cos(nθ) + i sin(nθ)) — raising to the nth power multiplies the argument by n. For a number with modulus 1, only the angle matters.\n\nExample: a complex number has argument 60°. Find the argument of its cube (n=3).\n60° × 3 = 180°.",
    cplxDeMoivrePrompt: "A complex number with modulus 1 has argument {angle}°. Find the argument of its {nOrd} power (reduced to [0°, 360°)).",
    cplxDeMoivreExplain: "{angle}° × {n} = {product}°, which reduces to {answer}° within [0°, 360°).",

    cplxTopicTitle_roots_of_unity: "Roots of Unity", cplxTopicDesc_roots_of_unity: "Find the angle spacing between the nth roots of unity",
    cplxLearn_roots_of_unity: "The n complex nth roots of unity are evenly spaced around the unit circle, 360°/n apart.\n\nExample: find the spacing between the 6th roots of unity.\n360°/6 = 60°.",
    cplxRootsUnityPrompt: "Find the angle spacing between the {nOrd} roots of unity.",
    cplxRootsUnityExplain: "360° / {n} = {answer}°.",

    cplxTopicTitle_quadratic_roots: "Complex Roots of a Quadratic", cplxTopicDesc_quadratic_roots: "Find the complex roots of a quadratic equation",
    cplxLearn_quadratic_roots: "When a quadratic's discriminant is negative, its roots are a complex conjugate pair: p ± qi. Since the equation always factors as x² - 2px + (p²+q²) = 0 for roots p±qi, you can find p and q directly from the coefficients.\n\nExample: solve x² - 4x + 13 = 0.\nHere -2p = -4, so p = 2. And p²+q² = 13, so 4+q² = 13, q² = 9, q = 3. Roots: 2 ± 3i.",
    cplxQuadRootsPrompt: "Solve: {expr}. Give the root with positive imaginary part.",
    cplxQuadRootsExplain: "Since the constant term is p² + q² = {c} and the x-coefficient is -2p = {b}, this gives p = {p} and q = {q}. The root is {p} + {q}i.",

    cplxTopicTitle_modulus_of_product: "Modulus of a Product", cplxTopicDesc_modulus_of_product: "Find |z₁z₂| using the moduli of z₁ and z₂",
    cplxLearn_modulus_of_product: "The modulus of a product equals the product of the moduli: |z₁z₂| = |z₁| × |z₂| — no need to actually multiply the complex numbers out.\n\nExample: |3+4i| = 5 and |5+12i| = 13. Find |(3+4i)(5+12i)|.\n5 × 13 = 65.",
    cplxModulusProductPrompt: "Find |z₁z₂|, where z₁ = {z1} and z₂ = {z2}.",
    cplxModulusProductExplain: "|z₁| = {m1} and |z₂| = {m2}. |z₁z₂| = |z₁| × |z₂| = {m1} × {m2} = {answer}.",

    sequencesTitle: "Sequences & Series",
    sequencesSub: "Month 10: patterns of numbers and the sums they add up to. Pick a topic to learn the concept, then practice.",
    backToSeqMenuBtn: "Back to Sequences & Series",
    seqConverges: "converges", seqDiverges: "diverges",

    seqTopicTitle_arithmetic_nth_term: "Arithmetic Sequences", seqTopicDesc_arithmetic_nth_term: "Find the nth term of an arithmetic sequence",
    seqLearn_arithmetic_nth_term: "An arithmetic sequence adds the same amount (the common difference, d) each step: aₙ = a₁ + (n-1)d.\n\nExample: a sequence starts at 4 with common difference 3. Find the 6th term.\na₆ = 4 + (6-1)×3 = 4 + 15 = 19.",
    seqArithNthPrompt: "An arithmetic sequence starts at {a1} with common difference {d}. Find the {n}th term.",
    seqArithNthExplain: "aₙ = a₁ + (n-1)d = {a1} + ({n}-1)×{d} = {answer}.",

    seqTopicTitle_geometric_nth_term: "Geometric Sequences", seqTopicDesc_geometric_nth_term: "Find the nth term of a geometric sequence",
    seqLearn_geometric_nth_term: "A geometric sequence multiplies by the same amount (the common ratio, r) each step: aₙ = a₁ × r^(n-1).\n\nExample: a sequence starts at 2 with common ratio 3. Find the 4th term.\na₄ = 2 × 3^(4-1) = 2 × 27 = 54.",
    seqGeomNthPrompt: "A geometric sequence starts at {a1} with common ratio {r}. Find the {n}th term.",
    seqGeomNthExplain: "aₙ = a₁ × r^(n-1) = {a1} × {r}^({n}-1) = {answer}.",

    seqTopicTitle_arithmetic_series_sum: "Arithmetic Series", seqTopicDesc_arithmetic_series_sum: "Find the sum of the first n terms of an arithmetic sequence",
    seqLearn_arithmetic_series_sum: "The sum of the first n terms of an arithmetic sequence is Sₙ = n(a₁+aₙ)/2, the number of terms times the average of the first and last.\n\nExample: sum the first 5 terms of an arithmetic sequence starting at 3 with common difference 2.\na₅ = 3+(5-1)×2 = 11. S₅ = 5(3+11)/2 = 5×14/2 = 35.",
    seqArithSeriesSumPrompt: "Find the sum of the first {n} terms of an arithmetic sequence starting at {a1} with common difference {d}.",
    seqArithSeriesSumExplain: "aₙ = {a1}+({n}-1)×{d} = {an}. Sₙ = n(a₁+aₙ)/2 = {n}({a1}+{an})/2 = {answer}.",

    seqTopicTitle_geometric_series_sum: "Geometric Series", seqTopicDesc_geometric_series_sum: "Find the sum of the first n terms of a geometric sequence",
    seqLearn_geometric_series_sum: "The sum of the first n terms of a geometric sequence is Sₙ = a₁(rⁿ-1)/(r-1).\n\nExample: sum the first 4 terms of a geometric sequence starting at 2 with common ratio 3.\nTerms: 2, 6, 18, 54. Sum = 80.",
    seqGeomSeriesSumPrompt: "Find the sum of the first {n} terms of a geometric sequence starting at {a1} with common ratio {r}.",
    seqGeomSeriesSumExplain: "Adding the first {n} terms (each the previous times {r}, starting at {a1}) gives {sum}.",

    seqTopicTitle_geometric_series_infinite: "Infinite Geometric Series", seqTopicDesc_geometric_series_infinite: "Find the sum of an infinite geometric series",
    seqLearn_geometric_series_infinite: "When |r| < 1, an infinite geometric series converges to a finite sum: S = a₁/(1-r).\n\nExample: find the sum of an infinite geometric series with first term 4 and common ratio 1/2.\nS = 4/(1-1/2) = 4/(1/2) = 8.",
    seqGeomSeriesInfinitePrompt: "Find the sum of an infinite geometric series with first term {a1} and common ratio 1/{k}.",
    seqGeomSeriesInfiniteExplain: "S = a₁/(1-r) = {a1}/(1-1/{k}) = {answer}.",

    seqTopicTitle_sigma_linear: "Sigma Notation", seqTopicDesc_sigma_linear: "Evaluate a sum written in sigma notation",
    seqLearn_sigma_linear: "Σ (sigma) notation compactly writes a sum: Σ from i=1 to n of f(i) means add up f(1), f(2), ..., f(n). For a linear expression, this is the same as an arithmetic series.\n\nExample: evaluate Σ from i=1 to 4 of (2i+1).\nTerms: 3, 5, 7, 9. Sum = 24.",
    seqSigmaLinearPrompt: "Evaluate: Σ from i=1 to {n} of ({expr})",
    seqSigmaLinearExplain: "This splits into Σci + Σd = {term1} + {term2} = {answer}.",

    seqTopicTitle_sum_first_n: "Sum of the First n Integers", seqTopicDesc_sum_first_n: "Find 1 + 2 + 3 + ... + n",
    seqLearn_sum_first_n: "The sum of the first n positive integers has a shortcut formula: 1+2+...+n = n(n+1)/2.\n\nExample: find the sum of the first 10 positive integers.\n10×11/2 = 55.",
    seqSumFirstNPrompt: "Find the sum: 1 + 2 + 3 + ... + {n}.",
    seqSumFirstNExplain: "n(n+1)/2 = ({n})({n}+1)/2 = {product}/2 = {answer}.",

    seqTopicTitle_sum_of_squares: "Sum of Squares", seqTopicDesc_sum_of_squares: "Find 1² + 2² + 3² + ... + n²",
    seqLearn_sum_of_squares: "The sum of the first n squares has a shortcut formula: 1²+2²+...+n² = n(n+1)(2n+1)/6.\n\nExample: find the sum of the first 4 squares.\n1+4+9+16 = 4×5×9/6 = 180/6 = 30.",
    seqSumOfSquaresPrompt: "Find the sum: 1² + 2² + 3² + ... + {n}².",
    seqSumOfSquaresExplain: "n(n+1)(2n+1)/6 = {n}×({n}+1)×{twonp1}/6 = {answer}.",

    seqTopicTitle_fibonacci: "Fibonacci-Style Sequences", seqTopicDesc_fibonacci: "Find a term in a sequence where each term is the sum of the two before it",
    seqLearn_fibonacci: "A Fibonacci-style sequence starts with two values, then each next term is the sum of the previous two: aₙ = a_(n-1) + a_(n-2).\n\nExample: a sequence starts 1, 1, then follows this rule. Find the 6th term.\n1, 1, 2, 3, 5, 8 — the 6th term is 8.",
    seqFibonacciPrompt: "A sequence starts {a1}, {a2}, and each next term is the sum of the two before it. Find the {n}th term.",
    seqFibonacciExplain: "Building the sequence term by term from {a1}, {a2} gives term {n} = {answer}.",

    seqTopicTitle_recursive_sequence: "Recursive Sequences", seqTopicDesc_recursive_sequence: "Find a term defined by a recurrence relation",
    seqLearn_recursive_sequence: "A recursive sequence defines each term using the one before it: aₙ = k×a_(n-1) + c.\n\nExample: a₁ = 2, and aₙ = 3×a_(n-1) + 1. Find a₃.\na₂ = 3×2+1 = 7. a₃ = 3×7+1 = 22.",
    seqRecursivePrompt: "a₁ = {a1}, and aₙ = {k}×a_(n-1) + ({c}). Find a_{n}.",
    seqRecursiveExplain: "Applying the rule aₙ = {k}×a_(n-1) + ({c}) repeatedly from a₁ = {a1} gives a_{n} = {answer}.",

    seqTopicTitle_common_difference: "Finding the Common Difference", seqTopicDesc_common_difference: "Find d from two terms of an arithmetic sequence",
    seqLearn_common_difference: "If you know two terms of an arithmetic sequence, you can find the common difference: d = (aₘ - aₙ)/(m - n).\n\nExample: the 3rd term of an arithmetic sequence is 7, and the 7th term is 19. Find d.\nd = (19-7)/(7-3) = 12/4 = 3.",
    seqCommonDiffPrompt: "The {m}th term of an arithmetic sequence is {am}, and the {n}th term is {an}. Find the common difference.",
    seqCommonDiffExplain: "d = (a_{m} - a_{n})/({m} - {n}) = ({am} - {an})/{mn} = {d}.",

    seqTopicTitle_common_ratio: "Finding the Common Ratio", seqTopicDesc_common_ratio: "Find r from two terms of a geometric sequence",
    seqLearn_common_ratio: "If you know two terms of a geometric sequence, you can find the common ratio by dividing: aₘ/aₙ = r^(m-n).\n\nExample: the 2nd term of a geometric sequence is 6, and the 5th term is 162. Find r.\nr³ = 162/6 = 27, so r = 3.",
    seqCommonRatioPrompt: "The {n}th term of a geometric sequence is {an}, and the {m}th term is {am}. Find the common ratio.",
    seqCommonRatioExplain: "a_{m}/a_{n} = r^({m}-{n}), so r^{ratioPow} = {am}/{an}, giving r = {r}.",

    seqTopicTitle_series_convergence: "Series Convergence", seqTopicDesc_series_convergence: "Determine whether an infinite geometric series converges",
    seqLearn_series_convergence: "An infinite geometric series with common ratio r converges (adds up to a finite value) only when |r| < 1. Otherwise it diverges.\n\nExample: does a geometric series with r = 3/4 converge?\n|3/4| = 0.75 < 1, so yes, it converges.",
    seqConvergencePrompt: "An infinite geometric series has common ratio {p}/{q}. Does it converge?",
    seqConvergenceExplain: "|r| = {absP}/{q}. Since {compareText}, the series {resultWord}.",

    matricesTitle: "Matrices & Linear Systems",
    matricesSub: "Month 11: back to matrices for deeper ground — Cramer's rule, rank, trace, and eigenvalues. Pick a topic to learn the concept, then practice.",
    backToMatMenuBtn: "Back to Matrices",

    matTopicTitle_cramers_rule: "Cramer's Rule", matTopicDesc_cramers_rule: "Solve a 2×2 system of equations using determinants",
    matLearn_cramers_rule: "Cramer's rule solves a system using determinants. For ax+by=e and cx+dy=f, let D be the determinant of the coefficient matrix, Dx be D with the x-column replaced by (e,f), and Dy be D with the y-column replaced by (e,f). Then x = Dx/D and y = Dy/D.\n\nExample: solve 2x+y=5 and x-y=1.\nD = (2)(-1)-(1)(1) = -3. Dx = (5)(-1)-(1)(1) = -6, so x = -6/-3 = 2. Dy = (2)(1)-(5)(1) = -3, so y = -3/-3 = 1.",
    matCramersPrompt: "Solve using Cramer's rule: {eq1}, and {eq2}",
    matCramersStep1Prompt: "Step 1: Find D, the determinant of the coefficient matrix.",
    matCramersStep1Explain: "D = ad − bc = ({a})({d}) − ({b})({c}) = {ad} − {bc} = {D}.",
    matCramersStep2Prompt: "Step 2: Find Dx (D with the x-column replaced by the right-hand side) and Dy (D with the y-column replaced).",
    matCramersStep2Explain: "Dx = ({e})({d}) − ({b})({f}) = {Dx}. Dy = ({a})({f}) − ({e})({c}) = {Dy}.",
    matCramersStep3Prompt: "Step 3: Find x = Dx/D and y = Dy/D.",
    matCramersStep3Explain: "x = Dx/D = {Dx}/{D} = {x0}. y = Dy/D = {Dy}/{D} = {y0}.",

    matTopicTitle_matrix_power: "Matrix Powers", matTopicDesc_matrix_power: "Compute A² for a 2×2 matrix",
    matLearn_matrix_power: "Squaring a matrix means multiplying it by itself: A² = A × A, using the normal rules of matrix multiplication.\n\nExample: square A = [[1,2],[3,4]].\nA² = [[1×1+2×3, 1×2+2×4], [3×1+4×3, 3×2+4×4]] = [[7,10],[15,22]].",
    matPowerPrompt: "Find A², where A = {A}",
    matPowerExplain: "A² = A × A = {C}.",

    matTopicTitle_matrix_rank: "Matrix Rank", matTopicDesc_matrix_rank: "Find the rank of a 2×2 matrix",
    matLearn_matrix_rank: "The rank of a matrix is the number of linearly independent rows (or columns). For a 2×2 matrix: rank 0 means every entry is 0, rank 2 means the determinant is nonzero, and rank 1 means the determinant is 0 but the matrix isn't all zeros.\n\nExample: find the rank of [[2,4],[1,2]].\nThe determinant is (2)(2)-(4)(1) = 0, and the matrix isn't all zeros (row 2 is exactly half of row 1). Rank = 1.",
    matRankPrompt: "Find the rank of A = {A}",
    matRankExplain: "The rank is {rank}.",

    matTopicTitle_matrix_trace: "Matrix Trace", matTopicDesc_matrix_trace: "Find the sum of a matrix's diagonal entries",
    matLearn_matrix_trace: "The trace of a square matrix is the sum of its diagonal entries (top-left to bottom-right).\n\nExample: find the trace of [[3,7],[1,5]].\ntrace = 3 + 5 = 8.",
    matTracePrompt: "Find the trace of A = {A}",
    matTrace2Explain: "trace = {a} + {d} = {answer}.",
    matTrace3Explain: "trace = {d1} + {d2} + {d3} = {answer}.",

    matTopicTitle_eigenvalues: "Eigenvalues", matTopicDesc_eigenvalues: "Find the eigenvalues of a 2×2 matrix",
    matLearn_eigenvalues: "The eigenvalues of a 2×2 matrix solve the characteristic equation λ² - (trace)λ + det = 0, where trace is the sum of the diagonal and det is the determinant.\n\nExample: find the eigenvalues of [[4,3],[3,-4]].\ntrace = 0, det = (4)(-4)-(3)(3) = -25. λ² - 25 = 0, so λ² = 25, λ = ±5.",
    matEigenvaluesPrompt: "Find the eigenvalues of A = {A}",
    matTraceLabel: "Trace", matDetLabel: "Determinant",
    matEigenvaluesStep1Prompt: "Step 1: Find the trace and determinant of A.",
    matEigenvaluesStep1Explain: "trace(A) = a + d = {a} + {d} = {trace}. det(A) = ad − b² = ({a})({d}) − {b}² = {det}.",
    matEigenvaluesStep2Prompt: "Step 2: Solve λ² − (trace)λ + det = 0 for the two eigenvalues.",
    matEigenvaluesStep2Explain: "λ² − {trace}λ + ({det}) = 0 gives λ = {lambda1} and λ = {lambda2}.",

    matTopicTitle_det_scalar_property: "Determinant of a Scalar Multiple", matTopicDesc_det_scalar_property: "Find det(kA) from det(A) for a 2×2 matrix",
    matLearn_det_scalar_property: "Scaling a 2×2 matrix by k multiplies its determinant by k²: det(kA) = k²·det(A).\n\nExample: det(A) = 5. Find det(3A).\ndet(3A) = 3²×5 = 9×5 = 45.",
    matDetScalarPropPrompt: "det(A) = {detA} for a 2×2 matrix A. Find det({k}A).",
    matDetScalarPropExplain: "det(kA) = k²·det(A) = {k}²×{detA} = {kSq}×{detA} = {answer}.",

    matTopicTitle_det_product_property: "Determinant of a Product", matTopicDesc_det_product_property: "Find det(AB) from det(A) and det(B)",
    matLearn_det_product_property: "The determinant of a product equals the product of the determinants: det(AB) = det(A)·det(B) — no need to actually multiply the matrices.\n\nExample: det(A) = 4, det(B) = -3. Find det(AB).\ndet(AB) = 4×(-3) = -12.",
    matDetProductPropPrompt: "det(A) = {detA} and det(B) = {detB}. Find det(AB).",
    matDetProductPropExplain: "det(AB) = det(A) × det(B) = {detA} × {detB} = {answer}.",

    matTopicTitle_homogeneous_system: "Homogeneous Systems", matTopicDesc_homogeneous_system: "Determine whether Ax=0 has only the trivial solution",
    matLearn_homogeneous_system: "A homogeneous system Ax=0 always has the trivial solution x=0. It has ONLY that solution when det(A)≠0. If det(A)=0, there are infinitely many solutions.\n\nExample: does [[2,4],[1,2]] have only the trivial solution?\ndet = (2)(2)-(4)(1) = 0, so no — there are infinitely many solutions.",
    matHomogeneousPrompt: "Does the system Ax = 0 have only the trivial solution x = 0, where A = {A}?",
    matHomogeneousExplain: "det(A) = {det}. The system has only the trivial solution if and only if det(A) ≠ 0, so the answer is {answer}.",

    matTopicTitle_find_scalar: "Finding a Scalar Multiplier", matTopicDesc_find_scalar: "Find k such that kA = B",
    matLearn_find_scalar: "If B = kA for some scalar k, you can find k by dividing any nonzero corresponding entries: k = B's entry / A's entry.\n\nExample: A = [[2,3],[1,4]], B = [[6,9],[3,12]]. Find k.\nk = 6/2 = 3 (check: 3×[[2,3],[1,4]] = [[6,9],[3,12]], correct).",
    matFindScalarPrompt: "Find k such that kA = B, where A = {A} and B = {B}.",
    matFindScalarExplain: "Comparing corresponding entries gives k = {k}.",

    matTopicTitle_linear_combo: "Linear Combinations of Matrices", matTopicDesc_linear_combo: "Compute k₁A + k₂B for two matrices",
    matLearn_linear_combo: "A linear combination of matrices scales each one, then adds them entry by entry: k₁A + k₂B.\n\nExample: find 2A + 3B, where A = [[1,0],[0,1]] and B = [[2,1],[1,2]].\n2A = [[2,0],[0,2]]. 3B = [[6,3],[3,6]]. Sum = [[8,3],[3,8]].",
    matLinearComboPrompt: "Find {k1}A + {k2}B, where A = {A} and B = {B}.",
    matLinearComboExplain: "{k1}A + {k2}B = {C}.",

    matTopicTitle_solve_for_x: "Solving for an Unknown Entry", matTopicDesc_solve_for_x: "Find x given the determinant of a matrix containing x",
    matLearn_solve_for_x: "If a matrix contains an unknown entry x and you know the determinant, you can solve for x using the determinant formula.\n\nExample: [[x,2],[3,5]] has determinant 4. Find x.\n5x - 6 = 4, so 5x = 10, x = 2.",
    matSolveXPrompt: "A = {A} has determinant {D}. Find x.",
    matSolveXExplain: "The determinant is xd - bc = x({d}) - ({b})({c}) = {D}, so x×{d} = {D} + {bc} = {sum}, giving x = {x0}.",

    matTopicTitle_symmetric_check: "Symmetric Matrices", matTopicDesc_symmetric_check: "Determine whether a matrix is symmetric",
    matLearn_symmetric_check: "A matrix is symmetric if it equals its own transpose — for a 2×2 matrix [[a,b],[c,d]], that just means b = c.\n\nExample: is [[3,5],[5,7]] symmetric?\nb=5 and c=5, so yes.",
    matSymmetricPrompt: "Is A = {A} symmetric?",
    matSymmetricExplain: "A is symmetric only if its off-diagonal entries match: b = {b} and c = {c}. So the answer is {answer}.",

    matTopicTitle_equality_check: "Matrix Equality", matTopicDesc_equality_check: "Determine whether two matrices are equal",
    matLearn_equality_check: "Two matrices are equal only if every corresponding entry matches exactly.\n\nExample: are [[1,2],[3,4]] and [[1,2],[3,5]] equal?\nThe bottom-right entries differ (4 vs 5), so no.",
    matEqualityPrompt: "Are A = {A} and B = {B} equal?",
    matEqualityExplain: "Comparing every entry of A and B shows the answer is {answer}.",
    coordgeomTitle: "Coordinate Geometry",
    coordgeomSub: "Month 12: lines and shapes in the coordinate plane — slope, midpoint, intercepts, parallel and perpendicular lines, circles and parabolas. Pick a topic to learn the concept, then practice.",
    backToCoordGeomMenuBtn: "Back to Coordinate Geometry",

    coordgeomTopicTitle_slope: "Slope", coordgeomTopicDesc_slope: "Find the slope of a line through two points",
    coordgeomLearn_slope: "The slope of a line through two points measures how steep it is: m = (y₂ − y₁)/(x₂ − x₁).\n\nExample: find the slope through (1, 2) and (3, 8).\nm = (8 − 2)/(3 − 1) = 6/2 = 3.",
    coordgeomSlopePrompt: "Find the slope of the line through ({x1}, {y1}) and ({x2}, {y2}).",
    coordgeomSlopeExplain: "m = (y₂ − y₁)/(x₂ − x₁) = ({y2} − {y1})/({x2} − {x1}) = {dy}/{dx} = {m}.",

    coordgeomTopicTitle_midpoint: "Midpoint", coordgeomTopicDesc_midpoint: "Find the midpoint of a segment between two points",
    coordgeomLearn_midpoint: "The midpoint of a segment is the average of the endpoints' coordinates: ((x₁+x₂)/2, (y₁+y₂)/2).\n\nExample: find the midpoint of (1, 2) and (5, 8).\nMidpoint = ((1+5)/2, (2+8)/2) = (3, 5).",
    coordgeomMidpointPrompt: "Find the midpoint of the segment from ({x1}, {y1}) to ({x2}, {y2}).",
    coordgeomMidpointExplain: "Midpoint = ((x₁+x₂)/2, (y₁+y₂)/2) = (({x1}+{x2})/2, ({y1}+{y2})/2) = ({mx}, {my}).",

    coordgeomTopicTitle_slope_intercept_form: "Slope-Intercept Form", coordgeomTopicDesc_slope_intercept_form: "Find b in y = mx + b, given the slope and a point",
    coordgeomLearn_slope_intercept_form: "A line's slope-intercept form is y = mx + b, where m is the slope and b is the y-intercept. If you know the slope and one point on the line, substitute in and solve for b.\n\nExample: a line has slope 2 and passes through (3, 7). Find b.\n7 = 2(3) + b, so 7 = 6 + b, giving b = 1.",
    coordgeomSlopeInterceptPrompt: "A line has slope {m} and passes through ({x0}, {y0}). Find b in y = {mExpr} + b.",
    coordgeomSlopeInterceptExplain: "b = y − mx = {y0} − ({m})({x0}) = {y0} − {mx0} = {b}.",

    coordgeomTopicTitle_point_on_line_check: "Point on a Line", coordgeomTopicDesc_point_on_line_check: "Determine whether a point lies on a given line",
    coordgeomLearn_point_on_line_check: "A point (x, y) lies on the line y = mx + b only if plugging in its x-value gives back its y-value exactly.\n\nExample: does (2, 5) lie on y = 2x + 1?\n2(2) + 1 = 5, which matches, so yes.",
    coordgeomPointOnLinePrompt: "Does the point ({x}, {y}) lie on the line y = {mExpr}{bExpr}?",
    coordgeomPointOnLineExplain: "Plugging in x = {x}: y = {mExpr}{bExpr} = {computedY}. The point's y-value is {y}, so the answer is {answer}.",

    coordgeomTopicTitle_parallel_check: "Parallel Lines", coordgeomTopicDesc_parallel_check: "Determine whether two lines with given slopes are parallel",
    coordgeomLearn_parallel_check: "Two lines are parallel exactly when they have the same slope.\n\nExample: are lines with slopes 3 and 3 parallel? Yes, since 3 = 3. Are lines with slopes 3 and -2 parallel? No, since 3 ≠ -2.",
    coordgeomParallelPrompt: "Line 1 has slope {m1}. Line 2 has slope {m2}. Are the lines parallel?",
    coordgeomParallelExplain: "Two lines are parallel exactly when their slopes are equal: {m1} {compareSymbol} {m2}. So the answer is {answer}.",

    coordgeomTopicTitle_perpendicular_slope: "Perpendicular Slope", coordgeomTopicDesc_perpendicular_slope: "Find the slope of a line perpendicular to a given one",
    coordgeomLearn_perpendicular_slope: "Perpendicular lines have slopes that are negative reciprocals of each other: if one slope is p/q, the perpendicular slope is -q/p.\n\nExample: a line has slope 2/3. A perpendicular line has slope -3/2.",
    coordgeomPerpSlopePrompt: "A line has slope {p}/{q}. Find the slope of a line perpendicular to it, as a fraction.",
    coordgeomPerpSlopeExplain: "The perpendicular slope is the negative reciprocal: flip {p}/{q} and change its sign, giving {numerator}/{denominator}.",

    coordgeomTopicTitle_x_intercept: "x-Intercept", coordgeomTopicDesc_x_intercept: "Find where a line crosses the x-axis",
    coordgeomLearn_x_intercept: "The x-intercept is where a line crosses the x-axis, where y = 0. Set y = 0 in y = mx + b and solve for x.\n\nExample: find the x-intercept of y = 2x - 6.\n0 = 2x - 6, so 2x = 6, giving x = 3.",
    coordgeomXInterceptPrompt: "Find the x-intercept of the line y = {mExpr}{bExpr}.",
    coordgeomXInterceptExplain: "Set y = 0: 0 = {mExpr}{bExpr}, so {m}x = {negB}, giving x = {x0}.",

    coordgeomTopicTitle_y_intercept: "y-Intercept from Two Points", coordgeomTopicDesc_y_intercept: "Find where a line through two points crosses the y-axis",
    coordgeomLearn_y_intercept: "To find the y-intercept of a line through two points, first find the slope, then use one point to solve for b in y = mx + b.\n\nExample: find the y-intercept of the line through (1, 4) and (3, 8).\nSlope: m = (8-4)/(3-1) = 4/2 = 2. Then b = 4 - 2(1) = 2.",
    coordgeomYInterceptPrompt: "Find the y-intercept of the line through ({x1}, {y1}) and ({x2}, {y2}).",
    coordgeomYInterceptStep1Prompt: "Step 1: Find the slope m of the line.",
    coordgeomYInterceptStep1Explain: "m = (y₂ − y₁)/(x₂ − x₁) = ({y2} − {y1})/({x2} − {x1}) = {dy}/{dx} = {m}.",
    coordgeomYInterceptStep2Prompt: "Step 2: Use one of the points and b = y − mx to find the y-intercept b.",
    coordgeomYInterceptStep2Explain: "b = y − mx = {y1} − ({m})({x1}) = {y1} − {mx1} = {b}.",

    coordgeomTopicTitle_line_intersection: "Line Intersection", coordgeomTopicDesc_line_intersection: "Find where two lines meet",
    coordgeomLearn_line_intersection: "Two non-parallel lines meet at exactly one point. Set their equations equal and solve for x, then substitute back to find y.\n\nExample: where do y = x + 1 and y = -x + 5 meet?\nx + 1 = -x + 5, so 2x = 4, x = 2. Then y = 2 + 1 = 3. They meet at (2, 3).",
    coordgeomLineIntersectPrompt: "Find where the lines y = {m1Expr}{b1Expr} and y = {m2Expr}{b2Expr} intersect.",
    coordgeomLineIntersectExplain: "Setting {m1Expr}{b1Expr} = {m2Expr}{b2Expr} and solving gives x = {x0}, then y = {y0}. They meet at ({x0}, {y0}).",

    coordgeomTopicTitle_circle_center_radius: "Circle Center and Radius", coordgeomTopicDesc_circle_center_radius: "Find the center and radius from a circle's equation",
    coordgeomLearn_circle_center_radius: "A circle's equation (x-h)² + (y-k)² = r² has center (h, k) and radius r.\n\nExample: find the center and radius of (x-2)² + (y+3)² = 25.\nCenter = (2, -3), and r² = 25 so r = 5.",
    coordgeomCircleCenterPrompt: "Find the center (h, k) and radius r of the circle ({hExpr})² + ({kExpr})² = {rSq}.",
    coordgeomCircleCenterExplain: "The equation (x-h)² + (y-k)² = r² gives center (h, k) = ({h}, {k}) and r² = {rSq}, so r = {r}.",

    coordgeomTopicTitle_parabola_vertex: "Parabola Vertex", coordgeomTopicDesc_parabola_vertex: "Find the vertex of a parabola y = ax² + bx + c",
    coordgeomLearn_parabola_vertex: "The vertex of a parabola y = ax² + bx + c has x-coordinate x = -b/(2a). Substitute that x back into the equation to find the y-coordinate.\n\nExample: find the vertex of y = x² - 4x + 1.\nx = -(-4)/(2×1) = 2. y = (2)² - 4(2) + 1 = 4 - 8 + 1 = -3. Vertex = (2, -3).",
    coordgeomParabolaVertexPrompt: "Find the vertex of the parabola y = {aExpr}{bExpr}{cExpr}.",
    coordgeomParabolaVertexStep1Prompt: "Step 1: Find the x-coordinate of the vertex, x = -b/(2a).",
    coordgeomParabolaVertexStep1Explain: "x = -b/(2a) = -({b})/(2×{a}) = -({b})/{twoA} = {x0}.",
    coordgeomParabolaVertexStep2Prompt: "Step 2: Substitute that x back into the equation to find y.",
    coordgeomParabolaVertexStep2Explain: "y = ax² + bx + c = ({a})({x0})² + ({b})({x0}) + ({c}) = {y0}.",

    coordgeomTopicTitle_reflection_over_x_axis: "Reflection over the x-axis", coordgeomTopicDesc_reflection_over_x_axis: "Find the image of a point reflected over the x-axis",
    coordgeomLearn_reflection_over_x_axis: "Reflecting a point over the x-axis keeps x the same and flips the sign of y: (x, y) → (x, -y).\n\nExample: reflect (3, 5) over the x-axis. Image = (3, -5).",
    coordgeomReflectXPrompt: "Reflect the point ({x}, {y}) over the x-axis. Find the image.",
    coordgeomReflectXExplain: "Reflecting over the x-axis keeps x and flips the sign of y: ({x}, {y}) → ({x}, {negY}).",

    coordgeomTopicTitle_reflection_over_y_axis: "Reflection over the y-axis", coordgeomTopicDesc_reflection_over_y_axis: "Find the image of a point reflected over the y-axis",
    coordgeomLearn_reflection_over_y_axis: "Reflecting a point over the y-axis keeps y the same and flips the sign of x: (x, y) → (-x, y).\n\nExample: reflect (3, 5) over the y-axis. Image = (-3, 5).",
    coordgeomReflectYPrompt: "Reflect the point ({x}, {y}) over the y-axis. Find the image.",
    coordgeomReflectYExplain: "Reflecting over the y-axis keeps y and flips the sign of x: ({x}, {y}) → ({negX}, {y}).",

    numtheoryTitle: "Number Theory",
    numtheorySub: "Month 13: primes, divisors and modular arithmetic — going deeper into the numbers themselves. Pick a topic to learn the concept, then practice.",

    numtheoryTopicTitle_is_prime: "Prime Check", numtheoryTopicDesc_is_prime: "Determine whether a number is prime",
    numtheoryLearn_is_prime: "A number is prime if it's greater than 1 and has no divisors other than 1 and itself. To check, test divisibility by every integer up to its square root.\n\nExample: is 29 prime?\n√29 ≈ 5.4, and 29 isn't divisible by 2, 3, or 5, so yes, it's prime.",
    numtheoryIsPrimePrompt: "Is {n} prime?",
    numtheoryIsPrimeExplain: "Checking divisibility by every integer up to √{n} (≈{sqrtN}) shows the answer is {answer}.",

    numtheoryTopicTitle_smallest_prime_factor: "Smallest Prime Factor", numtheoryTopicDesc_smallest_prime_factor: "Find the smallest prime factor of a composite number",
    numtheoryLearn_smallest_prime_factor: "The smallest prime factor of a number is the smallest prime that divides it evenly. Test 2, then 3, then 5, and so on, until one divides evenly.\n\nExample: find the smallest prime factor of 21.\n21 isn't even, so 2 doesn't work. 21 ÷ 3 = 7 exactly, so the smallest prime factor is 3.",
    numtheorySmallestPrimeFactorPrompt: "Find the smallest prime factor of {n}.",
    numtheorySmallestPrimeFactorExplain: "Testing 2, 3, 5, ... the smallest prime that divides {n} evenly is {f} ({n} ÷ {f} = {quotient}).",

    numtheoryTopicTitle_prime_factor_count: "Number of Distinct Prime Factors", numtheoryTopicDesc_prime_factor_count: "Find how many different primes divide a number",
    numtheoryLearn_prime_factor_count: "The distinct prime factors of a number are the different primes that appear in its prime factorization, counted once each.\n\nExample: how many distinct prime factors does 60 have?\n60 = 2² × 3 × 5, so it has 3 distinct prime factors (2, 3, and 5).",
    numtheoryPrimeFactorCountPrompt: "How many distinct prime factors does {n} have?",
    numtheoryPrimeFactorCountExplain: "{n} = {factors}, so it has {k} distinct prime factors.",

    numtheoryTopicTitle_count_divisors: "Counting Divisors", numtheoryTopicDesc_count_divisors: "Find the number of positive divisors of a number",
    numtheoryLearn_count_divisors: "If N = p^a × q^b for primes p and q, the number of positive divisors of N is (a+1)(b+1).\n\nExample: how many divisors does 12 = 2² × 3¹ have?\n(2+1)(1+1) = 3×2 = 6. (Check: 1, 2, 3, 4, 6, 12 — six divisors.)",
    numtheoryCountDivisorsPrompt: "Find the number of positive divisors of {n}.",
    numtheoryCountDivisorsExplain: "{n} = {p}^{a} × {q}^{b}, so the number of divisors is ({a}+1)({b}+1) = {count}.",

    numtheoryTopicTitle_sum_of_proper_divisors: "Sum of Proper Divisors", numtheoryTopicDesc_sum_of_proper_divisors: "Add up all the divisors of a number smaller than itself",
    numtheoryLearn_sum_of_proper_divisors: "The proper divisors of a number are all its positive divisors except itself. Add them up.\n\nExample: find the sum of the proper divisors of 12.\nProper divisors: 1, 2, 3, 4, 6. Sum = 1+2+3+4+6 = 16.",
    numtheorySumProperDivisorsPrompt: "Find the sum of the proper divisors of {n} (all positive divisors except {n} itself).",
    numtheorySumProperDivisorsExplain: "Adding up every divisor of {n} smaller than itself gives {sum}.",

    numtheoryTopicTitle_is_perfect_number: "Perfect Numbers", numtheoryTopicDesc_is_perfect_number: "Determine whether a number equals the sum of its proper divisors",
    numtheoryLearn_is_perfect_number: "A perfect number equals the sum of its own proper divisors.\n\nExample: is 6 perfect?\nProper divisors of 6: 1, 2, 3. Sum = 1+2+3 = 6, which equals the number itself, so yes.",
    numtheoryIsPerfectPrompt: "Is {n} a perfect number (does it equal the sum of its proper divisors)?",
    numtheoryIsPerfectExplain: "The proper divisors of {n} sum to {sum}, so the answer is {answer}.",

    numtheoryTopicTitle_divisibility_check: "Divisibility Check", numtheoryTopicDesc_divisibility_check: "Determine whether one number divides another evenly",
    numtheoryLearn_divisibility_check: "A number a is divisible by b if a ÷ b leaves no remainder.\n\nExample: is 84 divisible by 7?\n84 ÷ 7 = 12 exactly, with no remainder, so yes.",
    numtheoryDivisibilityPrompt: "Is {a} divisible by {b}?",
    numtheoryDivisibilityExplain: "{a} ÷ {b} leaves a remainder of {remainder}, so the answer is {answer}.",

    numtheoryTopicTitle_digital_root: "Digital Root", numtheoryTopicDesc_digital_root: "Repeatedly sum a number's digits until one digit remains",
    numtheoryLearn_digital_root: "The digital root of a number is found by summing its digits, then summing the digits of the result, repeating until only one digit remains.\n\nExample: find the digital root of 938.\n9+3+8 = 20, then 2+0 = 2. Digital root = 2.",
    numtheoryDigitalRootPrompt: "Find the digital root of {n}.",
    numtheoryDigitalRootExplain: "Repeatedly summing the digits of {n} until one digit remains gives {dr}.",

    numtheoryTopicTitle_coprime_check: "Coprime Numbers", numtheoryTopicDesc_coprime_check: "Determine whether two numbers share no common factor",
    numtheoryLearn_coprime_check: "Two numbers are coprime (relatively prime) if their greatest common divisor is 1 — they share no common factor besides 1.\n\nExample: are 8 and 15 coprime?\ngcd(8, 15) = 1, so yes.",
    numtheoryCoprimePrompt: "Are {a} and {b} coprime?",
    numtheoryCoprimeExplain: "gcd({a}, {b}) = {g}, so the answer is {answer}.",

    numtheoryTopicTitle_euclidean_algorithm: "Euclidean Algorithm", numtheoryTopicDesc_euclidean_algorithm: "Find a gcd step by step using repeated division",
    numtheoryLearn_euclidean_algorithm: "The Euclidean algorithm finds gcd(a, b) by repeated division: divide a by b to get a quotient and remainder, then repeat with b and that remainder, until the remainder is 0. The last nonzero remainder is the gcd.\n\nExample: find gcd(30, 12).\n30 = 2×12 + 6. Then 12 = 2×6 + 0. The last nonzero remainder is 6, so gcd(30, 12) = 6.",
    numtheoryEuclideanPrompt: "Use the Euclidean algorithm to find gcd({a}, {b}).",
    numtheoryEuclideanStep1Prompt: "Step 1: Divide {a} by {b}. Find the quotient q and remainder r.",
    numtheoryEuclideanStep1Explain: "{a} = {q1}×{b} + {r1}, so q = {q1} and r = {r1}.",
    numtheoryEuclideanStep2Prompt: "Step 2: Divide {b} by {r1}. Find the quotient q and remainder r.",
    numtheoryEuclideanStep2Explain: "{b} = {q2}×{r1} + 0, so q = {q2} and r = 0. Since the remainder is 0, the gcd is the last nonzero remainder: {gcdVal}.",

    numtheoryTopicTitle_fibonacci_term: "Fibonacci Numbers", numtheoryTopicDesc_fibonacci_term: "Find a term of the Fibonacci sequence",
    numtheoryLearn_fibonacci_term: "The Fibonacci sequence starts 1, 1, 2, 3, 5, 8, ... where each term is the sum of the previous two.\n\nExample: find the 6th Fibonacci number.\n1, 1, 2, 3, 5, 8 — the 6th term is 8.",
    numtheoryFibonacciPrompt: "Find the {n}th Fibonacci number (F₁ = 1, F₂ = 1, and each term after is the sum of the previous two).",
    numtheoryFibonacciExplain: "Building the sequence up to the {n}th term gives F_{n} = {fn}.",

    numtheoryTopicTitle_triangular_number: "Triangular Numbers", numtheoryTopicDesc_triangular_number: "Find the nth triangular number",
    numtheoryLearn_triangular_number: "The nth triangular number is the sum of the integers from 1 to n: T(n) = n(n+1)/2.\n\nExample: find the 5th triangular number.\nT(5) = 5×6/2 = 15.",
    numtheoryTriangularPrompt: "Find the {n}th triangular number, T({n}) = 1 + 2 + ... + {n}.",
    numtheoryTriangularExplain: "T({n}) = {n}×{np1}/2 = {tn}.",

    numtheoryTopicTitle_power_mod: "Modular Exponentiation", numtheoryTopicDesc_power_mod: "Compute a power of a number modulo n",
    numtheoryLearn_power_mod: "To compute a^b mod n, raise a to the power b, then find the remainder when dividing by n.\n\nExample: find 3⁴ mod 5.\n3⁴ = 81. 81 ÷ 5 = 16 remainder 1, so 3⁴ mod 5 = 1.",

    bizTitle_indirect_costs: "Indirect Costs", bizExplain_indirect_costs: "Indirect costs (overhead) cannot be traced directly to a single product or job — like factory rent or a supervisor's salary. They must be allocated across products using a cost driver.", bizQuestion_indirect_costs: "What term describes costs like factory rent that cannot be traced directly to one product?",
    bizTitle_variable_costs: "Variable Costs", bizExplain_variable_costs: "Variable costs change in direct proportion to the level of activity — the more units produced, the higher the total variable cost, but the cost per unit stays constant.", bizQuestion_variable_costs: "What term describes costs that change in direct proportion to activity level, like raw materials?",
    bizTitle_fixed_costs: "Fixed Costs", bizExplain_fixed_costs: "Fixed costs stay the same in total regardless of activity level within a relevant range — like rent or a manager's salary — but the cost per unit falls as volume rises.", bizQuestion_fixed_costs: "What term describes costs that stay the same in total no matter how many units are produced, like rent?",
    bizTitle_job_costing: "Job Costing", bizExplain_job_costing: "Job costing traces direct materials, direct labour and allocated overhead to a specific job or batch — used when products or services are distinct, like a custom furniture order or an audit engagement.", bizQuestion_job_costing: "What costing system assigns direct materials, direct labour and overhead to a specific, distinct job or batch?",
    bizTitle_breakeven_point: "Breakeven Point", bizExplain_breakeven_point: "The breakeven point is where total revenue equals total costs — profit is zero. Above it, each additional unit's contribution margin becomes profit; below it, the business loses money.", bizQuestion_breakeven_point: "What is the point called where total revenue equals total costs and profit is zero?",
    bizTitle_responsibility_center: "Responsibility Center", bizExplain_responsibility_center: "A responsibility center is an organizational unit — like a department or division — whose manager is held accountable for a specific set of financial results, such as costs, revenues or profit.", bizQuestion_responsibility_center: "What term describes an organizational unit whose manager is accountable for its costs, revenue or profit?",
    bizTitle_cost_driver: "Cost Driver", bizExplain_cost_driver: "A cost driver is a variable, such as the level of activity or volume, that causally affects costs over a given time span — for example machine hours or direct labour hours, used as the allocation base for overhead.", bizQuestion_cost_driver: "What term describes a variable, like machine hours, that causally affects costs over a given time span?",
    bizTitle_relevant_range: "Relevant Range", bizExplain_relevant_range: "The relevant range is the range of activity — the upper and lower limits of production — within which assumptions about fixed and variable cost behaviour are expected to hold true.", bizQuestion_relevant_range: "What term describes the range of activity within which assumptions about fixed and variable cost behaviour hold true?",
    bizTitle_contribution_margin: "Contribution Margin", bizExplain_contribution_margin: "Contribution margin is sales revenue minus variable costs — the amount left over to cover fixed costs and then contribute to profit. It can be calculated in total or per unit.", bizQuestion_contribution_margin: "What term describes sales revenue minus variable costs — the amount that covers fixed costs and then profit?",
    bizTitle_budgetary_slack: "Budgetary Slack", bizExplain_budgetary_slack: "Budgetary slack is the practice of underestimating budgeted revenues or overestimating budgeted costs so that targets are easier to achieve — often used by managers to cope with uncertainty or guard against budget cuts.", bizQuestion_budgetary_slack: "What term describes underestimating revenues or overestimating costs in a budget to make targets easier to hit?",
    bizTitle_overhead_allocation: "Overhead Allocation", bizExplain_overhead_allocation: "Overhead is allocated to jobs using a predetermined rate set before the period starts: Budgeted Overhead ÷ Budgeted Driver Quantity. During the period, Applied Overhead = Predetermined Rate × Actual Driver Quantity used.", bizQuestion_overhead_allocation: "Complete the overhead allocation schedule below.",
    bizTitle_unit_manufacturing_cost: "Unit Manufacturing Cost", bizExplain_unit_manufacturing_cost: "Unit manufacturing cost combines Direct Materials, Direct Labour and Factory Overhead. Prime Cost is Direct Materials plus Direct Labour, while Conversion Cost is Direct Labour plus Factory Overhead.", bizQuestion_unit_manufacturing_cost: "Complete the unit manufacturing cost schedule below.",
    bizTitle_cost_object: "Cost Object", bizExplain_cost_object: "A cost object is anything for which a cost measurement is desired — a product, job, department, customer or activity. Direct and indirect costs are both defined relative to a chosen cost object.", bizQuestion_cost_object: "What term describes anything for which a cost measurement is desired, such as a product or department?",
    bizTitle_direct_costs: "Direct Costs", bizExplain_direct_costs: "Direct costs are related to a particular cost object and can be traced to it easily and economically — like the timber used in a specific table. They are assigned by cost tracing, not allocation.", bizQuestion_direct_costs: "What term describes costs that can be traced easily and economically to a specific cost object?",
    bizTitle_inventoriable_costs: "Inventoriable Costs", bizExplain_inventoriable_costs: "Inventoriable costs are all costs of a product that are treated as assets on the balance sheet when incurred, and become cost of goods sold only when the product is sold.", bizQuestion_inventoriable_costs: "What term describes product costs treated as assets until the product is sold, then expensed as COGS?",
    bizTitle_period_costs: "Period Costs", bizExplain_period_costs: "Period costs are all costs in the income statement other than cost of goods sold — like R&D, advertising, and selling and administration expenses. They are expensed in the period incurred, not held in inventory.", bizQuestion_period_costs: "What term describes costs in the income statement other than cost of goods sold, expensed as incurred?",
    bizTitle_prime_cost: "Prime Cost", bizExplain_prime_cost: "Prime cost is the sum of all direct manufacturing costs: Direct Materials plus Direct Labour. It excludes manufacturing overhead entirely.", bizQuestion_prime_cost: "What term describes Direct Materials plus Direct Labour?",
    bizTitle_conversion_cost: "Conversion Cost", bizExplain_conversion_cost: "Conversion cost comprises all the manufacturing costs needed to transform direct materials into finished goods: Direct Labour plus Manufacturing Overhead.", bizQuestion_conversion_cost: "What term describes Direct Labour plus Manufacturing Overhead — the cost of turning materials into finished goods?",
    bizTitle_process_costing: "Process Costing", bizExplain_process_costing: "Process costing is used when many units of a single, homogeneous product flow evenly through a continuous production process — like a plastics or beverage manufacturer. The cost object is the process or department, and costs are averaged across all units.", bizQuestion_process_costing: "What costing system averages costs across many identical units flowing through a continuous production process?",
    bizTitle_normal_costing: "Normal Costing", bizExplain_normal_costing: "Normal costing reports actual direct materials and actual direct labour, but uses a predetermined rate to apply overhead — timely, though not necessarily as accurate as actual costing.", bizQuestion_normal_costing: "What costing system uses actual DM and DL but a predetermined rate for overhead?",
    bizTitle_master_budget: "Master Budget", bizExplain_master_budget: "The master budget is the working document at the core of the budgeting cycle. It combines the operating budget (revenues, costs, budgeted income statement) with the financial budget (cash budget, budgeted balance sheet).", bizQuestion_master_budget: "What is the working document called that combines the operating budget and the financial budget?",
    bizTitle_controllability: "Controllability", bizExplain_controllability: "Controllability is the degree of influence a specific manager has over costs, revenues or related items for which they are responsible. A controllable cost is one primarily subject to that manager's influence for a given period.", bizQuestion_controllability: "What term describes the degree of influence a specific manager has over the costs or revenues they are responsible for?",
    bizTitle_under_over_applied_overhead: "Under/Over-applied Overhead", bizExplain_under_over_applied_overhead: "If actual overhead exceeds applied overhead, overhead is under-applied and the difference is added to unadjusted COGS. If applied exceeds actual, overhead is over-applied and the difference is subtracted from unadjusted COGS.", bizQuestion_under_over_applied_overhead: "Complete the under/over-applied overhead schedule below.",
    bizTitle_production_budget: "Production Budget", bizExplain_production_budget: "The production budget converts budgeted sales into units to produce: budgeted unit sales plus desired ending finished goods, minus beginning finished goods inventory.", bizQuestion_production_budget: "Complete the production budget below.",
    bizTitle_cost_plus_pricing: "Cost-Plus Pricing", bizExplain_cost_plus_pricing: "Under cost-plus pricing, the job cost (direct materials plus direct labour plus applied overhead) is multiplied by (1 + markup %) to set the selling price.", bizQuestion_cost_plus_pricing: "Complete the cost-plus pricing schedule below.",
