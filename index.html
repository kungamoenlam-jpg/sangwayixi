  {id:'ec324', cat:'econ', en:'If sales increase, business profit may increase.', zh:'如果销售额增加，企业利润可能会增加。', bo:'བཙོང་ཚད་འཕར་ན་ཁེ་ལས་ཀྱི་ཁེ་བཟང་འཕར་སྲིད།'},
  {id:'ec325', cat:'econ', en:'If profit rises, businesses may invest more capital.', zh:'如果利润增加，企业可能会投入更多资本。', bo:'ཁེ་བཟང་འཕར་ན་ཁེ་ལས་ཀྱིས་མ་རྩ་མང་བ་འཇོག་སྲིད།'},
  {id:'ec326', cat:'econ', en:'Investment may increase production.', zh:'投资可能会增加生产。', bo:'མ་རྩ་འཇོག་པས་ཐོན་སྐྱེད་འཕེལ་སྲིད།'},
  {id:'ec327', cat:'econ', en:'This is a cycle of economic growth.', zh:'这是一个经济增长的循环。', bo:'འདི་ནི་དཔལ་འབྱོར་འཕེལ་བའི་རྒྱུན་ལམ་ཞིག་ཡིན།'},
  {id:'ec328', cat:'econ', en:'Both capital and technology are important to development.', zh:'资本和技术对发展都很重要。', bo:'འཕེལ་རྒྱས་ལ་མ་རྩ་དང་ལག་རྩལ་གཉིས་ཀ་གལ་ཆེན་ཡིན།'},
  {id:'ec329', cat:'econ', en:'Some countries with plentiful resources may develop differently.', zh:'一些资源丰富的国家，其发展情况可能会有所不同。', bo:'རྒྱལ་ཁབ་ཁ་ཤས་ཀྱི་ཐོན་ཁུངས་མང་ཡང་འཕེལ་རྒྱས་མི་འདྲ་བ་ཡོང་སྲིད།'},
  {id:'ec330', cat:'econ', en:'Policy affects development.', zh:'政策影响发展。', bo:'སྲིད་བྱུས་ཀྱིས་འཕེལ་རྒྱས་ལ་ཤུགས་རྐྱེན་བྱེད།'},
  {id:'ec331', cat:'econ', en:'A lawful market is important to business.', zh:'合法的市场对经商很重要。', bo:'ཁྲིམས་མཐུན་གྱི་ཁྲོམ་ར་ནི་ཚོང་ལས་ལ་གལ་ཆེན་ཡིན།'},
  {id:'ec332', cat:'econ', en:'If there is trust in law, there may be more investors.', zh:'如果对法律有信心，投资者可能会更多。', bo:'ཁྲིམས་ལ་ཡིད་ཆེས་ཡོད་ན་མ་དངུལ་འཇོག་མཁན་མང་བ་ཡོང་སྲིད།'},
  {id:'ec333', cat:'econ', en:'Investors weigh risk against benefit.', zh:'投资者权衡风险与收益。', bo:'མ་དངུལ་འཇོག་མཁན་གྱིས་ཉེན་ཁ་དང་ཁེ་ཕན་བསྡུར་གྱི་ཡོད།'},
  {id:'ec334', cat:'econ', en:'Stable investment is important for development.', zh:'稳定的投资对发展很重要。', bo:'འཕེལ་རྒྱས་ལ་བརྟན་པོའི་མ་དངུལ་འཇོག་པ་གལ་ཆེན་ཡིན།'},
  {id:'ec335', cat:'econ', en:'A country may put capital into infrastructure.', zh:'一个国家可能会将资本投入基础设施。', bo:'རྒྱལ་ཁབ་ཀྱིས་མ་རྩ་རྨང་གཞིར་འཇོག་སྲིད།'},
  {id:'ec336', cat:'econ', en:'Government investment can build roads and schools.', zh:'政府投资能够建设道路和学校。', bo:'གཞུང་གི་མ་དངུལ་འཇོག་པས་ལམ་དང་སློབ་གྲྭ་བསྐྲུན་ཐུབ།'},
  {id:'ec337', cat:'econ', en:'Public investment is also important for development.', zh:'公共投资对发展也很重要。', bo:'སྤྱི་དམངས་ཀྱི་མ་དངུལ་འཇོག་པ་ཡང་འཕེལ་རྒྱས་ལ་གལ་ཆེན་ཡིན།'},
  {id:'ec338', cat:'econ', en:'Foreign investment may bring new funding into the market.', zh:'外国投资可能会为市场带来新的资金。', bo:'ཕྱི་རྒྱལ་གྱི་མ་དངུལ་འཇོག་པས་ཁྲོམ་རར་མ་དངུལ་གསར་པ་འདྲེན་སྲིད།'},
  {id:'ec339', cat:'econ', en:'Large projects need a lot of investment funding.', zh:'大型项目需要大量投资资金。', bo:'ལས་གཞི་ཆེན་པོ་ལ་མ་དངུལ་མང་པོ་དགོས།'},
  {id:'ec340', cat:'econ', en:'Projects requiring large funding also carry risk.', zh:'需要大量资金的项目也存在风险。', bo:'མ་དངུལ་མང་པོ་དགོས་པའི་ལས་གཞིར་ཉེན་ཁ་ཡང་ཡོད།'},
  {id:'ec341', cat:'econ', en:'Economic growth requires a stable market.', zh:'经济增长需要稳定的市场。', bo:'དཔལ་འབྱོར་འཕེལ་བར་བརྟན་པོའི་ཁྲོམ་ར་དགོས།'},
  {id:'ec342', cat:'econ', en:'Population growth may increase labor supply.', zh:'人口增长可能会增加劳动力供给。', bo:'མི་འབོར་འཕར་བས་ལས་མིའི་མཁོ་སྤྲོད་འཕར་སྲིད།'},
  {id:'ec343', cat:'econ', en:'If there are many workers, job competition may increase.', zh:'如果劳动者众多，就业竞争可能会加剧。', bo:'ལས་མི་མང་བ་ཡིན་ན་ལས་ཀའི་འགྲན་རྩོད་འཕར་སྲིད།'},
  {id:'ec344', cat:'econ', en:'An aging population may reduce the number of workers.', zh:'人口老龄化可能会减少劳动者数量。', bo:'མི་འབོར་རྒས་པས་ལས་མིའི་གྲངས་ཚད་ཆག་སྲིད།'},
  {id:'ec345', cat:'econ', en:'Population structure affects the economy.', zh:'人口结构会影响经济。', bo:'མི་འབོར་གྱི་གྲུབ་ཚུལ་གྱིས་དཔལ་འབྱོར་ལ་ཤུགས་རྐྱེན་བྱེད།'},
  {id:'ec346', cat:'econ', en:'A country with many young people may have many workers.', zh:'年轻人多的国家可能会有很多劳动者。', bo:'གཞོན་སྐྱེས་མང་བའི་རྒྱལ་ཁབ་ལ་ལས་མི་མང་པོ་ཡོད་སྲིད།'},
  {id:'ec347', cat:'econ', en:'Young people need education and job opportunities.', zh:'年轻人需要教育和就业机会。', bo:'གཞོན་སྐྱེས་ཚོར་སློབ་གསོ་དང་ལས་ཀའི་གོ་སྐབས་དགོས།'},
  {id:'ec348', cat:'econ', en:'Without job opportunities, the public may face difficulty.', zh:'如果没有就业机会，公众可能会面临困难。', bo:'ལས་ཀའི་གོ་སྐབས་མེད་ན་མི་མང་ལ་དཀའ་ངལ་ཡོང་སྲིད།'},
  {id:'ec349', cat:'econ', en:'There are many statistics on development.', zh:'关于发展的统计数据有很多。', bo:'འཕེལ་རྒྱས་ཀྱི་གྲངས་ཐོ་མང་པོ་ཡོད།'},
  {id:'ec350', cat:'econ', en:'Economic development is a long-term process.', zh:'经济发展是一个长期的过程。', bo:'དཔལ་འབྱོར་འཕེལ་རྒྱས་ནི་དུས་ཡུན་རིང་པོའི་བྱ་བ་ཡིན།'},
  // Economics module 8 — Jobs & Unemployment
  {id:'ec351', cat:'econ', en:'Work is important to the public\'s livelihood.', zh:'工作对公众的生计很重要。', bo:'ལས་ཀ་ནི་མི་མང་གི་འཚོ་བར་གལ་ཆེན་ཡིན།'},
  {id:'ec352', cat:'econ', en:'If there is work, people can earn income.', zh:'有工作，人们就能获得收入。', bo:'ལས་ཀ་ཡོད་ན་མི་ཚོས་ཡོང་འབབ་ཐོབ་ཐུབ།'},
  {id:'ec353', cat:'econ', en:'Income can meet a household\'s needs.', zh:'收入能够满足家庭的需求。', bo:'ཡོང་འབབ་ཀྱིས་ཁྱིམ་ཚང་གི་དགོས་མཁོ་སྐོང་ཐུབ།'},
  {id:'ec354', cat:'econ', en:'Unemployment is the situation of seeking work but not finding it.', zh:'失业是指寻找工作却找不到的状况。', bo:'འཕར་ལས་མེད་པ་ནི་ལས་ཀ་འཚོལ་ཡང་མ་རག་པའི་གནས་ཚུལ་ཡིན།'},
  {id:'ec355', cat:'econ', en:'The unemployment rate indicates the number without work.', zh:'失业率反映了没有工作的人数。', bo:'འཕར་ལས་མེད་པའི་ཚད་ཀྱིས་ལས་ཀ་མེད་པའི་གྲངས་ཚད་མཚོན།'},
  {id:'ec356', cat:'econ', en:'If unemployment rises, household income may fall.', zh:'如果失业率上升，家庭收入可能会下降。', bo:'འཕར་ལས་མེད་པ་འཕར་ན་ཁྱིམ་ཚང་གི་ཡོང་འབབ་ཆག་སྲིད།'},
  {id:'ec357', cat:'econ', en:'If unemployment falls, the labor market may become strong.', zh:'如果失业率下降，劳动力市场可能会变得强劲。', bo:'འཕར་ལས་མེད་པ་ཆག་ན་ལས་ཀའི་ཁྲོམ་ར་དྲག་པོ་ཡོང་སྲིད།'},
  {id:'ec358', cat:'econ', en:'In the labor market, there are job seekers and employers.', zh:'劳动力市场中有求职者和雇主。', bo:'ལས་ཀའི་ཁྲོམ་རར་ལས་ཀ་འཚོལ་མཁན་དང་ལས་མཁན་ཡོད།'},
  {id:'ec359', cat:'econ', en:'Employers provide job opportunities.', zh:'雇主提供就业机会。', bo:'ལས་མཁན་གྱིས་ལས་ཀའི་གོ་སྐབས་སྤྲོད་ཀྱི་ཡོད།'},
  {id:'ec360', cat:'econ', en:'Job seekers look for suitable opportunities.', zh:'求职者寻找合适的机会。', bo:'ལས་ཀ་འཚོལ་མཁན་གྱིས་ལས་ཀ་དང་འཚམ་པའི་གོ་སྐབས་འཚོལ་གྱི་ཡོད།'},
  {id:'ec361', cat:'econ', en:'Wages are the price of labor.', zh:'工资是劳动的价格。', bo:'གླ་ཆ་ནི་ལས་ཀའི་རིན་གོང་ཡིན།'},
  {id:'ec362', cat:'econ', en:'If demand for workers is high, wages may rise.', zh:'如果对劳动者的需求高，工资可能会上涨。', bo:'ལས་མིའི་དགོས་མཁོ་མང་ན་གླ་ཆ་འཕར་སྲིད།'},
  {id:'ec363', cat:'econ', en:'If labor supply is high, wages may be affected.', zh:'如果劳动力供给多，工资可能会受到影响。', bo:'ལས་མིའི་མཁོ་སྤྲོད་མང་ན་གླ་ཆ་ལ་ཤུགས་རྐྱེན་ཡོང་སྲིད།'},
  {id:'ec364', cat:'econ', en:'Different types of jobs have different wages.', zh:'不同类型的工作，工资也不同。', bo:'ལས་ཀའི་རིགས་མི་འདྲ་བར་གླ་ཆ་ཡང་མི་འདྲ།'},
  {id:'ec365', cat:'econ', en:'High-skill jobs may have higher wages.', zh:'高技能的工作可能有更高的工资。', bo:'ལག་རྩལ་མཐོ་བའི་ལས་ཀར་གླ་ཆ་མཐོ་བ་ཡོང་སྲིད།'},
  {id:'ec366', cat:'econ', en:'Education affects job opportunities.', zh:'教育影响就业机会。', bo:'སློབ་གསོས་ལས་ཀའི་གོ་སྐབས་ལ་ཤུགས་རྐྱེན་བྱེད།'},
  {id:'ec367', cat:'econ', en:'Worker training can improve capability.', zh:'劳动者培训能够提升能力。', bo:'ལས་མིའི་གསོ་སྦྱོང་གིས་ནུས་པ་འཕེལ་ཐུབ།'},
  {id:'ec368', cat:'econ', en:'If capability rises, job income may increase.', zh:'如果能力提升，工作收入可能会增加。', bo:'ནུས་པ་འཕར་ན་ལས་ཀའི་ཡོང་འབབ་འཕར་སྲིད།'},
  {id:'ec369', cat:'econ', en:'If the period without work is long, people may face difficulty.', zh:'如果失业期较长，人们可能会面临困难。', bo:'ལས་ཀ་མེད་པའི་དུས་ཡུན་རིང་ན་མི་ཚོར་དཀའ་ངལ་ཡོང་སྲིད།'},
  {id:'ec370', cat:'econ', en:'There are different causes of unemployment.', zh:'失业有不同的原因。', bo:'འཕར་ལས་མེད་པའི་རྒྱུ་རྐྱེན་མི་འདྲ་བ་ཡོད།'},
  {id:'ec371', cat:'econ', en:'If business sales fall, workers may be laid off.', zh:'如果企业销售额下降，劳动者可能会被裁减。', bo:'ཁེ་ལས་ཀྱི་བཙོང་ཚད་ཆག་ན་ལས་མི་ཉུང་དུ་གཏོང་སྲིད།'},
  {id:'ec372', cat:'econ', en:'If the economy is weak, job opportunities may decrease.', zh:'如果经济疲弱，就业机会可能会减少。', bo:'དཔལ་འབྱོར་ཞན་པ་ཡིན་ན་ལས་ཀའི་གོ་སྐབས་ཆག་སྲིད།'},
  {id:'ec373', cat:'econ', en:'If job opportunities decrease, unemployment may increase.', zh:'如果就业机会减少，失业率可能会上升。', bo:'ལས་ཀའི་གོ་སྐབས་ཆག་ན་འཕར་ལས་མེད་པ་འཕར་སྲིད།'},
  {id:'ec374', cat:'econ', en:'If the economy recovers, job opportunities may increase.', zh:'如果经济复苏，就业机会可能会增加。', bo:'དཔལ་འབྱོར་སླར་གསོ་བྱུང་ན་ལས་ཀའི་གོ་སྐབས་འཕར་སྲིད།'},
  {id:'ec375', cat:'econ', en:'The labor market is an important market of the economy.', zh:'劳动力市场是经济中一个重要的市场。', bo:'ལས་ཀའི་ཁྲོམ་ར་ནི་དཔལ་འབྱོར་གྱི་ཁྲོམ་ར་གལ་ཆེན་ཞིག་ཡིན།'},
  {id:'ec376', cat:'econ', en:'If wages rise, people\'s income may increase.', zh:'如果工资上涨，人们的收入可能会增加。', bo:'གླ་ཆ་འཕར་ན་མི་ཚོའི་ཡོང་འབབ་འཕར་སྲིད།'},
  {id:'ec377', cat:'econ', en:'If income rises, demand may increase.', zh:'如果收入增加，需求可能会增加。', bo:'ཡོང་འབབ་འཕར་ན་དགོས་མཁོ་འཕར་སྲིད།'},
  {id:'ec378', cat:'econ', en:'If demand rises, businesses may hire more workers.', zh:'如果需求增加，企业可能会雇用更多劳动者。', bo:'དགོས་མཁོ་འཕར་ན་ཁེ་ལས་ཀྱིས་ལས་མི་མང་བ་གླ་སྲིད།'},
  {id:'ec379', cat:'econ', en:'This is related to the labor market.', zh:'这与劳动力市场有关。', bo:'འདིས་ལས་ཀའི་ཁྲོམ་རར་འབྲེལ་བ་ཡོད།'},
  {id:'ec380', cat:'econ', en:'Labor market statistics are collected regularly.', zh:'劳动力市场统计数据被定期收集。', bo:'ལས་ཀའི་ཁྲོམ་རའི་གྲངས་ཐོ་དུས་རྒྱུན་བསྡུ་གི་ཡོད།'},
  {id:'ec381', cat:'econ', en:'Labor statistics can indicate the state of the economy.', zh:'劳动力统计数据能够反映经济状况。', bo:'ལས་ཀའི་གྲངས་ཐོས་དཔལ་འབྱོར་གྱི་གནས་བབ་མཚོན་ཐུབ།'},
  {id:'ec382', cat:'econ', en:'Not all workers have the same wage.', zh:'并非所有劳动者的工资都是一样的。', bo:'ལས་མི་ཚང་མར་གླ་ཆ་གཅིག་པ་མིན།'},
  {id:'ec383', cat:'econ', en:'Wages depend on the type of job and skill level.', zh:'工资取决于工作类型和技能水平。', bo:'གླ་ཆ་ནི་ལས་ཀའི་རིགས་དང་ལག་རྩལ་ལ་བརྟེན་གྱི་ཡོད།'},
  {id:'ec384', cat:'econ', en:'Job location affects wages.', zh:'工作地点会影响工资。', bo:'ལས་ཀའི་ས་གནས་ཀྱིས་གླ་ཆ་ལ་ཤུགས་རྐྱེན་བྱེད།'},
  {id:'ec385', cat:'econ', en:'In some cities, the cost of living is high.', zh:'在一些城市，生活成本较高。', bo:'གྲོང་ཁྱེར་ཁ་ཤས་སུ་འགྲོ་སོང་མཐོ་བ་ཡོད།'},
  {id:'ec386', cat:'econ', en:'In places with a high cost of living, wages may also be higher.', zh:'在生活成本高的地方，工资可能也会更高。', bo:'འགྲོ་སོང་མཐོ་བའི་ས་གནས་སུ་གླ་ཆ་ཡང་མཐོ་བ་ཡོང་སྲིད།'},
  {id:'ec387', cat:'econ', en:'Worker migration is important to the labor market.', zh:'劳动者的迁移对劳动力市场很重要。', bo:'ལས་མིའི་གནས་སྤོ་ནི་ལས་ཀའི་ཁྲོམ་རར་གལ་ཆེན་ཡིན།'},
  {id:'ec388', cat:'econ', en:'People may relocate to places with better job opportunities.', zh:'人们可能会迁往有更好就业机会的地方。', bo:'མི་ཚོས་ལས་ཀའི་གོ་སྐབས་བཟང་སར་གནས་སྤོ་སྲིད།'},
  {id:'ec389', cat:'econ', en:'Both work and household conditions are important.', zh:'工作和家庭状况两者都很重要。', bo:'ལས་ཀ་དང་ཁྱིམ་གྱི་གནས་སྟངས་གཉིས་ཀ་གལ་ཆེན་ཡིན།'},
  {id:'ec390', cat:'econ', en:'As job types change, worker skills must also change.', zh:'随着工作类型的变化，劳动者的技能也必须随之改变。', bo:'ལས་ཀའི་རིགས་འགྱུར་བ་དང་བསྟུན་ནས་ལས་མིའི་ལག་རྩལ་ཡང་འགྱུར་དགོས།'},
  {id:'ec391', cat:'econ', en:'New technology may change some types of jobs.', zh:'新技术可能会改变某些类型的工作。', bo:'ལག་རྩལ་གསར་པས་ལས་ཀའི་རིགས་ཁ་ཤས་བརྗེ་སྲིད།'},
  {id:'ec392', cat:'econ', en:'New technology may also create new jobs.', zh:'新技术也可能会创造新的工作。', bo:'ལག་རྩལ་གསར་པས་ལས་ཀ་གསར་པ་ཡང་བཟོ་སྲིད།'},
  {id:'ec393', cat:'econ', en:'People must develop their skills to match job conditions.', zh:'人们必须根据工作情况提升自己的技能。', bo:'མི་ཚོས་ལས་ཀའི་གནས་ཚུལ་དང་བསྟུན་ནས་རང་གི་ལག་རྩལ་ཡར་རྒྱས་གཏོང་དགོས།'},
  {id:'ec394', cat:'econ', en:'Both employment statistics and wage statistics are important.', zh:'就业统计数据和工资统计数据都很重要。', bo:'ལས་ཀའི་གྲངས་ཐོ་དང་གླ་ཆའི་གྲངས་ཐོ་གཉིས་ཀ་གལ་ཆེན་ཡིན།'},
  {id:'ec395', cat:'econ', en:'Worker capability benefits business production.', zh:'劳动者的能力有利于企业生产。', bo:'ལས་མིའི་ནུས་པས་ཁེ་ལས་ཀྱི་ཐོན་སྐྱེད་ལ་ཕན་ཐོགས།'},
  {id:'ec396', cat:'econ', en:'Businesses may invest to improve worker capability.', zh:'企业可能会投资以提升劳动者的能力。', bo:'ཁེ་ལས་ཀྱིས་ལས་མིའི་ནུས་པ་འཕེལ་བར་མ་དངུལ་འཇོག་སྲིད།'},
  {id:'ec397', cat:'econ', en:'The labor market is an important sector of the economy.', zh:'劳动力市场是经济中的一个重要部门。', bo:'ལས་ཀའི་ཁྲོམ་ར་ནི་དཔལ་འབྱོར་གྱི་སྡེ་ཚན་གལ་ཆེན་ཞིག་ཡིན།'},
  {id:'ec398', cat:'econ', en:'If the unemployment rate falls, public income may rise.', zh:'如果失业率下降，公众收入可能会上升。', bo:'འཕར་ལས་མེད་པའི་ཚད་ཆག་ན་མི་མང་གི་ཡོང་འབབ་འཕར་སྲིད།'},
  {id:'ec399', cat:'econ', en:'If there are many jobs, household finances may be stable.', zh:'如果就业机会多，家庭经济可能会稳定。', bo:'ལས་ཀ་མང་བ་ཡོད་ན་ཁྱིམ་ཚང་གི་དཔལ་འབྱོར་བརྟན་སྲིད།'},
  {id:'ec400', cat:'econ', en:'Employment conditions are important to economic analysis.', zh:'就业情况对经济分析很重要。', bo:'ལས་ཀའི་གནས་ཚུལ་ནི་དཔལ་འབྱོར་དབྱེ་ཞིབ་ལ་གལ་ཆེན་ཡིན།'},
  // Economics module 9 — Taxes & Government
  {id:'ec401', cat:'econ', en:'The government collects taxes.', zh:'政府征收税款。', bo:'སྲིད་གཞུང་གིས་ཁྲལ་བསྡུ་གི་ཡོད།'},
  {id:'ec402', cat:'econ', en:'Taxes are an important source of government revenue.', zh:'税收是政府重要的收入来源。', bo:'ཁྲལ་ནི་སྲིད་གཞུང་གི་ཡོང་འབབ་གལ་ཆེན་ཞིག་ཡིན།'},
  {id:'ec403', cat:'econ', en:'The public pays taxes.', zh:'公众缴纳税款。', bo:'མི་མང་གིས་ཁྲལ་སྤྲོད་ཀྱི་ཡོད།'},
  {id:'ec404', cat:'econ', en:'Businesses must also pay taxes.', zh:'企业也必须缴纳税款。', bo:'ཁེ་ལས་ཀྱིས་ཀྱང་ཁྲལ་སྤྲོད་དགོས།'},
  {id:'ec405', cat:'econ', en:'There are many different types of taxes.', zh:'税收有很多不同的类型。', bo:'ཁྲལ་གྱི་རིགས་མི་འདྲ་བ་མང་པོ་ཡོད།'},
  {id:'ec406', cat:'econ', en:'Income tax is a tax collected based on a person\'s income.', zh:'所得税是根据个人收入征收的税。', bo:'ཡོང་འབབ་ཁྲལ་ནི་མིའི་ཡོང་འབབ་ལ་བརྟེན་ནས་བསྡུ་བའི་ཁྲལ་ཡིན།'},
  {id:'ec407', cat:'econ', en:'There may be a tax on business profit.', zh:'企业利润可能需要缴税。', bo:'ཁེ་ལས་ཀྱི་ཁེ་བཟང་ལ་ཁྲལ་ཡོད་སྲིད།'},
  {id:'ec408', cat:'econ', en:'There may be a tax on transactions.', zh:'交易可能需要缴税。', bo:'ཉོ་ཚོང་ལ་ཁྲལ་ཡོད་སྲིད།'},
  {id:'ec409', cat:'econ', en:'Taxes give the government funding.', zh:'税收为政府提供资金。', bo:'ཁྲལ་གྱིས་སྲིད་གཞུང་ལ་མ་དངུལ་སྤྲོད་ཀྱི་ཡོད།'},
  {id:'ec410', cat:'econ', en:'The government uses funds to provide services.', zh:'政府使用资金提供服务。', bo:'སྲིད་གཞུང་གིས་མ་དངུལ་སྤྱད་ནས་ཞབས་ཞུ་སྤྲོད་ཀྱི་ཡོད།'},
  {id:'ec411', cat:'econ', en:'Education is among government expenditures.', zh:'教育属于政府支出之列。', bo:'སློབ་གསོ་ནི་གཞུང་གི་འགྲོ་སོང་གི་གྲས་སུ་ཡོད།'},
  {id:'ec412', cat:'econ', en:'Healthcare is among government expenditures.', zh:'医疗属于政府支出之列。', bo:'སྨན་བཅོས་ནི་གཞུང་གི་འགྲོ་སོང་གི་གྲས་སུ་ཡོད།'},
  {id:'ec413', cat:'econ', en:'Building roads requires government funding.', zh:'修建道路需要政府资金。', bo:'ལམ་བསྐྲུན་པར་གཞུང་གི་མ་དངུལ་དགོས།'},
  {id:'ec414', cat:'econ', en:'When government spending and revenue are unequal, a deficit may occur.', zh:'当政府支出与收入不平衡时，可能会出现赤字。', bo:'གཞུང་གི་འགྲོ་སོང་དང་ཡོང་འབབ་མཉམ་སྙོམས་མ་ཡོང་སྐབས་དངུལ་ཁ་ཆད་ཡོང་སྲིད།'},
  {id:'ec415', cat:'econ', en:'A deficit is when spending exceeds revenue.', zh:'赤字是指支出超过收入。', bo:'དངུལ་ཁ་ཆད་ནི་གཞུང་གི་ཡོང་འབབ་ལས་འགྲོ་སོང་མང་བ་ཡིན།'},
  {id:'ec416', cat:'econ', en:'The government may borrow to cover a deficit.', zh:'政府可能会借款以弥补赤字。', bo:'གཞུང་གིས་དངུལ་ཁ་ཆད་ཁ་གསབ་བྱེད་པར་བུན་དངུལ་གཏོང་སྲིད།'},
  {id:'ec417', cat:'econ', en:'Government loans require paying interest.', zh:'政府贷款需要支付利息。', bo:'གཞུང་གི་བུན་དངུལ་ལ་སྐྱེད་སྤྲོད་དགོས།'},
  {id:'ec418', cat:'econ', en:'If government debt rises, future spending may increase.', zh:'如果政府债务增加，未来支出可能会增加。', bo:'གཞུང་གི་བུན་དངུལ་འཕར་ན་མ་འོངས་འགྲོ་སོང་འཕར་སྲིད།'},
  {id:'ec419', cat:'econ', en:'A government budget plan is important.', zh:'政府预算计划很重要。', bo:'གཞུང་གི་དངུལ་རྩིས་འཆར་གཞི་ནི་གལ་ཆེན་ཡིན།'},
  {id:'ec420', cat:'econ', en:'The budget determines government spending.', zh:'预算确定政府的支出。', bo:'དངུལ་རྩིས་འཆར་གཞིས་གཞུང་གི་འགྲོ་སོང་གཏན་འཁེལ་བྱེད།'},
  {id:'ec421', cat:'econ', en:'The government influences the economy through taxes.', zh:'政府通过税收影响经济。', bo:'གཞུང་གིས་དཔལ་འབྱོར་ལ་ཁྲལ་གྱི་ལམ་ནས་ཤུགས་རྐྱེན་བྱེད།'},
  {id:'ec422', cat:'econ', en:'If taxes fall, people may keep more money.', zh:'如果税收下降，人们手中可能会留有更多资金。', bo:'ཁྲལ་ཆག་ཡང་ན་མི་ཚོའི་ལག་ཏུ་དངུལ་མང་བ་ལྷག་སྲིད།'},
  {id:'ec423', cat:'econ', en:'If taxes rise, people may keep less money.', zh:'如果税收上升，人们手中留下的资金可能会减少。', bo:'ཁྲལ་འཕར་ན་མི་ཚོའི་ལག་ཏུ་དངུལ་ཉུང་བ་ལྷག་སྲིད།'},
  {id:'ec424', cat:'econ', en:'If government spending rises, demand may increase.', zh:'如果政府支出增加，需求可能会增加。', bo:'གཞུང་གི་འགྲོ་སོང་འཕར་ན་དགོས་མཁོ་འཕར་སྲིད།'},
  {id:'ec425', cat:'econ', en:'If government spending falls, demand may decrease.', zh:'如果政府支出减少，需求可能会减少。', bo:'གཞུང་གི་འགྲོ་སོང་ཆག་ན་དགོས་མཁོ་ཆག་སྲིད།'},
  {id:'ec426', cat:'econ', en:'Taxes and spending are tools of policy.', zh:'税收和支出是政策的工具。', bo:'ཁྲལ་དང་འགྲོ་སོང་ནི་སྲིད་བྱུས་ཀྱི་ལག་ཆ་ཡིན།'},
  {id:'ec427', cat:'econ', en:'This is called fiscal policy.', zh:'这被称为财政政策。', bo:'དེ་ལ་དངུལ་རྩིས་སྲིད་བྱུས་ཟེར།'},
  {id:'ec428', cat:'econ', en:'Fiscal policy affects the economy.', zh:'财政政策影响经济。', bo:'དངུལ་རྩིས་སྲིད་བྱུས་ཀྱིས་དཔལ་འབྱོར་ལ་ཤུགས་རྐྱེན་བྱེད།'},
  {id:'ec429', cat:'econ', en:'When the economy is weak, the government may increase spending.', zh:'经济疲弱时，政府可能会增加支出。', bo:'དཔལ་འབྱོར་ཞན་དུས་གཞུང་གིས་འགྲོ་སོང་འཕར་སྲིད།'},
  {id:'ec430', cat:'econ', en:'During a strong economy, tax revenue may increase.', zh:'经济强劲时，税收收入可能会增加。', bo:'དཔལ་འབྱོར་དྲག་པོའི་དུས་སུ་ཁྲལ་ཡོང་འབབ་འཕར་སྲིད།'},
  {id:'ec431', cat:'econ', en:'The basis of taxation is related to economic conditions.', zh:'税收的基础与经济状况有关。', bo:'ཁྲལ་གྱི་གཞི་རྩ་ནི་དཔལ་འབྱོར་གྱི་གནས་ཚུལ་དང་འབྲེལ་ཡོད།'},
  {id:'ec432', cat:'econ', en:'If taxes are too high, business costs may increase.', zh:'如果税收过高，企业成本可能会增加。', bo:'ཁྲལ་མང་དྲགས་ན་ཁེ་ལས་ལ་གོང་གུད་འཕར་སྲིད།'},
  {id:'ec433', cat:'econ', en:'If taxes are too low, the government may have less funding.', zh:'如果税收过低，政府的资金可能会减少。', bo:'ཁྲལ་ཉུང་དྲགས་ན་གཞུང་ལ་མ་དངུལ་ཉུང་བ་ཡོང་སྲིད།'},
  {id:'ec434', cat:'econ', en:'Tax policy is a subject of economic study.', zh:'税收政策是经济学研究的课题。', bo:'ཁྲལ་སྲིད་བྱུས་ནི་དཔལ་འབྱོར་ཞིབ་འཇུག་གི་གནད་དོན་ཡིན།'},
  {id:'ec435', cat:'econ', en:'The government may invest in healthcare and education.', zh:'政府可能会投资于医疗和教育。', bo:'གཞུང་གིས་གསོ་རིག་དང་སློབ་གསོར་མ་དངུལ་འཇོག་སྲིད།'},
  {id:'ec436', cat:'econ', en:'The government may develop public infrastructure.', zh:'政府可能会发展公共基础设施。', bo:'གཞུང་གིས་མི་མང་གི་རྨང་གཞི་ཡར་རྒྱས་གཏོང་སྲིད།'},
  {id:'ec437', cat:'econ', en:'Investment may benefit long-term development.', zh:'投资可能有利于长期发展。', bo:'མ་དངུལ་འཇོག་པས་དུས་ཡུན་རིང་པོར་འཕེལ་རྒྱས་ལ་ཕན་ཐོགས་སྲིད།'},
  {id:'ec438', cat:'econ', en:'Government investment requires a budget plan.', zh:'政府投资需要预算计划。', bo:'གཞུང་གི་མ་དངུལ་འཇོག་པ་ལ་དངུལ་རྩིས་འཆར་གཞི་དགོས།'},
  {id:'ec439', cat:'econ', en:'The government must publish its budget.', zh:'政府必须公布其预算。', bo:'གཞུང་གིས་དངུལ་རྩིས་གསལ་བསྒྲགས་བྱེད་དགོས།'},
  {id:'ec440', cat:'econ', en:'The public may pay attention to the government budget.', zh:'公众可能会关注政府预算。', bo:'མི་མང་གིས་གཞུང་གི་དངུལ་རྩིས་ལ་དོ་སྣང་བྱེད་སྲིད།'},
  {id:'ec441', cat:'econ', en:'The government budget may reflect economic conditions.', zh:'政府预算可能反映经济状况。', bo:'གཞུང་གི་དངུལ་རྩིས་ཀྱིས་དཔལ་འབྱོར་གྱི་གནས་བབ་མཚོན་སྲིད།'},
  {id:'ec442', cat:'econ', en:'Tax collection systems differ by country.', zh:'税收征收制度因国家而异。', bo:'ཁྲལ་བསྡུ་བའི་ལམ་ལུགས་ནི་རྒྱལ་ཁབ་རེ་རེར་མི་འདྲ།'},
  {id:'ec443', cat:'econ', en:'Tax rates also differ by country.', zh:'税率也因国家而异。', bo:'ཁྲལ་གྱི་ཚད་གཞི་ཡང་རྒྱལ་ཁབ་རེ་རེར་མི་འདྲ།'},
  {id:'ec444', cat:'econ', en:'The government may change tax policy.', zh:'政府可能会调整税收政策。', bo:'གཞུང་གིས་ཁྲལ་སྲིད་བྱུས་བསྒྱུར་སྲིད།'},
  {id:'ec445', cat:'econ', en:'If tax policy changes, business plans may also change.', zh:'如果税收政策发生变化，企业计划也可能随之改变。', bo:'ཁྲལ་སྲིད་བྱུས་བསྒྱུར་ན་ཁེ་ལས་ཀྱི་འཆར་གཞི་ཡང་འགྱུར་སྲིད།'},
  {id:'ec446', cat:'econ', en:'Fiscal policy has different goals.', zh:'财政政策有不同的目标。', bo:'དངུལ་རྩིས་སྲིད་བྱུས་ཀྱི་དམིགས་ཡུལ་མི་འདྲ་བ་ཡོད།'},
  {id:'ec447', cat:'econ', en:'Economic stability is one important goal.', zh:'经济稳定是一个重要的目标。', bo:'དཔལ་འབྱོར་གྱི་བརྟན་པོ་ནི་དམིགས་ཡུལ་གལ་ཆེན་ཞིག་ཡིན།'},
  {id:'ec448', cat:'econ', en:'Having plentiful job opportunities is also important.', zh:'拥有充足的就业机会也很重要。', bo:'ལས་ཀའི་གོ་སྐབས་མང་བ་ཡང་གལ་ཆེན་ཡིན།'},
  {id:'ec449', cat:'econ', en:'Achieving price stability is also important.', zh:'实现物价稳定也很重要。', bo:'རིན་གོང་བརྟན་པོ་ཡོང་བ་ཡང་གལ་ཆེན་ཡིན།'},
  {id:'ec450', cat:'econ', en:'Government economic policy may have a large effect on the economy.', zh:'政府的经济政策可能对经济产生重大影响。', bo:'གཞུང་གི་དཔལ་འབྱོར་སྲིད་བྱུས་ཀྱིས་དཔལ་འབྱོར་ལ་ཤུགས་རྐྱེན་ཆེན་པོ་བྱེད་སྲིད།'},
  // Economics module 10 — International Trade
  {id:'ec451', cat:'econ', en:'Countries trade with one another.', zh:'各国相互进行贸易。', bo:'རྒྱལ་ཁབ་ཚོས་ཕན་ཚུན་ཚོང་རྒྱག་གི་ཡོད།'},
  {id:'ec452', cat:'econ', en:'Buying goods from abroad is called importing.', zh:'从国外购买商品被称为进口。', bo:'ཕྱི་རྒྱལ་ནས་ཐོན་རྫས་ཉོ་བ་ལ་ནང་འདྲེན་ཟེར།'},
  {id:'ec453', cat:'econ', en:'Selling goods to another country is called exporting.', zh:'向另一个国家出售商品被称为出口。', bo:'རྒྱལ་ཁབ་གཞན་ལ་ཐོན་རྫས་བཙོང་བ་ལ་ཕྱིར་འཚོང་ཟེར།'},
  {id:'ec454', cat:'econ', en:'Exports are part of a country\'s income.', zh:'出口是一个国家收入的一部分。', bo:'ཕྱིར་འཚོང་ནི་རྒྱལ་ཁབ་ཀྱི་ཡོང་འབབ་ཀྱི་ཆ་ཤས་ཡིན།'},
  {id:'ec455', cat:'econ', en:'Imports are part of a country\'s spending.', zh:'进口是一个国家支出的一部分。', bo:'ནང་འདྲེན་ནི་རྒྱལ་ཁབ་ཀྱི་འགྲོ་སོང་གི་ཆ་ཤས་ཡིན།'},
  {id:'ec456', cat:'econ', en:'Each country has different product characteristics.', zh:'每个国家的产品特点各不相同。', bo:'རྒྱལ་ཁབ་རེ་རེར་ཐོན་རྫས་ཀྱི་ཁྱད་ཆོས་མི་འདྲ།'},
  {id:'ec457', cat:'econ', en:'Some countries focus on agriculture.', zh:'一些国家专注于农业。', bo:'རྒྱལ་ཁབ་ཁ་ཤས་ཀྱིས་ཞིང་ལས་ལ་དམིགས་གཏོད་བྱེད།'},
  {id:'ec458', cat:'econ', en:'Some countries focus on manufacturing.', zh:'一些国家专注于制造业。', bo:'རྒྱལ་ཁབ་ཁ་ཤས་ཀྱིས་བཟོ་ལས་ལ་དམིགས་གཏོད་བྱེད།'},
  {id:'ec459', cat:'econ', en:'Some countries focus on service industries.', zh:'一些国家专注于服务业。', bo:'རྒྱལ་ཁབ་ཁ་ཤས་ཀྱིས་ཞབས་ཞུའི་ལས་རིགས་ལ་དམིགས་གཏོད་བྱེད།'},
  {id:'ec460', cat:'econ', en:'International trade can increase product choices.', zh:'国际贸易能够增加产品的选择。', bo:'རྒྱལ་སྤྱིའི་ཚོང་གིས་ཐོན་རྫས་ཀྱི་གདམ་ག་མང་དུ་གཏོང་ཐུབ།'},
  {id:'ec461', cat:'econ', en:'Trading may benefit both countries.', zh:'贸易可能使两个国家都受益。', bo:'ཚོང་རྒྱག་པས་རྒྱལ་ཁབ་གཉིས་ཀར་ཁེ་ཕན་ཐོབ་སྲིད།'},
  {id:'ec462', cat:'econ', en:'If there are trade barriers, importing may become difficult.', zh:'如果存在贸易壁垒，进口可能会变得困难。', bo:'ཚོང་ལ་བཀག་རྐྱེན་ཡོད་ན་ནང་འདྲེན་དཀའ་བ་ཡོང་སྲིད།'},
  {id:'ec463', cat:'econ', en:'Import tariffs are taxes levied on goods brought from abroad.', zh:'进口关税是对从国外引进的商品所征收的税。', bo:'ནང་འདྲེན་ཁྲལ་ནི་ཕྱི་རྒྱལ་ནས་འདྲེན་པའི་ཐོན་རྫས་ལ་བསྡུ་བའི་ཁྲལ་ཡིན།'},
  {id:'ec464', cat:'econ', en:'If import tariffs rise, foreign goods may become more expensive.', zh:'如果进口关税提高，外国商品可能会变得更昂贵。', bo:'ནང་འདྲེན་ཁྲལ་འཕར་ན་ཕྱི་རྒྱལ་གྱི་ཐོན་རྫས་གོང་ཆེ་བ་ཡོང་སྲིད།'},
  {id:'ec465', cat:'econ', en:'There are other trade barriers too.', zh:'还有其他的贸易壁垒。', bo:'ཚོང་ལ་བཀག་རྐྱེན་གཞན་ཡང་ཡོད།'},
  {id:'ec466', cat:'econ', en:'Two countries may establish a trade agreement.', zh:'两个国家可能会建立贸易协定。', bo:'རྒྱལ་ཁབ་གཉིས་ཀྱིས་ཚོང་ཆིངས་བཞག་སྲིད།'},
  {id:'ec467', cat:'econ', en:'A trade agreement may make trading more convenient.', zh:'贸易协定可能会使交易更加便利。', bo:'ཚོང་ཆིངས་ཀྱིས་ཉོ་ཚོང་སྟབས་བདེ་རུ་གཏོང་སྲིད།'},
  {id:'ec468', cat:'econ', en:'The exchange rate is important to international trade.', zh:'汇率对国际贸易很重要。', bo:'རྒྱལ་སྤྱིའི་ཚོང་ལས་ལ་དངུལ་གྱི་བརྗེ་ཚད་གལ་ཆེན་ཡིན།'},
  {id:'ec469', cat:'econ', en:'The exchange rate is the value between two currencies.', zh:'汇率是两种货币之间的价值比率。', bo:'དངུལ་གྱི་བརྗེ་ཚད་ནི་དངུལ་རིགས་གཉིས་ཀྱི་བར་གྱི་རིན་ཐང་ཡིན།'},
  {id:'ec470', cat:'econ', en:'If one currency\'s value rises, buying foreign goods may become easier.', zh:'如果一种货币的价值上升，购买外国商品可能会变得更容易。', bo:'དངུལ་རིགས་གཅིག་གི་རིན་ཐང་འཕར་ན་ཕྱི་རྒྱལ་གྱི་ཐོན་རྫས་ཉོ་བ་སླ་བ་ཡོང་སྲིད།'},
  {id:'ec471', cat:'econ', en:'If one currency\'s value falls, it may benefit exports.', zh:'如果一种货币的价值下降，可能有利于出口。', bo:'དངུལ་རིགས་གཅིག་གི་རིན་ཐང་ཆག་ན་ཕྱིར་འཚོང་ལ་ཕན་ཐོགས་སྲིད།'},
  {id:'ec472', cat:'econ', en:'Exchange rates may change daily.', zh:'汇率可能每天变化。', bo:'དངུལ་རིགས་ཀྱི་བརྗེ་ཚད་ཉིན་རེར་འགྱུར་སྲིད།'},
  {id:'ec473', cat:'econ', en:'Exchange rates have many contributing factors.', zh:'汇率受多种因素影响。', bo:'དངུལ་རིགས་ཀྱི་བརྗེ་ཚད་ལ་རྒྱུ་རྐྱེན་མང་པོ་ཡོད།'},
  {id:'ec474', cat:'econ', en:'A country\'s interest rate may affect the exchange rate.', zh:'一个国家的利率可能会影响汇率。', bo:'རྒྱལ་ཁབ་ཀྱི་སྐྱེད་ཚད་ཀྱིས་བརྗེ་ཚད་ལ་ཤུགས་རྐྱེན་བྱེད་སྲིད།'},
  {id:'ec475', cat:'econ', en:'International investment is an important part of the economy.', zh:'国际投资是经济的重要组成部分。', bo:'རྒྱལ་སྤྱིའི་མ་དངུལ་འཇོག་པ་ནི་དཔལ་འབྱོར་གྱི་ཆ་ཤས་གལ་ཆེན་ཡིན།'},
  {id:'ec476', cat:'econ', en:'Investors may invest in other countries.', zh:'投资者可能会投资于其他国家。', bo:'མ་དངུལ་འཇོག་མཁན་གྱིས་རྒྱལ་ཁབ་གཞན་ནང་མ་དངུལ་འཇོག་སྲིད།'},
  {id:'ec477', cat:'econ', en:'Foreign investment may build new businesses.', zh:'外国投资可能会建立新企业。', bo:'ཕྱི་རྒྱལ་གྱི་མ་དངུལ་གྱིས་ཁེ་ལས་གསར་པ་བསྐྲུན་སྲིད།'},
  {id:'ec478', cat:'econ', en:'Foreign investment may create job opportunities.', zh:'外国投资可能会创造就业机会。', bo:'ཕྱི་རྒྱལ་གྱི་མ་དངུལ་གྱིས་ལས་ཀའི་གོ་སྐབས་བཟོ་སྲིད།'},
  {id:'ec479', cat:'econ', en:'Trade statistics are regularly collected for a country.', zh:'贸易统计数据被定期收集。', bo:'རྒྱལ་ཁབ་ཀྱི་ཚོང་གི་གྲངས་ཐོ་དུས་རྒྱུན་བསྡུ་གི་ཡོད།'},
  {id:'ec480', cat:'econ', en:'There is a trade gap between exports and imports.', zh:'出口与进口之间存在贸易差额。', bo:'ཕྱིར་འཚོང་དང་ནང་འདྲེན་གྱི་བར་ལ་ཚོང་གི་ཁ་ཆད་ཡོད།'},
  {id:'ec481', cat:'econ', en:'If exports exceed imports, there may be a trade surplus.', zh:'如果出口超过进口，可能会出现贸易顺差。', bo:'ཕྱིར་འཚོང་ནང་འདྲེན་ལས་མང་ན་ཚོང་གི་ཁ་ཆད་ཡོད་སྲིད།'},
  {id:'ec482', cat:'econ', en:'If imports exceed exports, there may be a trade deficit.', zh:'如果进口超过出口，可能会出现贸易逆差。', bo:'ནང་འདྲེན་ཕྱིར་འཚོང་ལས་མང་ན་ཚོང་གི་ཁ་ཆད་མེད་པ་ཡོང་སྲིད།'},
  {id:'ec483', cat:'econ', en:'The trade balance affects a country\'s finances.', zh:'贸易差额会影响一个国家的财政。', bo:'ཚོང་གི་ཁ་ཆད་ཀྱིས་རྒྱལ་ཁབ་ཀྱི་དངུལ་རྩིས་ལ་ཤུགས་རྐྱེན་བྱེད།'},
  {id:'ec484', cat:'econ', en:'Many countries buy foreign goods.', zh:'很多国家购买外国商品。', bo:'རྒྱལ་ཁབ་མང་པོས་ཕྱི་རྒྱལ་གྱི་ཐོན་རྫས་ཉོ་གི་ཡོད།'},
  {id:'ec485', cat:'econ', en:'Many countries sell goods to other countries.', zh:'很多国家向其他国家出售商品。', bo:'རྒྱལ་ཁབ་མང་པོས་ཕྱི་རྒྱལ་ལ་ཐོན་རྫས་བཙོང་གི་ཡོད།'},
  {id:'ec486', cat:'econ', en:'International trade can expand markets.', zh:'国际贸易能够扩大市场。', bo:'རྒྱལ་སྤྱིའི་ཚོང་གིས་ཁྲོམ་རའི་རྒྱ་ཆེ་རུ་གཏོང་ཐུབ།'},
  {id:'ec487', cat:'econ', en:'Businesses may enter foreign markets.', zh:'企业可能会进入国外市场。', bo:'ཁེ་ལས་ཀྱིས་ཕྱི་རྒྱལ་ཁྲོམ་རར་ཞུགས་སྲིད།'},
  {id:'ec488', cat:'econ', en:'Entering foreign markets requires data and research.', zh:'进入国外市场需要数据和研究。', bo:'ཕྱི་རྒྱལ་ཁྲོམ་རར་ཞུགས་པར་གཞི་གྲངས་དང་ཞིབ་འཇུག་དགོས།'},
  {id:'ec489', cat:'econ', en:'Each country\'s market conditions differ.', zh:'每个国家的市场情况各不相同。', bo:'རྒྱལ་ཁབ་རེ་རེར་ཁྲོམ་རའི་གནས་ཚུལ་མི་འདྲ།'},
  {id:'ec490', cat:'econ', en:'International trade has different systems.', zh:'国际贸易有不同的体系。', bo:'རྒྱལ་སྤྱིའི་ཚོང་ལ་ལམ་ལུགས་མི་འདྲ་བ་ཡོད།'},
  {id:'ec491', cat:'econ', en:'Legal and tax systems differ by country.', zh:'法律和税收制度因国家而异。', bo:'ཁྲིམས་དང་ཁྲལ་གྱི་ལམ་ལུགས་རྒྱལ་ཁབ་རེ་རེར་མི་འདྲ།'},
  {id:'ec492', cat:'econ', en:'Different currencies may be used in foreign trade.', zh:'对外贸易中可能会使用不同的货币。', bo:'ཕྱི་རྒྱལ་ཚོང་ལས་ལ་དངུལ་རིགས་མི་འདྲ་བ་སྤྱོད་སྲིད།'},
  {id:'ec493', cat:'econ', en:'Different currencies carry exchange rate risk.', zh:'不同货币存在汇率风险。', bo:'དངུལ་རིགས་མི་འདྲ་བར་བརྗེ་ཚད་ཀྱི་ཉེན་ཁ་ཡོད།'},
  {id:'ec494', cat:'econ', en:'Transportation costs matter for international trade.', zh:'运输成本对国际贸易很重要。', bo:'རྒྱལ་སྤྱིའི་ཉོ་ཚོང་ལ་སྐྱེལ་འདྲེན་གྱི་གོང་གུད་གལ་ཆེན་ཡིན།'},
  {id:'ec495', cat:'econ', en:'Ships and airplanes are important transport for foreign trade.', zh:'船只和飞机是对外贸易中重要的运输方式。', bo:'གྲུ་གཟིངས་དང་གནམ་གྲུ་ནི་ཕྱི་རྒྱལ་ཚོང་ལ་སྤྱོད་པའི་སྐྱེལ་འདྲེན་གལ་ཆེན་ཡིན།'},
  {id:'ec496', cat:'econ', en:'International trade may connect countries to one another.', zh:'国际贸易可能会将各国彼此连接起来。', bo:'རྒྱལ་སྤྱིའི་ཚོང་གིས་རྒྱལ་ཁབ་ཕན་ཚུན་འབྲེལ་བ་བྱེད་སྲིད།'},
  {id:'ec497', cat:'econ', en:'If economic ties grow, trade may also grow.', zh:'如果经济联系加深，贸易也可能随之增长。', bo:'དཔལ་འབྱོར་གྱི་འབྲེལ་བ་འཕེལ་ན་ཚོང་ཡང་འཕེལ་སྲིད།'},
  {id:'ec498', cat:'econ', en:'International economics is a broad field of study.', zh:'国际经济学是一个广阔的研究领域。', bo:'རྒྱལ་སྤྱིའི་དཔལ་འབྱོར་ནི་རྒྱ་ཆེ་བའི་ཞིབ་འཇུག་ཁོངས་ཤིག་ཡིན།'},
  {id:'ec499', cat:'econ', en:'One country\'s economic condition may affect other countries.', zh:'一个国家的经济状况可能会影响其他国家。', bo:'རྒྱལ་ཁབ་གཅིག་གི་དཔལ་འབྱོར་གནས་ཚུལ་གྱིས་རྒྱལ་ཁབ་གཞན་ལ་ཤུགས་རྐྱེན་བྱེད་སྲིད།'},
  {id:'ec500', cat:'econ', en:'Studying economics helps understand changes in countries and markets.', zh:'学习经济学有助于理解国家与市场的变化。', bo:'དཔལ་འབྱོར་རིག་པ་སློབ་པས་རྒྱལ་ཁབ་དང་ཁྲོམ་རའི་འགྱུར་བ་རྟོགས་ཐུབ།'},
  // Science & Technology module 1 — Science Basics
  {id:'sci1', cat:'science3', en:'Science is a field of knowledge that studies changes in nature.', zh:'科学是研究自然界变化的知识领域。', bo:'ཚན་རིག་ནི་རང་བྱུང་གི་འགྱུར་བ་ལ་ཞིབ་འཇུག་བྱེད་པའི་ཤེས་རིག་ཅིག་ཡིན།'},
  {id:'sci2', cat:'science3', en:'Scientists study the nature of matter and energy.', zh:'科学家研究物质与能量的本质。', bo:'ཚན་རིག་པས་དངོས་པོ་དང་ནུས་པའི་རྣམ་པ་ལ་ཞིབ་འཇུག་བྱེད།'},
  {id:'sci3', cat:'science3', en:'Examples and experiments are very important to scientific research.', zh:'实例和实验对科学研究非常重要。', bo:'ཚན་རིག་གི་ཞིབ་འཇུག་ལ་དཔེ་མཚོན་དང་ཚོད་ལྟ་གལ་ཆེན་པོ་ཡིན།'},
  {id:'sci4', cat:'science3', en:'By experimenting, new information can be discovered.', zh:'通过实验能够发现新的信息。', bo:'ཚོད་ལྟ་བྱས་ནས་གནས་ཚུལ་གསར་པ་རྙེད་ཐུབ།'},
  {id:'sci5', cat:'science3', en:'Analysis is an important step in science.', zh:'分析是科学中重要的步骤。', bo:'དཔྱད་ཞིབ་ནི་ཚན་རིག་གི་གོ་རིམ་གལ་ཆེན་ཞིག་ཡིན།'},
  {id:'sci6', cat:'science3', en:'Data is very important to scientific research.', zh:'数据对科学研究非常重要。', bo:'གྲངས་ཐོ་ནི་ཚན་རིག་ཞིབ་འཇུག་ལ་ཧ་ཅང་གལ་ཆེ།'},
  {id:'sci7', cat:'science3', en:'Scientists write conclusions based on facts.', zh:'科学家根据事实撰写结论。', bo:'ཚན་རིག་པས་དོན་དངོས་ལ་གཞི་བཞག་ནས་གྲུབ་དོན་འབྲི།'},
  {id:'sci8', cat:'science3', en:'Evidence is important to scientific conclusions.', zh:'证据对科学结论很重要。', bo:'དཔང་རྟགས་ནི་ཚན་རིག་གི་གྲུབ་དོན་ལ་གལ་ཆེན་ཡིན།'},
  {id:'sci9', cat:'science3', en:'Scientific knowledge grows every day.', zh:'科学知识每天都在增长。', bo:'ཚན་རིག་གི་ཤེས་ཡོན་ནི་ཉིན་རེ་བཞིན་འཕེལ་བཞིན་ཡོད།'},
  {id:'sci10', cat:'science3', en:'Through science, people deepen their understanding of nature.', zh:'通过科学，人们加深了对自然界的理解。', bo:'མི་ཚོས་ཚན་རིག་བརྒྱུད་ནས་རང་བྱུང་ཁམས་ལ་གོ་བ་ཇེ་ཟབ་ཏུ་གཏོང་།'},
  {id:'sci11', cat:'science3', en:'All matter is made of substance and energy.', zh:'一切物质都由物质和能量构成。', bo:'དངོས་པོ་ཡོད་ཚད་རྫས་རྒྱུ་དང་ནུས་པ་ལས་གྲུབ་ཡོད།'},
  {id:'sci12', cat:'science3', en:'Energy is the capacity to do work.', zh:'能量是做功的能力。', bo:'ནུས་པ་ནི་ལས་ཀ་བྱེད་ཐུབ་པའི་ནུས་ཤུགས་ཤིག་ཡིན།'},
  {id:'sci13', cat:'science3', en:'An object is matter that can be seen or felt.', zh:'物体是可以被看见或感知的物质。', bo:'དངོས་པོ་ནི་མཐོང་ཐུབ་པའམ་ཚོར་ཐུབ་པའི་དངོས་རྫས་ཡིན།'},
  {id:'sci14', cat:'science3', en:'The three states of matter are solid, liquid, and gas.', zh:'物质的三种状态是固态、液态和气态。', bo:'རྫས་རྒྱུའི་རྣམ་པ་གསུམ་ནི་གོང་མའི་རྣམ་པ་དང་གཤེར་རྣམ་པ་དང་རླངས་རྣམ་པ་ཡིན།'},
  {id:'sci15', cat:'science3', en:'If temperature changes, the state of matter may also change.', zh:'如果温度变化，物质的状态也可能随之改变。', bo:'དྲོད་ཚད་འགྱུར་ན་དངོས་པོའི་རྣམ་པ་ཡང་འགྱུར་སྲིད།'},
  {id:'sci16', cat:'science3', en:'Ice is the solid state of water.', zh:'冰是水的固态形式。', bo:'འཁྱགས་པ་ནི་ཆུའི་གོང་མའི་རྣམ་པ་ཡིན།'},
  {id:'sci17', cat:'science3', en:'Water is a liquid state.', zh:'水是液态形式。', bo:'ཆུ་ནི་གཤེར་གྱི་རྣམ་པ་ཡིན།'},
  {id:'sci18', cat:'science3', en:'Water vapor is the gaseous state of water.', zh:'水蒸气是水的气态形式。', bo:'ཆུ་རླངས་ནི་ཆུའི་རླངས་རྣམ་པ་ཡིན།'},
  {id:'sci19', cat:'science3', en:'The sun is an important source of heat and energy for the earth.', zh:'太阳是地球重要的热能和能量来源。', bo:'ཉི་མ་ནི་ས་གཞིའི་དྲོད་དང་ནུས་པའི་གཏེར་ཁ་གལ་ཆེན་ཞིག་ཡིན།'},
  {id:'sci20', cat:'science3', en:'The earth is warmed by sunlight.', zh:'地球被阳光加热。', bo:'ས་གཞི་ནི་ཉི་མའི་འོད་ཀྱིས་དྲོ་བར་བྱེད།'},
  {id:'sci21', cat:'science3', en:'Light is a form of energy.', zh:'光是能量的一种形式。', bo:'འོད་ནི་ནུས་པའི་རྣམ་པ་ཞིག་ཡིན།'},
  {id:'sci22', cat:'science3', en:'Sound is a wave that travels through matter.', zh:'声音是通过物质传播的波。', bo:'སྒྲ་ནི་དངོས་པོ་བརྒྱུད་ནས་འགྲོ་བའི་རླབས་ཤིག་ཡིན།'},
  {id:'sci23', cat:'science3', en:'Waves have different speeds.', zh:'波有不同的速度。', bo:'རླབས་ཀྱི་འགྲོས་ཚད་མི་འདྲ་བ་ཡོད།'},
  {id:'sci24', cat:'science3', en:'Time is an important scientific measurement.', zh:'时间是重要的科学度量。', bo:'དུས་ཚོད་ནི་ཚན་རིག་གི་ཚད་འཇལ་གལ་ཆེན་ཞིག་ཡིན།'},

  {id:'sci187', cat:'science3', en:'The moon orbits the earth.', zh:'月球围绕地球运转。', bo:'ཟླ་བས་སའི་གོ་ལར་སྐོར་བ་བྱེད།'},
  {id:'sci188', cat:'science3', en:'Sunlight strikes the moon, making it visible.', zh:'阳光照射到月球上，使月球可见。', bo:'ཉི་མའི་འོད་ཟླ་བར་ཕོག་ནས་ཟླ་བ་མཐོང་ཐུབ།'},

  {id:'sci190', cat:'science3', en:'Space is extremely vast.', zh:'太空极其广阔。', bo:'མཁའ་དབྱིངས་ཧ་ཅང་རྒྱ་ཆེན་པོ་ཡིན།'},

  {id:'sci193', cat:'science3', en:'There are many planets in a star system.', zh:'一个恒星系统中有很多行星。', bo:'སྐར་མའི་མ་ལག་ནང་གཟའ་སྐར་མང་པོ་ཡོད།'},
  {id:'sci194', cat:'science3', en:'A large collection of stars is called a galaxy.', zh:'大规模的恒星集合被称为星系。', bo:'སྐར་མའི་ཚོགས་པ་ཆེན་པོར་དགུ་ཚོགས་ཞེས་ཟེར།'},
  {id:'sci195', cat:'science3', en:'A galaxy contains billions of stars.', zh:'一个星系中有数十亿颗恒星。', bo:'དགུ་ཚོགས་ནང་སྐར་མ་ཐེར་འབུམ་མང་པོ་ཡོད།'},
  {id:'sci196', cat:'science3', en:'Special units are used to measure distances in space.', zh:'测量太空中的距离使用特殊的单位。', bo:'མཁའ་དབྱིངས་ཀྱི་རྒྱང་ཚད་འཇལ་བར་ཚད་གཞི་དམིགས་བསལ་སྤྱོད།'},

  {id:'sci207', cat:'science3', en:'A hard drive stores files.', zh:'硬盘存储文件。', bo:'སྡེར་མའི་ཉར་ཆས་ཀྱིས་ཡིག་ཆ་ཉར་ཚགས་བྱེད།'},

  {id:'sci218', cat:'science3', en:'There is a lot of audio and video software.', zh:'有很多音频和视频软件。', bo:'སྒྲ་དང་བརྙན་གྱི་མཉེན་ཆས་མང་པོ་ཡོད།'},

  {id:'sci232', cat:'science3', en:'Bluetooth can connect two nearby devices.', zh:'蓝牙能够连接两个附近的设备。', bo:'Bluetooth ཡིས་ཡོ་ཆས་ཉེ་འཁོར་གཉིས་སྦྲེལ་ཐུབ།'},
  {id:'sci233', cat:'science3', en:'Email is a method of sending information.', zh:'电子邮件是一种发送信息的方法。', bo:'གློག་འཕྲིན་ནི་གནས་ཚུལ་སྐྱེལ་བའི་ཐབས་ཤིག་ཡིན།'},

// ---- exercise generation -----------------------------------------------------
function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function buildExercises(track, group){
  const pool = group.ids.map(byId);
  return shuffled(group.ids).map(id=>{
    const word = byId(id);
    const others = shuffled(pool.filter(w=>w.id!==id)).slice(0,3);
    const options = shuffled([word, ...others]).map(w=>({
      id:w.id, text:wordText(w, track.answerLang), sub:wordSub(w, track.answerLang), correct:w.id===word.id
    }));
    return {
      wordId:word.id,
      prompt:wordText(word, track.promptLang),
      promptSub:wordSub(word, track.promptLang),
      promptLang:track.promptLang,
      options
    };
  });
}

const memoryFallback = {};
const safeStorage = {
  get(key){
    try{ const v = window.localStorage.getItem(key); return v===null? null : v; }
    catch(e){ return Object.prototype.hasOwnProperty.call(memoryFallback,key) ? memoryFallback[key] : null; }
  },
  set(key,val){
    try{ window.localStorage.setItem(key,val); }
    catch(e){ memoryFallback[key]=val; }
  }
};

function dicebearUrl(options, seed, extraParams){
  // The "none" -> probability=0 translation for facialHair/accessories now

let state = defaultAppState();

async function fetchSubscriptionStatus(){
  if(!state.currentUser) return;
  try{
    const res = await fetch('/api/subscription-status?username=' + encodeURIComponent(state.currentUser));
    if(!res.ok) return;
    const data = await res.json();
    state.subscription = data.subscription;
    if(data.avatar) state.avatar = data.avatar;
    render();
  } catch(e){ /* offline or server briefly unavailable — keep last known status */ }
}

function boot(){
  const savedLang = safeStorage.get(LANG_KEY);
  if(savedLang==='en' || savedLang==='zh' || savedLang==='bo') state.appLang = savedLang;
  state.voicePref = loadVoicePref();
  const sess = loadSession();
  if(sess.currentUser){
    state.currentUser = sess.currentUser;
    state.game = loadGame(sess.currentUser);
    regenHearts();
    state.screen = 'pick_language';
    fetchSubscriptionStatus();
  } else {
    state.screen = 'auth';
  }

  // Returning from Stripe Checkout: the webhook may land a moment after the
  // redirect, so poll subscription status briefly instead of checking once.
  const params = new URLSearchParams(location.search);
  if(params.has('checkout')){
    state.checkoutResult = params.get('checkout');
    history.replaceState(null, '', location.pathname);
    if(state.checkoutResult === 'success' && sess.currentUser){
      let attempts = 0;
      const poll = setInterval(async () => {
        attempts++;
        await fetchSubscriptionStatus();
        if(state.subscription.active || attempts >= 6) clearInterval(poll);
      }, 2000);
    }
  }
}
boot();

function regenHearts(){
  if(state.game.hearts >= HEARTS_MAX) { state.game.lastHeartTime = Date.now(); return; }
  const elapsed = Date.now() - state.game.lastHeartTime;
  const gained = Math.floor(elapsed / HEART_REGEN_MS);
  if(gained > 0){
    state.game.hearts = Math.min(HEARTS_MAX, state.game.hearts + gained);
    state.game.lastHeartTime = state.game.hearts >= HEARTS_MAX ? Date.now() : state.game.lastHeartTime + gained*HEART_REGEN_MS;
  }
}
function nextHeartEta(){
  if(state.game.hearts>=HEARTS_MAX) return null;
  const remain = HEART_REGEN_MS - (Date.now()-state.game.lastHeartTime);
  return Math.max(1, Math.ceil(remain/60000));
}

function trackProgress(trackId){
  if(!state.game.tracks[trackId]) state.game.tracks[trackId] = {completed:{}};
  return state.game.tracks[trackId];
}
function lessonKey(levelIdx, groupKey){ return levelIdx+'-'+groupKey; }
function isLessonDone(trackId, levelIdx, groupKey){
  return trackProgress(trackId).completed[lessonKey(levelIdx,groupKey)] || 0;
}
function levelStats(trackId, levelIdx){
  const lvl = LEVELS[levelIdx];
  if(!lvl.built) return {done:0,total:0};
  const p = trackProgress(trackId);
  let done=0;
  lvl.modules.forEach(g=>{ if(p.completed[lessonKey(levelIdx,g.key)]) done++; });
  return {done, total:lvl.modules.length};
}
function touchStreak(){
  const today = new Date().toDateString();
  if(state.game.lastActive===today) return;
  if(state.game.lastActive){
    const y = new Date(); y.setDate(y.getDate()-1);
    state.game.streak = state.game.lastActive===y.toDateString() ? state.game.streak+1 : 1;
  } else { state.game.streak = 1; }
  state.game.lastActive = today;
}

    algTopicTitle_fractions: "Fractions", algTopicDesc_fractions: "Simplify fractions to lowest terms",
    algLearn_fractions: "A fraction is in lowest terms when its numerator and denominator share no common factor other than 1. To simplify, find the greatest common factor (GCF) of the numerator and denominator, then divide both by it.\n\nExample: simplify 18/24.\nThe GCF of 18 and 24 is 6.\n18 ÷ 6 = 3, and 24 ÷ 6 = 4.\nSo 18/24 = 3/4.",
    algFractionsPrompt: "Simplify: {expr}",
    algFractionsExplain: "The greatest common factor of {num} and {den} is {k}. Divide both by {k}: {num}/{k} = {p}, {den}/{k} = {q}. So the answer is {p}/{q}.",

    algTopicTitle_exponents: "Exponents", algTopicDesc_exponents: "Evaluate powers",
    algLearn_exponents: "An exponent tells you how many times to multiply a number by itself. aⁿ means a multiplied by itself n times.\n\nExample: evaluate 3⁴.\n3⁴ = 3 × 3 × 3 × 3 = 81.",
    algExponentsPrompt: "Evaluate: {expr}",
    algExponentsExplain: "{a}^{b} means {a} multiplied by itself {b} times, which equals {answer}.",

    algTopicTitle_logarithms: "Logarithms", algTopicDesc_logarithms: "Evaluate logarithms",
    algLearn_logarithms: "A logarithm answers the question: what power do I raise the base to, to get this number? log_b(x) = e means b^e = x.\n\nExample: evaluate log₂(8).\nAsk: 2 to what power gives 8? Since 2³ = 8, log₂(8) = 3.",
    algLogPrompt: "Evaluate: log_{b}({x})",
    algLogExplain: "log_{b}({x}) asks: {b} to what power equals {x}? Since {b}^{e} = {x}, the answer is {e}.",

    algTopicTitle_equations: "Equations", algTopicDesc_equations: "Solve linear equations for x",
    algLearn_equations: "To solve a linear equation, isolate x by undoing each operation applied to it, working in reverse order — first move constants, then divide by the coefficient.\n\nExample: solve 3x + 5 = 20.\nSubtract 5 from both sides: 3x = 15.\nDivide both sides by 3: x = 5.",
    algEquationsPrompt: "Solve for x: {expr}",
    algEquationsExplain: "Isolate the x term: {a}x = {rhs}. Divide both sides by {a}: x = {x0}.",

    algTopicTitle_inequalities: "Inequalities", algTopicDesc_inequalities: "Solve linear inequalities for x",
    algLearn_inequalities: "Inequalities solve almost exactly like equations — isolate x the same way. The one rule to remember: if you multiply or divide both sides by a negative number, the inequality sign flips.\n\nExample: solve 2x + 3 < 11.\nSubtract 3: 2x < 8.\nDivide by 2 (positive, so the sign stays): x < 4.",
    algInequalitiesPrompt: "Find the boundary value of x: {expr}",
    algInequalitiesExplain: "Isolate the x term: {a}x compares to {rhs}. Divide by {a} (positive, so the direction doesn't flip): the boundary is x = {x0}.",

    algTopicTitle_simultaneous: "Simultaneous Equations", algTopicDesc_simultaneous: "Solve two equations for x and y",
    algLearn_simultaneous: "When two equations share the same two unknowns, you can solve both at once by elimination (adding/subtracting multiples of the equations to cancel one variable) or substitution (solving one equation for a variable and plugging it into the other).\n\nExample: solve x + y = 5 and x - y = 1.\nAdd the equations: 2x = 6, so x = 3.\nSubstitute back: 3 + y = 5, so y = 2.",
    algSimultaneousPrompt: "Solve the system: {eq1}, and {eq2}",
    algSimultaneousExplain: "Solving by elimination or substitution gives x = {x0} and y = {y0}.",

    algTopicTitle_polynomials: "Polynomials", algTopicDesc_polynomials: "Evaluate a polynomial at a given x",
    algLearn_polynomials: "To evaluate a polynomial at a specific value, substitute that value in for x everywhere it appears, then simplify using order of operations.\n\nExample: if f(x) = 2x² + 3x - 1, find f(2).\nf(2) = 2(2)² + 3(2) - 1 = 2(4) + 6 - 1 = 8 + 6 - 1 = 13.",
    algPolynomialsPrompt: "If f(x) = {expr}, find f({k}).",
    algPolynomialsExplain: "Substitute x = {k}: {sumExpr} = {answer}.",

    algTopicTitle_factorisation: "Factorisation", algTopicDesc_factorisation: "Factor a quadratic and find its roots",
    algLearn_factorisation: "A quadratic x² + bx + c factors as (x - r₁)(x - r₂) when r₁ and r₂ are its roots — two numbers that multiply to c and add to -b.\n\nExample: factor x² - 5x + 6.\nFind two numbers that multiply to 6 and add to -5: -2 and -3.\nSo x² - 5x + 6 = (x - 2)(x - 3), and the roots are x = 2 and x = 3.",
    algFactorisationPrompt: "Find the roots: {expr}",
    algFactorisationExplain: "This factors as {factors} = 0, so x = {rmin} or x = {rmax}.",

    algTopicTitle_sequences: "Sequences", algTopicDesc_sequences: "Find a term in a sequence",
    algLearn_sequences: "An arithmetic sequence adds the same amount (the common difference, d) each step: aₙ = a₁ + (n-1)d. A geometric sequence multiplies by the same amount (the common ratio, r) each step: aₙ = a₁ × r^(n-1).\n\nExample: an arithmetic sequence starts at 4 with common difference 3. Find the 6th term.\na₆ = 4 + (6-1)×3 = 4 + 15 = 19.",
    algSeqArithPrompt: "An arithmetic sequence starts at {a1} with common difference {d}. Find the {n}th term.",
    algSeqArithExplain: "Use aₙ = a₁ + (n-1)d = {a1} + ({n}-1)×{d} = {answer}.",
    algSeqGeoPrompt: "A geometric sequence starts at {a1} with common ratio {r}. Find the {n}th term.",
    algSeqGeoExplain: "Use aₙ = a₁ × r^(n-1) = {a1} × {r}^({n}-1) = {answer}.",

    algTopicTitle_functions: "Functions", algTopicDesc_functions: "Evaluate a composition of functions",
    algLearn_functions: "f(g(x)) means: first apply g to x, then apply f to that result. Work from the inside out.\n\nExample: if f(x) = 2x + 1 and g(x) = x - 3, find f(g(5)).\nFirst g(5) = 5 - 3 = 2.\nThen f(2) = 2(2) + 1 = 5.",
    algFunctionsPrompt: "If f(x) = {fExpr} and g(x) = {gExpr}, find f(g({k})).",
    algFunctionsExplain: "First find g({k}) = {inner}. Then find f({inner}) = {answer}.",

    algTopicTitle_graphs: "Graphs", algTopicDesc_graphs: "Find the slope and y-intercept of a line",
    algLearn_graphs: "A line's slope-intercept form is y = mx + b, where m is the slope and b is the y-intercept. Rearrange any linear equation into this form to read off both.\n\nExample: find the slope and y-intercept of y - 2x = 3.\nAdd 2x to both sides: y = 2x + 3.\nThe slope is 2 and the y-intercept is 3.",
    algGraphsPrompt: "Find the slope and y-intercept: {expr}",
    algGraphsExplain: "Rearranged to y = mx + b form: y = {m}x + {b}. So the slope is {m} and the y-intercept is {b}.",

    algTopicTitle_trigonometry: "Trigonometry", algTopicDesc_trigonometry: "Standard angle values",
    algLearn_trigonometry: "A handful of angles (0°, 30°, 45°, 60°, 90°) have exact sin/cos/tan values worth memorizing, since they show up constantly. They come from the side ratios of a 45-45-90 and a 30-60-90 right triangle.\n\nExample: sin(30°) = 1/2, cos(30°) = √3/2, tan(30°) = √3/3.",
    algTrigPrompt: "Evaluate: {expr}",
    algTrigExplain: "{expr} = {answer}. This is one of the standard angle values worth memorizing.",

    calculusBtn: "📈 Learn Calculus",
    calculusTitle: "Calculus",
    calculusSub: "Month 2: limits, derivatives and integrals. Pick a topic to learn the concept, then practice.",
    backToCalcMenuBtn: "Back to Calculus",

    calcTopicTitle_limits: "Limits", calcTopicDesc_limits: "Evaluate limits of functions",
    calcLearn_limits: "A limit asks: what value does f(x) approach as x gets closer and closer to some point c? For continuous functions (like polynomials), you can just substitute directly: lim(x→c) f(x) = f(c).\n\nSometimes substituting gives 0/0 — an ‘indeterminate form.’ When that happens, factor the numerator and denominator and cancel the common factor first, then substitute.\n\nExample: lim(x→2) (x² - 4)/(x - 2).\nSubstituting x=2 gives 0/0, so factor: (x-2)(x+2)/(x-2) = x+2 (for x≠2).\nNow substitute: 2 + 2 = 4.",
    calcLimitDirectPrompt: "Evaluate: lim(x→{c}) [{expr}]",
    calcLimitDirectExplain: "This function is continuous everywhere, so the limit equals direct substitution: f({c}) = {answer}.",
    calcLimitFactorPrompt: "Evaluate: lim(x→{r}) [{num} / {den}]",
    calcLimitFactorExplain: "Since x ≠ {r} while taking the limit, cancel the common factor {den}: the expression simplifies to {remExpr}. Substitute x = {r}: {answer}.",

    calcTopicTitle_power_rule: "Derivatives: Power Rule", calcTopicDesc_power_rule: "Differentiate a polynomial",
    calcLearn_power_rule: "The power rule says: d/dx[xⁿ] = n·x^(n-1). Multiply by the exponent, then subtract 1 from it. Apply this to each term of a polynomial separately.\n\nExample: if f(x) = 2x³ + 3x² - 4x + 1, find f'(x).\nf'(x) = 3(2)x² + 2(3)x - 4 = 6x² + 6x - 4.",
    calcPowerRulePrompt: "If f(x) = {expr}, find f'({k}).",
    calcPowerRuleExplain: "Apply the power rule to each term: f'(x) = {derivExpr}. Substitute x = {k}: {answer}.",

    calcTopicTitle_product_rule: "Derivatives: Product Rule", calcTopicDesc_product_rule: "Differentiate a product of two functions",
    calcLearn_product_rule: "When you're differentiating a product of two functions f(x) = u(x)·v(x), you can't just multiply the derivatives. The product rule is: (uv)' = u'v + uv'.\n\nExample: if u(x) = x + 2 and v(x) = 3x - 1, find (uv)'(x).\nu' = 1, v' = 3.\n(uv)' = 1·(3x-1) + (x+2)·3 = 3x - 1 + 3x + 6 = 6x + 5.",
    calcProductRulePrompt: "If f(x) = ({uExpr}) × ({vExpr}), find f'({k}) using the product rule.",
    calcProductRuleExplain: "By the product rule, f'(x) = u'v + uv'. At x = {k}: u = {uk}, v = {vk}, u' = {A}, v' = {C}. So f'({k}) = {stepExpr} = {sumExpr} = {answer}.",

    calcTopicTitle_quotient_rule: "Derivatives: Quotient Rule", calcTopicDesc_quotient_rule: "Differentiate a quotient of two functions",
    calcLearn_quotient_rule: "For a quotient f(x) = u(x)/v(x), the quotient rule is: (u/v)' = (u'v - uv') / v².\n\nExample: if u(x) = x and v(x) = x + 1, find (u/v)'(x).\nu' = 1, v' = 1.\n(u/v)' = [1·(x+1) - x·1] / (x+1)² = 1 / (x+1)².",
    calcQuotientRulePrompt: "If f(x) = ({uExpr}) / ({vExpr}), find f'({k}) using the quotient rule.",
    calcQuotientRuleExplain: "By the quotient rule, f'(x) = (u'v - uv') / v². At x = {k}: u = {uk}, v = {vk}, u' = {A}, v' = {C}. So f'({k}) = ({stepExpr}) / ({vk})² = {numerator} / {vk2} = {answer}.",

    calcTopicTitle_chain_rule: "Derivatives: Chain Rule", calcTopicDesc_chain_rule: "Differentiate a composition of functions",
    calcLearn_chain_rule: "When one function is nested inside another, f(g(x)), the chain rule says: [f(g(x))]' = f'(g(x)) × g'(x). Differentiate the outer function (leaving the inner one alone), then multiply by the derivative of the inner function.\n\nExample: if f(u) = u² and g(x) = 3x + 1, find the derivative of f(g(x)).\nf'(u) = 2u, so f'(g(x)) = 2(3x+1). g'(x) = 3.\n[f(g(x))]' = 2(3x+1) × 3 = 6(3x+1).",
    calcChainRulePrompt: "If f(u) = {fExpr} and g(x) = {gExpr}, find the derivative of f(g(x)) at x = {k} using the chain rule.",
    calcChainRuleExplain: "By the chain rule, [f(g(x))]' = f'(g(x)) × g'(x). Here f'(u) = {fPrimeExpr} and g'(x) = {C}. At x = {k}: g({k}) = {gk}, so f'(g({k})) = {twoA}×({gk}) = {fprime}. Multiply by g'(x): {fprime}×({C}) = {answer}.",

    calcTopicTitle_optimisation: "Optimisation", calcTopicDesc_optimisation: "Find the critical point of a function",
    calcLearn_optimisation: "A function's critical points — where it might have a maximum or minimum — occur where its derivative equals zero (or is undefined). Finding them is the first step in optimisation.\n\nExample: find the critical point of f(x) = x² - 6x + 5.\nf'(x) = 2x - 6. Set f'(x) = 0: 2x = 6, so x = 3.",
    calcOptimPrompt: "Find the critical point (where f'(x) = 0) of f(x) = {expr}.",
    calcOptimExplain: "f'(x) = {derivExpr}. Set f'(x) = 0: {twoA}x = {negB}, so x = {x0}.",

    calcTopicTitle_antiderivatives: "Antiderivatives", calcTopicDesc_antiderivatives: "Find and evaluate an antiderivative",
    calcLearn_antiderivatives: "An antiderivative reverses differentiation: it's a function F(x) whose derivative is f(x). The power rule in reverse: ∫xⁿ dx = x^(n+1)/(n+1) + C, where C is an unknown constant (since the derivative of any constant is 0).\n\nExample: find the antiderivative of f(x) = 4x + 3 with F(0) = 0.\nF(x) = 2x² + 3x + C. Since F(0) = 0, C = 0. So F(x) = 2x² + 3x.",
    calcAntiderivPrompt: "Find the antiderivative F(x) of f(x) = {expr} with F(0) = 0, then evaluate F({k}).",
    calcAntiderivExplain: "Using the power rule for integration (∫x dx = x²/2): F(x) = {FExpr} (with the constant of integration = 0). Evaluate at x = {k}: {sumExpr} = {answer}.",

    calcTopicTitle_definite_integrals: "Definite Integrals", calcTopicDesc_definite_integrals: "Evaluate a definite integral",
    calcLearn_definite_integrals: "A definite integral ∫ from a to b of f(x) dx gives the net signed area under f(x) between x=a and x=b. The Fundamental Theorem of Calculus says you can compute it as F(b) - F(a), where F is any antiderivative of f.\n\nExample: evaluate ∫ from 1 to 3 of 2x dx.\nAn antiderivative is F(x) = x². F(3) - F(1) = 9 - 1 = 8.",
    calcDefIntegralPrompt: "Evaluate: ∫ from {a} to {b} of ({expr}) dx",
    calcDefIntegralExplain: "The antiderivative is F(x) = {FExpr}. By the Fundamental Theorem of Calculus: ∫ = F({b}) - F({a}) = {Fb} - ({Fa}) = {answer}.",

    bizTitle_indirect_costs: "Indirect Costs", bizExplain_indirect_costs: "Indirect costs (overhead) cannot be traced directly to a single product or job — like factory rent or a supervisor's salary. They must be allocated across products using a cost driver.", bizQuestion_indirect_costs: "What term describes costs like factory rent that cannot be traced directly to one product?",
    bizTitle_variable_costs: "Variable Costs", bizExplain_variable_costs: "Variable costs change in direct proportion to the level of activity — the more units produced, the higher the total variable cost, but the cost per unit stays constant.", bizQuestion_variable_costs: "What term describes costs that change in direct proportion to activity level, like raw materials?",

    bizTitle_financial_accounting: "Financial Accounting", bizExplain_financial_accounting: "Financial accounting produces standardized statements — the income statement, balance sheet and cash flow statement — for external users like investors, lenders and regulators, following accounting standards.", bizQuestion_financial_accounting: "What branch of accounting produces standardized statements for external users like investors and lenders?",

    calcLearn_limits: "极限回答的问题是：当x越来越接近某个点c时，f(x)会趋近于什么值？对于连续函数（比如多项式），可以直接代入：lim(x→c) f(x) = f(c)。\n\n有时候直接代入会得到0/0——这叫做“不定型”。遇到这种情况，先把分子和分母因式分解，约去公因式，再代入。\n\n例题：lim(x→2) (x² - 4)/(x - 2)。\n代入x=2得到0/0，所以先因式分解：(x-2)(x+2)/(x-2) = x+2（当x≠2时）。\n再代入：2 + 2 = 4。",

// Enter key on the mental math / algebra practice screens does whatever the
// primary button would: submit the typed answer, or (once answered, when
// the input is disabled and no longer receiving key events) advance to the
// next question. Attached once at the document level rather than on the
// input itself so it still works after the input gets disabled/re-rendered.
document.addEventListener('keydown', function(e){
  if(e.key !== 'Enter') return;
  if(state.screen === 'math_practice' && state.mathSession){

  } else if(state.screen === 'algebra_practice' && state.algebraSession){

});

function readVal(id){ const el = document.getElementById(id); return el ? el.value.trim() : ''; }

async function doSignup(){
  const username = readVal('auth_username');
  const email = readVal('auth_email');
  const password = readVal('auth_password');
  const password2 = readVal('auth_password2');
  if(!username || username.length<3){ state.authError=t('errUsernameLength'); render(); return; }
  if(!/^[a-zA-Z0-9_.-]+$/.test(username)){ state.authError=t('errUsernameChars'); render(); return; }
  if(!password || password.length<4){ state.authError=t('errPasswordLength'); render(); return; }
  if(password!==password2){ state.authError=t('errPasswordMismatch'); render(); return; }

  try {
    const res = await fetch('/api/signup', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username, email: email||null, password, name:''})
    });
    const data = await res.json();
    if(!res.ok){
      state.authError = (data.error || t('errSignupFailed')) + (data.details ? ' — ' + data.details : '');
      render();
      return;
    }

    const usernameKey = (data.user.username || username).toLowerCase();
    saveSession({currentUser: usernameKey});
    state.currentUser = usernameKey;
    state.game = loadGame(usernameKey);
    state.subscription = data.user.subscription || state.subscription;
    state.avatar = data.user.avatar || state.avatar;
    state.authError = '';
    state.screen = 'pick_language';
    render();
  } catch(e) {
    state.authError = t('errConnection') + e.message;
    render();
  }
}

async function doLogin(){
  const username = readVal('auth_username');
  const password = readVal('auth_password');
  if(!username || !password){ state.authError=t('errEnterCreds'); render(); return; }

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username, password})
    });
    const data = await res.json();
    if(!res.ok){
      state.authError = (data.error || t('errLoginFailed')) + (data.details ? ' — ' + data.details : '');
      render();
      return;
    }

    const usernameKey = (data.user.username || username).toLowerCase();
    saveSession({currentUser: usernameKey});
    state.currentUser = usernameKey;
    state.game = loadGame(usernameKey);
    state.subscription = data.user.subscription || state.subscription;
    state.avatar = data.user.avatar || state.avatar;
    state.authError = '';
    state.screen = 'pick_language';
    render();
  } catch(e) {
    state.authError = t('errConnection') + e.message;
    render();
  }
}

  saveSession({currentUser:null, token:null});
  const lang = state.appLang;

// ---- mental math: a language-agnostic practice mode, independent of the
// TRACKS/LEVELS vocab structure above. Typed numeric answers rather than
// multiple choice. Unlimited questions per session, ending after 3 wrong
// answers (its own local strike counter — not tied to the app's global
// hearts economy, which regenerates slowly and is shared with vocab
// lessons; that would make "unlimited" a lie). ---------------------------
function randInt(min, max){ return min + Math.floor(Math.random()*(max-min+1)); }

function buildMathProblem(difficulty){
  const op = ['+','-','×','÷'][randInt(0,3)];
  let a, b, answer;
  if(difficulty==='easy'){
    if(op==='+'){ a=randInt(1,50); b=randInt(1,50); answer=a+b; }
    else if(op==='-'){ a=randInt(1,50); b=randInt(1,a); answer=a-b; }
    else if(op==='×'){ a=randInt(1,12); b=randInt(1,12); answer=a*b; }
    else { b=randInt(1,12); answer=randInt(1,12); a=b*answer; }
  } else if(difficulty==='medium'){
    if(op==='+'){ a=randInt(10,200); b=randInt(10,200); answer=a+b; }
    else if(op==='-'){ a=randInt(10,300); b=randInt(1,a); answer=a-b; }
    else if(op==='×'){ a=randInt(10,99); b=randInt(2,12); answer=a*b; }
    else { b=randInt(2,12); answer=randInt(2,50); a=b*answer; }
  } else { // hard
    if(op==='+'){ a=randInt(100,999); b=randInt(100,999); answer=a+b; }
    else if(op==='-'){ a=randInt(200,999); b=randInt(1,a); answer=a-b; }
    else if(op==='×'){ a=randInt(11,99); b=randInt(11,99); answer=a*b; }
    else { b=randInt(2,25); answer=randInt(2,80); a=b*answer; }
  }
  return {a, op, b, answer};
}
const MATH_MAX_MISTAKES = 3;

// ---- shared gamification: combo streaks, achievements, XP levels ----------
// Used identically by mental math, algebra and calculus so the reward loop
// feels the same everywhere rather than being a one-off for whichever
// module happens to get built last.
const ACHIEVEMENTS = [
  {key:'first_steps', icon:'🌱', titleKey:'achFirstStepsTitle', descKey:'achFirstStepsDesc', check:g=>g.totalCorrect>=1},
  {key:'combo_5', icon:'🔥', titleKey:'achCombo5Title', descKey:'achCombo5Desc', check:g=>g.bestCombo>=5},
  {key:'combo_10', icon:'⚡', titleKey:'achCombo10Title', descKey:'achCombo10Desc', check:g=>g.bestCombo>=10},
  {key:'century', icon:'💯', titleKey:'achCenturyTitle', descKey:'achCenturyDesc', check:g=>g.totalCorrect>=100},
  {key:'explorer', icon:'🧭', titleKey:'achExplorerTitle', descKey:'achExplorerDesc', check:g=>
    Object.values(g.math||{}).some(x=>x.best>0) &&
    Object.values(g.algebra||{}).some(x=>x.best>0) &&
    Object.values(g.calculus||{}).some(x=>x.best>0)
  },
  {key:'streak_7', icon:'🗓️', titleKey:'achStreak7Title', descKey:'achStreak7Desc', check:g=>g.streak>=7},
  {key:'streak_30', icon:'🏔️', titleKey:'achStreak30Title', descKey:'achStreak30Desc', check:g=>g.streak>=30},
];
function checkAchievements(game){
  if(!game.achievements) game.achievements=[];
  const unlocked = [];
  for(const a of ACHIEVEMENTS){
    if(!game.achievements.includes(a.key) && a.check(game)){
      game.achievements.push(a.key);
      unlocked.push(a);
    }
  }
  return unlocked;
}
function xpLevel(xp){
  const level = Math.floor(xp/100)+1;
  const into = xp%100;
  return {level, into, span:100};
}
// Bonus XP scales with the streak already built BEFORE this answer, so an
// isolated correct answer still earns the original flat 10 (no regression),
// while a run of consecutive correct answers earns progressively more,
// capped at +10 so it stays a bonus rather than runaway inflation.
function registerCorrectAnswer(session, game){
  const bonus = Math.min(session.combo||0, 10);
  session.combo = (session.combo||0) + 1;
  if(session.combo > (session.maxCombo||0)) session.maxCombo = session.combo;
  if(session.combo > (game.bestCombo||0)) game.bestCombo = session.combo;
  game.totalCorrect = (game.totalCorrect||0) + 1;
  const xpGain = 10 + bonus;
  session.correct += 1;
  session.xpEarned += xpGain;
  session.lastXpGain = xpGain;
  game.xp += xpGain;
  return xpGain;
}
function registerWrongAnswer(session){
  session.combo = 0;
  session.mistakes += 1;
}
function comboBadge(combo){
  if(combo>=10) return '⚡⚡⚡';
  if(combo>=6) return '🔥🔥';
  if(combo>=3) return '🔥';
  return '';
}

}

// Hints (hard difficulty only, opt-in): a short strategy note plus, for
// multiplication/division, a 1-12 lookup table built off one operand — the
// operand itself, for ×, since the standard algorithm always ends up
// multiplying it by single digits; the divisor, for ÷, since checking
// "divisor × ? = dividend" against the table is the standard technique.
// Doesn't hand over the final answer directly except by coincidence (e.g. a
// small quotient landing inside the 1-12 range), which is fine for a hint.
function mathHintData(q){
  if(q.op==='+') return {formula:t('hintFormulaAdd'), table:null};
  if(q.op==='-') return {formula:t('hintFormulaSub'), table:null};
  const base = q.op==='×' ? q.a : q.b;
  const rows = Array.from({length:12}, (_,i)=>({n:i+1, val:base*(i+1)}));
  return {formula: q.op==='×' ? t('hintFormulaMul') : t('hintFormulaDiv'), table:rows, base};
}

// Contextual mental-math tricks/tips, checked against the actual numbers in
// the current problem rather than shown generically — e.g. "round-and-
// adjust" only fires when an operand is actually close to a multiple of
// ten. Returns zero or more localized tip strings.
function roundAdjust(n){
  const rem = n % 10;
  if(rem>=8) return {rounded:n+(10-rem), diff:10-rem, dir:'up'};
  if(rem>0 && rem<=2) return {rounded:n-rem, diff:rem, dir:'down'};
  return null;
}
function mathTricksFor(q){
  const tips = [];
  if(q.op==='+'){
    let info = roundAdjust(q.b), val = q.b;
    if(!info){ info = roundAdjust(q.a); val = q.a; }
    if(info) tips.push(t(info.dir==='up' ? 'trickRoundUpAdd' : 'trickRoundDownAdd', {val, rounded:info.rounded, diff:info.diff}));
  } else if(q.op==='-'){
    const info = roundAdjust(q.b);
    if(info) tips.push(t(info.dir==='up' ? 'trickRoundUpSub' : 'trickRoundDownSub', {val:q.b, rounded:info.rounded, diff:info.diff}));
  } else if(q.op==='×'){
    if(q.a===11 || q.b===11){
      tips.push(t('trick11'));
    } else {
      const infoA = roundAdjust(q.a), infoB = roundAdjust(q.b);
      let chosen=null, val=null, other=null;
      if(infoA && (!infoB || infoA.diff<=infoB.diff)){ chosen=infoA; val=q.a; other=q.b; }
      else if(infoB){ chosen=infoB; val=q.b; other=q.a; }
      if(chosen) tips.push(t(chosen.dir==='up' ? 'trickRoundUpMul' : 'trickRoundDownMul', {val, rounded:chosen.rounded, diff:chosen.diff, other}));
    }
  } else { // ÷
    const divTricks = {4:'trickDiv4', 5:'trickDiv5', 8:'trickDiv8', 20:'trickDiv20', 25:'trickDiv25'};
    if(divTricks[q.b]) tips.push(t(divTricks[q.b]));
  }
  return tips;
}

// ---- algebra learning: Month 1 of a longer planned progression (algebra ->
// calculus -> linear algebra -> discrete math -> probability). Unlike mental
// math, each topic teaches the concept first (renderAlgebraLearn) before
// practice, and a wrong answer shows the actual worked solution to THIS
// problem, not just the bare correct number — teaching the concept in the
// moment it's needed, not just grading. Answer-checking is deliberately
// scoped to forms a plain string/number comparison can validate exactly
// (integers, reduced fractions, a fixed set of exact trig values) rather
// than attempting general symbolic/expression parsing. ----------------------
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ const r=a%b; a=b; b=r; } return a||1; }
function nonZeroRandInt(min,max){ let v; do{ v=randInt(min,max); }while(v===0); return v; }
function parseFraction(str){
  if(!str) return null;
  const s = str.trim();
  const frac = s.match(/^(-?\d+)\s*\/\s*(-?\d+)$/);
  if(frac){
    const n=parseInt(frac[1],10), d=parseInt(frac[2],10);
    if(d===0) return null;
    const sign = (n<0)!==(d<0) ? -1 : 1;
    const g = gcd(n,d);
    return {p: sign*Math.abs(n)/g, q: Math.abs(d)/g};
  }
  const whole = s.match(/^(-?\d+)$/);
  if(whole) return {p:parseInt(whole[1],10), q:1};
  return null;
}
// "+3x" / "-x" / "" (omitted when coef===0) — for terms after the first.
function signedCoeffTerm(coef, varPart){
  if(coef===0) return '';
  const sign = coef>0 ? ' + ' : ' - ';
  const mag = Math.abs(coef);
  const magStr = (varPart && mag===1) ? '' : String(mag);
  return sign+magStr+varPart;
}
// "3x" / "-x" / "x" — for a leading term with no preceding sign.
function leadTerm(coef, varPart){
  if(coef===1) return varPart || '1';
  if(coef===-1) return '-'+(varPart||'1');
  return coef+(varPart||'');
}
function factorTerm(root){ return root>=0 ? `(x - ${root})` : `(x + ${-root})`; }

function algProblemFractions(){
  const q = randInt(2,9);
  let p; do{ p = randInt(1, q*2); }while(gcd(p,q)!==1);
  const k = randInt(2,6);
  const num = p*k, den = q*k;
  return {
    promptText: t('algFractionsPrompt', {expr:`${num}/${den}`}),
    inputs: [{key:'ans', placeholder:t('algFractionAnswerPlaceholder')}],
    check(vals){ const f = parseFraction(vals.ans); return !!f && f.p===p && f.q===q; },
    explain: t('algFractionsExplain', {num, den, k, p, q}),
  };
}
function algProblemExponents(){
  const a = randInt(2,6), b = randInt(2,4);
  const answer = Math.pow(a,b);
  return {
    promptText: t('algExponentsPrompt', {expr:`${a}^${b}`}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('algExponentsExplain', {a, b, answer}),
  };
}
function algProblemLogarithms(){
  const bases=[2,3,5,10];
  const b = bases[randInt(0,bases.length-1)];
  const e = randInt(1,4);
  const x = Math.pow(b,e);

}
function algProblemEquations(){
  const a = randInt(2,9);
  const x0 = nonZeroRandInt(-10,10);
  const b = randInt(-20,20);
  const c = a*x0+b;
  return {

function algProblemInequalities(){
  const a = randInt(2,9);
  const x0 = nonZeroRandInt(-10,10);
  const b = randInt(-20,20);
  const c = a*x0+b;
  const symbol = ['<','>','≤','≥'][randInt(0,3)];
  return {

    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],

    explain: t('algInequalitiesExplain', {a, rhs:c-b, x0}),

}
function algProblemSimultaneous(){
  let a1,b1,a2,b2;
  do{
    a1=nonZeroRandInt(-6,6); b1=nonZeroRandInt(-6,6);
    a2=nonZeroRandInt(-6,6); b2=nonZeroRandInt(-6,6);
  } while(a1*b2-a2*b1===0);
  const x0 = randInt(-8,8), y0 = randInt(-8,8);
  const c1 = a1*x0+b1*y0, c2 = a2*x0+b2*y0;
  return {
    promptText: t('algSimultaneousPrompt', {
      eq1:`${leadTerm(a1,'x')}${signedCoeffTerm(b1,'y')} = ${c1}`,
      eq2:`${leadTerm(a2,'x')}${signedCoeffTerm(b2,'y')} = ${c2}`,
    }),
    inputs: [{key:'x', label:'x ='}, {key:'y', label:'y ='}],
    check(vals){ return Number(vals.x)===x0 && Number(vals.y)===y0; },
    explain: t('algSimultaneousExplain', {x0, y0}),

}
function algProblemPolynomials(){
  const A = nonZeroRandInt(1,5), B = randInt(-8,8), C = randInt(-8,8);
  const k = randInt(-5,5);
  const term1 = A*k*k, term2 = B*k;
  const answer = term1 + term2 + C;
  const expr = `${leadTerm(A,'x²')}${signedCoeffTerm(B,'x')}${signedCoeffTerm(C,'')}`;
  const sumExpr = `${term1}${signedCoeffTerm(term2,'')}${signedCoeffTerm(C,'')}`;
  return {
    promptText: t('algPolynomialsPrompt', {expr, k}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('algPolynomialsExplain', {k, sumExpr, answer}),
  };
}
function algProblemFactorisation(){
  let r1 = randInt(-8,8), r2;
  do{ r2 = randInt(-8,8); }while(r2===r1);
  const rmin = Math.min(r1,r2), rmax = Math.max(r1,r2);
  const b = -(r1+r2), c = r1*r2;
  const expr = `x²${signedCoeffTerm(b,'x')}${signedCoeffTerm(c,'')} = 0`;
  return {
    promptText: t('algFactorisationPrompt', {expr}),
    inputs: [{key:'small', label:t('algSmallerRootLabel')}, {key:'large', label:t('algLargerRootLabel')}],
    check(vals){ return Number(vals.small)===rmin && Number(vals.large)===rmax; },
    explain: t('algFactorisationExplain', {factors:`${factorTerm(rmin)}${factorTerm(rmax)}`, rmin, rmax}),
  };
}
function algProblemSequences(){
  if(Math.random()<0.3){
    const a1 = randInt(1,5), r = [2,3][randInt(0,1)], n = randInt(2,6);
    const answer = a1*Math.pow(r,n-1);

      check(vals){ return Number(vals.ans)===answer; },
      explain: t('algSeqGeoExplain', {a1, r, n, answer}),
    };
  }
  const a1 = randInt(-10,10), d = nonZeroRandInt(-6,6), n = randInt(5,15);
  const answer = a1+(n-1)*d;
  return {
    promptText: t('algSeqArithPrompt', {a1, d, n}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('algSeqArithExplain', {a1, d, n, answer}),
  };
}
function algProblemFunctions(){
  const A = nonZeroRandInt(-5,5), B = randInt(-8,8);
  const C = nonZeroRandInt(-5,5), D = randInt(-8,8);
  const k = randInt(-5,5);
  const inner = C*k+D;
  const answer = A*inner+B;
  const fExpr = `${leadTerm(A,'x')}${signedCoeffTerm(B,'')}`;
  const gExpr = `${leadTerm(C,'x')}${signedCoeffTerm(D,'')}`;

  };
}
function algProblemGraphs(){
  const m = nonZeroRandInt(-6,6), b = randInt(-10,10);
  const xTermSign = m>=0 ? '-' : '+';
  const magStr = Math.abs(m)===1 ? '' : String(Math.abs(m));
  const expr = `y ${xTermSign} ${magStr}x = ${b}`;
  return {
    promptText: t('algGraphsPrompt', {expr}),
    inputs: [{key:'slope', label:t('algSlopeLabel')}, {key:'intercept', label:t('algInterceptLabel')}],
    check(vals){ return Number(vals.slope)===m && Number(vals.intercept)===b; },
    explain: t('algGraphsExplain', {m, b}),
  };
}
const ALG_TRIG_TABLE = {
  sin: {0:['0'], 30:['1/2'], 45:['√2/2','sqrt(2)/2'], 60:['√3/2','sqrt(3)/2'], 90:['1']},
  cos: {0:['1'], 30:['√3/2','sqrt(3)/2'], 45:['√2/2','sqrt(2)/2'], 60:['1/2'], 90:['0']},
  tan: {0:['0'], 30:['√3/3','sqrt(3)/3'], 45:['1'], 60:['√3','sqrt(3)']},
};
function algProblemTrig(){
  const fns = Object.keys(ALG_TRIG_TABLE);
  const fn = fns[randInt(0,fns.length-1)];
  const angles = Object.keys(ALG_TRIG_TABLE[fn]).map(Number);
  const angle = angles[randInt(0,angles.length-1)];
  const accepted = ALG_TRIG_TABLE[fn][angle].map(s=>s.toLowerCase().replace(/\s+/g,''));
  return {
    promptText: t('algTrigPrompt', {expr:`${fn}(${angle}°)`}),
    inputs: [{key:'ans', placeholder:t('algTrigAnswerPlaceholder')}],
    check(vals){ const norm=(vals.ans||'').toLowerCase().replace(/\s+/g,''); return accepted.includes(norm); },
    explain: t('algTrigExplain', {expr:`${fn}(${angle}°)`, answer:ALG_TRIG_TABLE[fn][angle][0]}),
  };
}

// ---- calculus learning: Month 2 of the planned progression (algebra ->
// calculus -> linear algebra -> discrete math -> probability). Same
// architecture as algebra (learn screen -> unlimited practice -> worked
// explanation on a wrong answer -> best-score tracking), reusing the shared
// combo/achievement/level system. Scoped to single-variable calculus's
// core computational skills (limits, the derivative rules, optimisation,
// antiderivatives, definite integrals) — implicit differentiation and
// related rates are left out of this first pass since they don't reduce to
// a single cleanly-typed-and-graded value the way these do.
function calcProblemLimits(){
  if(Math.random()<0.4){
    const r = randInt(-8,8);
    let s; do{ s = randInt(-8,8); }while(s===r);
    const num = `${factorTerm(r)}${factorTerm(s)}`;
    const den = factorTerm(r);
    const answer = r - s;
    const remExpr = `x${signedCoeffTerm(-s,'')}`;
    return {
      promptText: t('calcLimitFactorPrompt', {num, den, r}),
      inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
      check(vals){ return Number(vals.ans)===answer; },
      explain: t('calcLimitFactorExplain', {den, remExpr, r, answer}),
    };
  }
  const A = nonZeroRandInt(1,5), B = randInt(-8,8), C = randInt(-8,8);
  const c = randInt(-5,5);
  const answer = A*c*c + B*c + C;
  const expr = `${leadTerm(A,'x²')}${signedCoeffTerm(B,'x')}${signedCoeffTerm(C,'')}`;
  return {
    promptText: t('calcLimitDirectPrompt', {expr, c}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('calcLimitDirectExplain', {c, answer}),
  };
}
function calcProblemPowerRule(){
  const A = nonZeroRandInt(1,4), B = randInt(-6,6), C = randInt(-6,6), D = randInt(-6,6);
  const k = randInt(-4,4);
  const expr = `${leadTerm(A,'x³')}${signedCoeffTerm(B,'x²')}${signedCoeffTerm(C,'x')}${signedCoeffTerm(D,'')}`;
  const derivExpr = `${leadTerm(3*A,'x²')}${signedCoeffTerm(2*B,'x')}${signedCoeffTerm(C,'')}`;
  const answer = 3*A*k*k + 2*B*k + C;
  return {
    promptText: t('calcPowerRulePrompt', {expr, k}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('calcPowerRuleExplain', {derivExpr, k, answer}),
  };
}
function calcProblemProductRule(){
  const A = nonZeroRandInt(-6,6), B = randInt(-8,8), C = nonZeroRandInt(-6,6), D = randInt(-8,8);
  const k = randInt(-5,5);
  const uk = A*k+B, vk = C*k+D;
  const term1 = A*vk, term2 = C*uk;
  const answer = term1 + term2;
  // Display strings built by hand (not naive "{a} + {b}" template interpolation)
  // so a negative second term reads as "- 60", never the confusing "+ -60".
  const stepExpr = `${A}×(${vk})${C>=0?` + ${C}`:` - ${-C}`}×(${uk})`;
  const sumExpr = `${term1}${signedCoeffTerm(term2,'')}`;
  const uExpr = `${leadTerm(A,'x')}${signedCoeffTerm(B,'')}`;
  const vExpr = `${leadTerm(C,'x')}${signedCoeffTerm(D,'')}`;
  return {
    promptText: t('calcProductRulePrompt', {uExpr, vExpr, k}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('calcProductRuleExplain', {k, uk, vk, A, C, stepExpr, sumExpr, answer}),
  };
}
function calcProblemQuotientRule(){
  const A = nonZeroRandInt(-6,6), B = randInt(-8,8), C = nonZeroRandInt(-5,5);
  const k = randInt(-5,5);
  const vSign = randInt(0,1)===0 ? 1 : -1;
  const D = vSign - C*k; // guarantees v(k) = C*k+D = vSign (±1), so v² = 1
  const uk = A*k+B, vk = vSign, vk2 = vk*vk;
  const term1 = A*vk, term2 = C*uk;
  const numerator = term1 - term2;
  const answer = numerator / vk2;
  // Display string built by hand, same reasoning as the product rule above —
  // avoids "5×(1) - -4×(9)"-style double signs from naive interpolation.
  const stepExpr = `${A}×(${vk})${C>=0?` - ${C}`:` + ${-C}`}×(${uk})`;
  const uExpr = `${leadTerm(A,'x')}${signedCoeffTerm(B,'')}`;
  const vExpr = `${leadTerm(C,'x')}${signedCoeffTerm(D,'')}`;
  return {
    promptText: t('calcQuotientRulePrompt', {uExpr, vExpr, k}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('calcQuotientRuleExplain', {k, uk, vk, A, C, stepExpr, numerator, vk2, answer}),
  };
}
function calcProblemChainRule(){
  const A = nonZeroRandInt(1,5), B = randInt(-6,6);
  const C = nonZeroRandInt(-5,5), D = randInt(-6,6);
  const k = randInt(-5,5);
  const gk = C*k+D;
  const twoA = 2*A;
  const fprime = twoA*gk;
  const answer = fprime*C;
  const fExpr = `${leadTerm(A,'u²')}${signedCoeffTerm(B,'')}`;
  const gExpr = `${leadTerm(C,'x')}${signedCoeffTerm(D,'')}`;
  const fPrimeExpr = `${leadTerm(twoA,'u')}`;
  return {
    promptText: t('calcChainRulePrompt', {fExpr, gExpr, k}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('calcChainRuleExplain', {fPrimeExpr, C, k, gk, twoA, fprime, answer}),
  };
}
function calcProblemOptimisation(){
  const A = nonZeroRandInt(1,6);
  const x0 = nonZeroRandInt(-8,8);
  const B = -2*A*x0;
  const C = randInt(-8,8);
  const expr = `${leadTerm(A,'x²')}${signedCoeffTerm(B,'x')}${signedCoeffTerm(C,'')}`;
  const twoA = 2*A;
  const derivExpr = `${leadTerm(twoA,'x')}${signedCoeffTerm(B,'')}`;
  return {
    promptText: t('calcOptimPrompt', {expr}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===x0; },
    explain: t('calcOptimExplain', {derivExpr, twoA, negB:-B, x0}),
  };
}
function calcProblemAntiderivatives(){
  const A = nonZeroRandInt(-4,4)*2; // even, so A/2 is a clean integer
  const B = randInt(-8,8);
  const k = randInt(-6,6);
  const halfA = A/2;
  const expr = `${leadTerm(A,'x')}${signedCoeffTerm(B,'')}`;
  const FExpr = `${leadTerm(halfA,'x²')}${signedCoeffTerm(B,'x')}`;
  const term1 = halfA*k*k, term2 = B*k;
  const answer = term1 + term2;
  const sumExpr = `${term1}${signedCoeffTerm(term2,'')}`;
  return {
    promptText: t('calcAntiderivPrompt', {expr, k}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('calcAntiderivExplain', {FExpr, k, sumExpr, answer}),
  };
}
function calcProblemDefiniteIntegral(){
  const A = nonZeroRandInt(-4,4)*2; // even, so A/2 is a clean integer
  const B = randInt(-8,8);
  const a = randInt(-5,4);
  let b; do{ b = randInt(-5,5); }while(b<=a);
  const halfA = A/2;
  const expr = `${leadTerm(A,'x')}${signedCoeffTerm(B,'')}`;
  const FExpr = `${leadTerm(halfA,'x²')}${signedCoeffTerm(B,'x')}`;
  const Fa = halfA*a*a + B*a, Fb = halfA*b*b + B*b;
  const answer = Fb - Fa;
  return {
    promptText: t('calcDefIntegralPrompt', {expr, a, b}),
    inputs: [{key:'ans', placeholder:t('algNumericAnswerPlaceholder')}],
    check(vals){ return Number(vals.ans)===answer; },
    explain: t('calcDefIntegralExplain', {FExpr, a, b, Fa, Fb, answer}),
  };
}

  const rec = state.game.calculus[s.topicKey] || (state.game.calculus[s.topicKey] = {best:0});

  if(s.isNewBest) rec.best = s.correct;
  touchStreak();
  s.newAchievements = checkAchievements(state.game);
  state.screen='calc_complete';
  render();
}
