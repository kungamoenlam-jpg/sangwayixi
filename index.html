
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sangwa · སངས་བ · 桑瓦</title>
<meta name="description" content="Sangwa — learn English, Chinese and Tibetan through Tibetan. A gamified 40-module route from Base Camp to the Summit.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231B2A47'/%3E%3Cpath d='M15 72 L38 34 L50 52 L60 38 L85 72 Z' fill='%23F3F7FB'/%3E%3Ccircle cx='60' cy='26' r='7' fill='%23E8A33D'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Tibetan:wght@400;600;700&family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12213B;
    --sky-deep:#152647;
    --sky-mid:#233A66;
    --snow:#F5F8FC;
    --snow-dim:#DCE4F0;
    --gold:#E8A33D;
    --gold-dim:#B87F2A;
    --ice:#4FB4D8;
    --good:#3FAE72;
    --bad:#E1584B;
    --flag-blue:#3D6FB4;
    --flag-white:#F5F8FC;
    --flag-red:#C4443A;
    --flag-green:#4C9A63;
    --flag-yellow:#E3B23C;
    --radius:18px;
    --shadow: 0 10px 30px rgba(10,18,36,.35);
    --font-display:'Space Grotesk', 'Noto Sans Tibetan', sans-serif;
    --font-body:'Inter','Noto Sans SC','Noto Sans Tibetan',sans-serif;
    --font-bo:'Noto Sans Tibetan','Inter',sans-serif;
    --font-zh:'Noto Sans SC','Inter',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:var(--font-body);
    background:
      radial-gradient(1200px 600px at 50% -10%, #24406f 0%, transparent 60%),
      linear-gradient(180deg, var(--sky-deep) 0%, var(--sky-mid) 55%, #16283f 100%);
    color:var(--snow);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative; overflow-x:hidden;}
  h1,h2,h3{font-family:var(--font-display); margin:0; letter-spacing:.01em;}
  button{font-family:var(--font-body); cursor:pointer;}
  .lang-bo{font-family:var(--font-bo);}
  .lang-zh{font-family:var(--font-zh);}

  .flagstrip{display:flex; height:6px; width:100%;}
  .flagstrip span{flex:1;}
  .flagstrip span:nth-child(1){background:var(--flag-blue);}
  .flagstrip span:nth-child(2){background:var(--flag-white);}
  .flagstrip span:nth-child(3){background:var(--flag-red);}
  .flagstrip span:nth-child(4){background:var(--flag-green);}
  .flagstrip span:nth-child(5){background:var(--flag-yellow);}

  .topbar{display:flex; align-items:center; justify-content:space-between; padding:14px 18px; gap:10px;}
  .topbar .stat{display:flex; align-items:center; gap:5px; font-weight:600; font-size:14px; background:rgba(255,255,255,.06); padding:6px 10px; border-radius:999px; border:1px solid rgba(255,255,255,.08);}
  .iconbtn{background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.1); color:var(--snow); width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:18px;}
  .brand{display:flex; align-items:center; gap:8px; font-family:var(--font-display); font-weight:700; font-size:20px; letter-spacing:.02em;}
  .brand .peak{color:var(--gold);}

  .home{padding:8px 20px 40px; display:flex; flex-direction:column; gap:22px;}
  .hero{text-align:center; padding:22px 6px 6px;}
  .hero h1{font-size:34px; color:var(--snow);}
  .hero .sub{margin-top:8px; font-size:15px; color:var(--snow-dim); line-height:1.5;}
  .track-grid{display:grid; grid-template-columns:1fr; gap:14px;}
  .track-card{
    text-align:left; border:1px solid rgba(255,255,255,.1); border-radius:var(--radius);
    background:linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
    padding:18px; display:flex; align-items:center; gap:14px; color:var(--snow);
    box-shadow:var(--shadow); position:relative; overflow:hidden;
  }
  .track-card:active{transform:scale(.98);}
  .track-card .glyph{font-size:30px; width:54px; height:54px; border-radius:14px; display:flex; align-items:center; justify-content:center; background:rgba(232,163,61,.15); flex-shrink:0;}
  .track-card .tc-title{font-family:var(--font-display); font-weight:700; font-size:19px;}
  .track-card .tc-native{font-size:15px; color:var(--gold); margin-top:2px;}
  .track-card .tc-sub{font-size:12.5px; color:var(--snow-dim); margin-top:4px;}
  .track-card .tc-progress{margin-left:auto; font-size:12px; color:var(--snow-dim); text-align:right; flex-shrink:0;}

  .map-wrap{flex:1; display:flex; flex-direction:column;}
  .map-scroll{flex:1; padding:20px 10px 50px; position:relative;}
  .route{position:relative; padding:10px 30px; display:flex; flex-direction:column; align-items:center; gap:56px;}
  .route::before{
    content:''; position:absolute; left:50%; top:20px; bottom:20px; width:4px; transform:translateX(-50%);
    background:repeating-linear-gradient(180deg, rgba(245,248,252,.35) 0 10px, transparent 10px 20px);
    z-index:0;
  }
  .node{position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:8px;}
  .node.left{align-self:flex-start; margin-left:6%;}
  .node.right{align-self:flex-end; margin-right:6%;}
  .node-btn{
    width:78px; height:78px; border-radius:50%; border:4px solid var(--sky-deep);
    display:flex; align-items:center; justify-content:center; font-size:28px;
    box-shadow:0 8px 0 rgba(0,0,0,.25), var(--shadow);
    background:linear-gradient(160deg,#DDB25E,var(--gold-dim));
  }
  .node-btn.locked{background:linear-gradient(160deg,#5b6b86,#3a465c); color:rgba(255,255,255,.6);}
  .node-btn.done{background:linear-gradient(160deg,#6BC98F,var(--good));}
  .node-btn:active{transform:translateY(4px); box-shadow:0 4px 0 rgba(0,0,0,.25);}
  .node-label{font-family:var(--font-display); font-weight:700; font-size:13px; text-align:center; max-width:126px;}
  .node-sub{font-size:11.5px; color:var(--snow-dim); text-align:center; max-width:130px;}
  .node-stars{display:flex; gap:2px; font-size:12px; color:var(--gold);}
  .world-block{position:relative; padding-top:6px; width:100%;}
  .world-title{text-align:center; font-family:var(--font-display); font-weight:700; font-size:16px; color:var(--snow); margin-bottom:2px;}
  .world-subtitle{text-align:center; font-size:12px; color:var(--gold); margin-bottom:18px;}

  .lesson{flex:1; display:flex; flex-direction:column; padding:0 20px 24px;}
  .progressbar{height:10px; border-radius:999px; background:rgba(255,255,255,.12); overflow:hidden; margin:6px 0 4px;}
  .progressbar-fill{height:100%; background:linear-gradient(90deg,var(--ice),var(--gold)); transition:width .35s ease;}
  .hearts-row{display:flex; gap:4px; font-size:16px;}
  .q-wrap{flex:1; display:flex; flex-direction:column; justify-content:center; gap:26px; padding:14px 0;}
  .q-card{text-align:center;}
  .q-eyebrow{font-size:12px; text-transform:uppercase; letter-spacing:.12em; color:var(--snow-dim); margin-bottom:10px;}
  .q-prompt{font-family:var(--font-display); font-size:36px; font-weight:700; line-height:1.25;}
  .q-prompt.script-bo{font-family:var(--font-bo); font-size:34px;}
  .q-prompt.script-zh{font-family:var(--font-zh); font-size:38px;}
  .q-prompt.long{font-size:22px; line-height:1.35;}
  .q-prompt.long.script-bo{font-size:21px;}
  .q-prompt.long.script-zh{font-size:24px;}
  .q-translit{margin-top:8px; color:var(--gold); font-size:15px; font-style:italic;}
  .options{display:grid; grid-template-columns:1fr; gap:12px;}
  .opt{
    border:2px solid rgba(255,255,255,.14); background:rgba(255,255,255,.05); color:var(--snow);
    border-radius:14px; padding:15px 16px; font-size:18px; font-weight:600; text-align:left;
    display:flex; flex-direction:column; gap:2px;
  }
  .opt .opt-sub{font-size:12px; font-weight:400; color:var(--snow-dim);}
  .opt.script-bo{font-family:var(--font-bo);}
  .opt.script-zh{font-family:var(--font-zh);}
  .opt.long{font-size:15px;}
  .opt:active{transform:scale(.98);}
  .opt.correct{border-color:var(--good); background:rgba(63,174,114,.22);}
  .opt.wrong{border-color:var(--bad); background:rgba(225,88,75,.22);}
  .opt.disabled{pointer-events:none; opacity:.55;}
  .opt.reveal{pointer-events:none;}

  .feedback-bar{position:sticky; bottom:0; margin:0 -20px -24px; padding:18px 20px 22px; display:flex; align-items:center; gap:14px;}
  .feedback-bar.good{background:rgba(63,174,114,.92);}
  .feedback-bar.bad{background:rgba(225,88,75,.92);}
  .feedback-bar .fb-text{flex:1;}
  .fb-title{font-family:var(--font-display); font-weight:700; font-size:16px;}
  .fb-sub{font-size:13px; opacity:.9; margin-top:2px;}
  .btn{
    border:none; border-radius:14px; padding:14px 18px; font-family:var(--font-display); font-weight:700;
    font-size:15px; letter-spacing:.02em; box-shadow:0 4px 0 rgba(0,0,0,.2);
  }
  .btn-primary{background:var(--gold); color:#241704;}
  .btn-primary:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.2);}
  .btn-light{background:var(--snow); color:var(--ink);}
  .btn-ghost{background:rgba(255,255,255,.12); color:var(--snow);}
  .btn-block{width:100%;}

  .complete{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px 26px; text-align:center; gap:18px;}
  .complete .medal{font-size:70px;}
  .complete h2{font-size:26px;}
  .stat-row{display:flex; gap:14px; width:100%;}
  .stat-box{flex:1; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); border-radius:14px; padding:14px 8px;}
  .stat-box .val{font-family:var(--font-display); font-size:22px; font-weight:700; color:var(--gold);}
  .stat-box .lab{font-size:11.5px; color:var(--snow-dim); margin-top:2px;}
  .stars-final{font-size:34px; letter-spacing:6px;}

  .locked-panel{padding:22px; text-align:center; background:rgba(255,255,255,.05); border:1px dashed rgba(255,255,255,.25); border-radius:16px; margin:10px 0;}
  .locked-panel h3{margin-bottom:6px;}
  .locked-panel p{color:var(--snow-dim); font-size:13.5px; line-height:1.5;}
  .roadmap-row{display:flex; gap:10px; align-items:baseline; padding:8px 2px; border-bottom:1px solid rgba(255,255,255,.08); text-align:left;}
  .roadmap-row:last-child{border-bottom:none;}
  .roadmap-num{color:var(--gold); font-family:var(--font-display); font-weight:700; font-size:13px; width:24px; flex-shrink:0;}
  .roadmap-label{font-size:14px;}

  .profile{padding:16px 20px 40px; display:flex; flex-direction:column; gap:16px;}
  .profile-card{background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); border-radius:16px; padding:18px;}
  .profile-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}

  .footer-note{text-align:center; font-size:11px; color:rgba(245,248,252,.4); padding:10px 30px 26px;}

  .auth-tabs{display:flex; gap:8px; background:rgba(255,255,255,.06); border-radius:12px; padding:4px; margin:4px 0 6px;}
  .auth-tab{flex:1; border:none; background:transparent; color:var(--snow-dim); font-family:var(--font-display); font-weight:700; font-size:14px; padding:10px 0; border-radius:9px;}
  .auth-tab.active{background:var(--gold); color:#241704;}
  .field{display:flex; flex-direction:column; gap:6px;}
  .field label{font-size:12.5px; color:var(--snow-dim); font-weight:600;}
  .field input{
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.14); border-radius:12px;
    padding:12px 14px; color:var(--snow); font-size:15px; font-family:var(--font-body);
  }
  .field input:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .auth-error{background:rgba(225,88,75,.18); border:1px solid rgba(225,88,75,.5); color:var(--snow); border-radius:10px; padding:10px 12px; font-size:13px;}

  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }
  ::selection{background:var(--gold); color:#241704;}
</style>
</head>

<div id="app"></div>

<script>
/* =========================================================================
   SANGWA — data + engine
   Content lives in three places:
     WORDBANK      — one entry per vocabulary item (en / zh / bo + bo_tr / zh_py)
     LESSON_GROUPS — the 10 modules that make up Level 1 ("Base Camp"), fully built
     LEVELS        — the 4 levels on the route (mirrors a 40-module curriculum:
                      words → sentences → conversations → ideas). Only Level 1
                      has exercises; Levels 2–4 carry a numbered roadmap of
                      what's coming, shown as a "coming soon" panel — never
                      gated behind progress; every level is open any time.
   The four *courses* (English via Tibetan, Chinese via Tibetan, Tibetan via
   Chinese, Tibetan via English) are NOT separately authored — buildExercises()
   generates all four directions from this one shared word bank by swapping
   which language is the prompt and which is the answer.
   ========================================================================= */

// bo_tr is a rough Lhasa-dialect romanization for learner support only.
// IMPORTANT: this vocabulary was assembled for a working prototype and should
// be reviewed by a native Tibetan speaker/linguist and a Mandarin speaker
// before real learners use it (see README "Content review").
const WORDBANK = [
  // module 01 — greetings & introductions
  {id:'hello',    cat:'greetings', en:'Hello',     zh:'你好',   zh_py:'nǐ hǎo',   bo:'བཀྲ་ཤིས་བདེ་ལེགས', bo_tr:'tashi delek'},
  {id:'thankyou', cat:'greetings', en:'Thank you', zh:'谢谢',   zh_py:'xièxie',   bo:'ཐུགས་རྗེ་ཆེ',       bo_tr:'thuk-je-che'},
  {id:'yes',      cat:'greetings', en:'Yes',       zh:'是',     zh_py:'shì',      bo:'ཡིན',              bo_tr:'yin'},
  {id:'no',       cat:'greetings', en:'No',        zh:'不是',   zh_py:'bú shì',   bo:'མིན',              bo_tr:'min'},
  {id:'goodbye',  cat:'greetings', en:'Goodbye',   zh:'再见',   zh_py:'zàijiàn',  bo:'བདེ་མོ་གནང་',       bo_tr:'de-mo nang'},
  {id:'sorry',    cat:'greetings', en:'Sorry',     zh:'对不起', zh_py:'duìbùqǐ',  bo:'དགོངས་དག',          bo_tr:'gong-dak'},
  // module 02 — numbers & counting
  {id:'one',   cat:'numbers', en:'One',   zh:'一', zh_py:'yī',  bo:'གཅིག',  bo_tr:'chik'},
  {id:'two',   cat:'numbers', en:'Two',   zh:'二', zh_py:'èr',  bo:'གཉིས',  bo_tr:'nyi'},
  {id:'three', cat:'numbers', en:'Three', zh:'三', zh_py:'sān', bo:'གསུམ',  bo_tr:'sum'},
  {id:'four',  cat:'numbers', en:'Four',  zh:'四', zh_py:'sì',  bo:'བཞི',   bo_tr:'zhi'},
  {id:'five',  cat:'numbers', en:'Five',  zh:'五', zh_py:'wǔ',  bo:'ལྔ',    bo_tr:'nga'},
  {id:'six',   cat:'numbers', en:'Six',   zh:'六', zh_py:'liù', bo:'དྲུག',  bo_tr:'druk'},
  {id:'seven', cat:'numbers', en:'Seven', zh:'七', zh_py:'qī',  bo:'བདུན',  bo_tr:'dün'},
  {id:'eight', cat:'numbers', en:'Eight', zh:'八', zh_py:'bā',  bo:'བརྒྱད', bo_tr:'gyé'},
  {id:'nine',  cat:'numbers', en:'Nine',  zh:'九', zh_py:'jiǔ', bo:'དགུ',   bo_tr:'gu'},
  {id:'ten',   cat:'numbers', en:'Ten',   zh:'十', zh_py:'shí', bo:'བཅུ',   bo_tr:'chu'},
  // module 03 — family & people
  {id:'mother',   cat:'family', en:'Mother',   zh:'妈妈', zh_py:'māma',    bo:'ཨ་མ',    bo_tr:'ama'},
  {id:'father',   cat:'family', en:'Father',   zh:'爸爸', zh_py:'bàba',    bo:'ཨ་ཕ',    bo_tr:'apa'},
  {id:'son',      cat:'family', en:'Son',      zh:'儿子', zh_py:'érzi',    bo:'བུ',     bo_tr:'bu'},
  {id:'daughter', cat:'family', en:'Daughter', zh:'女儿', zh_py:'nǚ\u2019ér', bo:'བུ་མོ', bo_tr:'bumo'},
  {id:'family',   cat:'family', en:'Family',   zh:'家人', zh_py:'jiārén',  bo:'ནང་མི',  bo_tr:'nangmi'},
  {id:'friend',   cat:'family', en:'Friend',   zh:'朋友', zh_py:'péngyou', bo:'གྲོགས་པོ', bo_tr:'drokpo'},
  // module 04 — colours & descriptions
  {id:'red',    cat:'colors', en:'Red',    zh:'红色', zh_py:'hóngsè',  bo:'དམར་པོ', bo_tr:'marpo'},
  {id:'blue',   cat:'colors', en:'Blue',   zh:'蓝色', zh_py:'lánsè',   bo:'སྔོན་པོ', bo_tr:'ngönpo'},
  {id:'green',  cat:'colors', en:'Green',  zh:'绿色', zh_py:'lǜsè',    bo:'ལྗང་ཁུ', bo_tr:'jangku'},
  {id:'yellow', cat:'colors', en:'Yellow', zh:'黄色', zh_py:'huángsè', bo:'སེར་པོ', bo_tr:'serpo'},
  {id:'white',  cat:'colors', en:'White',  zh:'白色', zh_py:'báisè',   bo:'དཀར་པོ', bo_tr:'karpo'},
  {id:'black',  cat:'colors', en:'Black',  zh:'黑色', zh_py:'hēisè',   bo:'ནག་པོ', bo_tr:'nakpo'},
  // module 05 — food & drinks
  {id:'water', cat:'food', en:'Water', zh:'水',   zh_py:'shuǐ',    bo:'ཆུ',     bo_tr:'chu'},
  {id:'tea',   cat:'food', en:'Tea',   zh:'茶',   zh_py:'chá',     bo:'ཇ',      bo_tr:'ja'},
  {id:'foodw', cat:'food', en:'Food',  zh:'食物', zh_py:'shíwù',   bo:'ཁ་ལག',   bo_tr:'khalak'},
  {id:'milk',  cat:'food', en:'Milk',  zh:'牛奶', zh_py:'niúnǎi',  bo:'འོ་མ',   bo_tr:'oma'},
  {id:'meat',  cat:'food', en:'Meat',  zh:'肉',   zh_py:'ròu',     bo:'ཤ',      bo_tr:'sha'},
  {id:'fruit', cat:'food', en:'Fruit', zh:'水果', zh_py:'shuǐguǒ', bo:'ཤིང་ཏོག', bo_tr:'shingtok'},
  // module 06 — home & objects
  {id:'house',  cat:'home', en:'House',  zh:'房子', zh_py:'fángzi',   bo:'ཁང་པ',    bo_tr:'khangpa'},
  {id:'door',   cat:'home', en:'Door',   zh:'门',   zh_py:'mén',      bo:'སྒོ',      bo_tr:'go'},
  {id:'book',   cat:'home', en:'Book',   zh:'书',   zh_py:'shū',      bo:'དཔེ་ཆ',    bo_tr:'pecha'},
  {id:'window', cat:'home', en:'Window', zh:'窗户', zh_py:'chuānghu', bo:'སྒེའུ་ཁུང', bo_tr:'geu-khung'},
  {id:'bed',    cat:'home', en:'Bed',    zh:'床',   zh_py:'chuáng',   bo:'ཉལ་ཁྲི',    bo_tr:'nyal-tri'},
  {id:'table',  cat:'home', en:'Table',  zh:'桌子', zh_py:'zhuōzi',   bo:'ཅོག་ཙེ',    bo_tr:'choktse'},
  // module 07 — clothes & personal items
  {id:'clothes', cat:'clothes', en:'Clothes', zh:'衣服', zh_py:'yīfu',     bo:'གོས',    bo_tr:'gö'},
  {id:'shoes',   cat:'clothes', en:'Shoes',   zh:'鞋子', zh_py:'xiézi',    bo:'ལྷམ',    bo_tr:'lham'},
  {id:'hat',     cat:'clothes', en:'Hat',     zh:'帽子', zh_py:'màozi',    bo:'ཞྭ་མོ',  bo_tr:'zhamo'},
  {id:'phone',   cat:'clothes', en:'Phone',   zh:'手机', zh_py:'shǒujī',   bo:'ཁ་པར',   bo_tr:'khapar'},
  {id:'money',   cat:'clothes', en:'Money',   zh:'钱',   zh_py:'qián',     bo:'དངུལ',   bo_tr:'ngül'},
  {id:'watch',   cat:'clothes', en:'Watch',   zh:'手表', zh_py:'shǒubiǎo', bo:'ཆུ་ཚོད', bo_tr:'chutsö'},
  // module 08 — time & dates
  {id:'today',     cat:'time', en:'Today',     zh:'今天', zh_py:'jīntiān',  bo:'དེ་རིང',   bo_tr:'dering'},

function wordText(word, lang){
  if(lang==='bo') return word.bo;
  if(lang==='zh') return word.zh;
  return word.en;
}
function wordSub(word, lang){
  if(lang==='bo') return word.bo_tr;
  if(lang==='zh') return word.zh_py;
  return '';
}
function scriptClass(lang){
  if(lang==='bo') return 'script-bo';
  if(lang==='zh') return 'script-zh';
  return '';
}

// ---- exercise generation -----------------------------------------------------
function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function buildExercises(track, group){
  const pool = group.ids.map(byId);
  return shuffled(group.ids).map(id=>{
    const word = byId(id);
    const others = shuffled(pool.filter(w=>w.id!==id)).slice(0,3);
    const options = shuffled([word, ...others]).map(w=>({
      id:w.id, text:wordText(w, track.answerLang), sub:wordSub(w, track.answerLang), correct:w.id===word.id
    }));
    return {
      wordId:word.id,
      prompt:wordText(word, track.promptLang),
      promptSub:wordSub(word, track.promptLang),
      promptLang:track.promptLang,
      options
    };
  });
}

// ---- persistence (falls back to in-memory if storage is unavailable,
//      e.g. inside a sandboxed preview) ---------------------------------------
const memoryFallback = {};
const safeStorage = {
  get(key){
    try{ const v = window.localStorage.getItem(key); return v===null? null : v; }
    catch(e){ return Object.prototype.hasOwnProperty.call(memoryFallback,key) ? memoryFallback[key] : null; }
  },
  set(key,val){
    try{ window.localStorage.setItem(key,val); }
    catch(e){ memoryFallback[key]=val; }
  }
};

const HEART_REGEN_MS = 30*60*1000; // 1 heart every 30 min
const HEARTS_MAX = 5;
const ACCOUNTS_KEY = 'sangwa_accounts_v1';
const SESSION_KEY = 'sangwa_session_v1';
const gameKey = username => 'sangwa_progress_v1__' + username;

// ---- accounts (local to this browser — see README "About the sign-in
//      system" for why this is a demo gate, not real production auth) -------
function loadAccounts(){
  const raw = safeStorage.get(ACCOUNTS_KEY);
  if(!raw) return {};
  try{ return JSON.parse(raw); } catch(e){ return {}; }
}
function saveAccounts(accounts){ safeStorage.set(ACCOUNTS_KEY, JSON.stringify(accounts)); }

function loadSession(){
  const raw = safeStorage.get(SESSION_KEY);
  if(!raw) return {currentUser:null};
  try{ return JSON.parse(raw); } catch(e){ return {currentUser:null}; }
}
function saveSession(session){ safeStorage.set(SESSION_KEY, JSON.stringify(session)); }

// Client-side hashing only — there is no server, so this is NOT secure
// production authentication, just a way to avoid storing raw passwords in
// this local demo. See README "About the sign-in system."
function hashPassword(pw){
  // Use a simple deterministic hash that works everywhere — not crypto secure,
  // but consistent for this demo auth system.
  let h = 5381; const s = 'sangwa-salt::' + pw;
  for(let i=0;i<s.length;i++){ h = ((h << 5) + h) ^ s.charCodeAt(i); }
  return 'hash_' + Math.abs(h).toString(36);
}

// ---- per-user game progress --------------------------------------------------
function defaultGame(){
  return {
    xp:0, streak:0, lastActive:null,
    hearts:HEARTS_MAX, lastHeartTime: Date.now(),
    tracks:{} // trackId -> {completed:{ "level-modulekey": stars }}
  };
}
function loadGame(username){
  const raw = safeStorage.get(gameKey(username));
  if(!raw) return defaultGame();
  try{ return Object.assign(defaultGame(), JSON.parse(raw)); }
  catch(e){ return defaultGame(); }
}
function saveGame(){
  if(!state.currentUser) return;
  safeStorage.set(gameKey(state.currentUser), JSON.stringify(state.game));
}

// ---- app state (navigation + auth are in-memory only; only per-user game
//      progress and accounts persist — see boot() below) ---------------------
function defaultAppState(){
  return {
    screen:'auth', authMode:'login', authError:'',
    currentUser:null,
    game: defaultGame(),
    currentTrack:null, currentWorld:0,
    session:null
  };
}

let state = defaultAppState();

function boot(){
  const accounts = loadAccounts();
  if(Object.keys(accounts).length===0) state.authMode = 'signup';
  const sess = loadSession();
  if(sess.currentUser && accounts[sess.currentUser]){
    state.currentUser = sess.currentUser;
    state.game = loadGame(sess.currentUser);
    regenHearts();
    // Always land on the language-picker after a fresh page load, rather
    // than resuming whatever screen was open before — this is the fix for
    // "why does it open straight into Base Camp."
    state.screen = 'pick_language';
  } else {
    state.screen = 'auth';
  }
}
boot();

function regenHearts(){
  if(state.game.hearts >= HEARTS_MAX) { state.game.lastHeartTime = Date.now(); return; }
  const elapsed = Date.now() - state.game.lastHeartTime;
  const gained = Math.floor(elapsed / HEART_REGEN_MS);
  if(gained > 0){
    state.game.hearts = Math.min(HEARTS_MAX, state.game.hearts + gained);
    state.game.lastHeartTime = state.game.hearts >= HEARTS_MAX ? Date.now() : state.game.lastHeartTime + gained*HEART_REGEN_MS;
  }
}
function nextHeartEta(){
  if(state.game.hearts>=HEARTS_MAX) return null;
  const remain = HEART_REGEN_MS - (Date.now()-state.game.lastHeartTime);
  return Math.max(1, Math.ceil(remain/60000));
}

function trackProgress(trackId){
  if(!state.game.tracks[trackId]) state.game.tracks[trackId] = {completed:{}};
  return state.game.tracks[trackId];
}
function lessonKey(levelIdx, groupKey){ return levelIdx+'-'+groupKey; }
function isLessonDone(trackId, levelIdx, groupKey){
  return trackProgress(trackId).completed[lessonKey(levelIdx,groupKey)] || 0;
}
function levelStats(trackId, levelIdx){
  const lvl = LEVELS[levelIdx];
  if(!lvl.built) return {done:0,total:0};
  const p = trackProgress(trackId);
  let done=0;
  lvl.modules.forEach(g=>{ if(p.completed[lessonKey(levelIdx,g.key)]) done++; });
  return {done, total:lvl.modules.length};
}
function touchStreak(){
  const today = new Date().toDateString();
  if(state.game.lastActive===today) return;
  if(state.game.lastActive){
    const y = new Date(); y.setDate(y.getDate()-1);
    state.game.streak = state.game.lastActive===y.toDateString() ? state.game.streak+1 : 1;
  } else { state.game.streak = 1; }
  state.game.lastActive = today;
}

function readVal(id){ const el = document.getElementById(id); return el ? el.value.trim() : ''; }

async function doSignup(){
  const username = readVal('auth_username');
  const email = readVal('auth_email');
  const password = readVal('auth_password');
  const password2 = readVal('auth_password2');
  if(!username || username.length<3){ state.authError='Username must be at least 3 characters.'; render(); return; }
  if(!/^[a-zA-Z0-9_.-]+$/.test(username)){ state.authError='Username can only use letters, numbers, _ . -'; render(); return; }
  if(!password || password.length<4){ state.authError='Password must be at least 4 characters.'; render(); return; }
  if(password!==password2){ state.authError='Passwords do not match.'; render(); return; }
  const accounts = loadAccounts();
  const key = username.toLowerCase();
  if(accounts[key]){ state.authError='That username is already taken.'; render(); return; }
  const passwordHash = hashPassword(password);
  accounts[key] = {username, email: email||null, passwordHash, createdAt: Date.now()};
  saveAccounts(accounts);
  saveSession({currentUser:key});
  state.currentUser = key;
  state.game = loadGame(key);
  state.authError = '';
  state.screen = 'pick_language';
  render();
}

async function doLogin(){
  const username = readVal('auth_username');
  const password = readVal('auth_password');
  if(!username || !password){ state.authError='Enter your username and password.'; render(); return; }
  const accounts = loadAccounts();
  const key = username.toLowerCase();
  const account = accounts[key];
  if(!account){ state.authError='No account with that username — try signing up instead.'; render(); return; }
  const passwordHash = hashPassword(password);
  if(passwordHash!==account.passwordHash){ state.authError='Incorrect password.'; render(); return; }
  saveSession({currentUser:key});
  state.currentUser = key;
  state.game = loadGame(key);
  state.authError = '';
  state.screen = 'pick_language';
  render();
}

function doLogout(){
  saveSession({currentUser:null});
  state = defaultAppState();
  const accounts = loadAccounts();
  if(Object.keys(accounts).length===0) state.authMode='signup';
  render();
}

  ${topbar({back:'openTrack("'+track.id+'")'})}
  <div class="home">
    <div class="locked-panel">
      <h3>${lvl.icon} ${lvl.title} — ${lvl.subtitle}</h3>
      <p>${lvl.range}. No exercises here yet — this is the next content drop. Milestone once it's built: <em>${lvl.milestone}</em></p>
      <div style="margin-top:14px;">${items}</div>
    </div>
    <button class="btn btn-primary btn-block" onclick="openTrack('${track.id}')">Back to the route</button>
  </div>`;
}

function renderLessonList(){
  const track = trackById(state.currentTrack);
  const levelIdx = state.currentWorld;
  const lvl = LEVELS[levelIdx];
  const nodes = lvl.modules.map((g,i)=>{
    const stars = isLessonDone(track.id, levelIdx, g.key);
    const side = i%2===0 ? 'left':'right';
    return `
    <div class="node ${side}">
      <button class="node-btn ${stars? 'done':''}" onclick="startLesson('${g.key}')">${stars? '✓' : g.icon}</button>
      <div class="node-label">${g.num}. ${g.label}</div>
      ${stars ? `<div class="node-stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>` : ''}
    </div>`;
  }).join('');
  return `
  ${topbar({back:'openTrack("'+track.id+'")'})}
  <div class="map-wrap">
    <div style="text-align:center; padding:6px 20px 0;">
      <h2 style="font-size:20px;">${lvl.icon} ${lvl.title}</h2>
      <div style="color:var(--snow-dim); font-size:13px; margin-top:4px;">${lvl.subtitle} · ${lvl.modules.length} modules</div>
    </div>
    <div class="map-scroll"><div class="route">${nodes}</div></div>
  </div>`;
}

function startLesson(groupKey){
  const track = trackById(state.currentTrack);
  const levelIdx = state.currentWorld;
  const group = LEVELS[levelIdx].modules.find(g=>g.key===groupKey);
  state.session = {
    trackId:track.id, worldIdx:levelIdx, groupKey,
    exercises: buildExercises(track, group),
    qIndex:0, mistakes:0, answered:false, xpEarned:0
  };
  state.screen='lesson';
  render();
}

function renderLesson(){
  const s = state.session;
  const track = trackById(s.trackId);
  const total = s.exercises.length;
  const q = s.exercises[s.qIndex];
  const pct = Math.round((s.qIndex/total)*100);

  const optsHtml = q.options.map(o=>{
    let cls = 'opt '+scriptClass(track.answerLang);
    if(o.text.length>20) cls+=' long';
    if(s.answered){
      if(o.correct) cls+=' correct reveal';
      else if(o.id===s.picked && !o.correct) cls+=' wrong reveal';
      else cls+=' disabled reveal';
    }
    return `<button class="${cls}" ${s.answered?'':`onclick="answer('${o.id}')"`}>
      <span>${o.text}</span>
      ${o.sub?`<span class="opt-sub">${o.sub}</span>`:''}
    </button>`;
  }).join('');

  const feedback = s.answered ? `
    <div class="feedback-bar ${s.lastCorrect?'good':'bad'}">
      <div class="fb-text">
        <div class="fb-title">${s.lastCorrect? 'Correct! +10 XP' : 'Not quite'}</div>
        ${!s.lastCorrect ? `<div class="fb-sub">Answer: ${q.options.find(o=>o.correct).text}</div>` : ''}
      </div>
      <button class="btn btn-light" onclick="nextQuestion()">${s.qIndex+1>=total ? 'Finish':'Continue'}</button>
    </div>` : '';

  return `
  ${topbar({back:'exitLesson()'})}
  <div class="lesson">
    <div class="progressbar"><div class="progressbar-fill" style="width:${pct}%"></div></div>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
      <div class="hearts-row">${Array.from({length:HEARTS_MAX}).map((_,i)=>`<span>${i<state.game.hearts?'❤️':'🩶'}</span>`).join('')}</div>
      <div style="font-size:12px; color:var(--snow-dim);">${s.qIndex+1} / ${total}</div>
    </div>
    <div class="q-wrap">
      <div class="q-card">
        <div class="q-eyebrow">Translate</div>
        <div class="q-prompt ${scriptClass(q.promptLang)} ${q.prompt.length>20?'long':''}">${q.prompt}</div>
        ${q.promptSub?`<div class="q-translit">${q.promptSub}</div>`:''}
      </div>
      <div class="options">${optsHtml}</div>
    </div>
  </div>
  ${feedback}
  `;
}

function answer(optId){
  const s = state.session;
  const q = s.exercises[s.qIndex];
  const opt = q.options.find(o=>o.id===optId);
  s.answered = true; s.picked = optId; s.lastCorrect = opt.correct;
  if(opt.correct){
    s.xpEarned += 10; state.game.xp += 10;
  } else {
    s.mistakes += 1;
    if(state.game.hearts===HEARTS_MAX) state.game.lastHeartTime = Date.now();
    state.game.hearts = Math.max(0, state.game.hearts-1);
    if(state.game.hearts===0){ render(); setTimeout(()=>{ state.screen='outofhearts'; render(); }, 550); return; }
  }
  render();
}

function nextQuestion(){
  const s = state.session;
  if(state.game.hearts<=0){ state.screen='outofhearts'; render(); return; }
  s.qIndex += 1; s.answered=false; s.picked=null;
  if(s.qIndex>=s.exercises.length){ finishLesson(); return; }
  render();
}

function finishLesson(){
  const s = state.session;
  const total = s.exercises.length;
  let stars = 1;
  if(s.mistakes===0) stars=3; else if(s.mistakes<=Math.ceil(total*0.34)) stars=2;
  const p = trackProgress(s.trackId);
  const key = lessonKey(s.worldIdx, s.groupKey);
  p.completed[key] = Math.max(p.completed[key]||0, stars);
  if(stars===3) { state.game.xp += 20; s.xpEarned += 20; }
  touchStreak();
  state.screen='complete';
  render();
}

function renderComplete(){
  const s = state.session;
  const total = s.exercises.length;
  const stars = trackProgress(s.trackId).completed[lessonKey(s.worldIdx,s.groupKey)];
  return `
  ${topbar()}
  <div class="complete">
    <div class="medal">${stars===3?'🏆':stars===2?'🥈':'🥉'}</div>
    <h2>Checkpoint reached!</h2>
    <div class="stars-final">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
    <div class="stat-row">
      <div class="stat-box"><div class="val">+${s.xpEarned}</div><div class="lab">XP earned</div></div>
      <div class="stat-box"><div class="val">${total-s.mistakes}/${total}</div><div class="lab">First-try correct</div></div>
      <div class="stat-box"><div class="val">🔥 ${state.game.streak}</div><div class="lab">Day streak</div></div>
    </div>
    <button class="btn btn-primary btn-block" onclick="backToLessonList()">Continue climbing</button>
  </div>`;
}

function renderOutOfHearts(){
  const eta = nextHeartEta();
  return `
  ${topbar()}
  <div class="complete">
    <div class="medal">💔</div>
    <h2>Out of hearts</h2>
    <p style="color:var(--snow-dim); max-width:280px;">Hearts refill on their own — about 1 every 30 minutes. ${eta?`Next heart in ~${eta} min.`:''} Come back to keep climbing, or review this module right away with a fresh attempt.</p>
    <button class="btn btn-primary btn-block" onclick="retrySameLesson()">Try this module again</button>
    <button class="btn btn-ghost btn-block" onclick="backToLessonList()">Back to Base Camp</button>
  </div>`;
}
function retrySameLesson(){
  regenHearts();
  if(state.game.hearts<=0){ render(); return; }
  startLesson(state.session.groupKey);
}
function backToLessonList(){ state.screen='lessonlist'; render(); }
function exitLesson(){ state.screen='lessonlist'; render(); }

function renderProfile(){
  const totalDone = Object.values(state.game.tracks).reduce((n,t)=>n+Object.keys(t.completed).length,0);
  const eta = nextHeartEta();
  return `
  ${topbar({back:'goHome()'})}
  <div class="profile">
    <div class="profile-card" style="text-align:center;">
      <div style="font-size:40px;">🏔️</div>
      <h2 style="margin-top:6px;">Basecamp Climber</h2>
      <div style="color:var(--snow-dim); font-size:13px; margin-top:2px;">Signed in as <strong>${state.currentUser}</strong> · ${totalDone} module${totalDone===1?'':'s'} completed across all routes</div>
    </div>
    <div class="profile-grid">
      <div class="profile-card"><div class="val" style="font-family:var(--font-display); font-size:22px; color:var(--gold);">⭐ ${state.game.xp}</div><div class="lab" style="font-size:12px; color:var(--snow-dim); margin-top:4px;">Total XP</div></div>
      <div class="profile-card"><div class="val" style="font-family:var(--font-display); font-size:22px; color:var(--gold);">🔥 ${state.game.streak}</div><div class="lab" style="font-size:12px; color:var(--snow-dim); margin-top:4px;">Day streak</div></div>
      <div class="profile-card"><div class="val" style="font-family:var(--font-display); font-size:22px; color:var(--gold);">${state.game.hearts}/${HEARTS_MAX}</div><div class="lab" style="font-size:12px; color:var(--snow-dim); margin-top:4px;">Hearts${eta?` · next in ~${eta}m`:''}</div></div>
      <div class="profile-card"><div class="val" style="font-family:var(--font-display); font-size:22px; color:var(--gold);">${totalDone}</div><div class="lab" style="font-size:12px; color:var(--snow-dim); margin-top:4px;">Modules done</div></div>
    </div>
    <button class="btn btn-ghost btn-block" onclick="resetProgress()">Reset all progress</button>
    <button class="btn btn-ghost btn-block" onclick="doLogout()">Log out</button>
  </div>`;
}
function resetProgress(){
  if(!confirm('Reset all XP, streaks and lesson progress for this account? This cannot be undone.')) return;
  state.game = defaultGame();
  saveGame();
  render();
}

// ---- navigation ---------------------------------------------------------------
function goHome(){ regenHearts(); state.screen='home'; render(); }
function goProfile(){ regenHearts(); state.screen='profile'; render(); }
function openTrack(id){ regenHearts(); state.currentTrack=id; state.screen='map'; render(); }

render();
</script>
</body>
</html>
